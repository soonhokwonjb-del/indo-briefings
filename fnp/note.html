<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OJK 규정 핵심 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 왼쪽 장별 개념 목록(필터·검색) / 오른쪽 개념 카드 한 장. 카드는 「강사 강조 → 한 줄 → 기준 → KBBF → 헷갈리는 점 → 예상 질문」 순서 */
:root{
  --bg:#f1f3f6; --panel:#ffffff; --ink:#18212e; --muted:#5a6575; --line:#d8dde5;
  --accent:#24477f; --accent-soft:#e2e9f5; --sel:#dbe4f4;
  --ok:#2f6b47; --ok-soft:#e3f0e8; --warn:#93570a; --warn-soft:#fbefd9; --sem:#7a3e8f; --sem-soft:#f3e8f6;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --panel:#1a2029; --ink:#e3e8ef; --muted:#9aa5b4; --line:#2e3644;
  --accent:#8fb0ff; --accent-soft:#223152; --sel:#24314a;
  --ok:#7fc59a; --ok-soft:#1d3327; --warn:#e6b25e; --warn-soft:#3a2d17; --sem:#d7a6e8; --sem-soft:#33233a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --panel:#1a2029; --ink:#e3e8ef; --muted:#9aa5b4; --line:#2e3644;
  --accent:#8fb0ff; --accent-soft:#223152; --sel:#24314a;
  --ok:#7fc59a; --ok-soft:#1d3327; --warn:#e6b25e; --warn-soft:#3a2d17; --sem:#d7a6e8; --sem-soft:#33233a; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;margin:0;padding-inline:16px;padding-block:8px;box-sizing:border-box}
*{box-sizing:border-box}
.app{display:grid;grid-template-columns:clamp(270px,23vw,350px) minmax(0,1fr);gap:10px;height:calc(100vh - 16px);min-height:600px}
.side,.main{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
.side{display:flex;flex-direction:column;overflow:hidden}
.side header{padding:12px 14px 10px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.side h1{font-size:17px;margin:0}
.side h1 small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools button{font:inherit;font-size:12.5px;padding:3px 9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:5px;cursor:pointer}
.tools button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
#q{font:inherit;font-size:13.5px;padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink);width:100%}
button:focus-visible,#q:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{font-size:12px;color:var(--muted)}
.list{overflow:auto;padding:4px 8px 10px;flex:1}
.grp{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.05em;margin:12px 6px 4px}
.list button{display:grid;grid-template-columns:2.6em 1fr auto;gap:4px;width:100%;text-align:left;font:inherit;font-size:13.8px;line-height:1.35;padding:5px 8px;border:0;background:none;color:var(--ink);border-radius:5px;cursor:pointer;align-items:start}
.list button .no{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding-top:2px}
.list button .tag{display:flex;gap:3px;align-items:center;padding-top:1px}
.list button:hover{background:var(--accent-soft)}
.list button.on{background:var(--sel);font-weight:600}
.stars{font-size:11px;color:var(--warn);letter-spacing:-1px;white-space:nowrap}
.semdot{font-size:10.5px;font-weight:700;color:var(--sem);background:var(--sem-soft);border-radius:3px;padding:0 4px}
.side footer{font-size:11.5px;color:var(--muted);padding:6px 12px;border-top:1px solid var(--line)}
.main{overflow:auto;padding:18px 24px 28px}
.card{max-width:1080px;display:grid;gap:14px}
.eyebrow{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow .stars{font-size:14px}
.card h2{font-size:24px;margin:2px 0 0;line-height:1.3;text-wrap:balance}
.card h2 small{display:block;font-size:13.5px;font-weight:400;color:var(--muted);margin-top:4px}
.sem{border-left:3px solid var(--sem);background:var(--sem-soft);border-radius:0 6px 6px 0;padding:7px 12px}
.sem b{color:var(--sem);font-size:12.5px;letter-spacing:.04em;margin-right:6px}
.one{background:var(--accent-soft);border-radius:6px;padding:10px 14px;font-size:17px;font-weight:600}
section h3{font-size:12.5px;letter-spacing:.06em;color:var(--accent);margin:0 0 6px;font-weight:700}
ol.req{margin:0;padding-left:22px;display:grid;gap:5px}
.req ul.sub{list-style:none;margin:6px 0 4px;padding:0;display:grid;gap:5px}
.req ul.sub li{display:grid;grid-template-columns:1.6em 1fr;gap:2px 6px;align-items:baseline}
.req ul.sub .sn{color:var(--accent,#8ab4ff);font-weight:600}
.req ul.sub .sb b{font-weight:600}
.req ul.sub .sx{display:block;opacity:.82;font-size:.95em;margin-top:1px}
.req .rh{font-weight:600}
.req .rt{margin-top:4px;opacity:.9}
.mem .hide{filter:blur(5px);cursor:pointer;user-select:none;transition:filter .15s}
.mem .hide.show{filter:none}
@media (prefers-reduced-motion:reduce){.mem .hide{transition:none}}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--bg)}
ul.kb{list-style:none;margin:0;padding:0;display:grid;gap:5px}
ul.kb li{display:grid;grid-template-columns:5.2em 1fr;gap:8px;align-items:start}
.st{font-size:11.5px;font-weight:600;border-radius:4px;padding:1px 6px;text-align:center}
.st.ok{background:var(--ok-soft);color:var(--ok)} .st.warn{background:var(--warn-soft);color:var(--warn)} .st.na{background:var(--bg);color:var(--muted)}
.trap{border-left:3px solid var(--warn);padding:6px 12px;background:var(--warn-soft);border-radius:0 6px 6px 0}
.trap ul{margin:0;padding-left:18px;display:grid;gap:3px}
.qa{display:grid;gap:6px}
.qa details{border:1px solid var(--line);border-radius:6px;padding:7px 12px}
.qa summary{cursor:pointer;font-weight:600}
.qa details p{margin:8px 0 2px;border-left:3px solid var(--ok);padding:4px 10px;background:var(--ok-soft);border-radius:0 5px 5px 0}
.qa .all{justify-self:start;font:inherit;font-size:12.5px;padding:2px 9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:5px;cursor:pointer}
.ir{color:var(--muted);font-size:.9em}
.empty{color:var(--muted);padding:30px}
@media (max-width:760px){
  .app{grid-template-columns:1fr;height:auto}
  .side{max-height:46vh}
  .main{padding:14px}
  .card h2{font-size:20px}
}
</style>

<div class="app">
  <aside class="side">
    <header>
      <h1>OJK 규정 핵심 노트<small>APPI 교재 2종(A to Z 2026 · MODUL K6·K7) + 세미나 강사 강조 · KBBF 수치는 8월말 OJK 보고 기준</small></h1>
      <div class="tools" role="group" aria-label="필터">
        <button type="button" data-f="all" aria-pressed="true">전체</button>
        <button type="button" data-f="3" aria-pressed="false">★★★만</button>
        <button type="button" data-f="sem" aria-pressed="false">강사 강조만</button>
        <button type="button" id="memBtn" aria-pressed="false" title="단축키 H">암기 모드</button>
      </div>
      <input id="q" type="search" placeholder="검색 (예: BMPP, 추심, 2.5%)" aria-label="개념 검색">
      <div class="count" id="count"></div>
    </header>
    <nav class="list" id="list" aria-label="개념 목록"></nav>
    <footer>↑↓ 이동 · H 암기 모드(가린 곳 클릭) · / 검색</footer>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>

<script>
const CH={"0":"0 · 한눈에 보기","1":"1 · 업권 기본·규제 체계","2":"2 · 사업 범위와 영업 규칙","3":"3 · 건전성·자본·조달","4":"4 · 지배구조","5":"5 · 리스크관리와 건강도","6":"6 · 사업계획과 컴플라이언스","7":"7 · Anti-Fraud와 내부감사","8":"8 · 소비자보호·AML·인력"};

ervisory Status", "imp": 3, "sem": null, "one": "OJK가 회사를 보는 체계는 건강도(Health Level) 평가, 리스크 프로필(Risk Profile), 감독 상태(Supervisory Status) 세 가지이며, 리스크 프로필은 건강도 평가의 한 요소이고 건강도 등급은 감독 상태 지정으로 이어짐.", "req": [{"h": "① 건강도 평가(POJK 28/2020)", "items": [["GCG", "지배구조 원칙을 실제 경영에서 이행하고 있는지를 평가함"], ["리스크 프로필", "8대 위험의 고유위험과 리스크관리 품질을 함께 평가함"], ["수익성(Profitability)", "수익 성과와 그 원천, 수익이 계속 유지될 수 있는지를 평가함"], ["자본", "자본적정성과 자본관리 수준이 사업 위험을 감당하기에 충분한지 평가함"]], "tail": "4요소, 종합 1~5등급"}, "② 리스크 프로필(PADK 48/2025): 8대 위험의 고유위험(Inherent Risk) × 리스크관리 품질, 반기 제출, 건강도 평가 4요소 중 하나", {"h": "③ 감독 상태(POJK 49/2024)", "items": [["정상", "집중·특별감독 기준에 해당하지 않아 사업 지속에 어려움이 없는 상태임"], ["집중", "건강도 종합 4등급, 자기자본/납입자본 0% 이상 50% 미만, Net NPF 5% 초과 25% 이하 등 사업 지속을 위협할 잠재적 어려움이 있는 상태임"], ["특별감독(Special)", "집중감독 기간 종료, 건강도 종합 5등급, 자기자본/납입자본 0% 미만, Net NPF 25% 초과 등 사업 지속이 이미 위협받는 상태임"]], "tail": "건강도 등급·자기자본/납입자본·Net NPF로 지정"}, "연결: 리스크 프로필 → 건강도 종합등급(Composite Rating)의 한 요소, 건강도 4등급 → 집중감독(Intensive), 5등급 → 특별감독", "GCG 자체평가(2/15)는 건강도 자체평가 보고서의 일부", "참고(교재 외): 회사는 별도로 자본·금융채권 품질·수익성·유동성 점수의 월별 재무건강도(TKK)를 산출해 내부 점검에 씀"], "tbl": {"h": ["체계", "근거", "구성·기준", "KBBF"], "r": [["건강도 평가", "POJK 28/2020", "GCG·리스크 프로필·수익성·자본 → 1~5등급", "GCG 2등급, 수익성 최약, 공식 종합등급 확인 필요"], ["리스크 프로필", "PADK 48/2025", "8대 위험 고유위험 × 관리 품질, 반기", "2분기 종합 P2(유동성 P1, 법률 P3)"], ["감독 상태", "POJK 49/2024", "정상·집중·특별(등급·자본·Net NPF)", "자기자본/납입자본 58.96%, Net NPF 0.94% → 기준과 거리 있음"]]}, "kb": [["ok", "리스크 프로필 2분기 P2, GCG 2등급"], ["ok", "감독 상태 기준과 거리 있음"], ["warn", "회사 월별 재무건강도 8월 한 단계 하락(BOPO 90% 초과, 수익성 약화) · 교재 외 내부 지표"]], "trap": ["건강도 평가와 리스크 프로필의 등급은 숫자가 클수록 나쁨", "리스크 프로필 P 등급의 단계 수와 명칭은 교재에 없음 [확인 필요]", "NPF는 리스크 프로필(신용위험) 지표이면서 감독 상태 지정 기준(Net NPF)에도 쓰임"], "qa": [["OJK가 회사를 평가하는 체계를 설명해 주십시오.", "건강도 평가는 GCG, 리스크 프로필, 수익성, 자본 네 요소로 1~5등급을 매기고, 리스크 프로필은 8대 위험을 반기마다 평가하며, 이 결과와 자본·Net NPF 기준에 따라 감독 상태가 정해집니다. KBBF는 GCG 2등급, 리스크 프로필 P2이고, 감독 상태 기준과는 거리가 있습니다. 다만 수익성이 가장 약한 요소라 우선 개선하겠습니다."]]}, {"ch": "1", "id": "POJK 35/2018 · A to Z S.1~4 · Modul Q7-2 PC1.3", "t": "MFC 정의와 OJK 감독 범위", "e": "Finance Company (Perusahaan Pembiayaan) · OJK supervision", "imp": 2, "sem": null, "one": "멀티파이낸스(MFC)는 재화·서비스에 금융을 제공하는 회사이며 OJK 인허가·감독 5개 영역 중 비은행 금융기관(PVML) 영역에 속함.", "req": ["정의: 재화 및/또는 서비스에 대한 금융(financing) 활동을 수행하는 사업체(POJK 35/2018). 생산 목적(사업 투자·운전자금)과 소비 목적 모두 금융", "형태 2가지: 일반(Conventional)과 샤리아(Sharia)", "OJK 감독 5개 영역: ① 은행 ② 자본시장·파생금융·탄소거래소 ③ 보험·보증·연기금 ④ 금융기관·벤처캐피탈·소액금융기관·기타 비은행금융기관 ⑤ 금융기술혁신(ITSK)·디지털금융자산·암호자산 → MFC는 ④", "OJK 역할: 영업인가, 경영진 변경 승인, 신상품 승인, POJK·SEOJK 발행, 검사·감독·제재", "OJK 외 관련 기관: 국세청(DJP)·재무부(세무), 법무인권부(법인 지위·피두시아 등록), 중앙은행 BI(외환·헤지 감독), PPATK(의심·현금거래 보고 수령), 통신디지털부 Komdigi(전자서명·전자시스템운영자 PSE), 노동부"], "tbl": null, "kb": [["ok", "Fleet 투자금융(Investment Financing, 생산 목적) 중심, 리테일 다목적금융(Multipurpose Financing), 딜러 운전자금, 일부 팩토링(Factoring) 운영. Fleet 비중 약 88%(8월)"]], "trap": ["교재는 Finance Company, PP(Perusahaan Pembiayaan), NBFI(LJKNB)를 섞어 씀. NBFI는 MFC를 포함한 비은행금융기관 전체를 가리키는 상위 개념", "의심거래(STR)·현금거래(CTR) 보고는 PPATK가 받음. 외환·헤지 감독은 BI 소관"], "qa": [["멀티파이낸스 회사의 정의와 은행과의 차이는 무엇입니까?", "멀티파이낸스는 OJK 감독을 받는 비은행 금융기관으로, 재화와 서비스에 대한 금융을 제공하며 공중으로부터 예금을 받을 수 없습니다. KBBF는 운송사업자 대상 Fleet 투자금융이 중심이고, 리테일 다목적금융과 딜러 운전자금을 함께 운영하고 있습니다."]]}, {"ch": "1", "id": "SKB 1974 ~ POJK 46/2024 · A to Z S.4", "t": "업권 연혁", "e": "Industry Development · SKB of 3 Ministers (1974) → POJK 46/2024", "imp": 1, "sem": null, "one": "인니 멀티파이낸스는 1974년 리스로 시작해 2000년 소비자금융, 2018년 운전자금·투자금융(Investment Financing), 2024년 비대면 금융으로 업무 범위가 넓어짐.", "req": ["1974년 3개 부처 공동결정(SKB): 최초 업무로 리스(leasing) 도입", "1991년 재무부령 KMK 1169: 리스업무 시행규정", "2000년 KMK 448/2000: 리스, 팩토링(Factoring), 신용카드, 소비자금융 수행 가능", "2000년 이후 소비자금융이 업무를 주도, 금융대상의 70%가 자동차", "2018년 POJK 35/2018: 운전자금·투자금융 수행 가능", "2024년 POJK 46/2024: 대면 없는(without face-to-face) 금융 수행 가능"], "tbl": null, "kb": [], "trap": ["비대면 금융 허용 근거는 POJK 46/2024, 운전자금·투자금융 근거는 POJK 35/2018"], "qa": [["POJK 46/2024는 이전 규정 POJK 35/2018과 비교해 무엇이 바뀌었습니까?", "POJK 35/2018이 운전자금과 투자금융을 허용했고, POJK 46/2024는 비대면 금융을 허용하는 등 사업 범위를 넓혔습니다. 이후 POJK 35/2025로 선수금(Down Payment), 무담보 운전자금, 비대면 요건이 다시 개정되었고, KBBF는 개정 기준에 맞춰 상품 운영 여부를 판단하겠습니다."]]}, {"ch": "1", "id": "A to Z S.13·S.15", "t": "MFC 규제 체계 지도", "e": "Finance Company Regulation Framework", "imp": 2, "sem": "강사가 POJK 46/2024·48/2024·35/2025를 중요 규정으로 표시했고 42/2024·19/2025도 목록에 넣음. 번호는 정확히 말하되 답변 중심은 실질 내용과 회사 적용에 둘 것 [FP메모 14번, K7, 강의정리 3.4]", "one": "교재는 MFC 규정을 금융사업 운영, 지배구조·리스크·준법(GRC), 소비자보호, 기타 규정, 금융업 규정 전반의 5대 축으로 정리함.", "req": [{"h": "5대 축", "items": [["금융사업 운영", "사업 범위, 금융 방식, 건전성 비율, 영업 규칙 등 금융업 수행 자체를 정한 규정 영역임"], ["지배구조·리스크관리·준법(GRC)", "GCG, 리스크관리, IT 리스크, 건강도 평가, Anti-Fraud, 적격성 재평가 등 회사 운영을 통제하는 규정 영역임"], ["소비자보호", "상품 정보 제공(RIPLAY), 민원 처리, 소비자 권리 보호 등 소비자와의 관계를 정한 규정 영역임"], ["기타 관련 규정", "인력, 감독상태, 중소기업 금융, 지속가능금융, 사업계획 등 개별 업무에 함께 적용되는 규정을 묶은 영역임"], ["금융업 규정 전반", "월간보고, OJK 수수료, 세무, 금융복합그룹, F&P 등 금융업 전반에 공통으로 적용되는 규정을 묶은 영역임"]]}, "사업활동: POJK 35/2018, 10/2019(샤리아), 7/2022, 46/2024, 35/2025(46/2024 개정)", "GRC: POJK 48/2024(지배구조), 42/2024(리스크관리)·PADK 48/2025(시행세칙), 4/2021(IT 리스크), 28/2020(건강도 평가)·SEOJK 11/2020, 12/2024(Anti-Fraud), 28/2024(SIPELAKU), 34/2018(적격성 재평가), 42/2025(재무보고 무결성)", "AML·CFT: POJK 8/2023, 23/POJK.01/2019, 12/POJK.01/2017", "소비자보호: POJK 22/2023, 38/2025(OJK 소송), PADK 37/2025(RIPLAY), POJK 3/2023, 61/2020 등", "기타: POJK 43/2024(인력), 49/2024(감독상태), 19/2025(중소기업 금융), 51/2017(지속가능금융), 24/2019(사업계획), 월간보고·OJK 수수료·세무·금융복합그룹·F&P(34/2018 등)"], "tbl": null, "kb": [], "trap": ["POJK 46/2024(사업활동)와 POJK 46/2025(교재 샤리아 슬라이드 표기)는 번호가 같고 연도가 다름 [원문 표기 그대로]", "RIPLAY 근거는 PADK 37/PADK.08/2025(2025-12-02 시행)로 확인됨. 교재 슬라이드의 'POJK 37/2025'는 오기이며, POJK 37/2025는 보험·보증·연금 회사의 감독상태 규정임", "2024년 번호 짝: 42 리스크관리, 43 인력, 46 사업 운영, 48 지배구조, 49 감독상태(Supervisory Status)"], "qa": [["멀티파이낸스 회사가 지켜야 할 핵심 규정을 말씀해 주십시오.", "사업 운영은 POJK 46/2024와 개정 규정 35/2025, 지배구조는 48/2024, 리스크관리는 42/2024와 시행세칙 PADK 48/2025가 기본입니다. 대표이사(President Director)로 선임되면 규정별로 담당 부서와 점검 주기를 정해 준수 현황을 이사회(BOD, Directors)에서 정기적으로 확인하겠습니다."]]}, {"ch": "1", "id": "POJK 46/2024 (35/2018 대체, 35/2025로 개정)", "t": "POJK 46/2024 기본 규정 구조", "e": "Financing Business Operations (Penyelenggaraan Usaha Perusahaan Pembiayaan)", "imp": 3, "sem": "강사가 46·48·35를 중요 규정으로 표시했고, 1쪽 메모에 핵심 POJK 한 줄 요약(46/2024 포함)을 준비하라고 권고함 [FP메모 14번, 강의정리 3.6]", "one": "POJK 46/2024는 MFC의 사업 범위, 자본·건전성 비율, 여신한도, 채권 관리, 영업 규칙을 정한 기본 규정임.", "req": [{"h": "사업 범위", "items": [["투자금융(Investment Financing)", "사업장 재건·현대화·확장·이전에 필요한 자본재와 부수 서비스를 금융함"], ["운전자금금융(Working Capital Financing)", "차주의 1개 영업주기 안에 쓰이는 단기 운영 지출을 금융함"], ["다목적금융(Multipurpose Financing)", "사업·생산 목적이 아닌 사용·소비 목적의 재화·서비스를 금융함"], ["OJK 승인 기타 금융", "위 3개 유형 외의 금융으로, 사업계획 반영·건강도 종합 2등급·기본자본 Rp200bn 등 요건을 갖추고 OJK 승인을 받아야 함"]], "tail": "샤리아 별도"}, {"h": "건전성 비율", "items": [["기본자본(Core Capital) IDR 100bn 이상", "회사가 상시 유지해야 하는 기본자본의 최저 금액임"], ["기본자본/납입자본 50% 이상", "손실 누적으로 기본자본이 납입자본의 절반 아래로 줄어들면 안 됨"], ["Gearing 10배 이하", "자기자본 대비 차입 등 조달 총액이 10배를 넘으면 안 됨"], ["FAR 50% 이상", "순 금융채권잔액이 총자산의 50% 이상이어야 함"], ["자본비율(Capital Ratio) 10% 이상", "조정자본을 조정자산으로 나눈 비율이 10% 이상이어야 함"]]}, "최대금융한도(BMPP): 단일 차주 자본의 20%, 단일 그룹 50%. 외부 요인으로 초과 시 1개월 내 실행계획(action plan)", "채권 재조정(Restructuring): 상환 곤란 + 상환능력, 등급 개선·충당금 회피 목적 금지, 원 승인자보다 상위 권한자 결정", "자산 건전성 분류 5단계, 충당금 1%·5%·15%·50%·100%(담보 차감 후)", {"h": "영업 규칙", "items": [["피두시아(Fiducia) 1개월 내 등록", "담보신탁을 금융계약일로부터 늦어도 1개월 안에 등록해야 하며, 피두시아 증서는 담보 집행의 요건임"], ["상환청구권부(with recourse) 채널링(Channeling)·공동금융(Joint Financing) 금지", "자금 제공자가 부담할 위험을 MFC가 되돌려 받는 조건의 채널링·공동금융은 할 수 없음"], ["제3자 인센티브 계약 수입의 17.5% 이하", "딜러 등 제3자에게 주는 커미션·인센티브는 각 금융계약 총수입의 17.5%를 넘을 수 없음"]]}, "조직·주주: 필수 기능 9개, 교육훈련비 인건비 2.5% 이상, 외국인 지분 85% 이하", "위반 처리: 통지 → 1개월 내 충족 → 이행계획 → 행정제재"], "tbl": null, "kb": [["ok", "자본·비율 기준 모두 충족(8월: 자본비율 63.88%, Gearing 2.06배, FAR 95.63%, 자기자본/납입자본 58.96%)"], ["ok", "재조정 채권 0.51%(6월)"], ["warn", "최대 차주 여신한도 비중 확인 필요"]], "trap": ["교재 일부 슬라이드는 근거를 아직 POJK 35/2018로 표기함. 현행 기본 규정은 46/2024이고 POJK 35/2025(2025-12-22 시행)가 일부 조항을 개정함", "POJK 46/2024(사업 운영)와 POJK 48/2024(지배구조)를 혼동하지 않음"], "qa": [["POJK 46/2024의 핵심 내용과 KBBF의 준 ", "imp": 1, "sem": null, "one": "교재 차트상 MFC 수는 200개 안팎에서 144개 수준으로 줄어드는 추세이고, 사업 초점별 분포 합계는 144개임.", "req": ["회사 수 추이(2013~2026년 4월) 추출값: 200, 202, 201, 203 … 147, 146, 145, 144로 감소 추세", "사업 초점별 회사 수: 78개(54.17%), 20개(13.89%), 18개(12.50%), 16개(11.11%), 9개(6.25%), 3개(2.08%), 합계 144개", "사업 초점 범주: 신차 2륜, 중고 2륜, 신차 4륜, 중고 4륜, 운송차량, 기타", "성장 연혁 차트의 위기 사건: 이중담보(Double Pledge) 사건, 코로나19, 연료보조금 폐지, 글로벌 금융위기, 유가 인상, 경제위기"], "tbl": null, "kb": [], "trap": ["연도별 회사 수와 범주별 수치의 대응은 교재 추출에서 불명확 [확인 필요]"], "qa": [["업계 회사 수 추세를 알고 있습니까?", "교재 통계로 MFC 수는 200개 안팎에서 2026년 4월 약 144개로 줄고 있습니다. KBBF는 자본 기준을 넉넉히 충족하고 있으므로, 수익성을 회복해 계속 경쟁할 수 있는 회사로 만들겠습니다."]]}, {"ch": "1", "id": "A to Z S.9~11 · GAIKINDO · AISI", "t": "금융대상 구성과 차량 판매", "e": "Financing objects · Car Sales (GAIKINDO) · Motorcycle National Sales (AISI)", "imp": 2, "sem": null, "one": "업계 금융대상은 소비재 69%, 생산재 25%이고 생산재 중 운송차량이 42.1%로 가장 크며, GAIKINDO는 2026년 자동차 판매를 85만 대로 전망함.", "req": ["전체 구성: 소비재 69%, 생산재 25%, 서비스 3.85%, 매출채권 2.43%, 인프라재 0.30%", "소비재: 신차 4륜 39.3%, 신차 2륜 24.1%, 중고 4륜 23.4%, 중고 2륜 6.2%, 기타 소비재 4% 등", "생산재: 운송차량 42.1%, 중장비 등 34.8%(표기 겹침), 기타 15.9%, 기계 4.9%, 건물 0.5%", "GAIKINDO 2026년 자동차 판매 전망 85만 대", "AISI 2026년 이륜차 판매 전망 640만~670만 대"], "tbl": null, "kb": [["ok", "Fleet(운송차량) 비중 약 88%(8월)"]], "trap": ["생산재 34.8% 항목은 '주택·아파트'와 '생산용 중장비' 표기가 겹쳐 추출됨 [확인 필요]", "AISI 전망 문구가 원문에 'car sales'로 표기됨 [원문 표기 그대로]"], "qa": [["2026년 자동차 시장 전망과 KBBF 목표는 어떻게 연결됩니까?", "GAIKINDO는 2026년 자동차 판매를 85만 대로 전망하고 있습니다. KBBF는 운송차량 Fleet 비중이 약 88%이므로 신차 판매 전망과 운송사업자 수요를 함께 보고 신규취급 목표를 세우겠습니다."]]}, {"ch": "1", "id": "A to Z S.13 · SEOJK 11/SEOJK.01/2024 · SEOJK 28/2025 · PADK 45/2025", "t": "정기 보고·SLIK·가입 의무", "e": "Monthly Report (APOLO) · SLIK · OJK Fee · Membership (APPI)", "imp": 2, "sem": "강사는 OJK 수수료, 월간 보고, 금융복합그룹은 깊게 묻지 않을 수 있다고 함. 수치로 월간 보고 매월 10일 전후, OJK 수수료 감사받은 총자산의 0.045% 분기 납부를 언급 [강의정리 6.3·2.3]", "one": "MFC는 매월 APOLO 월간보고와 SLIK 차주정보 보고를 하고, 2026-07-01부터는 완제 건의 SLIK 정보를 3영업일 안에 갱신해야 함. 연간 보고는 Anti-Fraud 1월 31일, 경영실태평가(GCG 포함) }, "거절 사유 설명(POJK 11/2024 제17조): SLIK 정보로 여신을 거절한 차주가 서면 요청하면 서면으로 설명", "OJK 입장: SLIK만으로 여신 승인을 정해서는 안 됨(2025년 10월·2026년 7월 보도자료). POJK 35/2025 제26조는 연체 이력 차주도 상환능력과 리스크 성향 기준을 충족하면 취급 가능하게 함", "P2P 대출사업자는 2025-07-31부터 SLIK 보고기관에 포함됨. 신용보험·보증보험사와 보증회사의 편입 기한은 2027-12-31로 연장됨"], "tbl": null, "kb": [["warn", "완제·중도상환·회수차량 매각 정산 건의 3영업일 갱신 절차와 7월 이후 준수 실적 [확인 필요]"], ["warn", "SLIK 데이터 오류 반복 → 제출 전 검증 강화"], ["ok", "심사 단계에서 SLIK 조회 후 소득·현금흐름·담보 가치와 함께 판단"], ["warn", "SLIK 내규(051/2025)가 대체된 SEOJK 3/2021을 인용하고 완제 건 3영업일 갱신 절차를 반영하지 않음 [내규 대조 2026-10-11]"]], "trap": ["보고 주기는 월 1회로 유지됨. 3영업일은 완제 건 갱신에만 적용됨", "매일 보고(POJK 8/2026)는 P2P 대출사업자 규정이며 MFC에는 적용되지 않음", "3영업일 갱신 위반의 제재 수준은 공표되지 않음 [확인 필요]", "SLIK는 OJK 신용정보 시스템이고, 자산등기기관(Rapindo)은 담보 중복 확인용임"], "qa": [["7월부터 SLIK 정보 갱신 기준이 바뀌었는데, 회사는 어떻게 대응합니까?", "7월 1일부터 완제 건은 3영업일 안에 SLIK 정보를 갱신해야 하고, Rp1백만 이하 정보는 조회 결과에 나타나지 않습니다. 매달 말 기준 다음 달 12일까지 내는 정기 보고는 그대로입니다. 완제, 중도상환, 회수 차량 매각 정산 건을 매일 뽑아 갱신하고, 기한 준수 여부를 컴플라이언스 대시보드에서 점검하겠습니다."], ["심사에서 SLIK는 어떻게 활용합니까?", "SLIK는 중요한 자료이지만 SLIK만으로 승인 여부를 정하지 않습니다. 소득과 현금흐름, 담보 가치를 함께 보고, 연체 이력이 있어도 상환능력이 확인되면 리스크 성향 기준 안에서 취급할 수 있습니다. SLIK 정보로 거절한 차주가 서면으로 요청하면 거절 사유를 서면으로 설명하겠습니다."]]}, {"ch": "1", "id": "OJK 입법예고(Rancangan Regulasi) · 2026-10-11 기준", "t": "입법예고 중인 규정안", "e": "RPOJK · RPADK under public consultation", "imp": 2, "sem": null, "one": "2026-10-11 현재 MFC와 관련해 미확정인 초안은 경영실태평가 규정 개정안(POJK·PADK), F&P 시행세칙 개정안, 지속가능금융 개정안 등이며, 확정 전에는 현행 기준으로 답함.", "req": [{"h": "KBBF 관련 초안", "items": [["RPOJK TKS PVML", "경영실태평가 규정(POJK 28/2020 대체). 2026-04-08 공개, 04-21 의견 마감. 4요소 1~5등급, 매년 12월 기준 다음 해 2월 15일 제출, 지연 시 영업일당 Rp50만(최대 Rp25백만)"], ["RPADK TKS PP·PPS", "MFC 경영실태평가 시행세칙. 2026-03-13 공개, 04-17 마감. SEOJK 1/2016·2/2016·11/2020 폐지"], ["RPADK PKK PVML", "F&P 시행세칙(SEOJK 22/2024 대체). 2026-02-24 공개, 03-05 마감. 진행 중 신청은 기존 기준 적용. 2026-09 현재 작성 중"], ["RPOJK·RPADK SF", "지속가능금융(POJK 51/2017 대체). 2026-02-10 공개. 자산 규모별 단계적 배출량·IFRS S2 공시"]]}, "기타 초안: 금융그룹(2026-04-16), 제재 이의제기 절차(2026-05-12), 신용조회회사 LPIP(2026-07-01), 소비자·공공서비스(2026-07-27, 2026년 말 제정 목표), 금융복합기업집단 자본·유동성(2026-08-19)", "예고만 된 사항: 감독상태 지정 규정(POJK 49/2024) 개정을 2026년 하반기에 낸다고 발표(2026-08-07), 초안 미공개", "POJK 35/2025와 PADK 45/2025는 공개 의견조회 없이 확정됨. 공개 초안만으로 향후 규정을 모두 파악할 수 없음"], "tbl": null, "kb": [["na", "확정 전 초안은 현행 규정(POJK 28/2020, SEOJK 11/2020, SEOJK 22/2024)으로 운영"]], "trap": ["의견 마감일은 시행일이 아님", "경영실태평가 개정안이 공개되었어도 현행 POJK 28/2020과 SEOJK 11/2020(리스크 프로필 부분은 PADK 48/2025, GCG 보고는 SEOJK 28/2025로 대체)이 적용됨"], "qa": [["경영실태평가 규정 개정 내용을 알고 있습니까?", "OJK가 올해 3~4월 개정안을 공개해 의견을 받았고 아직 확정되지 않았습니다. 4요소 체계와 2월 15일 제출은 유지되고 지연 제출 과태료가 들어 있습니다. 확정되면 컴플라이언스 부서가 영향을 평가하고, 그 전까지는 현행 기준으로 운영하겠습니다."]]}, {"ch": "2", "id": "POJK 46/2024 · POJK 35/2025 · A to Z S.16~17", "t": "사업활동 3대 유형과 대면 요건", "e": "Investment Financing · Working Capital Financing · Multipurpose Financing · Mandatory Face-to-Face Physically (Pembiayaan Investasi · Modal Kerja · Multiguna)", "imp": 3, "sem": "강사가 3대 사업라인(투자·운전자금·다목적)을 강조했고, 8/27 LSPPI 인터뷰에서 'OJK 규정상 MFC가 운영할 수 있는 상품'이 실제 출제됨. 운전자금금융에는 금융리스(Finance Lease)가 없음 [강의정리 1.3, 시험힌트 7), LSPPI질의 1번]", "one": "MFC 사업은 투자금융(Investment Financing), 운전자금금융(Working Capital Financing), 다목적금융(Multipurpose Financing)의 3대 유형과 운용리스·수수료 업무 등 기타 활동으로 구성되고, 투자금융만 원칙적으로 대면이 필수임.", "req": ["투자금융: 사업·투자활동, 사업장 재건·현대화·확장·이전에 필요한 자본재와 부수 서비스 금융. 방식 8가지(금융리스, 세일앤리스백, 상환청구권부·없는 팩토링, 할부구매, 프로젝트금융, 인프라금융, OJK 승인 기타)", "운전자금금융: 차주의 1개 영업주기 내 단기 지출 금융. 방식 6가지(세일앤리스백, 상환청구권부·없는 팩토링, 운전자금대출 FMU, 할부구매, OJK 승인 기타)", "다목적금융: 사업·생산 목적이 아닌 사용·소비 목적 금융. 방식 4가지(금융리스, 할부구매, 자금대출 FD, OJK 승인 기타)", {"h": "기타 활동 3가지", "items": [["운용리스(Operating Lease)", "MFC가 소유권을 가진 채 재화를 일정 기간 빌려주고 리스료를 받는 업무임"], ["수수료 기반 업무(Fee-based)", "자금을 빌려주지 않고 법령이 허용하는 서비스를 제공해 수수료 수입을 얻는 업무임"], ["OJK 승인 기타", "위 두 가지 외의 활동은 OJK 승인을 받은 경우에만 수행할 수 있음"]]}, "대면 요건: 투자금융은 물리적 대면 필수(예외 있음), 운전자금·다목적은 대면 또는 비대면", "투자금융 비대면 예외 3요건: a. 소상공인·초소상공인 대상 b. 투자금융 금액 Rp10.000.000(1,000만 루피아) 이하 c. 비대면 투자금융채권 최대 5%"], "tbl": {"h": ["방식", "투자", "운전자금", "다목적"], "r": [["할부구매(Purchase with Installment Payments)", "O", "O", "O"], ["금융리스", "O", "-", "O"], ["세일앤리스백(Sale and Lease Back)", "O", "O", "-"], ["팩토링(Factoring, 상환청구권 유·무)", "O", "O", "-"], ["운전자금대출(FMU, Working Capital Facility)", "-", "O", "-"], ["자금대출(FD, Fund Facility)", "-", "-", "O"], ["프로젝트·인프라금융", "O", "-", "-"]]}, "kb": [["ok", "Fleet 투자금융 중심, 리테일 다목적금융, 딜러 운전자금, 일부 팩토링 운영"]], "trap": ["세일앤리스백은 투자·운전자금, 금융리스는 투자·다목적, 할부구매는 3개 유형 모두에 쓰임. 운전자금금융에는 금융리스가 없음", "투자금융 비대면 예외 한도는 POJK 35/2025로 개정된 제4조 제7항 원문 기준 Rp10.000.000(1,000만 루피아)임. A to Z S.17의 'max. 10 billion'은 오기 [2026-10-11 원문 확인]"], "qa": [["OJK 규정상 MFC가 운영할 수 있는 사업은 무엇입니까?", "투자금융, 운전자금금융, 다목적금융의 3대 유형과 운용리스·수수료 업무 같은 기타 활동, 그리고 OJK 승인을 받은 기타 금융입니다. KBBF는 운송사업자 대상 Fleet 투자금융이 중심이고, 리테일 다목적금융, 딜러 운전자금, 일부 팩토링을 운영하고 있습니다."], ["투자금융과 다목적금융은 어떻게 다릅니까?", "투자금융은 사업에 쓰는 자본재에 대한 금융이고 원칙적으로 대면이 필수입니다. 다목적금융은 사업 목적 외 소비 목적 금융이며 비대면으로도 할 수 있습니다."]]}, {"ch": "2", "id": "POJK 46/2024 · A to Z S.21~22", "t": "할부구매와 금융계약 명칭", "e": "Purchase with Installment Payments (PPSA, Pembelian dengan Pembayaran Secara Angsuran)", "imp": 3, "sem": "강사가 금융계약을 'hire purchase'라고 답한 후보자가 탈락한 사례를 언급했고 'Buy on installment'도 부정확하다고 함. 회사가 실제 쓰는 계약 명칭을 반드시 확인하라고 강조 [강의정리 1.3·2.2·3.2, 시험힌트 Q10]", "one": "할부구매는 MFC가 공급자에게 대금을 직접 지급하고 차주가 MFC에 할부로 상환하는 금융으로, 3대 유형 모두에 쓰이는 자동차금융의 기본 계약임.", "req": ["구조: MFC가 재화·서비스 공급자에게 대금 직접 지급, 차주는 MFC에 할부 상환", "소유권: 약정에 따라 공급자에서 차주에게 이전", "투자·운전자금·다목적 3개 유형 모두에 사용", "흐름 7단계: ① 차주 재화 선택·선수금(Down Payment) 납부 ② 금융 신청 ③ MFC 승인 ④ 공급자에 잔금 지급 ⑤ 공급자 인도 ⑥ 인수증 제출 ⑦ 할부 납부", "영문 명칭은 Purchase with Installment Payments로 말함. 'hire purchase', 'buy on installment'는 쓰지 않음"], "tbl": null, "kb": [], "trap": ["약칭이 자료마다 다름: 시험힌트 PPASR, 가이드·W1 PPSA. KBBF 실제 계약서 명칭으로 확정 필요 [확인 필요]", "할부구매는 소유권이 차주에게 이전되고, 금융리스(Finance Lease)는 약정 기간 동안 MFC가 소유권을 보유"], "qa": [["KBBF가 사용하는 금융계약 형태는 무엇입니까?", "MFC 규정상 계약 방식은 할부구매(Purchase with Installment Payments), 금융리스, 세일앤리스백(Sale and Lease Back), 팩토링(Factoring), 운전자금대출(Working Capital Facility), 자금대출(Fund Facility)입니다. KBBF는 Fleet 투자금융(Investment Financing), 리테일 다목적금융(Multipurpose Financing), 딜러 운전자금, 일부 팩토링을 운영하고 있으며, 계약 명칭은 계약서에 쓰인 명칭 그대로 사용하겠습니다."]]}, {"ch": "2", "id": "POJK 46/2024 · A to Z S.19~20", "t": "팩토링(상환청구권 유무)", "e": "Factoring With Recourse · Factoring Without Recourse (Anjak Piutang)", "imp": 2, "sem": "강사는 팩토링을 상환청구권 유무(Factoring With Recourse / Factoring Without Recourse)로 구분해 설명함 [강의정리 1.3]", "one": "팩토링은 기업 영업채권을 매입·관리하는 금융이며, 미회수 위험을 매도인이 지면 상환청구권부, MFC가 지면 상환청구권 없는 팩토링임.", "req": ["정의: 기업의 영업채권 매입과 그 채권 관리. 투자·운전자금금융(Working Capital Financing)에 사용", "상환청구권부(Factoring With Recourse): 채권 매도인이 매각 채권 일부·전부의 미회수 위험 부담", "상환청구권 없는(Factoring Without Recourse): MFC가 매입 채권 전부의 미회수 위험 부담", "금지 3가지: 채권 만기 10년 초과 거래, 채권 만기 2년 초과 거래, 다른 금융회사를 채무자로 하는 매도인 담보부 팩토링", "흐름 6단계: ① 고객이 구매자에 물품 판매 ② 서류를 팩터에 제공 ③ 선지급 ④ 팩터가 구매자에 회수 ⑤ 구매자 대금 지급 ⑥ 잔여 대금 정산"], "tbl": null, "kb": [["ok", "일부 팩토링 운영"]], "trap": ["만기 금지 두 문장(10년 초과, 2년 초과)이 원문에 모두 'without recourse'로 표기됨 [원문 표기 그대로, 확인 필요]"], "qa": [["상환청구권 유무에 따라 팩토링 위험은 어떻게 다릅니까?", "상환청구권부 팩토링은 채권을 판 고객이 미회수 위험을 지고, 상환청구권 없는 팩토링은 금융회사가 위험을 모두 집니다. KBBF는 팩토링을 일부 운영하고 있으므로 매입 채권의 구매자 신용과 만기 요건을 심사 단계에서 확인하겠습니다."]]}, {"ch": "2", "id": "POJK 46/2024 · A to Z S.19", "t": "금융리스·세일앤리스백", "e": "Finance Lease · Sale and Lease Back (Sewa Pembiayaan · Jual dan Sewa Balik)", "imp": 2, "sem": "운전자금금융(Working Capital Financing)에는 금융리스가 없고, 운전자금 쪽 2자 구조는 Sale and Lease Back, Fund Facility, Working Capital Facility라고 설명 [시험힌트 7), Q11·Q12]", "one": "금융리스(Finance Lease)는 MFC가 소유권을 유지한 채 재화를 차주에게 쓰게 하는 금융이고, 세일앤리스백은 차주가 MFC에 판 재화를 다시 리스받는 금융임.", "req": ["금융리스: 재화의 효익과 위험은 실질적으로 차주에게 이전, 약정 기간 중 소유권은 MFC", "금융리스 의무·금지: 차주의 제3자 재리스 금지, MFC는 리스물건에 표지판(plate)·라벨 부착", "사용 범위: 금융리스는 투자·다목적금융(Multipurpose Financing), 세일앤리스백은 투자·운전자금금융", "금융리스 흐름 7단계: 자본재 선택 → 신청 → 승인 → 보증금 납부 → 공급자 대금 지급 → 물건 인도 → 리스료 납부·만기 매수선택권(purchase option)"], "tbl": null, "kb": [], "trap": ["운용리스(Operating Lease)는 3대 유형 밖의 '기타 활동'으로 분류됨"], "qa": [["금융리스 기간 중 소유권은 누구에게 있습니까?", "금융리스 기간 동안 소유권은 금융회사에 있고, 사용에 따른 효익과 위험은 차주에게 넘어가며, 만기에는 매수선택권이 주어집니다. 할부구매(Purchase with Installment Payments)는 약정에 따라 소유권이 차주에게 이전되는 점이 다릅니다."]]}, {"ch": "2", "id": "POJK 46/2024 · A to Z S.21", "t": "프로젝트금융·인프라금융", "e": "Project Financing · Infrastructure Financing", "imp": 1, "sem": null, "one": "프로젝트금융은 투자금융(Investment Financing)의 한 방식이고, 인프라금융은 기본자본(Core Capital) IDR 1조 등 5개 요건을 갖춰야 할 수 있음.", "req": ["프로젝트금융: 여러 자본재·서비스가 필요한 프로젝트 수행 금융, 투자금융에 사용", "프로젝트금융 흐름: 차주(입찰 낙찰자)가 공급자 선정·공사비 산정(RAB) → MFC 승인 → 공급자 지급 → 할부 상환", "인프라금융: 인프라 개발을 위한 재화·서비스 금융", "인프라금융 요건 5개: a. 사업계획(Business Plan) 반영 b. 건강도(Health Level) 종합 2등급 이상 c. 기본자본 IDR 1 trillion 이상 d. 인프라금융 SOP e. OJK 행정제재 중이 아닐 것"], "tbl": null, "kb": [["na", "자기자본 IDR 470.0bn(8월)으로 인프라금융 자본 요건(IDR 1조) 미달"]], "trap": ["기본자본 기준이 업무별로 다름: 인프라금융 IDR 1조, 기타 금융사업 Rp200bn, 회사 최저 IDR 100bn"], "qa": [["인프라금융에 진출하려면 어떤 요건이 필요합니까?", "사업계획 반영, 건강도 종합 2등급 이상, 기본자본 1조 루피아 이상, 인프라금융 SOP, 행정제재가 없을 것의 다섯 가지입니다. KBBF 자기자본은 8월말 약 4,700억 루피아로 1조 루피아 요건에 못 미칩니다."]]}, {"ch": "2", "id": "POJK 46/2024 · A to Z S.18", "t": "기타 금융사업활동 요건 5개", "e": "other financing business activities · other financing based on the approval of OJK", "imp": 2, "sem": null, "one": "OJK 승인 기타 금융사업을 하려면 사업계획 반영, 건강도(Health Level) 종합 2등급, Gearing 충족, 기본자본 Rp200bn, 제재 없음의 5요건을 갖춰야 함.", "req": ["a. 사업계획(Business Plan)에 반영", "b. 건강도 종합 2등급(Composite Rating 2) 이상", "c. 부채비율(Gearing Ratio) 요건 충족", "d. 기본자본(Core Capital) Rp200bn 이상", "e. OJK 행정제재 중이 아닐 것"], "tbl": null, "kb": [["ok", "자기자본 IDR 470.0bn, Gearing 2.06배(8월)"], ["warn", "POJK 기준 공식 건강도 종합등급 확인 필요(GCG 2등급, Risk Profile P2)"]], "trap": ["건강도 종합 2등급은 기타 금융사업, FMU·FD, 인프라금융, 외화차입의 공통 요건", "facts의 자기자본(470.0bn)과 교재의 기본자본(Core Capital)은 산정 범위가 다를 수 있음 [확인 필요]"], "qa": [["신규 금융상품을 도입하려면 어떤 요건이 필요합니까?", "사업계획 반영, 건강도 종합 2등급 이상, Gearing 기준 충족, 기본자본 2,000억 루피아 이상, 행정제재가 없을 것의 다섯 가지입니다. KBBF는 자본과 Gearing 요건을 충족하고 있으며, 신규 상품은 사업계획에 먼저 반영하고 OJK 승인 절차를 거치겠습니다."]]}, {"ch": "2", "id": "POJK 46/2024 · POJK 35/2025 · A to Z S.17·S.23", · A to Z S.29~30", "t": "채널링·공동금융", "e": "Channeling · Joint Financing (Penerusan Pembiayaan · Pembiayaan Bersama)", "imp": 2, "sem": null, "one": "채널링은 자금 소유자가 위험을 모두 지고 MFC는 관리 보수를 받으며, 공동금융은 출연 비율로 위험을 나누고, 두 방식 모두 상환청구권부(with recourse)는 금지됨.", "req": ["채널링(Channeling): 위험은 자금 소유자가 부담, MFC는 자금 관리자로서 관리 보상 수령", "공동금융(Joint Financing): 자금원은 MFC와 타 당사자, 위험은 출연 비율에 따라 각자 부담", "금지: 상환청구권부 채널링(channeling with recourse), 상환청구권부 공동금융(joint financing with recourse)", {"h": "채권 소유증빙 보관 주체 3가지", "items": [["자금 소유자", "채널링·공동금융 자금을 낸 은행 등 자금 소유자가 채권 소유증빙을 직접 보관함"], ["보관기관(custodian)", "증빙 보관을 전문으로 하는 별도 보관기관에 소유증빙 보관을 맡김"], ["자금 소유자 승인 시 MFC", "자금 소유자가 승인한 경우에 한해 MFC가 자기 사무소에서 소유증빙을 보관함"]]}], "tbl": null, "kb": [], "trap": ["채널링은 위험 전부를 자금 소유자가, 공동금융은 비율로 분담. 은행이 상환청구권 조건을 요구해도 두 방식 모두 허용되지 않음"], "qa": [["은행과 상환청구권 조건이 붙은 공동금융을 할 수 있습니까?", "할 수 없습니다. 공동금융은 출연 비율대로 위험을 나누는 구조이고 상환청구권부 채널링과 공동금융은 모두 금지되어 있으므로, 은행과 협업 조달을 할 때 계약 조건을 이 기준으로 확인하겠습니다."]]}, {"ch": "2", "id": "POJK 46/2024 · POJK 35/2018 · A to Z S.31", "t": "담보 소유증빙 보관과 이중담보 금지", "e": "Custody and maintenance of financing asset ownership evidence (BPKB) · Double Pledge", "imp": 2, "sem": null, "one": "MFC는 차량 소유증빙(BPKB) 등 금융대상 소유증빙을 서면지침에 따라 보관하고, 증빙을 질권으로 내주거나 이중담보로 제공해서는 안 됨.", "req": ["금융대상 소유증빙 보관·관리 서면지침 보유", "약정 종료 후에도 소유증빙을 회사 사무소에 보관, 보관시설이 없으면 위험경감 조치", "보관·관리 위험경감 조치 실시", {"h": "채널링(Channeling)·공동금융(Joint Financing) 시 보관 주체", "items": [["자금 소유자", "자금을 낸 은행 등 자금 소유자가 소유증빙을 직접 보관함"], ["보관기관", "별도 보관기관(custodian)에 소유증빙 보관을 맡김"], ["자금 소유자 승인 시 MFC", "자금 소유자가 승인한 경우에 한해 MFC가 회사 사무소에서 보관함"]]}, "금지 2가지: 담보 소유증빙을 타인에게 질권·실물 담보로 제공, 1명의 차주 채권을 2개 이상 대주에게 중복 담보 제공(이중담보)"], "tbl": null, "kb": [], "trap": ["업계 연혁 차트에 이중담보(Double Pledge) 사건이 위기 사건으로 표시되어 있음"], "qa": [["BPKB 보관과 이중담보 방지는 어떻게 합니까?", "규정상 소유증빙은 서면지침에 따라 회사 사무소에 보관하고, 질권으로 내주거나 같은 채권을 여러 대주에게 중복 담보로 제공하는 것은 금지됩니다. 선임 후 BPKB 보관 현황과 차입 담보 제공 내역을 대조해 이중담보가 없는지 확인하겠습니다."]]}, {"ch": "2", "id": "POJK 46/2024 · POJK 35/2018 · A to Z S.39", "t": "MFC 금지행위 7가지", "e": "Prohibitions", "imp": 2, "sem": null, "one": "MFC는 예금 수취, 약속어음 발행, 타인 채무 보증, 불공정 채권 매각, 질권 기반 대출, 민원 비용 부과, 법령 회피 유도의 7가지 행위를 할 수 없음.", "req": ["1. 예금·적금·정기예금 등 형태로 공중으로부터 직접 자금 수취", "2. 약속어음(promissory note) 발행. 채권자인 은행 차입의 담보로 발행하는 경우는 예외", "3. 타인 채무 이행에 대한 어떠한 형태의 보증 제공", "4. 공정성·영업관행 원칙에 맞지 않는 금융채권의 매각·양도", "5. 질권법(pledge law)에 근거한 담보로 대출·금융 제공", "6. 차주·공중에게 민원 처리 비용 부과", "7. OJK 감독 금융기관이 법령을 회피하거나 위반하게 하는 행위"], "tbl": null, "kb": [], "trap": ["약속어음 발행은 채권자 은행 차입의 담보용만 예외", "민원 처리 비용 부과 금지는 소비자보호(POJK 22/2023) 민원 처리 의무와도 연결됨"], "qa": [["멀티파이낸스 회사가 할 수 없는 업무는 무엇입니까?", "공중으로부터 예금을 받거나, 은행 차입 담보용 외에 약속어음을 발행하거나, 타인 채무를 보증하는 것 등 7가지가 금지됩니다. 고객에게 민원 처리 비용을 받는 것도 금지되어 있어, 선임 후 수수료 항목에 해당 비용이 없는지 확인하겠습니다."]]}, {"ch": "2", "id": "POJK 46/2024 · A to Z S.40", "t": "규정 위반 처리 절차와 행정제재", "e": "Violations · Letter of Notification · Fulfillment Plan · Administrative Sanctions", "imp": 2, "sem": "강사: OJK 지적사항 질문은 지적 내용 → 근본 원인 → 조치계획 → 담당자 → 기한 → 증빙 → 감사회(BOC, Board of Commissioners) 모니터링 순서로 답함 [강의정리 3.4·4.4]", "one": "OJK가 위반을 확인하면 통지 후 1개월 내 요건을 충족해야 하고, 못 하면 이행계획을 내며, 이행계획 기간에도 못 하면 행정제재를 받음.", "req": ["절차 1: OJK 위반 확정 → 통지서(Letter of Notification)", "절차 2: 통지일부터 늦어도 1개월 내 요건 충족", "절차 3: 미충족 시 이행계획(Fulfillment Plan) 제출", "절차 4: 이행계획 기간 종료까지 미충족 시 행정제재", {"h": "제재 종류(회사)", "items": [["서면경고", "OJK가 위반 사실을 문서로 지적하고 시정을 요구하는 제재임"], ["영업 일부·전부 동결", "회사 영업활동의 일부 또는 전부를 동결해 일정 기간 수행하지 못하게 하는 제재임"], ["특정 업무 제한", "특정 금융 방식이나 업무를 수행하지 못하도록 업무 범위를 제한하는 제재임"], ["위험수준 평가 하향", "OJK가 매기는 회사 위험수준 평가를 낮추는 제재로, 위험수준을 요건으로 하는 채무증권 발행 등에 영향을 줌"], ["경고장(3회)", "경고장을 3회까지 발부하는 제재로 교재에 표기됨"], ["영업정지", "회사의 영업활동 전체를 정지시키는 제재임"], ["인가취소", "회사의 금융업 영업인가를 취소해 금융회사로서 영업할 수 없게 하는 제재임"], ["승인 취소", "OJK가 이전에 내준 개별 승인 사항을 취소하는 제재임"], ["과징금(administrative fines)", "위반에 대해 회사에 금전적 벌과금을 부과하는 행정제재임"], ["샤리아 사업부(UUS) 인가 취소", "샤리아 사업부(UUS)를 운영하는 회사의 해당 사업부 인가를 취소하는 제재임"]]}, "제재 종류(사람): 지배주주·이사·커미셔너·샤리아감독위원 취임 금지"], "tbl": null, "kb": [["warn", "2026년 3월 OJK 서면 경고 1건: RBB 교육훈련비 2.3%로 2.5% 미달 → 수정 RBB 제출"]], e": "법인 지배주주는 2년 이상 영업한 법인이어야 하고, 투자액은 그 주주의 자기자본 한도 안이며, 외국인 소유는 납입자본의 85%까지임.", "req": ["법인 지배주주: 투자 전 2년 이상 영업한 법인", "법인 주주의 투자금액은 그 주주의 자기자본 한도 내", "지배주주 최소 1명, 실질소유자(beneficial owner) 지정", "설립 납입자본 Rp250bn 이상", "외국인 소유(직·간접) 납입자본의 85% 이하", "외국인 지분 초과 예외(POJK 35/2025 제9조): 이미 85%를 넘은 회사는 지분 변동이 없는 동안 예외, 자본·유동성 문제 해결 목적의 초과는 OJK 승인 계획에 따라 3년 내 85%로 조정", "OJK 개별 예외 정책(2026-06-17, SP 115): 외국인 지분, 법인 지배주주 최소 영업기간(2년), 인수에 따른 납입자본 요건에 대해 신청한 회사에만 다른 기준 적용 가능. 외국인 지분은 변경 보고일부터 최장 3년 내 85%로 조정", "협회(APPI)와 자산등기기관 회원 가입", "지배주주 변경 없는 지분 변경 절차 간소화(POJK 35/2025)", "주주는 회사 운영에서 이사회(BOD, Directors)에 간섭할 수 없음(POJK 48/2024)"], "tbl": null, "kb": [["ok", "대주주 3년 IDR 570bn 계획 증자, 첫 집행 2027년"], ["ok", "10월 16일 임시주총: 지분 변경 승인·사명 변경"], ["ok", "대표이사(President Director) 겸직(Double Positions) 없음(JB 파견 형식)"], ["warn", "나머지 15% 주주의 내·외국인 구분 [확인 필요]"]], "trap": ["외국인 지분 상한 85%(소유), 외국인 이사·커미셔너 50% 이하(인적 구성), 외국인 직원 고용 허용 외국인 지분 25% 이상은 서로 다른 기준", "외국인 지분 25% 이상이면 외국인 이사 가능, 이사의 50% 이상은 인니 국적", "2026-06-17 OJK 정책은 신청 회사에만 적용되는 개별 예외이며 일반 면제가 아님. 인터뷰에서 먼저 언급하지 않음"], "qa": [["외국계 대주주의 지시와 회사·고객 이익이 충돌하면 어떻게 하겠습니까?", "규정상 주주는 이사회의 회사 운영에 간섭할 수 없고, 대주주 의견은 주주총회(GMS)와 이사회의 공식 절차로 반영합니다. 저는 선임 후 JB우리캐피탈 직위를 겸하지 않으며, 회사와 고객 이익을 기준으로 판단하고 반대 의견은 회의록에 남기겠습니다."], ["외국인 지분 한도는 얼마입니까?", "외국인 직·간접 소유는 납입자본의 85%까지이고, 외국인 지분이 25% 이상이면 외국인 이사를 둘 수 있으며 이사의 50% 이상은 인도네시아 국적이어야 합니다. KBBF는 10월 16일 임시주총에서 지분 변경과 사명 변경을 승인할 예정이며, 지분 구조는 이 기준 안에서 운영하겠습니다."]]}, {"ch": "4", "id": "POJK 48/2024 · A to Z S.52~54 / Modul Q7 3-1·3-8", "t": "GCG 정의와 5원칙(TARIF)", "e": "Good Corporate Governance · Transparency, Accountability, Responsibility, Independency, Fairness (인니어 참고: Tata Kelola Perusahaan yang Baik)", "imp": 3, "sem": "강사는 GCG를 구조·과정·결과로 설명하고 과정이 TARIF라고 함. Accountability와 Responsibility 혼동을 흔한 실수로 지적함(강의정리 1.5·2.5, 시험힌트 3)).", "one": "GCG는 회사 기관이 법규와 윤리에 따라 책임 있게 회사를 운영하는 구조와 과정이며, 5원칙(TARIF)으로 이행함.", "req": ["정의: 주주총회(GMS)·이사회(BOD, Directors)·감사회(BOC, Board of Commissioners)가 사업성과 달성과 기업가치 극대화를 위해 규정과 윤리에 따라 책임 있게 권한을 행사하는 구조와 과정", "인용 정의: \"the system by which companies are directed and controlled\"(Sir Adrian Cadbury)", "① 투명성(Transparency): 관련 정보를 명확하고 접근하기 쉽게 공개", "② 책임성(Accountability): 각 기관·직무에 맞는 경영 책임(조직구조·직무·KPI·보고체계)", "③ 책임(Responsibility): 법규·규정·규범 준수", "④ 독립성(Independency): 의사결정에서 이해상충과 외부 간섭 회피", "⑤ 공정성(Fairness): 모든 이해관계자를 공정하게 대우", "GCG 강령(Code of GCG): 회사 경영의 기초이자 기준, 모든 활동에 적용, 법규 변화에 맞춰 정기 재검토", "설명 틀(강사): 구조(BOD·BOC·주총·위원회·리스크·컴플라이언스·내부감사·Anti-Fraud·AML·소비자보호 조직) → 과정(TARIF) → 결과(고객·임직원·주주·채권자·OJK 등에 대한 실질 가치)"], "tbl": null, "kb": [["ok", "2025년 GCG 자체평가 2등급"], ["ok", "대표이사(President Director) 겸직(Double Positions) 없음(JB 파견 형식)"]], "trap": ["Accountability는 직무·KPI·보고체계, Responsibility는 법규 준수임. 강사가 가장 흔한 실수로 지적함", "Modul 도식은 약어 \"T A R I F\"로 표기함. 원칙 이름은 POJK 48/2024 정의를 따름"], "qa": [["GCG 5원칙을 말하고, 회사에 어떻게 적용하겠습니까?", "GCG 5원칙은 투명성, 책임성, 법규 준수 책임, 독립성, 공정성입니다. 투명성은 정보 공개, 책임성은 직무와 보고체계, 책임은 법규 준수, 독립성은 이해상충 회피, 공정성은 이해관계자 공정 대우를 뜻합니다. KBBF는 2025년 GCG 자체평가 2등급이고, 저는 대주주 의견도 주주총회와 이사회 공식 절차로만 반영해 독립성을 지키겠습니다."], ["Accountability와 Responsibility의 차이는 무엇입니까?", "Accountability는 조직구조, 직무, KPI, 보고체계에 따라 각자 경영 책임을 지는 것입니다. Responsibility는 법규와 규정을 준수할 책임입니다. 대표이사로서 직무별 KPI와 보고선을 명확히 하고, 규정 준수는 컴플라이언스 기능으로 점검하겠습니다."]]}, {"ch": "4", "id": "POJK 48/2024 · Modul Q7 3-8 (p.75~78) / A to Z S.53~54", "t": "GCG 이행 범위 16항목·목적 7가지", "e": "Good Corporate Governance (POJK 48/2024) (인니어 참고: Penerapan Tata Kelola PVML)", "imp": 2, "sem": null, "one": "POJK 48/2024는 PVML 공통 지배구조 규정이며, GCG 이행 범위 16항목과 이행 목적 7가지를 정함.", "req": [{"h": "이행 범위 16항목", "items": [["주주·주주총회(GMS) 직무·권한", "주주와 주주총회가 이사·감사(BOC 위원) 선임 등 법령·정관상 권한을 적정하게 행사함"], ["이사회(BOD, Directors) 직무·책임·권한", "이사회가 경영 전반을 책임지고 권한 범위 안에서 회사를 운영함"], ["감사회(BOC, Board of Commissioners) 직무·책임·권한", "감사회가 이사회의 경영을 감독하고 자문하는 직무를 수행함"], ["샤리아감독위원회(DPS) 직무", "샤리아 사업을 하는 경우 DPS가 상품·영업이 샤리아 원칙에 맞는지 감독함"], ["위원회 구비와 직무 이행", "감사위원회·리스크감시위원회·보수·추천위원회 등을 갖추고 실제로 운영함"], ["리스크관리", "8대 위험을 식별·측정·통제·모니터링하는 체계를 갖추고 운영함"], ["부정방지 전략(Anti-Fraud ["재무보고 내부통제에 대한 이사회 책임은 어떻게 문서화됩니까?", "이사회는 재무보고의 작성, 적합성, 완전성과 진실성, 내부통제 이행에 대한 책임을 인지세를 붙인 서명 확인서로 명시합니다. KBBF는 내부 관리 보고와 OJK 보고의 NPF, BOPO 산식이 달라 선임 후 기준을 통일하고, OJK 보고는 기준에 따라 일관되게 작성하겠습니다."], ["POJK 42/2025에 따라 회사가 언제까지 무엇을 갖춰야 합니까?", "기존 회사는 올해 12월 22일까지 재무보고 내부통제 정책과 절차를 만들어 적용하고, 전담 부서나 담당 임원을 지정해야 합니다. 선임 직후의 기한이므로 이자·수수료 인식, 충당금, 상각과 회수, 계열사 거래부터 작성·검증·승인 담당을 나누고, 정책은 감사회(BOC) 승인을 받아 내부감사가 매년 점검하게 하겠습니다."]]}, {"ch": "4", "id": "POJK 34/2018 · A to Z S.103~104", "t": "주요 당사자 적격성 재평가", "e": "Reassessment to Main Parties (인니어 참고: Penilaian Kembali Pihak Utama)", "imp": 2, "sem": null, "one": "OJK는 주요 당사자(Primary Party)에게 진실성·재무적 적격성·재무평판·역량 문제 징후가 있으면 재평가(Reassessment)하고, 불합격 시 취임·주식 보유를 제한함.", "req": [{"h": "재평가 사유 4가지", "items": [["진실성(integrity)", "부정행위나 법령 위반 등 정직성·도덕성에 문제가 있다는 징후가 있는 경우임. 불합격 시 모든 금융기관에서 제한됨"], ["재무적 적격성(financial feasibility)", "주요 당사자가 회사 운영과 의무 이행을 뒷받침할 재무 능력을 갖추지 못했다는 징후가 있는 경우임"], ["재무평판(financial reputation)", "부실 채무나 파산 관련 이력 등 개인·회사의 재무 신뢰도에 문제가 있다는 징후가 있는 경우임"], ["역량(competence)", "직무 수행에 필요한 지식·경험·경영 능력이 부족하다는 징후가 있는 경우임. 불합격 시 해당 금융기관 취임이 금지됨"]]}, "대상 ① 지배 주요당사자(Controller): 지배주주", "대상 ② 경영 주요당사자(Managing): 이사, 감사(BOC 위원), 샤리아감독위원", "대상 ③ 임원 주요당사자(Official): 내부감사인 등", "재평가 시점에 이미 직을 떠난 자도 대상", "진실성 문제: 모든 금융기관의 지배주주·주식 보유와 경영·임원 취임 금지", "재무평판 문제: 재평가 받은 해당 금융기관 대상 금지 / 역량 문제: 해당 금융기관 경영·임원 취임 금지", "금지 기간은 POJK 34/2018 제11조에 따름"], "tbl": {"h": ["대상", "진실성 문제", "재무평판 문제", "역량 문제"], "r": [["지배 주요당사자", "모든 금융기관 지배·주식 보유, 경영·임원 취임 금지", "해당 금융기관 지배·보유·취임 금지", "-"], ["경영·임원 주요당사자", "모든 금융기관 지배·주식 보유, 경영·임원 취임 금지", "해당 금융기관 지배·보유·취임 금지", "해당 금융기관 경영·임원 취임 금지"]]}, "kb": [], "trap": ["진실성 문제는 모든 금융기관 대상 금지, 재무평판·역량 문제는 재평가 받은 해당 금융기관 대상 금지", "재평가는 선임 후에도 적용되는 사후 점검 절차이고, F&P는 선임 전 심사임"], "qa": [["재평가 사유는 무엇이고, 역량 문제로 불합격하면 어떻게 됩니까?", "진실성, 재무적 적격성, 재무평판, 역량 네 가지 문제 징후가 있을 때 재평가합니다. 역량 문제로 불합격하면 해당 금융기관의 경영·임원 직에 취임할 수 없습니다. 저는 선임 후에도 규정 준수와 역량 개발로 재평가 사유가 생기지 않게 하겠습니다."]]}, {"ch": "4", "id": "Modul Q7 3-11 (p.81) / 3-1 (p.60~63)", "t": "리스크 지배구조 정책 7가지", "e": "Risk Governance · Risk Oversight (인니어 참고: Tata Kelola Risiko)", "imp": 2, "sem": null, "one": "리스크 지배구조(Corporate Governance)는 리스크가 전략목표에 맞게 관리되도록 구조·책임·절차를 정한 틀이며, 지배구조 정책에는 최소 7가지가 들어가야 함.", "req": [{"h": "리스크 지배구조 정책 최소 포함 7가지", "items": [["감사회(BOC, Board of Commissioners)·이사회(BOD, Directors) 직무·책임 이행 절차", "이사회(BOD)의 경영 직무와 감사회(BOC)의 감독 직무를 어떤 절차와 권한으로 수행하는지 정함"], ["내부통제(Internal Control) 위원회 구비(리스크관리위원회, 감사위원회, 리스크감시위원회, 보수·추천위원회)", "이사회(BOD) 산하 리스크관리위원회와 감사회(BOC) 산하 3개 위원회를 두고 각 위원회의 역할을 정함"], ["컴플라이언스·내부감사·외부감사 기능 이행 정책·절차", "준법 점검과 내·외부 감사가 독립적으로 수행되도록 담당 조직·절차·보고선을 정함"], ["내부통제체계를 포함한 리스크관리 이행 정책·절차", "위험의 식별·측정·모니터링·통제 절차와 이를 점검하는 내부통제 체계를 문서로 정함"], ["부정방지 전략(Anti-Fraud Strategy)", "부정행위를 예방·적발·조사·모니터링하는 4대 요소로 부정을 관리하는 전략을 수립·이행함"], ["AML·CFT·대량살상무기 확산자금 차단 프로그램", "고객확인(CDD·EDD)과 의심거래 보고 등으로 회사가 자금세탁·테러자금·확산자금 조달에 이용되지 않도록 막음"], ["장기계획과 연간 업무계획·예산 수립 절차", "리스크를 반영해 장기계획과 연간 사업계획·예산을 수립하고 승인받는 절차를 정함"]]}, "구조 예시: 감독 측(통합지배구조위원회·리스크감시위원회·감사위원회), 경영 측(리스크관리·여신정책위원회, ALCO, 자본·자회사위원회), 사업부(리스크 감수)·리스크부(통제)·컴플라이언스부(준법)·감사부(독립 보증)", "계층 관계(Modul 도식): 지배구조 → 리스크관리·컴플라이언스 → 내부통제 → 내부감사"], "tbl": null, "kb": [], "trap": ["구조 예시의 ALCO, 자본·자회사위원회는 교재 예시이며 규정상 의무 위원회는 아님", "Modul Q6 '지배구조·리스크관리 이행 평가' 단원(p.86~111)은 미독 구간 [확인 필요]"], "qa": [["회사에 두어야 하는 위원회를 이사회 소속과 감사회 소속으로 나눠 말씀해 주십시오.", "이사회 소속은 리스크관리위원회(Risk Management Committee)이고, 감사회 소속은 감사위원회(Audit Committee), 리스크감시위원회(Risk Monitoring Committee), 보수·추천위원회(Remuneration & Nomination Committee)입니다. KBBF는 리스크관리위원회를 분기마다 운영하고 있고, 자산 1조 루피아를 넘어 IT 운영위원회(IT steering committee)도 2026년에 설치했습니다."]]}, {"ch": "5", "id": "POJK 42/2024 · PADK 48/2025 · A to Z S.73~74", "t": "리스크관리 일반 원칙·4대 요소", "e": "Risk Management Frame Work (인니어 참고: Manajemen Risiko)", "imp": 3, "sem": "리스크관리 4대 요소(적극적 감독, 정책·절차, 식별·측정·모니터링·통제와 정보시스템, 내부통제)를 강사가 정리함(강의정리 1.5). 8/27 LSPPI 인터뷰 2번에서 실제 출제됨.", "one": "리스크관리는 위험을 식별·측정·모니터링·통제하는 절차이며, 4대 요소로 이행하고 고유위험과 관리 품질로 평가함.", "req": ["정의: NBFI 업무에서 발생하는 위험을 식별·측정·모니터링·통제하는 절차와 방법론. 위험은 손해를 초래할 수 있는 사건의 발생 가능성", {"h": "4대 요소", "items": [["감사회(BOC, Board of Commissioners)·이사회(BOD, Directors)의 적극적 감독", "이사회(BOD)는 리스크관리 정책·전략을 수립·이행하고 감사회(BOC)는 그 이행을 감독·평가함"], ["정책·절차·한도의 적정성", "리스크관리 정책·절차와 선호·허용·한도를 문서로 정하고 최소 연 1회 검토함"], ["위험 식별·측정·모니터링·통제와 리스크관리정보시스템의 적정성", "8대 위험을 식별·측정·모니터링·통제하고 이를 뒷받침하는 리스크관리정보시스템을 갖춤"], ["포괄적 내부통제(Internal Control)시스템", "업무 분리, 승인 권한, 내부감사 등으로 리스크관리가 정해진 대로 이행되는지 점검함"]]}, "회사 목적·정책·규모·복잡성에 맞게 적용", "위험평가: 고유위험(Inherent Risk) + 리스크관리 이행 품질(KPMR) → Net Risk = 고유위험 × KPMR", "PADK 48/2025(2025-12-30): SEOJK 7/2021과 리스크 프로필(Risk Profile) 평가 기준 대체, 시행 6개월 내(2026년 6월 말) 정책 정비", "자산 Rp250bn 초과: 리스크관리위원회(Risk Management Committee)와 리스크관리 부서 설치"], "tbl": null, "kb": [["ok", "2분기 리스크 프로필 종합 P2"], ["ok", "리스크관리위원회 분기 운영, 업종 한도 체계 구축 중"], ["warn", "PADK 48/2025 정책 정비 완료 여부 확인 필요"]], "trap": ["Net Risk 산식(고유위험 × KPMR)은 자체 학습자료 표기임. 교재는 '고유위험 평가 + 관리 품질 평가'로 기재함", "A to Z S.76에 COSO 내부통제 도식이 있으나 텍스트 미추출"], "qa": [["리스크관리 4대 요소를 말씀해 주십시오.", "감사회와 이사회의 적극적 감독, 정책·절차·한도, 위험 식별·측정·모니터링·통제와 정보시스템, 내부통제 네 가지입니다. KBBF는 리스크관리위원회를 분기마다 열고 있고 2분기 리스크 프로필은 P2입니다. 시행세칙 PADK 48/2025에 맞춘 정책 정비 결과는 선임 후 첫 이사회에서 확인하겠습니다."]]}, {"ch": "5", "id": "PADK 48/2025 · A to Z S.75~84 · POJK 28/2020 S.90", "t": "8대 위험과 고유위험 평가지표", "e": "Strategic · Credit · Market · Operational · Liquidity · Compliance · Legal · Reputation · Inherent Risk", "imp": 3, "sem": "8대 리스크는 객관식 출제 가능성이 높다고 강사가 직접 언급하고 \"Let's try to memorize\"라고 함(시험힌트 2), W3 §5.1).", "one": "멀티파이낸스의 8대 위험은 전략·신용·시장·운영·유동성·준법·법률·평판이며, 위험별 고유위험(Inherent Risk) 평가지표가 정해져 있음.", "req": ["① 전략위험(Strategic): 사업전략과 환경의 정합성, 전략 선택(고위험/저위험), 업계 내 전략적 위치, 사업 실적 달성도", "② 신용위험(Credit): 금융 배분 전략, 포트폴리오 구성·편중도, 채권 자산 건전성과 충당금 적정성, 외부요인(경기·기술·금리·환율 규제·수요 변화)", "③ 시장위험(Market): 시장위험 전략·정책, 시장위험 노출 자산·부채의 규모·구성(금리·환율·주가)", "④ 운영위험(Operational): 조직·업무 복잡성, 인적자원, 기술·정보시스템, 부정위험, 업무 중단, 상호작용·의존도", "⑤ 유동성위험(Liquidity): 단기 자산·부채 구성, 자산·부채 편중, 현금흐름 관리, 자금수요 취약성, 조달원 접근성", "⑥ 준법위험(Compliance): 위반 유형·중대성, 위반 빈도·준법 이력, 일반 영업기준 위반, 위반 후속조치", "⑦ 법률위험(Legal): 법령 부재·변경, 계약·제휴 취약성, 소송 발생", "⑧ 평판위험(Reputation): 소유주·그룹 평판, 영업윤리 위반, 상품·제휴 복잡성, 부정적 뉴스, 차주 민원", {"h": "고유위험 특성 결정 요인 5가지", "items": [["사업전략", "회사가 택한 성장 목표와 상품·고객 전략이 고위험인지 저위험인지에 따라 위험 수준이 달라짐"], ["사업 특성", "취급 상품, 고객층, 담보 유형 등 사업의 성격이 노출되는 위험의 종류와 크기를 정함"], ["업무 복잡성", "상품·조직·업무 프로세스·IT 시스템이 복잡할수록 운영·준법 위험 등이 커짐"], ["금융업계 상황", "업계 경쟁 강도, 업계 전반의 연체·조달 여건 등이 회사의 위험 수준에 영향을 줌"], ["거시경제", "경기·금리·환율·물가 변화가 차주 상환능력과 조달비용을 통해 위험 수준을 바꿈"]]}], "tbl": {"h": ["그룹(건강도 평가)", "위험"], "r": [["A. 사업위험군", "전략"], ["B. 재무위험군", "신용·시장·운영·유동성"], ["C. 지배구조(Corporate Governance)위험군", "준법·법률·평판"]]}, "kb": [["ok", "2분기 리스크 프로필(Risk Profile) 종합 P2, 유동성 P1"], ["warn", "법률위험 P3"], ["warn", "Fleet 비중 약 88%로 포트폴리오 편중도 관리 필요, NPF Gross 3.25%(8월)"], ["ok", "부정적 언론·SNS 0건, 상반기 민원 25건 전건 응대"]], "trap": ["운영위험은 재무위험군(B)에 속함", "암기 순서(강사 자료): S-C-M-O-L-C-L-R"], "qa": [["멀티파이낸스의 8대 위험은 무엇입니까?", "전략, 신용, 시장, 운영, 유동성, 준법, 법률, 평판 위험입니다. 건강도(Health Level) 평가에서는 전략을 사업위험군, 신용·시장·운영·유동성을 재무위험군, 준법·법률·평판을 지배구조위험군으로 묶습니다."], ["회사의 가장 큰 위험과 대응 방안은 무엇입니까?", "2분기 리스크 프로필은 종합 P2이고, 유동성은 P1, 법률은 P3입니다. 신용위험에서는 Fleet 비중이 약 88%여서 편중도 관리가 필요하고, 8월 NPF Gross는 3.25%입니다. 업종 한도 체계를 완성하고 법률위험은 계약과 소송 관리를 점검하겠습니다."]]}, {"ch": "5", "id": "Modul Q7 3-1 (p.60~63) · SNI ISO 31000:2018", "t": "리스크관리 원칙(ISO 31000) 8가지", "e": "Risk Management Principles · Creation and Protection of value", "imp": 1, "sem": null, "one": "Modul은 ISO 31000에 따라 가치 창출·보호를 중심에 둔 리스크관리 8원칙과 단원 수행 증빙 5가지를 제시함.", "req": [{"h": "8원칙", "items": [["통합(Integrated)", "리스크관리를 회사의 모든 활동과 의사결정 과정에 포함해 수행함"], ["구조적·포괄적(Structured and comprehensive)", "일관된 구조와 절차로 리스크를 빠짐없이 관리해 비교 가능한 결과를 얻음"], ["맞춤형(Customized)", "리스크관리 체계와 절차를 회사의 목표, 규모, 내·외부 여건에 맞게 설계함"], ["포용적(Inclusive)", "이해관계자를 적절한 시점에 참여시켜 그 지식과 의견을 리스크관리에 반영함"], ["동태적(Dynamic)", "내·외부 환경 변화로 새로 생기거나 바뀌는 리스크를 적시에 파악하고 대응함"], ["최선의 가용정보(Best available information)", "과거·현재 정보와 향후 전망을 근거로 판단하되 정보의 한계와 불확실성을 함께 고려함"], ["인적·문화 요인(Human and cultural factors)", "사람의 행동과 조직 문화가 리스크관리의 모든 단계에 영향을 준다는 점을 고려함"], ["지속 개선(Continuous improvement)", "학습과 경험을 바탕으로 리스크관리 체계와 절차를 계속 개선함"]]}, "중심 가치: 가치 창출·보호(Creation and Protection of value)", "리스크 지배구조: 리스크관리 결정·행동·평가를 조직 목표와 연결하는 과정, GCG 원칙 기반", "수행 증빙 5가지: ① 리스크 지배구조·전략·정책 문서 ② 리스크관리 이행보고(위원회 회의록 포함) ③ 법규 이행 보고(위반·OJK 권고 포함) ④ 리스크 지배구조·리스크관리 이행 평가 문서 ⑤ 부정방지 전략(Anti-Fraud Strategy) 이행 감독 보고서"], "tbl": null, "kb": [], "trap": ["ISO 31000 8원칙은 교재 이론이며 POJK 요건 항목은 아님"], "qa": [["리스크 지배구조란 무엇입니까?", "리스크관리 결정과 행동, 평가를 회사 목표와 연결하는 구조와 과정이며 GCG 원칙에 기반합니다. 저는 리스크관리위원회(Risk Management Committee) 회의록과 이행 보고를 이사회(BOD, Directors) 보고 체계에 연결해 관리하겠습니다."]]}, {"ch": "5", "id": "Modul Q7 3-2·3-3 (p.64~67)", "t": "리스크관리 수립 순서(CE 3·PC 9)", "e": "Developing Governance, Strategy, and Risk Management Policies", "imp": 2, "sem": null, "one": "리스크관리는 전략 수립 → 정책 수립 → 지배구조(Corporate Governance)·인프라 개발 3단계(9개 수행기준) 순서로 만들고, 출발점은 회사 전략임.", "req": ["1단계 리스크관리 전략: 1.1 회사 전략 식별 1.2 전략에 따른 리스크 범위 분석 1.3 리스크관리 전략 수립", "2단계 리스크관리 정책: 2.1 리스크 선호(Risk Appetite) 결정 2.2 선호·허용에 근거한 리스크 한도(Risk Limit) 설정 2.3 리스크관리 정책 수립", "3단계 지배구조·인프라: 3.1 구조·역할·책임·관리 프로세스 3.2 리스크 문화 3.3 인프라 요건 분석", "회사 전략 수립 4구성 ①: 전략적 맥락(비전·미션, 경쟁 환경, 시장 동향)", "② 회사 진단: SWOT, 핵심 성과지표(ROE, Loss Ratio, 최소자본비율, Gearing Ratio)", "③ 전략 옵션: 차별화·확장·효율화, 전략 기둥(디지털화·우수 인재·회복탄력성), 리스크와 완화", "④ 실행 로드맵: 단기·장기 계획, 자원 배분"], "tbl": null, "kb": [["ok", "회사 진단 지표: ROE 누계 2.27%, Gearing 2.06배, 자본비율(Capital Ratio) 63.88%(8월말)"]], "trap": ["전략 옵션 예시는 사업계획(Business Plan) 단원(Modul 1-5)과 같음"], "qa": [["리스크관리 전략과 정책은 어떤 순서로 수립합니까?", "회사 전략을 먼저 확인하고, 전략에 따른 리스크 범위를 분석해 리스크관리 전략을 세웁니다. 그다음 리스크 선호와 한도를 정해 정책을 만들고, 지배구조와 리스크 문화, 인프라를 갖춥니다. 선임 후 사업계획과 리스크 선호를 같은 이사회(BOD, Directors) 안건으로 연결하겠습니다."]]}, {"ch": "5", "id": "Modul Q7 3-4 (p.67~70)", "t": "리스크 범위 4단계와 측정 기준", "e": "Risk Scope · Impact · Likelihood", "imp": 2, "sem": null, "one": "리스크 범위는 4단계로 정하고, 영향도 5단계 × 발생가능성 5단계 매트릭스(1~25점)로 측정함.", "req": [{"h": "리스크 범위 4단계", "items": [["핵심 리스크 식별", "회사 전략을 실행하는 과정에서 목표 달성을 방해할 수 있는 핵심 리스크를 찾아냄"], ["리스크 프로파일(Risk Profile) 측정(영향·발생가능성)", "식별한 리스크마다 영향도(1~5)와 발생가능성(1~5)을 매겨 1~25점으로 수준을 측정함"], ["리스크 유형·관리계획 수립", "리스크를 유형별로 분류하고 회피·감소·이전·수용 중 대응 방식과 담당자를 정함"], ["전략 로드맵과 통합", "리스크 관리계획을 전략 로드맵에 반영하고 전략 KPI와 리스크 KPI를 함께 관리함(이중 KPI)"]]}, "식별 예시: 디지털 온보딩 전략 → 기술 리스크(API 연동 실패, 데이터 유출), 규제 리스크(OJK e-KYC 규정 변경)", "영향도 5단계(재무손실, IDR): ① Insignificant 2,500만 이하 ② Minor ~1억 ③ Moderate ~5억 ④ Significant ~10억 ⑤ Major to Catastrophic 10억 초과", "영향도 정성 기준: 민원·언론 보도·목표 감소율·규정 위반 정도·영향 고객 비율", "발생가능성 5단계: ① Very Rare(1년 초과, 2% 이하) ② Rare(6개월~1년, 2~5%) ③ Sometimes(3~6개월, 5~10%) ④ Often(1~3개월, 10~20%) ⑤ Very Often(1개월 이하, 20% 초과)", "리스크 매트릭스: 영향도(1~5) × 발생가능성(1~5) = 점수 1~25"], "tbl": {"h": ["단계", "영향도(재무손실 IDR)", "발생가능성"], "r": [["1", "Insignificant · 2,500만 이하", "Very Rare · 1년 초과 · 2% 이하"], ["2", "Minor · 2,500만 초과~1억", "Rare · 6개월~1년 · 2~5%"], ["3", "Moderate · 1억 초과~5억", "Sometimes · 3~6개월 · 5~10%"], ["4", "Significant · 5억 초과~10억", "Often · 1~3개월 · 10~20%"], ["5", "Major to Catastrophic · 10억 초과", "Very Often · 1개월 이하 · 20% 초과"]]}, "kb": [], "trap": ["수치는 교재 예시이며 규정 기준이 아님. 발생가능성 표에 은행 사례 문구가 남아 있음", "Modul 정리본 중요도는 ★★★이나, 규정 요건이 아닌 예시이므로 ★★로 분류함"], "qa": [["회사의 리스크 프로파일은 어떻게 측정합니까?", "리스크마다 영향도와 발생가능성을 각각 5단계로 평가하고 둘을 곱해 1점에서 25점으로 측정합니다. 점수가 높은 리스크부터 관리계획을 세우고 전략 로드맵에 반영하겠습니다."]]}, {"ch": "5", "id": "Modul Q7 3-5 (p.70~72)", "t": "리스크관리 전략·대응 4유형", "e": "Risk Treatment (Avoid / Terminate · Reduce · Transfer · Accept) · Dual KPI · 4P", "imp": 2, "sem": "리스크 대응을 TRACK(Transfer·Reduce·Avoid·Accept)으로 정리하라고 강사 자료에 기재됨(시험힌트 4)).", "one": "리스크 대응(Risk Treatment)은 회피·감소·이전·수용 4유형이며, 전략 KPI마다 리스크 KPI를 함께 두고 People·Policy·Process·Performance 4구성으로 운영함.", "req": ["대응 ① 회피(Avoid / Terminate): 고위험 국가 진출 취소", "대응 ② 감소(Reduce): 선제 통제(종단간 암호화)", "대응 ③ 이전(Transfer): 사이버보험 가입, 아웃소싱", "대응 ④ 수용(Accept): IDR 1억 미만 경미 운영리스크 무조치 수용", "이중 KPI(Dual KPI): 재무(ROE 3% / VaR Rp 50억), 고객(CSI 8 / 민원비율 2% 초과 증가), 프로세스(승인 8시간 미만 / RTO 4시간)", "4구성 People: 인력 적정성, 리스크 오너 지정, 직무·책임 명확화", "4구성 Policy: 전략에 맞는 Appetite·Tolerance·Limit", "4구성 Process: 리스크통제자가평가(RCSA), 실행·상향보고(Escalation) / Performance: 통제 효과성, 조기경보 핵심리스크지표(KRI)", "리스크 유형 예시: 신용(스코어링 미보정), 집중(세분화·상품 불일치), 유동성(유동성비율 1 미만 또는 유휴현금 과다), 운영(DRC 실패로 RTO 초과)"], "tbl": null, "kb": [["ok", "대주주 조기경보 기준 설정(자본비율 12%, Gearing 8배, NPF 4%), 도달 시 추가 지원"]], "trap": ["TRACK 약어는 강사 자료 정리 순서이고, 교재 순서는 회피·감소·이전·수용임", "이중 KPI 수치는 교재 예시임"], "qa": [["리스크 대응 방식 4가지를 사례와 함께 설명해 주십시오.", "회피, 감소, 이전, 수용 네 가지입니다. 고위험 사업은 진출하지 않고, 통제로 줄일 수 있는 위험은 통제를 강화하며, 보험이나 위탁으로 넘길 수 있는 위험은 이전하고, 경미한 위험은 수용합니다. KBBF에서는 피두시아(Fiducia) 등록과 담보 보험 같은 수단으로 신용위험(Credit)을 줄이고, 조기경보 지표로 상향보고 기준을 정해 운영하겠습니다."]]}, {"ch": "5", "id": "Modul Q7 3-6 (p.72~74) · PADK 48/2025 · A to Z S.85", "t": "수용능력·선호·허용·한도", "e": "Risk Bearing Capacity / Risk Capacity · Risk Appetite · Risk Tolerance · Risk Limit", "imp": 3, "sem": null, "one": "리스크 관리 기준은 수용능력 ⊃ 선호 → 허용 → 한도 4단계 계층이며, 선호는 이사회(BOD, Directors)가 정하고 한도는 8대 위험별로 설정함.", "req": ["① 수용능력(Risk Bearing Capacity / Risk Capacity): 자본·유동성·운영역량으로 흡수할 수 있는 손실 범위, 선호·허용 결정의 1차 제약", "② 선호(Risk Appetite): 전략목표 달성을 위해 받아들이려는 위험 수준. 비전·미션·전략과 정렬, 이사회(BOD)가 종합 리스크 분석과 재무역량을 고려해 설정", "③ 허용(Risk Tolerance): 운영상 수용 가능한 최대 위험(자본이 흡수할 수 있는 잠재 손실). 예: NPF 5% 초과 금지, 단일 채무자 총자본의 10%", "④ 한도(Risk Limit): 8대 위험 유형별 설정. 전체 한도, 위험 유형별 한도, 기능·거래별 한도", "설정 방법: 정성(경영진 인터뷰·벤치마킹·규정), 혼합, 정량(실증데이터 수학모형·2차 데이터·규정)", "절차·한도: 명확한 책임·위임 권한, 최소 연 1회 정기 검토, 적정한 문서화", "교재 적용 예시: 신용(30일 초과 연체 4% / 최대 5%), 운영(분석가 이직률 10% / 12.5%), 유동성(대체 조달 가능일수 30일 / 20일)"], "tbl": {"h": ["개념", "의미", "결정·관리"], "r": [["수용능력", "자원으로 흡수 가능한 최대 손실", "1차 제약"], ["선호", "목표 달성을 위해 감수할 위험 수준", "이사회 설정"], ["허용", "넘으면 조치가 필요한 상한", "이사회 정기 모니터링·조정"], ["한도", "8대 위험·기능·거래별 운영 한도", "연 1회 이상 검토"]]}, "kb": [["ok", "이사회가 Risk Appetite와 한도 승인, 업종 한도 체계 구축 중"], ["ok", "대주주 조기경보: 자본비율(Capital Ratio) 12%, Gearing 8배, NPF 4% 도달 시 추가 지원(규정 한도 10%·10배보다 앞선 경보선)"]], "trap": ["선호는 목표 운영 범위, 허용은 넘으면 조치가 필요한 상한", "교재 예시 표의 각 쌍에서 앞 값을 선호, 뒤 값을 허용으로 읽음. 표 열이 추출 과정에서 깨짐 [확인 필요]", "교재 예시 '단일 채무자 총자본 10%'는 허용 예시이며, 규정상 동일인 여신한도는 자기자본의 20%임"], "qa": [["Risk Appetite와 Risk Tolerance의 차이를 회사 사례로 설명해 주십시오.", "Risk Appetite는 전략목표를 위해 받아들이려는 위험 수준이고 이사회가 정합니다. Risk Tolerance는 넘으면 조치가 필요한 최대 수준입니다. KBBF는 대주주와 자본비율 12%, Gearing 8배, NPF 4%를 조기경보선으로 두고 있고, 저는 이 기준과 업종 한도를 이사회 승인 한도로 연결해 매년 검토하겠습니다."]]}, {"ch": "5", "id": "PADK 48/2025 · A to Z S.85~87 / Modul Q7 3-7 (p.74·84)", "t": "리스크관리 정책 구성", "e": "Minimum Contents of Risk Management Policy (인니어 참고: Kebijakan Manajemen Risiko)", "imp": 2, "sem": null, "one": "리스크관리 정책은 규정상 최소 6가지를 담아야 하며, Modul은 정책 범위 9항목·최소 포함 11항목·목적 4가지를 제시함.", "req": [{"h": "PADK 48/2025 최소 6가지", "items": [["업무 관련 위험 결정", "회사 업무에서 발생하는 위험의 종류(8대 위험)를 정하고 관리 대상으로 삼음"], ["측정방법·리스크관리정보시스템", "위험별 측정 방법과 측정·보고에 쓰는 리스크관리정보시스템을 정함"], ["선호·허용·한도", "감수할 위험 수준(선호), 자본이 흡수할 수 있는 손실(허용), 전체·유형별·거래별 한도를 정함"], ["위험등급 평가", "고유위험과 리스크관리 품질을 평가해 위험별·종합 위험등급을 매기는 방법을 정함"], ["최악 상황(worst case scenario) 비상계획", "최악 상황을 가정해 유동성 부족 등 비정상 상황에 대응할 비상계획(contingency plan)을 둠"], ["내부통제(Internal Control)시스템", "정책·절차와 한도가 지켜지는지 점검하고 위반을 바로잡는 내부통제 체계를 둠"]]}, {"h": "Modul 최소 포함 11항목", "items": [["철학과 목적", "리스크를 어떻게 보고 관리하는지에 대한 회사의 기본 입장과 정책의 목적을 밝힘"], ["정책 범위", "정책이 적용되는 조직, 업무, 리스크 유형의 범위를 정함"], ["리스크관리 원칙", "ISO 31000 8원칙 등 리스크관리를 수행할 때 따를 원칙을 정함"], ["리스크 지배구조(Corporate Governance)", "이사회(BOD)·감사회(BOC)·위원회·부서별 리스크관리 역할과 책임, 보고선을 정함"], ["리스크관리 전략", "회사 전략에 맞춰 리스크를 식별하고 대응하는 방향과 방식을 정함"], ["리스크선호 선언(Risk Appetite Statement, Capacity·Appetite·Tolerance)", "수용능력·선호·허용 수준을 문서로 선언함. 선호는 이사회(BOD)가 재무역량을 고려해 설정함"], ["부정통제(Fraud Control)·부정방지 전략(Anti-Fraud Strategy)", "부정행위의 예방·적발·조사·모니터링 체계를 리스크관리 정책에 포함함"], ["리스크 유형별 관리전략", "신용·운영·유동성 등 리스크 유형별로 관리 방법과 관리 지표를 정함"], ["리스크관리 프로세스", "리스크 식별·측정·모니터링·통제의 단계별 절차를 정함"], ["리스크 교육과 문화", "임직원 리스크 교육과 리스크 문화 조성 방안을 정함"], ["리스크관리 보고", "리스크 현황을 누가, 언제, 누구에게 보고하는지 보고 체계를 정함"]]}, "Modul 정책 범위 9항목: 서론, 목적, 범위, 원칙, 지배구조, 프로세스, Appetite·Tolerance, 유형별 관리전략, 교육과 문화", "정책 목적 4가지: ① 선제적·체계적·통합적 관리 ② 자산·평판·지속가능성 보호 ③ 전략목표 달성 지원 ④ 관련 규정·기준 준수", "철학 예시: 리스크를 사업전략 달성의 필수 요소로 관리, 신중 원칙과 규정 준수"], "tbl": null, "kb": [["warn", "PADK 48/2025 시행 6개월 내(2026년 6월 말) 정책 정비 완료 여부 확인 필요"]], "trap": ["교재는 정책 '범위'(9항목)와 '최소 포함 내용'(11항목)을 따로 제시함. 최소 내용에 부정방지 전략이 들어감", "규정 요건(PADK 6가지)과 교재 구성(11항목)을 구분해서 말함"], "qa": [["리스크관리 정책에 반드시 들어가야 하는 내용은 무엇입니까?", "업무 관련 위험 결정, 측정방법과 정보시스템, 선호·허용·한도, 위험등급 평가, 최악 상황 비상계획, 내부통제시스템입니다. 선임 후 PADK 48/2025에 맞춘 정책 정비가 완료됐는지 첫 이사회(BOD, Directors)에서 확인하겠습니다."]]}, {"ch": "5", "id": "PADK 48/2025 · A to Z S.86~88 / Modul Q7 3-10 (p.80)", "t": "리스크관리위원회·부서·기능", "e": "Risk Management Committee · Risk Management Work Unit · Risk Management Function", "imp": 2, "sem": "자체 학습자료에 '리스크관리위원회는 이사회(BOD)의 실행 도구, 리스크감시위원회(Risk Monitoring Committee)는 감사회(BOC, Board of Commissioners)의 감독 도구'가 최빈출 함정으로 표시됨(W3 §11, 강사 발언 근거 없음).", "one": "자산 Rp250bn 초과 회사는 이사회(BOD, Directors) 산하 리스크관리위원회(Risk Management Committee)와 리스크관리부서(Risk Management Work Unit)를 두고, 리스크관리 기능(Risk Management Function)은 영업에서 독립해 대표이사(President Director) 또는 리스크 담당 이사에게 보고함.", "req": ["리스크관리위원회: 자산 Rp250bn 초과, 비상설(non-structural) 기구", "위원회 구성: 이사의 절반 이상(그중 1명은 컴플라이언스·리스크관리 담당 이사) + 이사회 직보 또는 리스크 정책에 상당한 영향력이 있는 집행임원", "위원회 역할: 리스크관리 정책·전략·지침(선호·허용 포함), 리스크관리 프레임워크, 비정상 상황 비상계획 수립", "리스크관리부서: 자산 Rp250bn 초과, 위험 유형별·기능별 전체 위험 포지션 모니터링, 시나리오 테스트·과거데이터 테스트", "리스크관리기능: 자산 Rp250bn 미만, 지정 임직원이 사업·운영 기능과 함께 수행", "독립성: 사업·운영 기능(위험 감수)과 내부통제(Internal Control) 기능에서 독립, 다른 부서와 결합은 가능", "보고선: 대표이사 또는 리스크관리 담당 이사에게 직접 책임"], "tbl": {"h": ["조직", "소속", "역할"], "r": [["리스크관리위원회", "이사회(비상설)", "정책·선호·한도 결정, 이행 도구"], ["리스크감시위원회", "감사회", "정책과 이행의 정합성 감독"], ["리스크관리부서", "경영 조직", "전체 위험 포지션 모니터링·테스트"]]}, "kb": [["ok", "리스크관리위원회 분기 운영"]], "trap": ["리스크관리위원회 구성은 '이사의 절반 이상'임", "리스크관리 담당 이사와 그 아래 직급은 리스크관리 자격증이 필요함(POJK 43/2024)"], "qa": [["리스크관리 기능은 누구에게 보고합니까?", "리스크관리 기능은 영업과 내부통제 기능에서 독립하고 대표이사 또는 리스크관리 담당 이사에게 직접 보고합니다. KBBF는 리스크관리위원회를 분기마다 운영하고 있고, 저는 위원회 회의를 직접 챙기며 한도 초과 사항을 이사회에 보고받겠습니다."]]}, {"ch": "5", "id": "Modul Q7 3-9 (p.79~80) · IIA Three Lines Model", "t": "3선 모델(Three Lines Model)", "e": "Three Lines Model (IIA): Governing Body · Management (1st · 2nd line) · Internal Audit (3rd line)", "imp": 2, "sem": "강사는 내부감사가 대표이사(President Director)에게 보고하고 독립감사(독립 커미셔너)·감사위원회(Audit Committee)에 점선 보고할 수 있다고 설명함. 내부감사는 단속 기능보다 SOP·프로세스 개선을 돕는 기능으로 설명함(강의정리 4.7·1.10).", "one": "3선 모델은 지배기구, 경영진(1선·2선), 내부감사(Internal Audit, 3선)로 역할을 나누며, 3선은 독립 요건 3가지를 갖춰야 함.", "req": ["지배기구(Governing Body): 이해관계자에 대한 감독 책임, 무결성·리더십·투명성", "1선: 고객 앞 상품·서비스 제공, 리스크관리 책임(사업부)", "2선: 리스크관리 지원·전문성, 모니터링·견제(challenge). 컴플라이언스, 내부통제(Internal Control), 정보·기술 보안, 지속가능성, 품질보증, ERM", "1선과 2선은 결합하거나 분리할 수 있음", "3선 내부감사: 지배구조(Corporate Governance)와 리스크관리의 적정성·효과성에 대한 독립적·객관적 보증과 자문", "관계: 지배기구 → 경영진(위임·지시·자원·감독), 경영진 → 지배기구(책임·보고), 각 선 사이 정렬·소통·조정·협업", "3선 독립성 3요건: ① 지배기구에 대한 책임 ② 사람·자원·데이터 접근 ③ 감사 계획·수행에서 편향·간섭 배제", "적용 원칙: 직무분리, 자원 제공, 법규 준수 보장, 내부감사 독립성 보장"], "tbl": null, "kb": [], "trap": ["교재는 IIA의 'Three Lines Model' 용어를 씀. 'Three Lines of Defense'는 이전 명칭", "1선과 2선은 결합 가능하고, 3선(내부감사)은 독립 요건이 있음"], "qa": [["회사의 3선 체계와 내부감사 독립성 확보 방법을 말씀해 주십시오.", "1선은 영업과 심사 등 사업부, 2선은 리스크관리와 컴플라이언스, 3선은 내부감사입니다. 내부감사는 대표이사에게 보고하되 감사위원회와 독립감사에도 보고할 수 있게 하고, 감사 계획과 자료 접근에 간섭하지 않겠습니다."]]}, {"ch": "5", "id": "Modul Q7 3-12 (p.81~83)", "t": "리스크 문화 6단계·5특징", "e": "Risk Culture · Tone at the Top", "imp": 2, "sem": null, "one": "리스크 문화는 리더십 헌신부터 모니터링까지 6단계로 이행하며, 건설적 리스크 문화의 특징은 5가지임.", "req": ["정의: 개인과 조직이 리스크를 식별·이해·관리할 때의 가치·신념·태도", "① 리더십 헌신: 이사회(BOD, Directors)·최고경영진이 중요성 전달, 이사회가 리스크관리위원회(Risk Management Committee) 회의 직접 주재(Tone at the Top), 전략 결정에 리스크 분석 선행", "② 리스크 교육: 신용·운영·유동성 등 고위험 부서 전문 교육, 상시 e-learning", "③ 정책·절차: 투명성·책임성·비난하지 않는(no-blame) 문화, 쉬운 리스크 보고 절차, 리스크 인식을 인사평가 지표에 반영", "④ 인식 캠페인: \"Risk is Our Shared Responsibility\", 익명 리스크 보고 핫라인, 리스크 완화 아이디어 공모", "⑤ 보상과 제재: 중대 리스크 사전 식별 보상, 고의 위반(데이터 조작·절차 위반) 공정 제재", "⑥ 모니터링·평가: 연 1회 리스크 문화 설문, 리스크관리부 정기 효과성 보고", {"h": "건설적 리스크 문화 5특징", "items": [["리스크 기반 리더십", "경영진이 전략 결정 전에 리스크 분석을 거치고 리스크관리를 직접 챙기는 모습을 보임(Tone at the Top)"], ["이사회·감사회(BOC, Board of Commissioners) 적극 관여", "이사회(BOD)는 리스크관리를 주도하고 감사회(BOC)는 그 이행을 적극 감독함"], ["개방적 소통", "직원이 상사를 두려워하지 않고 예의 있게 리스크 관련 의견을 말할 수 있음"], ["책임 수용, 탓하지 않음", "문제가 생기면 각자 책임을 인정하고, 사람을 탓하기보다 원인을 찾아 개선함"], ["학습·혁신 의지", "사고와 실수에서 배우고 리스크관리 방식을 계속 개선하려는 태도를 가짐"]]}], "tbl": null, "kb": [["ok", "내부고발(Whistleblowing) 핫라인·이메일·웹, 익명 신고 운영"], ["ok", "Anti-Fraud 교육 2개월마다 전 직원 실시"]], "trap": ["Modul 정리본 중요도는 ★★★. 인터뷰 질문 형태('대표이사로서 리스크 문화를 어떻게 조성하는가')로 나올 수 있음"], "qa": [["대표이사(President Director)로서 리스크 문화를 어떻게 조성하겠습니까?", "리스크 문화는 경영진의 솔선, 교육, 보고 절차, 보상과 제재, 정기 평가로 만듭니다. 저는 리스크관리위원회를 직접 챙기고 중요한 결정에는 리스크 분석을 먼저 받겠습니다. KBBF가 운영하는 익명 내부고발 채널과 정기 교육을 유지하고, 리스크 인식을 인사평가에 반영하겠습니다."]]}, {"ch": "5", "id": "Modul Q7 3-13 (p.83~85)", "t": "리스크관리 인프라 6요소", "e": "Risk Management Infrastructure", "imp": 1, "sem": null, "one": "리스크관리 인프라는 정책·조직·시스템·프로세스·교육·측정 체계 6요소로 구성됨.", "req": [{"h": "리스크관리 인프라 6요소", "items": [["리스크관리 정책·체계", "리스크관리 원칙·선호·한도·절차를 정한 정책과 이를 운영하는 체계를 갖춤"], ["명확한 직무·책임의 조직구조", "이사회(BOD)·감사회(BOC)·위원회·리스크관리 부서의 역할과 보고선을 분명히 정함"], ["지원 기술·시스템", "리스크 데이터의 수집·측정·보고에 필요한 정보시스템과 기술을 갖춤"], ["리스크관리 프로세스·지침", "리스크 식별·측정·모니터링·통제를 수행하는 절차와 업무 지침을 둠"], ["리스크 인식 교육 프로그램(지식·소통·인식·기술 역량·능력·경험·리스크 한도 이해)", "임직원이 리스크를 알아보고 한도 안에서 업무하도록 교육 프로그램을 운영함"], ["측정·평가 체계", "현재 상태와 미래 목표 사이의 기회·위협을 f(영향, 발생가능성)로 측정하고 사업 프로세스·KPI와 연결함"]]}], "tbl": null, "kb": [["ok", "코어시스템 교체 계획, AML 탐지 엔진 개발 중"]], "trap": [], "qa": [["리스크관리를 운영하기 위해 어떤 인프라를 갖추었습니까?", "정책, 조직, 시스템, 프로세스, 교육, 측정 체계 여섯 가지가 필요합니다. KBBF는 코어시스템 교체를 계획하고 있어, 리스크 측정과 한도 모니터링 기능을 새 시스템 요건에 넣겠습니다."]]}, {"ch": "5", "id": "POJK 4/2021 · A to Z S.88~89", "t": "IT 리스크관리(자산 구간별 의무)", "e": "IT Risk Management (인니어 참고: MRTI)", "imp": 2, "sem": null, "one": "IT 리스크관리는 4대 요소로 이행하며, 총자산 Rp1조 초과 회사는 IT 운영위원회와 데이터센터·재해복구센터를 갖춰야 함.", "req": [{"h": "범위", "items": [["이사회(BOD, Directors)·감사회(BOC, Board of Commissioners) 적극적 감독", "이사회(BOD)는 IT 전략·정책을 정해 이행하고 감사회(BOC)는 IT 리스크관리 이행을 감독함"], ["IT 사용 정책·절차", "IT 도입·운영·보안·외부 위탁에 관한 정책과 절차를 갖추고 적정하게 유지함"], ["IT 위험 식별·측정· ], ["ok", "자본비율(Capital Ratio) 63.88%, 유동비율 2.11배, NPF Net 0.94%"]], "trap": ["「건강도」나 「4 pilar」 질문에는 POJK 28/2020 4요소로 답하고, 재무건강도는 8월 변화 설명의 보조로만 씀", "등급 경계값(1.75·2.5)은 근거 규정이 확인되지 않았으므로 먼저 말하지 않음", "4분기 신규 축소·충당금 적립을 인수 시점과 연결해 말하지 않음"], "qa": [["재무건강도가 7월보다 낮아진 이유는 무엇입니까?", "재무건강도는 회사가 자본, 금융채권 품질, 수익성, 유동성 점수로 매월 산출하는 지표입니다. 8월에 BOPO가 90%를 넘으면서 수익성 점수가 나빠져 '매우 건전'에서 '건전'으로 한 단계 내려갔고, 다른 항목은 그대로입니다. 선임 후 BOPO를 낮추는 수익과 비용 관리부터 점검하겠습니다."]]}, {"ch": "5", "id": "POJK 49/2024 · A to Z S.112~113", "t": "감독 방식과 감독 상태 3단계", "e": "Supervisory Status: Normal · Intensive · Special", "imp": 3, "sem": "건강도(Health Level) 4등급은 집중감독, 5등급은 특별감독이며 숫자가 클수록 나쁘다고 강사 자료에 정리됨(시험힌트 Q28).", "one": "OJK는 간접·직접감독을 하고, 회사를 정상·집중·특별감독(Special) 3단계로 지정함. 집중감독(Intensive)은 종합 4등급, 자기자본/납입자본 50% 미만, Net NPF 5% 초과가 기준임.", "req": ["감독 방식 a. 간접감독: 보고서·타 당사자 보고·감독데이터 모니터링·분석·평가", "감독 방식 b. 직접감독: 대면·전자 대면 회의, 검사", "검사 유형: 정기검사, 수시검사, 범죄 혐의 특별검사. 주주·자회사·거래상대방도 검사 대상 가능", "정상감독(Normal): 집중·특별감독 기준에 해당하지 않음", "집중감독: 건강도 종합 4등급, 또는 자기자본/납입자본 0% 이상 50% 미만, 또는 Net NPF 5% 초과 25% 이하", "특별감독: 집중감독 기간 종료, 또는 종합 5등급, 또는 자기자본/납입자본 0% 미만, 또는 Net NPF 25% 초과"], "tbl": {"h": ["상태", "건강도", "자기자본/납입자본", "Net NPF"], "r": [["정상", "-", "50% 이상", "5% 이하"], ["집중", "4등급", "0% 이상 50% 미만", "5% 초과 25% 이하"], ["특별", "5등급(또는 집중감독 기간 종료)", "0% 미만", "25% 초과"]]}, "kb": [["ok", "자기자본/납입자본 58.96%, Net NPF 0.94%(8월말) → 기준과 거리 있음"], ["warn", "자기자본/납입자본 여유 약 9%p로 손실 누적 시 주의"], ["ok", "대주주 조기경보(자본비율 12%, Gearing 8배, NPF 4%) 도달 시 추가 지원"], ["warn", "OJK 서면 경고 1건(2026.3, 교육훈련비 2.3% < 2.5%)"]], "trap": ["Net NPF 5%는 FMU·FD 수행 상한이자 집중감독 기준의 하한임", "A to Z 정리본은 '기본자본(Core Capital)/납입자본', rcards·facts는 '자기자본/납입자본'으로 표기함. 같은 비율로 보이나 원문 용어 [확인 필요]", "자기자본/납입자본 50%는 자본 요건(최소 50%)과 집중감독 기준이 같은 수치임"], "qa": [["집중감독 지정 기준은 무엇입니까?", "건강도 종합 4등급, 납입자본 대비 자기자본 비율 50% 미만, Net NPF 5% 초과 중 하나에 해당하면 집중감독입니다. KBBF는 8월말 자기자본/납입자본 58.96%, Net NPF 0.94%로 기준과 거리가 있습니다. 다만 자본 여유가 약 9%p이므로 손실 누적을 막고, 대주주와 정한 조기경보 기준으로 먼저 대응하겠습니다."], ["Net NPF가 얼마를 넘으면 특별감독입니까?", "Net , 디지털·자동화, 리스크관리)", "규정 준수와 GCG를 강화하고, 디지털화·자동화와 측정 가능한 리스크관리로 생산성을 높이고 비용을 줄임"]]}, "전략 수립 흐름: 외부분석(기회·위협) + 내부분석(강점·약점) → 비전(Vision)·미션(Mission) → 핵심성공요인(KSF) → 전략 → 실행", {"h": "단기 옵션 4개", "items": [["온보딩 디지털화(e-KYC·OCR)", "e-KYC·OCR과 AI 서류검증으로 가입 절차를 디지털화함. 교재 예시는 운영비 30% 절감, 처리시간 3일→15분임"], ["마이크로 상품 다각화", "1~30일 만기 디지털 퀵론, 이커머스 제휴 등 소액 상품을 늘려 신규 고객과 수수료수익을 확대함"], ["조달 효율화(리테일 채권·그린본드 등)", "리테일 채권, P2P 제휴, 그린본드 등으로 조달원을 다양화해 조달비용을 낮춤(교재 예시 1.5~2%p 감소)"], ["회수 강화(AI 스코어링·자동 알림)", "대체데이터 기반 AI 스코어링과 WhatsApp 자동 알림으로 연체를 줄이고 추심비용을 낮춤"]]}, {"h": "장기 옵션 4개", "items": [["금융 슈퍼앱", "여러 금융 서비스를 하나의 앱에서 제공해 교차판매를 늘림(교재 예시 교차판매 3배)"], ["그린·지속가능금융 허브", "녹색금융 포트폴리오를 키움. 교재 예시는 녹색 포트폴리오를 총자산의 30%까지 확대하는 것임"], ["언더뱅크 확대", "금융 접근이 부족한 3·4선 도시 고객으로 영업을 넓힘(교재 예시 신규고객 500만, 거래액 120% 증가)"], ["전략적 제휴", "외부 파트너와 제휴해 고객 획득 경로를 넓히고 고객획득비용을 낮춤(교재 예시 40% 감소)"]]}, "실행 로드맵 예시: 2026년 1분기 ~ 2028년 1분기에 단계 배치"], "tbl": null, "kb": [], "trap": ["옵션별 수치(운영비 30% 절감, 조달비용 1.5~2%p 감소 등)는 교재 예시이며 규정 수치가 아님"], "qa": [["회사의 단기·장기 전략은 무엇입니까?", "외부·내부 분석에서 핵심성공요인을 정하고 전략과 실행계획(action plan)으로 연결합니다. 단기에는 디지털 온보딩과 회수 강화로 효율을 높이고, 중장기에는 상품 다각화를 단계적으로 추진하겠습니다."]]}, {"ch": "6", "id": "POJK 24/2019 / Modul Q7-1 p.12 / A to Z S.117", "t": "사업계획 정의와 작성 6단계", "e": "Business Plan · Work plans", "imp": 3, "sem": "LSPPI 인터뷰(8/27)에서 「비즈니스 플랜은 어떻게 수립할 것인가」가 실제 출제됨 [LSPPI질의 4번]. 거시 가정·PESTEL·SWOT·동종사 비교·재무 전망·조달·자본계획·점포망을 고려하라고 함 [강의정리 1.10]", "one": "사업계획(Business Plan)은 일정 기간의 사업 발전 계획과 달성 전략을 기술한 문서이며, 전략 정의부터 예산 편성까지 6단계로 작성함.", "req": ["정의: 비은행금융기관의 일정 기간 사업 발전 계획·사업활동과 목표 기간 내 달성 전략을 기술한 문서(POJK 24/2019)", {"h": "작성 6단계", "items": [["사업 전략·목표 정의(예: 원가우위)", "회사가 어떤 방식으로 경쟁할지 전략과 목표를 먼저 정함. 교재 예시는 원가우위(Cost Leadership) 전략임"], ["전략 목표 설정(예: 인력 생산성)", "전략을 이루기 위해 개선할 구체 목표를 정함"], ["KPI 결정(예: CMO당 Booking)", "전략 목표의 달성 여부를 측정할 핵심성과지표를 고름"], ["KPI 목표치 설정(예: 월 20대)", "선택한 KPI마다 기간별로 달성해야 할 수치를 정함"], ["이니셔티브·업무계획(예: CMO 4DX 교육)", "목표치 달성을 위한 구체 활동과 업무계획을 세움. 교재 예시는 CMO 100% 대상 4DX 교육임"], ["예산 편성", "이니셔티브 수행에 필요한 비용을 배정함. 교재 예시는 직원 1,000명에 IDR 10억임"]]}, "계획 기간: 단기·중기·장기(A to Z S.117)", "거시 가정: 경제성장률, 1인당 GDP, 물가, BI 기준금리, 환율, 유가 등", "사업 가정: 수요 수준, 취급 목표(booking target), 조달원, 인력 수, 서비스 네트워크, IT 개선, 조직 개선"], "tbl": null, "kb": [["ok", "1~9월 신규취급 계획 대비 108.1%(9월 내부 실적, OJK 미확인)"], ["warn", "9월말 잔액 계획 대비 85.9%, 1~9월 순이익 10.93bn으로 계획 대비 약 45%(9월 내부 실적)"]], "trap": ["교재 6단계는 KPI 결정(③)과 KPI 목표치 설정(④)을 별도 단계로 둠"], "qa": [["사업계획은 어떻게 수립하시겠습니까?", "거시 가정과 시장 분석으로 전략 목표를 정하고, KPI와 목표치, 실행계획(action plan), 예산 순으로 연결합니다. KBBF는 올해 신규취급은 계획을 넘었지만 잔액과 이익이 계획에 못 미쳐, 그 차이의 원인을 분석해 내년 계획 가정에 반영하겠습니다."]]}, {"ch": "6", "id": "POJK 24/2019 · SEOJK 23/2019 / Modul Q7-1 p.13·19", "t": "사업계획 최소 구성 7항목", "e": "Business Plan · Executive Summary (RBB, Rencana Bisnis)", "imp": 3, "sem": "강의 수치: 사업계획 제출 매년 11월 30일, 수정은 6월 30일 전·14영업일 전 [강의정리 2.3]. 교육훈련비 2.5%는 KBBF 2026년 3월 OJK 서면 경고 사유와 직결됨 [강의정리 2.3] [가이드 4-3]", "one": "사업계획(Business Plan)은 요약부터 기타 정보까지 최소 7개 항목(a~g)으로 구성하며, 경영정책·계획 7개와 기타 정보 6개를 포함함.", "req": ["a. 요약(Executive Summary)", "b. 직전 기간 사업계획 이행 평가", "c. 비전(Vision)·미션·사업전략", {"h": "d. 경영정책·계획 7개", "items": [["사업활동", "취급할 금융 상품과 사업활동의 규모·방향을 계획함"], ["사업 개발·확장", "신규 사업이나 사업 범위 확대 계획을 기술함"], ["자본", "자본 확충 등 자본 관리 계획을 기술함"], ["조달(Funding)", "은행 차입·채권 발행 등 조달원별 자금 조달 계획을 기술함"], ["사무소 네트워크·유통채널", "지점 등 사무소 네트워크와 유통채널의 개발·변경 계획을 기술함"], ["조직·인력·IT 개발", "조직 구조, 인력, IT 시스템의 개발 계획을 기술함"], ["금융이해력·포용 제고 활동", "소비자의 금융이해력을 높이고 금융 접근을 넓히는 활동 계획을 기술함"]]}, "e. 재무제표 추정과 사용 가정", "f. 주요 비율·계정 추정", {"h": "g. 기타 정보 6개", "items": [["직접 지분참여", "다른 회사에 직접 지분을 투자할 계획이 있으면 기재함"], ["지속가능금융 실행계획(RAKB)", "지속가능금융 실행계획을 포함함. A to Z는 RAKB를 1년·5년 계획과 실행전략·목표시점을 담은 문서로 설명함"], ["합병·통합·분할", "합병·통합·분할 계획이 있으면 그 내용을 기재함"], ["사업 종료로 지위 상실", "사업을 종료해 금융회사 지위를 잃게 되는 경우 관련 내용을 기재함"], ["샤리아 금융회사 전환", "일반 금융회사를 샤리아 금융회사로 전환할 계획이 있으면 기재함"], ["샤리아사업부(UUS) 설립·폐쇄·분할", "샤리아사업부를 설립·폐쇄·분할할 계획이 있으면 기재함"]]}], "tbl": null, "kb": [["warn", "2026년 3월 OJK 서면 경고 1건: RBB 교육훈련비가 인건비의 2.3%로 기준 2.5%에 미달 → 수정 RBB 제출로 조치 완료"], ["ok", "대주주 3년간 IDR 570bn 증자 계획(114.3/341.7/114.3bn, 첫 집행 2027년), 조기경보(자본비율 12%·Gearing 8배·NPF 4%) 도달 시 추가 지원"]], "trap": ["사업계획 제출 기한 자료 간 차이: 강의정리 매년 11월 30일 / W2 매년 10월 31일 [확인 필요]", "사업계획 수정 기한(6월 30일 전, 14영업일 전)은 강의 수치이며 교재 본문에는 없음 [확인 필요]", "금융이해력·포용 활동 계획은 d(경영정책·계획), 지속가능금융 실행계획(action plan)은 g(기타 정보)에 들어감", "교육훈련비 2.5%는 RBB 편성 단계에서 충족해야 하며, 배정 미달만으로 서면 경고 대상이 됨(KBBF 2026년 3월 사례)"], "qa": [["OJK에서 경고 공문을 받은 분야와 개선 방안은 무엇입니까?", "2026년 3월 RBB의 교육훈련비가 인건비의 2.3%로 기준 2.5%에 못 미쳐 서면 경고를 받았고, 수정 RBB를 제출해 조치를 마쳤습니다. 앞으로는 RBB 확정 전에 컴플라이언스 부서가 규정 비율을 점검하고, 분기별 집행률을 이사회(BOD, Directors)와 감사회(BOC, Board of Commissioners)에 보고하겠습니다."], ["사업계획서에 반드시 들어가야 하는 항목은 무엇입니까?", "요약, 직전 계획 이행 평가, 비전·미션·전략, 경영정책과 계획, 재무 추정과 가정, 주요 비율 추정, 기타 정보 7개 항목입니다. 경영계획에는 자본·조달·인력·IT 계획이 들어가며, KBBF는 대주주의 3년간 약 5,700억 루피아 증자 계획과 연결해 설명드릴 수 있습니다."]]}, {"ch": "6", "id": "POJK 24/2019 · SEOJK 23/2019 / Modul Q6-1 p.20·27", "t": "사업계획 실현 보고서", "e": "Business Plan Realization Report (Laporan Realisasi Rencana Bisnis)", "imp": 3, "sem": "회사 현황 답변은 PAT와 예산 대비 실적, 그 설명(대손비용 개선, 사업 개선, 디지털 효율, BOPO 개선)으로 시작하라고 함 [FP메모 3번]. PAT 미달은 수익·신규취급·NPF·충당금 비용·조달비용·영업비용으로 나눠 설명 [강의정리 4.2]", "one": "이사회(BOD, Directors)가 사업계획 대비 실적과 편차 원인, 후속조치를 담아 OJK에 반기마다 제출하는 보고서임.", "req": ["작성 주체: 이사회(BOD). 일정 기간 시점의 사업계획 이행을 보고", {"h": "최소 내용 5가지", "items": [["a. 계획 대비 실적 비교", "사업계획 목표와 실제 실적을 비교해 달성 정도를 설명함"], ["b. 편차 원인과 장애", "실적이 계획과 달라진 원인과 이행 과정에서 겪은 장애를 설명함"], ["c. 달성도 제고 후속조치(시행·예정)", "달성도를 높이기 위해 이미 취했거나 앞으로 취할 조치를 기재함"], ["d. 재무비율과 주요 계정", "해당 기간의 주요 재무비율과 주요 계정 실적을 보고함"], ["e. 기타 정보(실현에 영향을 준 보고 범위 밖 정보)", "보고 항목에 들지 않지만 사업계획 실현에 영향을 준 정보를 추가로 기재함"]]}, "제출 주기: 반기(semi-annual), OJK 앞", "같은 반기에 감사회(BOC, Board of Commissioners)는 사업계획 감독 보고서(Business Plan Supervision Report)를 별도 제출"], "tbl": null, "kb": [["warn", "1~9월 순이익 10.93bn, 계획 대비 약 45%(9월 내부 실적, OJK 미확인)"], ["ok", "1~9월 신규취급 계획 대비 108.1%, 9월말 잔액 85.9%"], ["warn", "BOPO 90.58%(8월, 업계 82.86%), 대손비용 누계 10.94bn(1~9월)"]], "trap": ["실현 보고서(Business Plan Realization Report, 이사회)와 감독 보고서(감사회)는 작성 주체가 다르고 둘 다 반기 제출임"], "qa": [["올해 실적이 계획에 못 미친 이유는 무엇입니까?", "9월 내부 실적 기준 1~9월 순이익은 약 109억 루피아로 계획의 약 45%입니다. 신규취급은 계획을 넘었지만 잔액이 계획의 86% 수준이고, 대손비용과 90%대 BOPO가 이익을 낮췄습니다. 선임 후 수익, 대손비용, 조달비용, 영업비용별로 차이를 나눠 실현 보고서에 담고 개선 조치를 보고하겠습니다."]]}, {"ch": "6", "id": "Modul Q6-1 p.14~18", "t": "사업계획 평가 효익·대상 6", "e": "Business Plan Evaluation (Conformance · Strategy · Leadership · Coherence · Execution · Adequacy)", "imp": 2, "sem": "감사(BOC 위원) 예시 질문 1번 「회사 사업계획을 어떻게 평가하겠는가」 [FP메모]. 감사회(BOC, Board of Commissioners)는 경영 대시보드로 예산 대비 실적, KPI, 재무비율, NPF, 수익성 차이를 점검하고 큰 차이에는 원인과 시정조치를 요구함 [강의정리 1.10, 4.6]", "one": "사업계획(Business Plan) 평가는 성공도 측정·시정조치 결정·사업전략 분석 3단계로 진행하며, 적합성 등 6개 대상을 봄.", "req": [{"h": "평가 효익 5가지", "items": [["진척 모니터링과 시정", "사업·프로그램 진척을 점검해 필요한 조치와 시정으로 연결함"], ["자원의 효과적·효율적 사용", "인력·예산 등 자원이 효과적이고 효율적으로 쓰이도록 확인함"], ["의도한 영향 달성 여부", "사업계획이 의도한 영향을 실제로 냈는지 평가함"], ["전략 실행 효과성", "전략 실행이 전반적으로 효과가 있었는지 평가함"], ["경영진 리더십 효과성", "경영진의 리더십이 목표 달성에 효과적이었는지 평가함"]]}, {"h": "평가 대상 6가지", "items": [["적합성(Conformance, 규정 준수)", "사업계획과 그 이행이 관련 규정에 맞는지 평가함"], ["전략(Strategy)", "환경분석, 전략, 업무계획이 타당한지 평가함"], ["리더십(Leadership)", "경영진 리더십이 효과적으로 작동했는지 평가함"], ["정합성(Coherence, 정렬·하향 전개)", "회사 목표가 부서·개인 목표까지 일관되게 정렬되고 하향 전개(cascading)됐는지 평가함"], ["실행(Execution)", "계획이 효과적으로 이행되고 목표가 달성됐는지 평가함"], ["적정성(Adequacy, 자원 배분)", "자원 배분이 적정하고 효과적이었는지 평가함"]]}, {"h": "역량요소 3개", "items": [["성공도 측정(PC 1.1~1.5)", "실적 데이터 식별, 계획 대비 분석, 저해·지원요인 식별을 거쳐 성공 수준을 추정함"], ["시정조치 결정(PC 2.1~2.2)", "성공 수준별로 분석하고 정해진 절차에 따라 시정조치를 결정함"], ["사업전략 분석(PC 3.1 결과 전달, 3.2 보고서 작성, 3.3 문서화)", "평가 결과를 관계자에게 전달하고 보고서를 작성해 문서로 보관함"]]}, "수행 증빙: 사업계획 평가 문서"], "tbl": null, "kb": [], "trap": ["Q6 단원은 감사(BOC 위원) 관점 평가 단원임. 대표이사(President Director) 답변에서는 「감사회에 이렇게 보고하겠다」 형태로 활용 [추정]"], "qa": [["사업계획 이행을 어떤 관점에서 점검합니까?", "규정 적합성, 전략, 리더십, 정합성, 실행, 자원 적정성 여섯 가지로 봅니다. 대표이사로서 매월 대시보드로 계획 대비 실적을 점검하고, 감사회가 같은 기준으로 평가할 수 있게 자료를 제공하겠습니다."]]}, {"ch": "6", "id": "Modul Q6-1 CE1 p.21~23", "t": "사업계획 성공도 측정 절차", "e": "Measuring the Success of a Business Plan", "imp": 2, "sem": null, "one": "실적 데이터 식별 5단계, 실적 분석 4단계, 저해·지원요인 식별, 성공 수준 추정 7단계로 사업계획 성공도를 측정함.", "req": [{"h": "PC 1.1 실적 데이터 식별 5단계", "items": [["실현 보고서(Business Plan Realization Report)·경영진 설명 요청", "사업계획 실현 보고서와 경영진의 설명·책임 자료를 요청해 평가 자료를 확보함"], ["전략·KPI·목표치·이니셔티브·예산 파악", "전략, 전략목표, KPI, 목표치, 이니셔티브, 예산과 이행 현황을 파악함"], ["재무제표·Booking·포트폴리오 품질·운영보고 수집", "재무제표, 판매·Booking 실적, 포트폴리오 품질, 운영보고 등 실적 데이터를 모음"], ["신뢰 가능한 시스템(재무보고·ERP·CRM·내부보고)에서 확보", "데이터는 회사가 관리하는 신뢰할 수 있는 시스템에서 가져와야 함"], ["정확성·일관성 검증", "수집한 데이터가 정확하고 자료 사이에 일관되는지 검증함"]]}, {"h": "PC 1.2 실적 분석 4단계", "items": [["목표·실적 비교", "KPI별 목표치와 실제 실적을 나란히 비교함"], ["차이 분석", "목표와 실적의 차이 규모를 산출함"], ["긍정·부정 편차 식별", "목표를 넘은 항목과 미달한 항목을 구분함"], ["내부·외부 원인 분석", "편차가 회사 내부 요인에서 왔는지 외부 환경 요인에서 왔는지 분석함"]]}, {"h": "PC 1.3 저해요인 2군", "items": [["사업환경 변화 예측 실패(시장 불안, 규정 변경, 경기침체, 재해·팬데믹·지정학, 기술 변화)", "시장·규정·경기·기술 등 외부 환경 변화를 계획 단계에서 예측하지 못해 실적이 떨어진 경우임"], ["의사결정 부정확(계획 과정, 정렬·하향 전개, 리더십, 자원 배분, 내부 조율·소통)", "환경분석 미흡, 목표 정렬 실패, 자원 배분 오류 등 회사 내부 의사결정 문제로 실적이 떨어진 경우임"]]}, {"h": "PC 1.4 지원요인 4가지", "items": [["정확한 시장 분석", "SWOT, Porter 5 Forces, PESTLE 등으로 시장을 정확히 분석한 것이 성과를 뒷받침함"], ["결단력 있는 전략 의사결정", "명확한 비전·미션·전략과 효과적인 리더십으로 필요한 결정을 제때 내림"], ["자원 가용성", "자원을 효과적으로 배분하고 생산적인 인력을 확보함"], ["변화 적응", "민첩하고 유연하게 대응하며, 지속적으로 혁신하고 피드백을 반영함"]]}, {"h": "PC 1.5 성공 수준 추정 7단계", "items": [["SWOT·PESTEL·Porter 분석", "분석 도구로 회사 내부 역량과 외부 환경을 다시 점검함"], ["벤치마킹", "산업 평균과 동종사 실적을 회사 실적과 비교함"], ["시계열 분석", "과거 실적 추이와 편차의 흐름을 기간별로 분석함"], ["지원·저해요인 검토", "PC 1.3·1.4에서 찾은 저해요인과 지원요인을 종합해 검토함"], ["시정조치 권고", "분석 결과에 따라 필요한 시정조치를 권고함"], ["관계자 논의", "분석 결과와 권고안을 관련 경영진·부서와 논의함"], ["성공 수준 추정", "앞 단계 결과를 종합해 사업계획의 성공 수준을 판정함"]]}], "tbl": null, "kb": [["warn", "내부 보고서와 OJK 보고의 NPF·BOPO 산식 차이 → 선임 후 통일 필요"]], "trap": [], "qa": [["실적 편차가 생기면 원인을 어떻게 분석합니까?", "목표와 실적을 비교해 긍정·부정 편차를 나누고, 원인을 내부와 외부로 구분합니다. KBBF는 내부 보고와 OJK 보고의 NPF·BOPO 산식이 달라, 먼저 기준을 하나로 맞춘 뒤 편차를 분석하겠습니다."]]}, {"ch": "6", "id": "Modul Q6-1 CE2 p.24~25", "t": "시정·개선조치 결정 5단계", "e": "Corrective Action (Root Cause Analysis)", "imp": 2, "sem": "OJK 지적사항 질문은 지적 내용 → 근본 원인 → 조치계획 → 담당자 → 기한 → 증빙 → 감사회(BOC, Board of Commissioners) 모니터링 순서로 답하라고 함 [강의정리 3.4, 4.4]", "one": "근본원인분석으로 문제를 찾고, 평가 기준 설정부터 시범·단계적 실행까지 5단계로 시정조치를 결정함.", "req": ["정의: 근본 문제를 식별하고 필요시 업무계획과 목표를 조정함. 근본원인분석(Root Cause Analysis) 활용", "그룹별 초점: 계획 과정, 리더십 효과성, 자원 배분, 프로세스 최적화·기술 시스템 등", {"h": "이행상 문제 10가지", "items": [["목표 달성 곤란", "설정한 목표치가 현실과 맞지 않거나 실적이 계속 미달하는 상태임"], ["재무 문제", "자금 부족, 조달비용 상승, 손실 등으로 계획 이행에 필요한 재원이 모자란 상태임"], ["외부환경 변화", "경기·규정·시장 여건이 계획 수립 당시의 가정과 달라진 상태임"], ["인력관리 부실", "필요한 인력의 확보·교육·성과관리가 제대로 되지 않는 상태임"], ["기술·인프라", "IT 시스템과 업무 인프라가 계획 이행을 뒷받침하지 못하는 상태임"], ["내부 불일치", "부서 사이의 목표나 우선순위가 서로 맞지 않는 상태임"], ["변화 저항", "임직원이 새 전략이나 업무 방식 도입에 소극적인 상태임"], ["컴플라이언스·규제", "규정 위반이나 규제 대응 지연이 계획 이행을 막는 상태임"], ["조율·소통", "부서 간 정보 공유와 업무 조율이 부족한 상태임"], ["리스크관리 실패", "리스크를 제때 식별·통제하지 못해 손실이나 차질이 생긴 상태임"]]}, {"h": "결정 5단계", "items": [["평가 기준 설정(목표 영향·비용·소요기간·성공 가능성·리스크)", "여러 시정안을 비교할 기준을 먼저 정함"], ["분석 도구(SWOT·비용편익·민감도·시뮬레이션)", "정한 기준에 따라 각 시정안의 효과와 비용을 분석 도구로 따져 봄"], ["합의 기준으로 우선순위화", "관계자가 합의한 기준으로 시정안의 우선순위를 정함"], ["조정안 논의·권고", "경영 강화, 운영 효과성, 시스템 개선 등 영향이 큰 이니셔티브를 중심으로 조정안을 논의해 권고함"], ["시범 적용과 단계적 실행", "선정한 조치를 일부에 먼저 시범 적용한 뒤 단계적으로 넓혀 실행함"]]}], "tbl": null, "kb": [["ok", "OJK 서면 경고(2026년 3월, 교육훈련비 2.3%)는 수정 RBB 제출로 조치 완료"]], "trap": [], "qa": [["연간 목표 미달이 예상되면 어떻게 시정합니까?", "근본 원인을 분석한 뒤 영향·비용·기간·리스크 기준으로 우선순위를 정하고, 조정안을 시범 적용한 다음 단계적으로 확대합니다. 조치마다 담당자와 기한을 정해 이사회(BOD, Directors)에서 점검하고 감사회에 보고하겠습니다."]]}, {"ch": "6", "id": "POJK 24/2019 제6조·제15조 · SEOJK 23/2019 Format 18 / Modul Q6-1 p.26~28", "t": "사업계획 감독 보고서(감사회)", "e": "Business Plan Supervision Report", "imp": 2, "sem": "감사회(BOC)가 반기별로 OJK에 사업계획 감독보고서를 제출함 [W2 §5, 자체 학습자료]", "one": "감사회(BOC, Board of Commissioners)는 사업계획 이행을 감독할 의무가 있고, 감독 결과를 반기마다 OJK에 보고함.", "req": ["POJK 24/2019 제6조 제6항: 감사회의 사업계획 이행 감독 의무", "제15조 (1): 사업계획 감독 보고서(Business Plan Supervision Report)를 OJK에 반기마다 제출", {"h": "제15조 (2) 최소 내용(감사회 평가)", "items": [["a. 사업계획 실현(정량·정성)", "감사회(BOC PO", "90.58%", "업계 82.86%"]]}, "kb": [["ok", "Risk Profile P2(법률 P3), GCG 2등급"], ["warn", "OJK 서면 경고 1건(2026년 3월, 교육훈련비 2.3% < 2.5%) → 수정 RBB 제출로 조치 완료"], ["ok", "인력 142명(정규 77·계약 59·경영진·위원 6), 영업소(KSKC) 7, 이직률 0.73%(9월)"], ["warn", "수익성(ROA·BOPO)이 업계보다 약함"]], "trap": ["8월 숫자는 OJK 보고 기준, 9월 숫자는 내부 실적(OJK 미확인)으로 구분해 말할 것", "OJK 건강도(Health Level) 종합등급(Composite Rating)과 회사 월별 재무건강도(교재 외)는 다른 지표임"], "qa": [["현재 ROA, NPF, 부채비율(Gearing Ratio), FAR은 얼마입니까?", "8월말 OJK 보고 기준 ROA 누계 0.80%, NPF 총비율 3.25%·순비율 0.94%, Gearing 2.06배, FAR 95.63%입니다. 자본과 레버리지는 기준을 크게 웃돌지만 수익성이 업계보다 낮아, BOPO와 대손비용 개선을 우선 과제로 두겠습니다."], ["최근 제재 이력과 시정 상황은 어떻습니까?", "2026년 3월 교육훈련비 배정이 인건비의 2.3%로 기준 2.5%에 못 미쳐 서면 경고 1건을 받았고, 수정 RBB를 제출해 조치를 마쳤습니다. 이후 집행률을 분기별로 점검해 재발을 막겠습니다."]]}, {"ch": "6", "id": "Modul Q7-2 p.29~33", "t": "규정 준수 확보 철학과 역량요소 4", "e": "Ensuring Compliance With Regulations Related to Finance Companies (Kepatuhan)", "imp": 3, "sem": "LSPPI 인터뷰 6번 「컴플라이언스는 어떤 역량을 가져야 하는가」가 실제 출제됨 [LSPPI질의 6번]. 암기 순서: Compliance Function → OJK Report → Monitoring/Internal Audit → AML-CFT → Consumer Protection → Risk Indicators [시험힌트 1)]", "one": "규정 준수 확보는 데이터 수집, 신규 규정 영향 평가, 준수 수준 분석, 준수 수준 보고 4개 역량요소(수행기준 13개)로 구성됨.", "req": [{"h": "철학 6가지", "items": [["주주·이해관계자의 위임 사항", "컴플라이언스는 주주와 이해관계자가 경영진에게 맡긴 책무임"], ["법률 문제이면서 사업 무결성·지속가능성 문제", "규정 준수는 법적 의무이면서 회사의 무결성과 지속가능성을 지키는 일임"], ["컴플라이언스 리스크(당국 제재, 신뢰 하락, 유·무형 손실)", "규정을 지키지 않으면 당국 제재, 공공·투자자·소비자의 신뢰 하락, 유·무형 손실이 생김"], ["준수 모니터링은 긍정적 영향을 주고 문화는 지속 가치", "준수 모니터링·통제는 회사에 긍정적 영향을 주며, 컴플라이언스 문화는 오래 유지되는 가치임"], ["윤리 가치·비전(Vision)·미션과 GCG 우선", "업무 판단에서 윤리 가치, 비전·미션, GCG 이행을 우선해야 함"], ["관련 규정 식별·이행 모니터링·평가·통제", "적용 규정을 빠짐없이 식별하고, 이행을 모니터링하며 평가·통제해야 함"]]}, {"h": "역량요소 1 데이터·정보 수집", "items": [["1.1 절차에 따른 수집", "정해진 절차에 따라 컴플라이언스 데이터와 정보를 모음"], ["1.2 타당성·관련성 확인", "수집한 데이터가 정확하고 목적에 맞는지 확인함"], ["1.3 감독당국 권고 수집", "OJK 등 감독당국의 권고사항을 모아 관리함"]]}, {"h": "역량요소 2 신규·개정 규정 영향 평가", "items": [["2.1 영향 분석", "신규·개정 규정이 회사 업무의 준수에 미치는 영향을 분석함"], ["2.2 후속조치 개념 논의", "필요한 후속조치의 방향을
