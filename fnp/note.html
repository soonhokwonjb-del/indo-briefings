y, 내용·구성·준거 관련 3유형, 「측정 대상이 정확한가」), 관련성(Relevance, 「유용하고 관련 있는가」). 교육 효과 예시: 참석률, 사전·사후 시험, 교육 후 위반 감소"], "tbl": null, "kb": [["warn", "SLIK 데이터 오류 반복 → 제출 전 검증 강화 필요"], ["ok", "상반기 민원 25건 전건 APPK 응대, H+1 대응·10일 내 해결"]], "trap": ["교재는 OJK 정기 컴플라이언스 보고를 「분기」, 연간 보고를 「요청 시」로 기재함"], "qa": [["컴플라이언스 담당이 이사회에 정기 보고해야 할 지표는 무엇입니까?", "기능 이행 현황, OJK 보고 현황, 감사·감독 지적의 후속조치, AML·CFT 보고, 민원 처리, 위반·제재 건수입니다. KBBF는 SLIK 데이터 오류가 반복된 적이 있어 제출 전 검증 결과도 함께 보고받겠습니다."]]}, {"ch": "6", "id": "Modul Q7-2 PC 1.3·2.1 p.35~36", "t": "금융회사 감독·관련 기관", "e": "Supervisory authority (OJK · PPATK · BI · DJP · Komdigi)", "imp": 2, "sem": null, "one": "금융회사는 OJK 외에 국세청·법무인권부·중앙은행·PPATK·통신디지털부 등 관련 기관의 규정도 준수해야 함.", "req": ["OJK: 모든 활동 감독·규제, 영업인가·경영진 변경·신상품 승인, POJK·SEOJK 발행, 검사·감독·제재", "국세청(DJP)·재무부: 세무 준수, 부가세·소득세 신고 확인, 세무데이터 대사", "법무인권부: 설립·정관 변경 시 법인 지위 승인, 법률 측면", "인도네시아 중앙은행(BI): 금융시스템 거시 안정 모니터링, 외환거래(파생·헤지 포함) 감독", "금융거래보고분석센터(PPATK): STR·CTR 수령, AML·CFT 프로그램 이행 감독", "통신디지털부(Komdigi): 전자서명(Electronic Signature, 예: BNPL 상품), 전자시스템운영자(PSE) 규제", "교재 추가 언급: 노동부(노동 준수), 지식재산권 분야 법무인권부, 기타 감독기관"], "tbl": null, "kb": [], "trap": ["STR·CTR(LTKM·LTKT) 수령 기관은 OJK가 아닌 PPATK임", "외환·헤지 거래 감독은 BI 소관"], "qa": [["OJK 외에 보고·준수해야 하는 기관은 어디입니까?", "의심거래와 현금거래 보고는 PPATK, 세무는 국세청, 외환과 헤지 거래는 중앙은행, 전자서명과 전자시스템 등록은 통신디지털부 소관입니다. 컴플라이언스 부서가 기관별 의무 목록을 관리하도록 하겠습니다."]]}, {"ch": "6", "id": "Modul Q7-2 PC 2.1~2.3 p.36~37", "t": "신규 규정 영향 분석과 후속조치", "e": "Identifying the Regulatory Impacts · Follow-up", "imp": 3, "sem": "강사가 POJK 46/2024, 48/2024, 35/2025를 중요 규정으로 표시함 [FP메모 14번]. 규제 번호는 정확히 말하되 답변 중심은 실질 내용과 회사 적용에 둠 [K7] [강의정리 3.4]", "one": "신규·개정 규정은 영향 식별, 부서 논의, 정책·SOP 조정, 시스템 구축, 모니터링 5단계로 반영하고, 권고에는 리스크 분석·비용 추정·이행 일정을 붙임.", "req": [{"h": "영향 분석 4영역(교재 기재)", "items": [["사업모델·시장전략", "규정이 상품 구성, 영업 채널, 시장 확장 방향에 주는 영향을 분석함. 고위험 투기성 상품 제한도 여기에 해당함"], ["조직·인력", "지배구조·컴플라이언스 전담 부서 설치, 임직원 교육·인증 요구가 조직과 인건비에 주는 영향을 분석함"], ["시스템·인프라", "내부통제체계, 부정방지 전략, 사이버보안·디지털 감사 요구에 따른 IT 투자 필요성을 분석함"], ["제재·감독 기관", "규정 위반 시 제재하거나 감독하는 기관(OJK, PPATK, 재무부, 노동부 등)을 확인함"]]}, {"h": "후속조치 논의 5단계", "items": [["규제 영향 식별(규정 유형·범위, 업무 프로세스 매핑)", "규정 유형과 적용 범위를 확인하고, 영향받는 업무 프로세스를 1차로 매핑함"], ["관련 부서 논의(법무·컴플라이언스, 리스크, IT, HRD, 내부감사, FGD)", "부서별로 해석·평가·시스템·교육·통제 측면을 논의하고, FGD로 교차기능 실행계획을 만듦"], ["정책·SOP 조정", "운영 SOP, 여신정책, 지배구조, 보고 체계를 새 규정에 맞게 개정함"], ["시스템·인프라 구축(전자보고, 감사추적, 신용평가, 데이터 보안)", "새 규정 이행에 필요한 시스템을 새로 만들거나 고침"], ["모니터링·평가", "정기 내부감사와 컴플라이언스 보고로 이행 여부와 규정이 운영·실적에 준 영향을 평가함"]]}, {"h": "권고 변수 4가지", "items": [["규정 유형과 영향", "업무 프로세스, 인력, IT, 지배구조에 직접 영향을 주는 조항을 찾아냄"], ["관련 부서", "권고를 받을 부서를 정하고 메모·발표·교차기능 회의로 전달함"], ["권고 형태(정책·SOP 개정, 조직 조정, 교육·인증, IT·보안)", "규정에 어떤 방식으로 대응할지 구체적인 조치 형태를 정함"], ["권고 목적(준수, 효율, 소비자보호, 지배구조·평판)", "권고가 전략목표와 법적 의무 달성으로 이어지도록 목적을 명확히 함"]]}, "권고에는 리스크 분석, 비용 추정, 이행 일정이 함께 있어야 함", "교재 예시: POJK 46/2024는 전자시스템운영자(PSE) 등록·디지털 통합과 사이버보안 기준 요구, POJK 43/2024는 주요 임직원 정기 교육·인증 요구(인건비·채용 영향)"], "tbl": null, "kb": [["warn", "PADK 48/2025(리스크관리 시행세칙) 정책 정비 완료 여부 확인 필요(기한 2026년 6월 말)"], ["ok", "POJK 35/2025: Net NPF 0.94%로 선수금(Down Payment) 0% 요건 안. 리테일 성과 확인 후 20% 한도 안에서 단계적 판단"]], "trap": ["교재가 연결한 POJK 번호와 주제(42·43·46·48/2024)는 실제 규정 제목과 대조 필요 [확인 필요]"], "qa": [["새 OJK 규정이 나오면 회사 안에서 어떤 절차로 반영합니까?", "컴플라이언스 부서가 영향받는 업무를 식별하고, 관련 부서와 논의해 정책·SOP와 시스템을 고친 뒤 이행을 모니터링합니다. 권고안에는 리스크, 비용, 일정을 함께 붙여 이사회(BOD, Directors)가 결정하도록 하겠습니다. 예를 들어 POJK 35/2025의 선수금 0%는 요건은 충족하지만 리테일 성과를 확인한 뒤 단계적으로 판단하겠습니다."]]}, {"ch": "6", "id": "Modul Q7-2 CE3 p.38~41", "t": "준수 수준 분석", "e": "Compliance Level Analysis", "imp": 2, "sem": null, "one": "OJK 보고·감사·교육·민원 데이터를 정성·정량·리스크 기반·벤치마킹 4가지 방법으로 분석해 미준수 영역과 개선 권고를 도출함.", "req": ["데이터 유형: OJK 정기보고(재무, NPL 비율, 컴플라이언스), 내·외부 감사, 교육·인증, 민원과 후속조치", {"h": "분석 방법 4가지", "items": [["정성 서술", "위반과 준수의 패턴을 서술로 정리함"], ["정량 통계(준수율·보고 추세·통제 효과)", "준수율, 보고 추세, 통제 효과를 수치로 측정함"], ["리스크 기반 분석", "미준수가 운영과 평판에 주는 영향의 크기를 기준으로 분석함"], ["벤치마킹", "산업 기준과 OJK 규정 기준에 회사 수준을 비교함"]]}, "분석 목적: 미준수 영역 식별, 정책·SOP 개선 권고, 경영 의사결정 근거, 정확·적시 보고", "산출물: 컴플라이언스 매트릭스, 감사보고서·권고, 디지털 컴플라이언스 대시보드, 후속·완화 계획", {"h": "결과 구성 6가지(PC 3.2)", "items": [["분석 목적", "일정 기간 OJK·PPATK·국세청 규정, 내부정책, GCG 준수 여부를 평가한다는 목적을 밝힘"], ["범위", "POJK·SEOJK, AML-CFT, 재무·세무 보고, 소비자보호, 내부 모니터링 등 분석 범위를 정함"], ["영역별 결과", "영역별 준수 여부를 기재함. 교재 예시는 민원 95% 5일 내 해결, 1월 부가세 신고 지연 Less Comply임"], ["성과지표", "OJK 보고 100%, STR/CTR 100% 등 지표별로 목표 대비 실적을 제시함"], ["종합 결론", "영역별 결과를 묶어 회사 전체의 준수 수준을 판정함"], ["측정 가능한 개선 권고와 지속 평가", "측정·모니터링할 수 있는 개선 권고를 내고 이후에도 계속 평가함"]]}, "PC 3.3: 부서가 권고를 접수·이해·이행했는지 확인"], "tbl": null, "kb": [["ok", "2026년 1~9월 OJK 보고 지연 0건·과태료 0건"]], "trap": ["교재 성과지표(OJK 보고 100%, 내부감사 후속조치 65% Less Comply 등)는 예시 수치임"], "qa": [["회사 컴플라이언스 수준을 무엇으로 측정합니까?", "OJK 보고 적시율, 감사 지적 후속조치 완료율, 민원 적시 해결률, AML 보고 이행률 같은 지표로 측정합니다. 이를 컴플라이언스 대시보드로 만들어 매월 이사회(BOD, Directors)에서 점검하겠습니다."]]}, {"ch": "6", "id": "Modul Q7-2 CE4 · SEOJK 15/SEOJK.05/2016 p.42~44", "t": "준수 수준 보고·배포·이행 점검", "e": "Compliance Report · Distribution · Commitment", "imp": 2, "sem": null, "one": "컴플라이언스 보고서는 컴플라이언스 이사 등의 승인을 거쳐 OJK·이사회(BOD, Directors)·감사회(BOC, Board of Commissioners) 등에 배포하고, 부서의 이행 약속을 대시보드로 모니터링함.", "req": ["PC 4.1 작성 변수: 데이터 출처, 분석 방법, 형식(요약·준수 매트릭스·갭 분석·후속계획), 이용자(경영진·부서·OJK·감사인)", "PC 4.2 보고 내용: 규정 준수(GCG, AML·CFT·PPPSPM, 소비자보호, 개인정보, 세무 등), 기능 이행, 컴플라이언스 문화, 감사 지적과 권고", {"h": "PC 4.2 승인 절차 4변수", "items": [["배포 전 승인(컴플라이언스 이사·위원회·고위 경영진, 내부감사 검증)", "보고서는 배포 전에 승인권자의 승인을 받고, 내부감사·컴플라이언스 모니터링 부서가 내용을 검증함"], ["형식·내용", "요약, 준수 매트릭스, 리스크 발견·분석, 권고·후속계획을 담고 당국 서식과 내부 기준을 따름"], ["수신 부서", "컴플라이언스·리스크·IT·HRD·법무·내부감사 등 후속 책임을 지는 부서에 전달함"], ["목적", "내부통제 효과를 높이고 의사결정 근거를 제공하며 감사·검사 지적의 후속조치를 보장함"]]}, "PC 4.3 배포 보고서: 정기 컴플라이언스 보고(월·분기·연), GCG 보고서(회계연도 말, 자가평가·시정계획 포함, 이사회 서명), 지속가능 보고서", {"h": "PC 4.4 이행 약속 모니터링", "items": [["합의 목표(완료 시점·성공지표·보고 빈도)", "후속조치 완료 시점, 성공지표, 보고 빈도를 미리 합의함. 보통 GCG 보고서의 실행계획(action plan)에 포함함"], ["관련 부서", "컴플라이언스·리스크·IT·HR·내부감사·법무 등 이행 책임 부서를 정함"], ["방법(대시보드·진척 보고·조정 회의)", "대시보드, 정기 진척 보고, 경영 검토, 조정 회의로 이행을 확인해 실행계획이 형식에 그치지 않게 함"], ["목적", "규정 이행의 효과성과 책임성을 확보하고, 장애를 찾아 해결하며, 부서 성과 평가의 근거로 씀"]]}], "tbl": null, "kb": [], "trap": ["GCG 보고 기한 자료 간 차이: Modul은 GCG 보고서 「다음 해 4월 30일, OJK 수석감독관 앞」 / A to Z는 GCG 자가평가 보고 「다음 연도 2월 15일」(POJK 28/2020) [확인 필요]", "교재는 실행계획(action plan) 근거로 SEOJK 15/SEOJK.05/2016을 인용함. POJK 48/2024 이후 하위 규정 개정 여부 [확인 필요]"], "qa": [["감사 지적 후속조치가 늦어지는 부서는 어떻게 관리합니까?", "후속조치마다 완료 시점과 성공지표를 합의하고 대시보드로 진척을 봅니다. 지연되면 부서 간 조정 회의에서 장애를 해결하고, 계속 지연되면 이사회와 감사위원회(Audit Committee)에 보고하겠습니다."]]}, {"ch": "6", "id": "Modul Q6-2 p.45~49", "t": "컴플라이언스 문화 평가 개요", "e": "Evaluating the Implementation of Compliance Culture (Budaya Kepatuhan)", "imp": 1, "sem": "감사(BOC 위원) 예시 질문 3번 「준법문화를 어떻게 평가하겠는가」 [FP메모]", "one": "컴플라이언스 문화 평가는 철학 6가지를 바탕으로 3개 역량요소·10개 수행기준으로 진행함.", "req": ["근거: SKKNI No. 143/2022", "수행 증빙 5가지: ① 비전(Vision)·미션(Mission)·가치·규범 ② 문화 이행계획과 범위 ③ 정책·프로그램 평가지표 ④ 문화 프로그램 기록(경영진 관여, 감사·후속, 재교육, 위반 제재) ⑤ 개선 권고", {"h": "철학 6가지", "items": [["내부 가치로 내재화", "구성원이 스스로 규정을 지킬 정도로 컴플라이언스를 내부 가치로 삼아야 함"], ["지속적 교육·인식", "지속적인 교육과 인식 제고가 준수의 기초이며, 결과와 함께 학습 과정도 평가함"], ["신뢰와 평판의 기둥", "컴플라이언스 문화가 회사에 대한 신뢰와 평판을 지탱함"], ["리더의 솔선수범(Leading by Example)", "리더가 먼저 규정을 지키는 모습을 보여야 문화가 자리 잡음"], ["평가를 통한 지속 개선", "문화 수준을 계속 평가하고 개선하는 과정을 반복함"], ["조직 성과의 동인", "컴플라이언스 문화를 성과 측정과 목표 달성에 연계함"]]}, {"h": "역량요소 3개", "items": [["문화 조성 파라미터 평가(1.1~1.3)", "문화의 범위·파라미터를 정하고 이행 데이터를 모아 이행 단계를 평가함"], ["이행 분석(2.1~2.3)", "이행 요인을 찾고 컴플라이언스 기능 목표와의 상관을 분석해 요인을 정리함"], ["이행 평가(3.1~3.4)", "목표 대비로 평가한 뒤 현재 여건과 미래 전망을 반영해 개선 권고를 결정함"]]}], "tbl": null, "kb": [], "trap": ["Q6 단원은 감사(BOC 위원) 관점이며, 평가 프로세스 도식 일부는 텍스트 미추출 [확인 필요]"], "qa": [["컴플라이언스 문화가 정착됐는지 무엇으로 판단합니까?", "직원이 스스로 규정을 지키는지, 리더가 모범을 보이는지, 위반 건수와 감사 결과가 개선되는지로 판단합니다. 저부터 규정을 지키고 결과를 정기적으로 평가하겠습니다."]]}, {"ch": "6", "id": "Modul Q6-2 PC 1.1·1.2 p.50~51", "t": "컴플라이언스 문화 3계층·파라미터 10", "e": "Scope & Parameters of Compliance Culture", "imp": 2, "sem": "준법문화는 내부감사, 감사위원회(Audit Committee), 내부고발(Whistleblowing), 임직원 징계, 필수 자격증, 컴플라이언스 교육을 통해 평가한다고 설명함 [시험힌트 1)]", "one": "컴플라이언스 문화는 전략·운영·개인 3계층으로 보고, 경영진 헌신부터 보상·제재 체계까지 10개 파라미터로 평가함.", "req": ["계층 ① 하가 적절하다고 설명함 [시험힌트 1)]. 감사(BOC 위원) 예시 질문 3번 「준법문화를 어떻게 평가하겠는가」 [FP메모]", "one": "경영진 헌신에서 시작해 정책·기능·교육·평가·문화·제재·개선으로 이어지는 9단계로 컴플라이언스 문화를 정착시킴.", "req": ["① 경영진 헌신: 이사회(BOD, Directors)·감사회(BOC, Board of Commissioners)의 구체적 정책·행동, 비전(Vision)·미션에 준수 원칙 통합", "② 정책 개발: Anti-Fraud, 개인정보보호, AML, KYC, 여신 승인부터 분쟁 해결까지 SOP", "③ 강한 컴플라이언스 기능: 독립 부서가 최고경영진 또는 감사회에 직접 보고, 역량 있는 팀", "④ 교육과 전파(Training and Outreach): 정기 교육, 윤리강령 전파", "⑤ 교육과 사회화(Training and Socialization)", "⑥ 정기 평가·감독: 내·외부 컴플라이언스 감사, 감사 후 신속 시정", "⑦ 조직문화 강화: 리더 솔선수범, 전 직원의 책임", "⑧ 제재와 보상: 공정·일관·비례 제재, 준수 우수 직원 보상", "⑨ 지속 개선: 규정·기술·산업 변화에 맞춘 정책 재검토, 피드백 반영"], "tbl": null, "kb": [["warn", "컴플라이언스 담당 이사 지정 여부 확인 필요"], ["warn", "교육훈련비 배정 미달(2.3%)로 2026년 3월 서면 경고 → 수정 RBB 제출로 조치 완료"]], "trap": ["교재상 9단계지만 4·5단계 내용이 중복 기재됨"], "qa": [["신임 대표이사(President Director)로서 컴플라이언스 문화를 강화하려고 처음 할 일은 무엇입니까?", "세 가지로 말씀드리겠습니다. 첫째, 이사회가 준수 원칙을 공식 정책으로 확인하고 제가 먼저 지키겠습니다. 둘째, 컴플라이언스 기능이 감사회에 직접 보고할 수 있게 독립성을 보장하겠습니다. 셋째, 교육훈련비를 인건비의 2.5% 이상 배정해 정기 교육을 하겠습니다."]]}, {"ch": "6", "id": "Modul Q6-2 CE2·CE3 p.52~58", "t": "컴플라이언스 문화 이행 요인과 평가", "e": "Factors for implementing a compliance culture · Evaluation", "imp": 1, "sem": null, "one": "이행 요인 8가지를 설문·상관 분석으로 점검하고, 10요소 평가 프로세스로 개선 권고를 도출함.", "req": [{"h": "이행 요인 8가지(PC 2.1)", "items": [["최고경영진 리더십·모범", "최고경영진이 규정 준수에 앞장서고 모범을 보이는 정도임"], ["규정 이해·전파", "임직원이 규정을 이해하고 신규 규정이 제때 전파되는 정도임"], ["GRC(Governance, Risk, Compliance) 통합", "지배구조·리스크관리·컴플라이언스 업무를 하나의 체계로 연결해 운영하는 정도임"], ["조직 역량·구조", "컴플라이언스 업무를 맡을 조직 구조와 인력 역량을 갖춘 정도임"], ["명확한 시스템·절차", "SOP와 업무 시스템이 명확하고 일관되게 정해진 정도임"], ["정기 평가·검토", "컴플라이언스 수준을 정기적으로 평가·검토하는 정도임"], ["지속적 소통·교육", "규정과 윤리에 대한 소통과 교육이 꾸준히 이루어지는 정도임"], ["리스크 예방·완화", "컴플라이언스 리스크를 미리 막고 줄이는 활동이 작동하는 정도임"]]}, "상관 분석(PC 2.2): 내부 설문으로 인식을 측정하고 피어슨 상관(Pearson correlation)으로 변수 관계 분석", "요인 정리 질문(PC 2.3): 경영진 모범, SOP의 명확성·정기 검토, 규정 이해·갱신 방법, 컴플라이언스 감사 결과", "개선 방향(PC 3.1~3.3): 인력 역량 강화, 조직 재구조화, 내부정책 조화, 감사·감독을 통한 정기 평가, 금융이해력·소비자보호 강화", {"h": "평가 프로세스 10요소(PC 3.4)", "items": [["정책·절차 평가", "정책·절차가 문서화되어 있고 규정에 맞는지 평가함"], ["준수 수준 분석", "내부감사 결과와 성과지표로 준수 수준을 분석함"], ["설문·피드백", "임직원·이해관계자 설문과 피드백으로 인식 수준을 확인함"], ["리더십 헌신 평가", "리더십과 경영진의 헌신 정도를 평가함"], ["전파·재교육·교육", "규정 전파, 재교육, 교육이 충분했는지 점검함"], ["기술·지원 시스템", "컴플라이언스를 지원하는 기술과 시스템이 갖춰졌는지 점검함"], ["위반 처리·제재", "위반이 규정에 따라 처리되고 제재가 부과됐는지 점검함"], ["외부 조정·권고", "외부감사인·컨설턴트·당국과 조정하고 그 권고를 반영함"], ["보고와 개선", "평가 결과를 보고하고 개선 조치로 연결함"], ["모니터링·후속조치", "개선 조치의 이행을 모니터링하고 후속조치를 함"]]}], "tbl": null, "kb": [], "trap": ["교재 도식 일부 미추출 [확인 필요]"], "qa": [["컴플라이언스 문화 평가 결과를 어떻게 개선으로 연결합니까?", "설문과 감사 결과로 약한 요인을 찾고, 교육·정책 조정·조직 보완 같은 개선 과제마다 담당자와 기한을 정합니다. 진척은 이사회(BOD, Directors)에서 점검하고 감사회(BOC, Board of Commissioners)에 보고하겠습니다."]]}, {"ch": "7", "id": "POJK 12/2024 / A to Z S.45~48 / Modul Q7-4 p.112~115", "t": "부정방지 전략 정의와 적용", "e": "Anti-Fraud Strategy (Strategi Anti-Fraud) · Fraud Triangle", "imp": 3, "sem": "강사가 「most important」「memorize」라고 반복 강조함. OJK 검사가 Anti-Fraud 전략부터 확인할 수 있다고 설명함 [강의정리 1.6]", "one": "부정방지 전략(Anti-Fraud Strategy)은 부정 발생 과정과 가능성을 종합 고려해 설계하고 부정통제(Fraud Control)체계로 이행하는 회사 전략이며, 근거는 POJK 12/2024임.", "req": ["근거: POJK 12/2024(금융서비스기관 부정방지 전략 이행). 금융회사는 2024년 10월 23일부터 적용", "부정(Fraud) 정의: 회사·소비자·제3자를 속이거나 조작하려는 고의적 일탈·누락으로, 손실을 주거나 행위자·제3자가 직간접 이익을 얻는 행위", "적용 범위: 고객·내부·기타 당사자 포함. 온라인 도박, 허위 온라인 투자 등 온라인 사기, 온라인 성매매, 기타 경제범죄에 회사 업무가 이용되지 않도록 예방·처리", {"h": "부정 삼각형(Fraud Triangle) 3요소", "items": [["압박(Pressure)", "재정 문제나 실적 부담처럼 개인을 부정행위로 몰아가는 동기임"], ["합리화(Rationalization)", "부정을 저지르는 사람이 자기 행위를 정당하다고 스스로 납득하는 심리임"], ["기회(Opportunity, 주로 약한 내부통제에서 발생)", "통제가 약해 부정을 저질러도 드러나지 않을 여건이며, 동기가 없던 사람도 유혹할 수 있음"]]}, "철학: 예방이 치료보다 낫다(Prevention is better than cure). 모든 업무 프로세스에 무결성·투명성·책임성 문화", {"h": "역량요소 2개·수행기준 5개", "items": [["전략 개발(1.1 활동 개발 1.2 전파)", "규정·절차에 따라 부정방지 전략 활동을 개발하고 관계자에게 전파함"], ["전략 평가(2.1 정기 모니터링 2.2 평가 2.3 후속조치)", "전략 이행을 정기적으로 모니터링하고 그 결과로 평가한 뒤 후속조치를 함"]], "tail": "수행 증빙은 전략 포트폴리오와 평가 포트폴리오"}], "tbl": null, "kb": [["ok", "신규 고객 100% 명단 대조에 온라인도박 포함"], ["ok", "2026년 6~7월 부정 사고·손실 없음, 분기 보고"]], "trap": ["Fraud Triangle(원인 3요소), 4대 축(전략 구성), 부정통제 4요소(통제 체계)는 서로 다른 목록임"], "qa": [["부정방지 전략의 근거 규정과 기본 개념을 말씀해 주십시오.", "근거는 POJK 12/2024이고, 압박·합리화·기회라는 부정 발생 원인을 고려해 예방부터 후속조치까지 체계로 운영하는 전략입니다. 그중 기회는 약한 내부통제(Internal Control)에서 생기므로 업무 분리와 불시 점검(Surprise Audits)으로 줄이겠습니다."]]}, {"ch": "7", "id": "POJK 12/2024 / A to Z S.45 / Modul Q7-4 PC 1.1 p.116", "t": "부정 행위 5대 분류", "e": "Types of Fraud Actions (Corruption · Asset Misappropriation · Financial Reporting Fraud · Leakage of Confidential Information · Other Acts Equated with Fraud)", "imp": 2, "sem": null, "one": "부정 행위는 부패, 자산 유용, 재무보고 부정, 기밀정보 유출, 기타 준하는 행위 5개 대분류로 기억함.", "req": ["① 부패(Corruption): 회사·소비자에 손해를 주는 이해상충, 뇌물(Bribery), 불법 수수(Illegal receipts), 갈취(Extortion)", "② 자산 유용(Asset Misappropriation): 현금, 재고, 기타 자산", "③ 재무보고 부정(Financial Reporting Fraud): 순자산·순이익 과대계상·과소계상", "④ 기밀정보 유출(Leakage of Confidential Information)", "⑤ 기타 부정에 준하는 행위(Other Acts Equated with Fraud)"], "tbl": null, "kb": [["ok", "2026년 6~7월 부정 사고·손실 없음"]], "trap": ["Modul 제목은 「10 Types of Actions Classified as Fraud」이나 도식상 개수 기준이 모호함. 대분류 5개로 기억하는 편이 안전함 [확인 필요]", "재무보고 부정은 POJK 42/2025(재무보고 무결성)와도 연결됨"], "qa": [["금융회사에서 생길 수 있는 부정 유형과 대응은 무엇입니까?", "부패, 자산 유용, 재무보고 부정, 기밀정보 유출, 기타 준하는 행위 다섯 가지로 분류됩니다. 업무 분리와 불시 점검(Surprise Audits), 내부고발(Whistleblowing) 채널로 예방(Prevention)하고 적발(Detection)하겠습니다."]]}, {"ch": "7", "id": "POJK 12/2024 / A to Z S.47 / Modul Q7-4 PC 1.2 p.119~122", "t": "부정방지 전략 4대 축과 세부 수단", "e": "Four Pillars: Prevention · Detection · Investigation, Reporting and Sanctions · Monitoring, Evaluation and Follow-up", "imp": 3, "sem": "4대 요소(P·D·I·M)를 반드시 외우라고 함 [강의정리 1.6, 2.2] [시험힌트 5)]. 부정 후 「내부통제(Internal Control)를 강화하겠다」만 말하면 부족하며 누가·무엇을·언제까지·어떤 지표로 개선할지 말해야 함 [시험힌트 Q7]", "one": "부정방지 전략(Anti-Fraud Strategy)은 예방, 탐지, 조사·보고·제재, 모니터링·평가·후속조치 4대 축으로 운영함.", "req": [{"h": "① 예방(Prevention)", "items": [["부정방지 인식(선언·직원·소비자 프로그램)", "부정방지 선언을 작성·전파하고, 직원 대상 부정방지 문화·인식 프로그램과 소비자 대상 부정 인식 프로그램을 운영함"], ["취약성 식별", "교육·지식 부족, 불명확한 정책·절차, 부적정한 재무통제 등 부정이 생길 수 있는 약점을 미리 식별함"], ["직원 확인 정책(Know Your Employee)", "적정 자격 기준으로 채용하고, 직원의 성격·무결성·태도·행동·생활방식을 파악해 계속 모니터링함"]]}, {"h": "② 탐지(Detection)", "items": [["내부고발 정책·체계(Whistleblowing, 제보자 보호·보고 규정·후속 체계)", "제보자를 보호하고 부정 보고 규정과 보고·후속 처리 체계를 갖춰 내부 제보가 실제 조사로 이어지게 함"], ["불시 점검(Surprise Audits)", "예고 없이 업무를 점검해 직원이 업무를 수행할 때 경각심을 갖도록 함"], ["감시 체계(비공개 시험·검사)", "대상자 모르게 비공개 시험·검사를 하여 부정방지 정책의 효과를 점검하며, 독립 기관이나 내부 인력이 정기 또는 수시로 수행함"]]}, {"h": "③ 조사·보고·제재", "items": [["독립성·역량 있는 조사 권한자 지정과 비밀 유지", "독립성과 역량을 고려해 조사 권한자를 정하고, 정보 비밀을 지키면서 탐지 결과를 후속 조사함"], ["내부·OJK 보고", "조사 결과를 회사 내부 보고 라인과 OJK에 정해진 체계에 따라 보고함"], ["제재 정책(위반별 유형·부과 절차·권한자, 공정·투명·일관)", "위반별 제재 유형, 부과 절차, 제재 권한자를 정책에 정하고 공정·투명·일관되게 적용해 억지 효과를 내야 함"]]}, {"h": "④ 모니터링·평가·후속조치", "items": [["후속조치 모니터링", "내부 규정과 법령에 따라 부정 사건의 후속조치가 이행되는지 계속 확인함"], ["사건 데이터 유지와 약점·원인 분석", "부정 사건 데이터를 보관하고 약점과 원인을 찾아 완화·개선 방안을 마련하며, 평가 결과를 직원과 공유함"], ["내부통제 강화 체계", "평가에서 드러난 약점을 고치고 내부통제(Internal Control)를 강화하는 체계를 마련함"]]}, "취약성 예시: 교육·지식 부족, 과도한 리스크 감수를 보상하는 문화, 불명확한 정책·절차, 부적정한 재무통제, 이사회(BOD, Directors)·감사회(BOC, Board of Commissioners) 지시 부족", "강의 보충: 예방에 KYE·리스크 등록부·RCSA, 탐지에 추심원·조사원 이상징후 모니터링, 조사에 SLA 내 보고·판정 회의, 모니터링에 PDCA·SMART 대응책·서면 이행 서약 [강의정리 1.6]"], "tbl": null, "kb": [["ok", "내부고발: 핫라인·이메일·웹, 익명, 5영업일 내 분류·60일 내 종결"], ["ok", "Anti-Fraud 교육 2개월마다 전 직원 대상"], ["ok", "2026년 6~7월 부정 사고·손실 없음, 분기 보고"], ["ok", "내규 Pedoman Anti Fraud 297(2024-12-02, 감사회 승인)이 4대 축과 OJK 보고 양식(부속서 II·III)을 반영함 [내규 대조 2026-10-11]"], ["warn", "내부고발 규정(009/2022)이 폐지된 근거(POJK 35/2018 Anti-Fraud 장)를 인용하고, 익명 제보 기준이 행동강령(2025)과 서로 다르며, 사실로 입증된 제보만 보호함 [내규 대조 2026-10-11]"]], "trap": ["세 번째 축은 조사·보고·제재가 하나의 축임. 순서와 이름을 정확히 말할 것", "SMART = Specific·Measurable·Achievable·Relevant·Timeframe(강의 표현)"], "qa": [["부정방지 전략 4대 축을 회사에서 어떻게 운영합니까?", "예방, 탐지, 조사·보고·제재, 모니터링·평가·후속조치 네 축입니다. KBBF는 2개월마다 전 직원 교육을 하고, 익명 내부고발을 5영업일 내 분류·60일 내 종결 기준으로 운영합니다. 사건이 생기면 담당자·기한·지표를 정한 대응책과 서면 서약까지 받아 후속조치를 확인하겠습니다."], ["내부고발제도의 핵심 요소는 무엇입니까?", "제보자 보호, 보고 규정, 보고 이후 처리 체계  이상)"], ["ok", "2026년 6~7월 부정 사고·손실 없음, 분기 보고"], ["warn", "내규가 부정방지 전담 부서와 담당 임원 지정을 섞어 써서 상설 부서인지 겸직 지정인지 분명하지 않음 [확인 필요] [내규 대조 2026-10-11]"], ["warn", "취약성 식별을 내부감사부에 맡기고 주기를 적지 않음(구판은 연 1회) [내규 대조 2026-10-11]"]], "trap": ["교육 기준은 최소 연 1회", "외주업체 과실로 소비자 손실이 생겨도 회사가 책임짐"], "qa": [["조직 구조와 기능은 어떻게 배치하시겠습니까?", "영업·심사·채권관리와 함께 리스크관리, 컴플라이언스, 내부감사(Internal Audit)를 두고, AML·CFT 기능, 부정방지 기능, 소비자보호 기능을 별도로 갖추겠습니다. 부정방지 기능은 이사회에 책임지면서 감사회에 직접 보고할 수 있게 하고, AML·CFT 담당자는 대표이사(President Director)에게 직접 보고하도록 지정하겠습니다."], ["대리점이나 외주 직원의 부정으로 소비자가 손실을 보면 누가 책임집니까?", "POJK 12/2024에 따라 회사가 책임집니다. 외주업체 계약에 부정방지 의무를 넣고 정기 점검하겠습니다."]]}, {"ch": "7", "id": "POJK 12/2024 / Modul Q7-4 CE2 p.124~126", "t": "부정방지 전략 모니터링·평가", "e": "Monitoring, Evaluation and Follow-up · Anti-Fraud Strategy", "imp": 2, "sem": "감사회(BOC, Board of Commissioners)의 Anti-Fraud 감독 확인 사항은 정책·SOP, 이행 보고, 리스크감시위원회(Risk Monitoring Committee) 회의록, 보고 채널, 부정 추이와 시정조치임 [시험힌트 6)]. Anti-Fraud는 문서 작성으로 끝나지 않고 서약과 후속조치까지 있어야 함 [강의정리 2.5]", "one": "부정방지 전략(Anti-Fraud Strategy)의 효과성은 모니터링 4방법과 평가 4방법으로 점검하고, 6요소 실행계획으로 후속조치함.", "req": [{"h": "모니터링 방법 4가지", "items": [["관찰", "부서의 운영 프로세스를 현장에서 직접 검토함"], ["인터뷰", "직원과 면담해 부정방지에 대한 이해와 인식 수준을 파악함"], ["문서 검토(정책, fraud log, SOP, 교육 증빙)", "정책, 부정 기록(fraud log), SOP, 교육 증빙 문서를 확인해 이행 여부를 점검함"], ["시스템 검증(조기탐지·상향보고)", "조기탐지·상향보고 시스템이 실제로 작동하는지 시험함"]]}, "지원 도구: 축별 체크리스트, 부정 리스크 지표·탐지(Detection) 대시보드, 내부고발(Whistleblowing)·익명 보고 기록", {"h": "평가 지표", "items": [["예방(Prevention)", "교육 빈도, 전파 실적, SOP·정책 구비 여부로 예방 수준을 평가함"], ["탐지", "조기 탐지 건수와 대응 시간으로 탐지 효과를 평가함"], ["조사·제재", "조사 절차, 경영진 관여 정도, 제재 일관성으로 조사·제재 운영을 평가함"], ["모니터링", "모니터링 빈도, 후속조치 효과, OJK 보고 이행으로 모니터링 수준을 평가함"]]}, {"h": "평가 방법 4가지", "items": [["근본원인분석(RCA, Root Cause Analysis)", "발생한 부정 사건의 근본 원인을 찾아 같은 사건이 다시 생기지 않도록 개선 방안을 도출함"], ["COSO/ERM 기반 통제 효과성", "COSO·ERM 모형을 기준으로 내부통제가 효과적으로 작동하는지 평가함"], ["직원 설문 기반 문화 평가", "직원 설문으로 회사의 부정방지 문화 수준을 측정함"], ["SWOT/GAP 분석", "현 부정방지 전략의 강점·약점과 목표 수준 대비 차이를 분석함"]]}, "평가 산출물 3가지: ① 축별 평가 보고서 ② 효과성 점수·성숙도 ③ 강화·개정 권고", "실행계획 6요소: 발견사항(Findings), 리스크, 실행계획(Action Plan), 담당(PIC), 기한(Deadline), 성공 지표(Indicator)", "이행은 컴플라이언스·감사 부서 감독 아래 진행하고, 미이행 사항은 리스크감시위원회 또는 이사회(BOD, Directors)에 보고"], "tbl": null, "kb": [], "trap": ["Q6 부정방지 전략 모니터링 단원(Modul p.130~149)은 미독 [확인 필요]"], "qa": [["부정방지 전략이 효과적인지 어떻게 평가합니까?", "관찰, 인터뷰, 문서 검토, 시스템 검증으로 모니터링하고, 사건 원인 분석과 직원 설문으로 평가합니다. 발견사항마다 담당자, 기한, 성공 지표를 정하고, 미이행 사항은 리스크감시위원회에 보고하겠습니다."]]}, {"ch": "7", "id": "POJK 12/2024 / A to Z S.46 / Modul Q7-4 p.127~128", "t": "부정방지 OJK 보고 의무와 기한", "e": "Anti-Fraud Strategy Implementation Report", "imp": 3, "sem": "Anti-Fraud 보고 기한은 전략 변경 7영업일, 연차 이행보고 1월 31일 [W4 §6, 자체 학습자료]. 중대 부정 보고는 멀티파이낸스 기준 인지 후 3영업일로 정정함(POJK 12/2024 제15조 원문, 2026-10-11 확인)", "one": "멀티파이낸스는 부정방지 전략(Anti-Fraud Strategy) 변경을 7영업일, 중대 부정 사건을 인지 후 3영업일 안에 보고하고, 연차 이행 보고서는 다음 해 1월 31일까지 OJK에 제출함.", "req": ["중대 영향 부정 기준 3가지: ① 행위자의 법령 중대 위반 ② 회사 사업 연속성 위협 ③ 공중의 관심을 끌거나 평판을 해칠 가능성", "이행 보고서 구성: ① 전략 이행 진척 ② 부정 사건 데이터(발생 부서, 행위자·당시 직위, 피해자, 발생 시점, 손실액, 유형, 원인, 수법, 처리 조치, 재발방지 조치, 장소 등)", "내부 보고 수신자: 이사회(BOD, Directors), 감사회(BOC, Board of Commissioners)·리스크감시위원회(Risk Monitoring Committee), OJK(요청 또는 정기)", "내부 보고 빈도: 모니터링 보고(연간·수시), 전략 평가(연간), 후속조치(분기), OJK 보고(규정에 따름)"], "tbl": {"h": ["보고", "기한", "부속서"], "r": [["부정방지 전략(최초)", "시행 후 3개월 이내(멀티파이낸스·은행·보험). 연기금·벤처캐피탈 등은 6개월", "부속서 I"], ["부정방지 전략 변경", "변경 후 7영업일 이내", "부속서 I"], ["이행 보고서(또는 정정)", "매년 12월 말 기준, 다음 해 1월 31일까지(최초 2025년 1월 31일). 정정은 15영업일", "부속서 II"], ["중대 영향 부정 사건", "인지 후 3영업일 이내(멀티파이낸스·은행·보험). 연기금·벤처캐피탈·전당포 등은 6영업일", "부속서 III"]]}, "kb": [["ok", "2026년 1~9월 OJK 보고 지연 0건(Taskboard 관리)"], ["ok", "부정 사건 현황 분기 보고"], ["warn", "내규(Pedoman Anti Fraud 297/2024)는 3영업일만 적고 「인지 후」 기산점, 중대 부정 정성 기준 3가지, 1월 31일·7영업일·15영업일 기한이 빠짐 → 개정 필요 [내규 대조 2026-10-11]"]], "trap": ["중대 부정 보고 기한은 업권마다 다름. 멀티파이낸스는 인지 후 3영업일이고, 6영업일은 연기금·벤처캐피탈·전당포 등에 적용됨 [2026-10-11 원문 확인]", "최초 전략 제출도 멀티파이낸스는 시행 후 3개월, 그 밖의 일부 금융기관은 6개월임", "전략 변경 7영업일과 중대 부정 3영업일을 혼동하지 않음", "보고 정정·갱신은 15영업일 내(제18조)"], "qa": [["중대 부정 사건을 발견하면 OJK에 언제까지 보고합니까?", "멀티파이낸스는 중대 부정 사건을 안 날부터 3영업일 안에 보고합니다. 중대 영향 여부는 법령 중대 위반, 사업 연속성 위협, 평판 훼손 가능성으로 판단하며, 연차 이행 보고서는 다음 해 1월 31일까지 제출합니다."]]}, {"ch": "7", "id": "POJK 12/2024 제3조~제21조 / Modul Q7-4 p.128~129", "t": "부정방지 의무 위반 제재", "e": "Administrative sanctions (POJK 12/2024)", "imp": 2, "sem": null, "one": "부정방지 의무를 어기면 서면경고·벌금·영업 제한이 부과되고, 이사회(BOD, Directors)·감사회(BOC, Board of Commissioners) 감독 실패는 주요 당사자 지정 금지로 이어질 수 있음.", "req": ["전략 미수립·지침 부재·부적정 이행(제3조(1)(4)): 서면경고, 벌금, 신규 활동 금지, 영업 제한·정지", "이사회·감사회의 효과적 이행 보장 증빙 없음(제3조(2)): 서면경고, 주요 당사자(Primary Party) 지정 금지", "전략·지침·업무계획이 회사 여건과 맞지 않음(제4조): 서면경고, 벌금, 정지까지", "리스크관리 이행 부적정·미문서화(제6조): 경고, 리스크관리 POJK에 따른 벌금", "교육·전파 연 1회 미만 또는 대상 부적정(제7조): 서면경고, 위반 지속 시 주요 당사자 금지", "전담 부서 미설치·책임 불명확·역량 미충족(제8조): 서면경고, 추가 제재", "보고 미제출·지연·부정확(제10~16조): 경고, 일일 지연 벌금(보고서당 IDR 150만~3,000만), 입력 오류 건당 IDR 1만~5만", "불가항력 연기 미통지(제17조), 정정 15영업일 내 미이행(제18조), 보고 매체 절차 미준수(제19조): 서면경고 등"], "tbl": null, "kb": [], "trap": ["교재 금액 표기(「IDR 1.5–30 million/report」)는 원문 대조 필요 [확인 필요]"], "qa": [["부정방지 의무를 위반하면 이사 개인에게 어떤 제재가 가능합니까?", "이사회와 감사회가 효과적 이행을 보장한 증빙이 없거나 교육 의무를 계속 어기면 주요 당사자 지정 금지까지 가능합니다. 그래서 이사회 감독 내용을 회의록과 보고서로 남기겠습니다."]]}, {"ch": "7", "id": "POJK 28/2024 / A to Z S.47 / Modul Q7-4 p.123", "t": "SIPELAKU 부정행위자 이력정보", "e": "SIPELAKU (Sistem Informasi Pelaku di Sektor Jasa Keuangan)", "imp": 2, "sem": "강사 제시 F&P 질문 12번 기본 지식 목록에 SIPELAKU가 포함됨 [FP메모 12번]", "one": "SIPELAKU는 부정행위자 이력을 기록하는 OJK 정보시스템이며, 이용 회사는 Anti-Fraud 보고 이행·기밀 보호·연 1회 이상 내부감사(Internal Audit) 의무를 짐.", "req": ["목적: 금융서비스부문 무결성 제고와 부정 예방(Prevention). 행위자(Perpetrator)는 부정을 저지른 개인·법인, 이용자는 LJK 또는 OJK 승인자", "이용 목적: 채용 결정, 잠재 소비자·파트너 프로파일링, 리스크관리", "접근 요건: OJK 전자 등록, 부정방지 전략(Anti-Fraud Strategy) 보고", "이용자 의무 5가지: a. POJK 12/2024 Anti-Fraud 보고 이행 b. SIPELAKU 정책·절차 보유·이행 c. 취득부터 폐기까지 기밀 보호 d. 접근권 보유자 변경 보고 e. 이용 내부감사 연 1회 이상", "금지 2가지: ① 판단기준 외 목적의 접근·이용 ② 정한 자 외의 자에게 이력정보(가공 결과 포함) 배포", "접근 비활성화: 위반, 데이터 유출, 부정방지 미준수", "제재: 서면경고 및/또는 최대 IDR 60억 벌금(Modul)"], "tbl": null, "kb": [["ok", "내규 002/PKO-RISK/I/2025 운영(접근권자 변경 7영업일 보고, 연 1회 내부감사) [내규 대조 2026-10-11]"], ["warn", "채용·제휴 선정 때 SIPELAKU를 조회하도록 연결한 조항이 없음 [내규 대조 2026-10-11]"]], "trap": ["철자: SIPELAKU(Pelaku = 행위자). 근거는 POJK 28/2024로 POJK 12/2024와 번호를 혼동하지 말 것", "벌금 금액(최대 IDR 60억)은 Modul 기재이며 A to Z는 「서면경고·과징금(administrative fines)」으로만 기재 [확인 필요]"], "qa": [["채용할 때 부정 이력은 어떻게 확인합니까?", "POJK 28/2024에 따라 SIPELAKU로 부정행위자 이력을 조회할 수 있고, 이를 위해 부정방지 보고 의무를 지키고 정보는 기밀로 관리해야 합니다. 채용과 파트너 선정 절차에 조회를 넣고, 이용 내역은 매년 내부감사로 점검하겠습니다."]]}, {"ch": "7", "id": "Modul Q7-5 p.150~154 · IIA IPPF", "t": "내부감사 지적사항 후속조치", "e": "Monitoring the Follow-up Results of Internal Audit Findings (Tindak Lanjut Audit Internal)", "imp": 3, "sem": "내부감사는 대표이사(President Director)에게 보고하고 독립감사(독립 커미셔너)·감사위원회(Audit Committee)에 점선 보고 가능. 지적은 심각도·영향·발생 가능성·긴급성으로 우선순위화하고, 후속계획에 일정·담당자·기한·자원·KPI·대시보드를 넣음. 재발 방지에 소책자·교육·재감사·경고장·상여 삭감. 내부감사를 「policeman」으로 보지 말라고 함 [강의정리 1.10, 4.7]. LSPPI 인터뷰 5번 「감사위원회의 역할」 실제 출제 [LSPPI질의 5번]", "one": "내부감사(Internal Audit) 후속조치는 피감사부서 약속 대비 이행 적정성을 분석·전달·보고·문서화하고, 감사 기능의 품질개선 프로그램을 평가하는 일임.", "req": ["철학: 지속적 품질개선, 책임성, 기준·규정 준수. 효과적 내부감사는 a. 재발 방지 시정·예방(Prevention)조치 b. 부가가치·경쟁력을 높이는 개선 권고를 강조", {"h": "기본 원칙 5가지", "items": [["책임성(Accountability)", "피감사부서와 감사 기능이 지적사항 이행 결과에 대해 책임을 지도록 함"], ["준수(Compliance)", "후속조치가 내부 기준과 관련 법령·규정에 맞게 이행되도록 함"], ["리스크 기반 지속 개선", "리스크가 큰 지적사항을 우선 관리하면서 감사 품질을 계속 개선함"], ["효과성·효율성", "후속조치가 실제로 문제를 해결하는지와 자원을 적정하게 쓰는지를 함께 점검함"], ["협업(Collaboration)", "감사 부서와 피감사부서가 함께 시정 해법을 찾고 후속계획을 조정함"]]}, {"h": "이론 개념 4가지", "items": [["내부통제(Internal Control)체계", "후속조치를 내부통제 약점을 보완하는 과정으로 보고 통제체계 관점에서 평가함"], ["리스크관리", "지적사항의 리스크 크기에 따라 우선순위를 정하고 관리함"], ["지속가능성", "시정·예방조치가 재발 방지로 이어지고 개선 효과가 계속 유지되게 함"], ["지배구조(Corporate Governance)·책임성", "후속조치 결과를 관계자에게 서면 보고해 감독과 책임 소재를 분명히 함"]]}, "역량요소 1 후속조치 평가: 1.1 피감사부서 약속 대비 이행 적정성·장애 분석 1.2 피감사부서에 전달·후속계획 조정 1.3 관계자 서면 보고 1.4 모니터링 보고서 문서화", "역량요소 2 품질개선 프로그램 평가: 2.1 계획대로 이행되는지 분석 2.2 평가 보고서 작성 2.3 문서화", "지식 기준: IIA 국제내부감사직무수행체계(IPPF). 수행 증   h+=`<div class="one">${c.one}</div>`;
  if(c.req&&c.req.length) h+=`<section><h3>기준</h3><ol class="req">${c.req.map(reqItem).join('')}</ol></section>`;
  if(c.tbl) h+=`<section><h3>표로 보기</h3><div class="tbl"><table><thead><tr>${c.tbl.h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${c.tbl.r.map(r=>`<tr>${r.map((x,j)=>`<td>${j===0?x:H(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;
  if(c.kb&&c.kb.length) h+=`<section><h3>KBBF 현재</h3><ul class="kb">${c.kb.map(k=>`<li><span class="st ${k[0]}">${k[0]==='ok'?'충족·양호':k[0]==='warn'?'과제·확인':'해당 없음'}</span><span>${k[1]}</span></li>`).join('')}</ul></section>`;
  if(c.trap&&c.trap.length) h+=`<section><h3>헷갈리는 점</h3><div class="trap"><ul>${c.trap.map(t=>`<li>${t}</li>`).join('')}</ul></div></section>`;
  if(c.qa&&c.qa.length) h+=`<section><h3>OJK가 물어볼 만한 질문 · 눌러서 답변 보기</h3><div class="qa">${c.qa.map(q=>`<details><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join('')}<button type="button" class="all" id="openAll">답변 모두 펼치기</button></div></section>`;
  h+=`</article>`;
  mainEl.innerHTML=h; mainEl.scrollTop=0;
  mainEl.querySelectorAll('.hide').forEach(e=>e.addEventListener('click',()=>e.classList.toggle('show')));
  const oa=document.getElementById('openAll'); if(oa) oa.addEventListener('click',()=>{const ds=mainEl.querySelectorAll('.qa details');const open=![...ds].every(d=>d.open);ds.forEach(d=>d.open=open);});
}
function render(){ drawList(); drawCard(); const on=listEl.querySelector('.on'); if(on) on.scrollIntoView({block:'nearest'}); }
function ensureSel(){ const v=visible(); if(v.length&&!v.includes(sel)) sel=v[0]; }
function move(d){ const v=visible(); if(!v.length) return; let k=v.indexOf(sel); k=k<0?0:Math.max(0,Math.min(v.length-1,k+d)); sel=v[k]; render(); }
document.querySelectorAll('.tools [data-f]').forEach(b=>b.addEventListener('click',()=>{filt=b.dataset.f; try{localStorage.setItem('ojkNoteFilt',filt)}catch(e){} ensureSel(); render();}));
memBtn.addEventListener('click',()=>{mem=!mem; try{localStorage.setItem('ojkNoteMem',mem?'1':'0')}catch(e){} render();});
qEl.addEventListener('input',()=>{qtext=qEl.value.trim().toLowerCase(); ensureSel(); render();});
document.addEventListener('keydown',e=>{
  if(e.target===qEl){ if(e.key==='Escape'){qEl.value='';qtext='';qEl.blur();render();} else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();move(e.key==='ArrowDown'?1:-1);} return; }
  if(e.target.closest&&e.target.closest('summary')&&(e.key===' '||e.key==='Enter')) return;
  if(e.key==='ArrowDown'){e.preventDefault();move(1);}
  else if(e.key==='ArrowUp'){e.preventDefault();move(-1);}
  else if(e.key==='h'||e.key==='H'||e.key==='ㅗ'){memBtn.click();}
  else if(e.key==='/'){e.preventDefault();qEl.focus();}
});
ensureSel(); render();
</script>
</body></html>
