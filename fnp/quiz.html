가 없습니다. 금융리스는 투자·다목적금융에 씁니다.", "choices": ["금융리스", "세일앤리스백", "할부구매", "팩토링"], "correct": 0, "memo": "금융리스 = 투자·다목적, 세일앤리스백 = 투자·운전자금, 할부구매 = 셋 모두."}, {"id": "q-2-05", "ch": "2", "card": "사업활동 3대 유형과 대면 요건", "imp": 3, "sem": true, "type": "short", "q": "3대 유형 중 원칙적으로 물리적 대면이 필수(Mandatory Face-to-Face Physically)인 것은 무엇이며, 나머지는 어떻습니까?", "a": "투자금융(Investment Financing)은 원칙적으로 대면이 필수(예외 있음)이고, 운전자금·다목적금융은 대면 또는 비대면(without face-to-face) 모두 가능합니다.", "key": ["투자금융", "대면 필수", "운전자금·다목적", "비대면"]}, {"id": "q-2-06", "ch": "2", "card": "할부구매와 금융계약 명칭", "imp": 3, "sem": true, "type": "num", "q": "할부구매(Purchase with Installment Payments) 흐름은 몇 단계입니까?", "a": "7단계입니다: 재화 선택·선수금(Down Payment) → 신청 → 승인 → 공급자 잔금 지급 → 인도 → 인수증 제출 → 할부 납부.", "accept": ["7", "7단계"], "unit": "단계"}, {"id": "q-2-07", "ch": "2", "card": "할부구매와 금융계약 명칭", "imp": 3, "sem": true, "type": "mc", "q": "할부구매의 영문 명칭으로 말해야 하는 것은?", "a": "Purchase with Installment Payments로 말합니다. hire purchase, buy on installment는 쓰지 않습니다.", "choices": ["Purchase with Installment Payments", "Hire Purchase", "Buy on Installment", "Installment Lease"], "correct": 0}, {"id": "q-2-08", "ch": "2", "card": "할부구매와 금융계약 명칭", "imp": 3, "sem": true, "type": "short", "q": "할부구매(Purchase with Installment Payments)와 금융리스(Finance Lease)의 소유권 차이를 말해 보세요.", "a": "할부구매는 약정에 따라 소유권이 차주에게 이전되고, 금융리스는 약정 기간 동안 MFC가 소유권을 보유합니다.", "key": ["할부구매 차주 이전", "금융리스 MFC 보유"]}, {"id": "q-2-09", "ch": "2", "card": "팩토링(상환청구권 유무)", "imp": 2, "sem": true, "type": "short", "q": "상환청구권부 팩토링(Factoring With Recourse)과 상환청구권 없는 팩토링(Factoring Without Recourse)의 위험 부담 주체는 각각 누구입니까?", "a": "상환청구권부는 채권 매도인이 미회수 위험을 지고, 상환청구권 없는 팩토링은 MFC가 매입 채권 전부의 미회수 위험을 집니다.", "key": ["매도인", "MFC"]}, {"id": "q-2-10", "ch": "2", "card": "금융리스·세일앤리스백", "imp": 2, "sem": true, "type": "cloze", "q": "금융리스(Finance Lease)는 「___」·「___」금융에, 세일앤리스백(Sale and Lease Back)은 투자·「___」금융에 씁니다.", "a": "금융리스는 투자·다목적, 세일앤리스백은 투자·운전자금금융에 씁니다.", "blanks": ["투자", "다목적", "운전자금"]}, {"id": "q-2-11", "ch": "2", "card": "금융리스·세일앤리스백", "imp": 2, "sem": true, "type": "short", "q": "금융리스(Finance Lease)에서 차주와 MFC에 적용되는 의무·금지를 말해 보세요.", "a": "차주는 리스물건을 제3자에게 재리스할 수 없고, MFC는 리스물건에 표지판(plate)·라벨을 부착해야 합니다.", "key": ["재리스 금지", "표지판·라벨"]}, {"id": "q-2-12", "ch": "2", "card": "기타 금융사업활동 요건 5개", "imp": 2, "sem": false, "type": "list", "q": "OJK 승인 기타 금융사업(other financing business activities) 요건 5가지를 말해 보세요.", "a": "사업계획 반영, 건강도(Health Level) 종합 2등급, Gearing 충족, 기본자본(Core Capital) Rp200bn, 제재 없음입니다.", "parts": ["사업계획 반영", "건강도 종합 2등급 이상", "Gearing 요건 충족", "기본자본 Rp200bn 이상", "OJK 행정제재 중이 아닐 것"]}, {"id": "q-2-13", "ch": "2", "card": "운전자금대출·자금대출 요건", "imp": 3, "sem": true, "type": "cloze", "q": "FMU는 차주당 IDR 「___」 이하, FD는 차주당 IDR 「___」 이하입니다.", "a": "FMU 차주당 IDR 10bn 이하, FD 차주당 IDR 500mn 이하입니다.", "blanks": ["10bn", "500mn"], "alt": [["100억", "10 billion"], ["5억", "500 million"]]}, {"id": "q-2-14", "ch": "2", "card": "운전자금대출·자금대출 요건", "imp": 3, "sem": true, "type": "list", "q": "FMU·FD 회사 요건 6가지를 말해 보세요.", "a": "건강도(Health Level) 2등급, 자본비율(Capital Ratio), Gearing, FD 채권 25% 이내, Net NPF 5% 이하, 기본자본/납입자본(Core Capital/Paid-Up Capital) 50% 이상입니다.", "parts": ["건강도 종합 2등급 이상", "자본비율 준수", "Gearing 준수", "FD 다목적 채권은 총 금융채권의 25% 이내", "Net NPF 5% 이하", "기본자본/납입자본 50% 이상"]}, {"id": "q-2-15", "ch": "2", "card": "운전자금대출·자금대출 요건", "imp": 3, "sem": true, "type": "list", "q": "FMU·FD 담보 면제(Collateral Exemption) 조건(기본자본/납입자본 100% 초과 회사, 차주당 누적 IDR 100mn 이하) 3가지를 말해 보세요.", "a": "UMKM 차주, 신용위험 보험 이전, 총 금융채권의 10% 이내입니다.", "parts": ["소상공인(UMKM) 차주", "신용위험 보험 이전", "해당 채권 총 금융채권의 10% 이내"]}, {"id": "q-2-16", "ch": "2", "card": "운전자금대출·자금대출 요건", "imp": 3, "sem": true, "type": "mc", "q": "기본자본/납입자본 기준으로 맞는 짝은?", "a": "FMU·FD 수행 요건은 50% 이상, 담보 면제(Collateral Exemption)는 100% 초과입니다.", "choices": ["FMU·FD 수행 50% 이상 / 담보 면제 100% 초과", "FMU·FD 수행 100% 초과 / 담보 면제 50% 이상", "둘 다 50% 이상", "둘 다 100% 초과"], "correct": 0}, {"id": "q-2-17", "ch": "2", "card": "운전자금대출·자금대출 요건", "imp": 3, "sem": true, "type": "short", "q": "KBBF는 FMU·FD 요건과 담보 면제(Collateral Exemption) 요건을 충족합니까?", "a": "Net NPF 0.94%, 자기자본/납입자본 58.96%(8월)로 FMU·FD 회사 요건은 충족하고, 담보 면제는 100% 초과 요건을 충족하지 못합니다.", "key": ["0.94%", "58.96%", "100%"]}, {"id": "q-2-18", "ch": "2", "card": "POJK 35/2025 개정 내용", "imp": 3, "sem": true, "type": "list", "q": "POJK 35/2025의 주요 개정 내용 5가지를 말해 보세요.", "a": "선수금(Down Payment) 0%, 무담보 운전자금, 비대면(without face-to-face) 확대, 연체 이력 차주 금융, 지분 변경 절차 간소화입니다.", "parts": ["선수금(Down Payment) 0% 허용", "무담보 운전자금 요건", "비대면(without face-to-face) 금융 확대", "연체 이력 차주 금융 허용", "지배주주 변경 없는 지분 변경 절차 간소화"]}, {"id": "q-2-19", "ch": "2", "card": "POJK 35/2025 개정 내용", "imp": 3, "sem": true, "type": "cloze", "q": "선수금(Down Payment) 0%는 차량금융 Net NPF 「___」% 이하 회사만, 0% 취급분은 금융채권 잔액의 「___」% 이내", "a": "차량금융 Net NPF 3% 이하, 잔액의 20% 이내입니다.", "blanks": ["3", "20"]}, {"id": "q-2-20", "ch": "2", "card": "POJK 35/2025 개정 내용", "imp": 3, "sem": true, "type": "cloze", "q": "무담보 운전자금: 기본자본/납입자본(Core Capital/Paid-Up Capital) 「___」% 초과 회사, 중소기업 차주당 IDR 「___」 이하, 잔액 「___」% 이내", "a": "100% 초과 회사, 차주당 IDR 100mn 이하, 잔액 10% 이내이며 신용보험·보증이 필요합니다.", "blanks": ["100", "100mn", "10"], "alt": [[], ["1억", "100 million"], []]}, {"id": "q-2-21", "ch": "2", "card": "디지털금융서비스 요건", "imp": 2, "sem": true, "type": "list", "q": "디지털금융(Digital Financing Services) 요건 4가지를 말해 보세요.", "a": "IT SOP, 담당 이사·임원 IT 자격증, 시스템 인력, IT 경력 3년 이상입니다.", "parts": ["IT 활용 SOP", "정보시스템 담당 이사 1명과 바로 아래 임원 1명의 IT 직무 자격증", "시스템 개발·변경·삭제·유지·보안 인력", "해당 인력 IT 경력 3년 이상"]}, {"id": "q-2-22", "ch": "2", "card": "디지털금융서비스 요건", "imp": 2, "sem": true, "type": "num", "q": "디지털금융(Digital Financing Services) 승인 후 몇 개월 내 정보보안관리 인증을 받아야 합니까?", "a": "승인 후 6개월 내입니다(19D조).", "accept": ["6", "6개월"], "unit": "개월"}, {"id": "q-2-23", "ch": "2", "card": "제3자 인센티브 상한 17.5%", "imp": 3, "sem": false, "type": "num", "q": "제3자(딜러 등) 인센티브 상한은 각 금융계약 총수입의 몇 %입니까?", "a": "17.5% 이하입니다.", "accept": ["17.5", "17.5%"], "unit": "%"}, {"id": "q-2-24", "ch": "2", "card": "제3자 인센티브 상한 17.5%", "imp": 3, "sem": false, "type": "list", "q": "인센티브 상한 산정의 「수입(Income)」 4요소를 말해 보세요.", "a": "조달비용 차감 전 이자수입, 보험 할인(insurance discount), 관리수수료, 취급수수료입니다.", "parts": ["조달비용 차감 전 이자수입", "보험 할인(insurance discount)", "관리수수료 수입", "취급수수료(provision) 수입"]}, {"id": "q-2-25", "ch": "2", "card": "제3자 인센티브 상한 17.5%", "imp": 3, "sem": false, "type": "mc", "q": "제3자 인센티브 17.5%의 분모는 무엇입니까?", "a": "분모는 계약별 총수입이며, 이자수입은 조달비용을 빼기 전 금액입니다. 인센티브를 선수금 산정에 넣는 것도 금지됩니다.", "choices": ["계약별 총수입(조달비용 차감 전 이자수입 포함)", "금융원금", "조달비용 차감 후 순이자수입", "차량 가격"], "correct": 0}, {"id": "q-2-26", "ch": "2", "card": "금리 투명성", "imp": 2, "sem": false, "type": "list", "q": "약정서 산출 예시에 넣어야 하는 항목 3가지를 말해 보세요.", "a": "금융원금·이자, 연체료(fines), 담보 집행비용입니다.", "parts": ["금융원금·이자", "연체료(fines)", "담보 집행비용"]}, {"id": "q-2-27", "ch": "2", "card": "채널링·공동금융", "imp": 2, "sem": false, "type": "short", "q": "채널링(Channeling)과 공동금융(Joint Financing)의 위험 부담 차이와 공통 금지사항을 말해 보세요.", "a": "채널링은 자금 소유자가 위험을 모두 지고, 공동금융은 출연 비율로 위험을 나눕니다. 두 방식 모두 상환청구권부(with recourse)는 금지됩니다.", "key": ["자금 소유자", "출연 비율", "with recourse 금지"]}, {"id": "q-2-28", "ch": "2", "card": "담보 소유증빙 보관과 이중담보 금지", "imp": 2, "sem": false, "type": "list", "q": "담보 소유증빙(BPKB) 관련 금지 2가지를 말해 보세요.", "a": "증빙의 질권 제공 금지, 이중담보(Double Pledge) 금지입니다.", "parts": ["소유증빙을 타인에게 질권·실물 담보로 제공", "1명의 차주 채권을 2개 이상 대주에게 중복 담보 제공(이중담보)"]}, {"id": "q-2-29", "ch": "2", "card": "MFC 금지행위 7가지", "imp": 2, "sem": false, "type": "list", "q": "MFC 금지행위(Prohibitions) 7가지를 말해 보세요.", "a": "예금 수취, 약속어음(promissory note) 발행, 보증, 불공정 채권 매각, 질권 기반 대출, 민원 비용 부과, 법령 회피 유도입니다.", "parts": ["공중으로부터 예금·적금 형태 자금 수취", "약속어음(promissory note) 발행(은행 차입 담보용 예외)", "타인 채무 보증", "불공정 금융채권 매각·양도", "질권법(pledge law) 기반 담보로 대출", "민원 처리 비용 부과", "법령 회피·위반 유도"]}, {"id": "q-2-30", "ch": "2", "card": "규정 위반 처리 절차와 행정제재", "imp": 2, "sem": true, "type": "num", "q": "OJK 위반 통지일부터 늦어도 몇 개월 내 요건을 충족해야 합니까?", "a": "1개월 내이며, 못 하면 이행계획(Fulfillment Plan)을 제출합니다.", "accept": ["1", "1개월"], "unit": "개월"}, {"id": "q-2-31", "ch": "2", "card": "규정 위반 처리 절차와 행정제재", "imp": 2, "sem": true, "type": "list", "q": "OJK 지적사항 질문에 답하는 순서 7단계(강사 권고)를 말해 보세요.", "a": "지적 내용 → 근본 원인 → 조치계획 → 담당자 → 기한 → 증빙 → 감사회(BOC, Board of Commissioners) 모니터링입니다.", "parts": ["지적 내용", "근본 원인", "조치계획", "담당자", "기한", "증빙", "감사회(BOC, Board of Commissioners) 모니터링"]}, {"id": "q-2-32", "ch": "2", "card": "규정 위반 처리 절차와 행정제재", "imp": 2, "sem": true, "type": "cloze", "q": "KBBF는 2026년 3월 RBB 교육훈련비가 인건비(Personnel Expenses)의 「___」%로 기준 「___」%에 미달해 서면 경고를 받았습니다.", "a": "2.3%로 2.5% 기준에 미달해 서면 경고 1건을 받았고 수정 RBB를 제출했습니다.", "blanks": ["2.3", "2.5"]}, {"id": "q-3-01", "ch": "3", "card": "건전성 핵심 비율", "imp": 3, "sem": true, "type": "cloze", "q": "FAR 「___」% 이상, Gearing 「___」배 이하, 자본비율(Capital Ratio) 「___」% 이상", "a": "FAR 50% 이상, Gearing 10배 이하, 자본비율 10% 이상입니다.", "blanks": ["50", "10", "10"]}, {"id": "q-3-02", "ch": "3", "card": "건전성 핵심 비율", "imp": 3, "sem": true, "type": "cloze", "q": "기본자본(Core Capital) IDR 「___」 이상, 기본자본/납입자본(Core Capital/Paid-Up Capital) 「___」% 이상", "a": "기본자본 IDR 100bn 이상, 기본자본/납입자본 50% 이상입니다.", "blanks": ["100bn", "50"], "alt": [["1000억", "100 billion"], []]}, {"id": "q-3-03", "ch": "3", "card": "건전성 핵심 비율", "imp": 3, "sem": true, "type": "cloze", "q": "KBBF 8월: FAR 「___」%, Gearing 「___」배, 자본비율(Capital Ratio) 「___」%, 자기자본/납입자본 「___」%", "a": "FAR 95.63%, Gearing 2.06배, 자본비율 63.88%, 자기자본/납입자본 58.96%입니다.", "blanks": ["95.63", "2.06", "63.88", "58.96"], "memo": "FAR 95 · Gearing 2 · 자본 64 · 자기/납입 59."}, {"id": "q-3-04", "ch": "3", "card": "건전성 핵심 비율", "imp": 3, "sem": true, "type": "list", "q": "대주주 조기경보 기준 3가지를 말해 보세요.", "a": "자본비율(Capital Ratio) 12%, Gearing 8배, NPF 4%이며 도달 시 추가 지원을 받습니다.", "parts": ["자본비율(Capital Ratio) 12%", "Gearing 8배", "NPF 4%"], "memo": "규제 10%·10배보다 한 단계 앞(12%·8배)에서 경보."}, {"id": "q-3-05", "ch": "3", "card": "건전성 핵심 비율", "imp": 3, "sem": true, "type": "num", "q": "피두시아(Fiducia) 등록은 금융계약일부터 늦어도 몇 개월 내입니까?", "a": "1개월입니다.", "accept": ["1", "1개월"], "unit": "개월"}, {"id": "q-3-06", "ch": "3", "card": "건전성 핵심 비율", "imp": 3, "sem": true, "type": "mc", "q": "FAR 수치 중 개별 회사 규제 최소 기준은?", "a": "규제 최소 FAR은 50%입니다. 86.70%는 업계(2026.4), 85~90%는 로드맵 목표, 95.63%는 KBBF 8월입니다.", "choices": ["50%", "86.70%", "85~90%", "95.63%"], "correct": 0}, {"id": "q-3-07", "ch": "3", "card": "자본 구성과 최소 자본 기준", "imp": 2, "sem": true, "type": "mc", "q": "기본자본(Core Capital) IDR 100bn과 납입자본 Rp250bn의 구분으로 맞는 것은?", "a": "기본자본 IDR 100bn은 유지 기준, 납입자본 Rp250bn은 설립 기준입니다.", "choices": ["100bn은 유지 기준, 250bn은 설립 기준", "100bn은 설립 기준, 250bn은 유지 기준", "둘 다 설립 기준", "둘 다 유지 기준"], "correct": 0}, {"id": "q-3-08", "ch": "3", "card": "자본 구성과 최소 자본 기준", "imp": 2, "sem": true, "type": "short", "q": "KBBF 자본 확충 계획을 정해진 문구로 말해 보세요.", "a": "대주주가 3년간 IDR 570bn 증자를 계획하고 있고 첫 집행은 2027년이며, 조기경보 기준 도달 시 추가 지원을 받습니다.", "key": ["3년", "570bn", "2027년", "조기경보"]}, {"id": "q-3-09", "ch": "3", "card": "자산 건전성 분류와 충당금", "imp": 3, "sem": true, "type": "list", "q": "자산 건전성(A/R Collectability) 5단계와 연체일수 구간을 말해 보세요.", "a": "정상(Current) ~10일, 요주의(Special Mention) 11~90일, 고정(Non-Current) 91~120일, 회수의문(Doubtful) 121~180일, 손실(Bad Debt) 180일 초과입니다.", "parts": ["정상(Current) 10일 이하", "요주의(Special Mention) 11~90일", "고정(Non-Current) 91~120일", "회수의문(Doubtful) 121~180일", "손실(Bad Debt) 180일 초과"], "memo": "경계 숫자 10 · 90 · 120 · 180."}, {"id": "q-3-10", "ch": "3", "card": "자산 건전성 분류와 충당금", "imp": 3, "sem": true, "type": "cloze", "q": "충당금 = (잔액 − 담보) × 정상(Current) 「___」%, 요주의(Special Mention) 「___」%, 고정(Non-Current) 「___」%, 회수의문(Doubtful) 「___」%, 손실(Bad Debt) 100%", "a": "1%·5%·15%·50%·100%입니다.", "blanks": ["1", "5", "15", "50"]}, {"id": "q-3-11", "ch": "3", "card": "자산 건전성 분류와 충당금", "imp": 3, "sem": true, "type": "short", "q": "NPF는 어느 등급의 채권입니까?", "a": "고정(Non-Current)·회수의문(Doubtful)·손실(Bad Debt), 즉 91일 이상 연체 채권입니다.", "key": ["고정·회수의문·손실", "91일"]}, {"id": "q-3-12", "ch": "3", "card": "자산 건전성 분류와 충당금", "imp": 3, "sem": true, "type": "cloze", "q": "KBBF 8월 충당금 커버리지는 「___」%(6월 164.6%)이고, 순 NPF는 연말 「___」% 목표입니다.", "a": "커버리지 89.6%, 순 NPF 연말 0% 목표입니다.", "blanks": ["89.6", "0"]}, {"id": "q-3-13", "ch": "3", "card": "채권 재조정 요건과 결정권", "imp": 3, "sem": true, "type": "list", "q": "채권 재조정(Restructuring) 대상 요건 2가지를 말해 보세요.", "a": "상환 곤란과 재조정 후 상환능력 두 가지입니다.", "parts": ["차주가 원금·이자 상환에 어려움이 있음", "사업 전망 양호 또는 재조정 후 상환능력이 있다고 평가"]}, {"id": "q-3-14", "ch": "3", "card": "채권 재조정 요건과 결정권", "imp": 3, "sem": true, "type": "list", "q": "재조정(Restructuring) 금지 목적 2가지를 말해 보세요.", "a": "등급 상향과 충당금 증가 회피 목적은 금지입니다.", "parts": ["자산 건전성(A/R Collectability) 등급 상향", "손상차손충당금(allowance for impairment losses) 증가 회피"]}, {"id": "q-3-15", "ch": "3", "card": "채권 재조정 요건과 결정권", "imp": 3, "sem": true, "type": "short", "q": "재조정(Restructuring) 결정권자는 누구입니까?", "a": "원 금융 승인자보다 상위 권한자가 결정하고, 원 금융을 최고 권한자가 승인했다면 이사회(BOD, Directors) 결의로 결정합니다.", "key": ["상위 권한자", "이사회(BOD) 결의"]}, {"id": "q-3-16", "ch": "3", "card": "채권 재조정 요건과 결정권", "imp": 3, "sem": true, "type": "cloze", "q": "KBBF 재조정(Restructuring) 채권 비율은 6월 기준 「___」%입니다.", "a": "0.51%입니다.", "blanks": ["0.51"]}, {"id": "q-3-17", "ch": "3", "card": "최대금융한도(BMPP)", "imp": 3, "sem": true, "type": "cloze", "q": "BMPP: 지배관계 없는 단일 차주 자본의 「___」%, 단일 차주그룹 「___」%", "a": "단일 차주 20%, 단일 그룹 50%입니다.", "blanks": ["20", "50"]}, {"id": "q-3-18", "ch": "3", "card": "최대금융한도(BMPP)", "imp": 3, "sem": true, "type": "list", "q": "BMPP 초과가 허용되는 외부 사유 5가지를 말해 보세요.", "a": "자본 감소, 환율 변동, 공정가치 변동, 합병·경영구조 변경, 법령 변경이며 초과 시 1개월 내 실행계획(action plan)을 냅니다.", "parts": ["자본 감소", "환율 변동", "공정가치 변동", "합병·경영구조 변경", "법령 변경"]}, {"id": "q-3-19", "ch": "3", "card": "최대금융한도(BMPP)", "imp": 3, "sem": true, "type": "short", "q": "BMPP 산정 기준 자본은 무엇이며, 외부 요인으로 초과하면 어떻게 합니까?", "a": "금융 실행 전 직전 월간보고서(Monthly Report)상 자본이 기준이고, 초과 시 초과분을 조정하며 늦어도 1개월 내 실행계획(action plan)을 제출합니다.", "key": ["직전 월간보고", "1개월", "실행계획"]}, {"id": "q-3-20", "ch": "3", "card": "금융위험 경감 4가지", "imp": 2, "sem": true, "type": "list", "q": "금융위험 경감(Financing Risk Mitigation) 수단 4가지를 말해 보세요.", "a": "신용보험·보증, 담보물 보험, 피두시아(Fiducia)·저당권, 기타 노력입니다.", "parts": ["신용보험·신용보증", "담보물 보험", "피두시아(Fiducia)·저당권 설정", "기타 채무불이행 위험 경감 노력"]}, {"id": "q-3-21", "ch": "3", "card": "조달원과 채무증권 발행", "imp": 2, "sem": false, "type": "list", "q": "MFC 조달원 6가지를 말해 보세요.", "a": "비공모(Not Through Public Offering) 증자, 차입, 후순위차입, 공모(Through Public Offering) 유가증권, 비공모 채무증권, 자산유동화입니다.", "parts": ["비공모(Not Through Public Offering) 유상증자", "정부기관·은행·비은행금융·기타 기관 차입", "후순위차입", "공모(Through Public Offering) 유가증권", "비공모 채무증권", "자산유동화"]}, {"id": "q-3-22", "ch": "3", "card": "주주 요건과 외국인 지분 85%", "imp": 3, "sem": true, "type": "num", "q": "외국인 직·간접 소유 상한은 납입자본의 몇 %입니까?", "a": "85%입니다.", "accept": ["85", "85%"], "unit": "%"}, {"id": "q-3-23", "ch": "3", "card": "주주 요건과 외국인 지분 85%", "imp": 3, "sem": true, "type": "num", "q": "법인 지배주주는 투자 전 몇 년 이상 영업한 법인이어야 합니까?", "a": "2년 이상입니다.", "accept": ["2", "2년"], "unit": "년"}, {"id": "q-3-24", "ch": "3", "card": "주주 요건과 외국인 지분 85%", "imp": 3, "sem": true, "type": "mc", "q": "외국인 관련 기준의 짝으로 맞는 것은?", "a": "외국인 지분 상한 85%, 외국인 지분 25% 이상이면 외국인 이사 가능, 이사 50% 이상은 인니 국민입니다.", "choices": ["지분 상한 85% / 외국인 이사 가능 지분 25% 이상 / 이사 인니 국민 50% 이상", "지분 상한 50% / 외국인 이사 가능 지분 25% 이상 / 이사 인니 국민 85% 이상", "지분 상한 85% / 외국인 이사 가능 지분 50% 이상 / 이사 인니 국민 25% 이상", "지분 상한 25% / 외국인 이사 가능 지분 85% 이상 / 이사 인니 국민 50% 이상"], "correct": 0, "memo": "85(소유) · 25(이사 허용 문턱) · 50(국민 비율)."}, {"id": "q-3-25", "ch": "3", "card": "주주 요건과 외국인 지분 85%", "imp": 3, "sem": true, "type": "short", "q": "주주와 이사회(BOD, Directors)의 관계에 대한 규정(POJK 48/2024)과 KBBF 대응을 말해 보세요.", "a": "주주는 회사 운영에서 이사회(BOD)에 간섭할 수 없고, 대주주 의견은 주주총회(GMS)와 이사회 공식 절차로만 반영합니다.", "key": ["간섭할 수 없음", "주주총회", "이사회(BOD) 공식 절차"]}, {"id": "q-4-01", "ch": "4", "card": "GCG 정의와 5원칙(TARIF)", "imp": 3, "sem": true, "type": "list", "q": "GCG 5원칙(TARIF)을 말해 보세요.", "a": "투명성(Transparency), 책임성(Accountability), 책임(Responsibility), 독립성(Independency), 공정성(Fairness)입니다.", "parts": ["투명성(Transparency)", "책임성(Accountability)", "책임(Responsibility)", "독립성(Independency)", "공정성(Fairness)"], "memo": "T-A-R-I-F 앞글자 순서."}, {"id": "q-4-02", "ch": "4", "card": "GCG 정의와 5원칙(TARIF)", "imp": 3, "sem": true, "type": "short", "q": "Accountability와 Responsibility의 차이를 말해 보세요.", "a": "Accountability는 조직구조·직무·KPI·보고체계에 따른 경영 책임이고, Responsibility는 법규·규정·규범 준수 책임입니다.", "key": ["직무·KPI·보고체계", "법규 준수"], "memo": "강사가 가장 흔한 실수로 지적한 구분입니다."}, {"id": "q-4-03", "ch": "4", "card": "GCG 정의와 5원칙(TARIF)", "imp": 3, "sem": true, "type": "list", "q": "강사의 GCG 설명 틀 3단계를 말해 보세요.", "a": "구조 → 과정(TARIF) → 결과입니다.", "parts": ["구조", "과정(TARIF)", "결과"]}, {"id": "q-4-04", "ch": "4", "card": "GCG 정의와 5원칙(TARIF)", "imp": 3, "sem": true, "type": "cloze", "q": "KBBF 2025년 GCG 자체평가(self-assessment) 등급은 「___」등급입니다.", "a": "2등급입니다.", "blanks": ["2"]}, {"id": "q-4-05", "ch": "4", "card": "GCG 이행 범위 16항목·목적 7가지", "imp": 2, "sem": false, "type": "num", "q": "POJK 48/2024 GCG 이행 범위는 몇 항목입니까?", "a": "16항목이며, 이행 목적은 7가지입니다.", "accept": ["16", "16개", "16항목"], "unit": "항목"}, {"id": "q-4-06", "ch": "4", "card": "기관 구성 요건(자산 Rp250bn 초과)", "imp": 3, "sem": true, "type": "cloze", "q": "자산 Rp250bn 초과 회사: 이사(Director) 최소 「___」명, 감사(BOC 위원) 최소 「___」명(독립커미셔너 포함)", "a": "이사 3명 이상, 감사(BOC 위원) 2명 이상입니다.", "blanks": ["3", "2"]}, {"id": "q-4-07", "ch": "4", "card": "기관 구성 요건(자산 Rp250bn 초과)", "imp": 3, "sem": true, "type": "num", "q": "감사(BOC 위원)는 최근 몇 개월 내 같은 회사 이사(Director) 경력이 있으면 안 됩니까?", "a": "6개월입니다.", "accept": ["6", "6개월"], "unit": "개월"}, {"id": "q-4-08", "ch": "4", "card": "기관 구성 요건(자산 Rp250bn 초과)", "imp": 3, "sem": true, "type": "mc", "q": "거주 요건으로 맞는 것은?", "a": "이사(Director)는 전원 인도네시아 거주, 감사(BOC 위원)는 최소 1명 거주입니다.", "choices": ["이사 전원 인니 거주, 감사(BOC 위원)는 최소 1명 거주", "이사·감사(BOC 위원) 모두 최소 1명 거주", "이사 최소 1명, 감사(BOC 위원) 전원 거주", "거주 요건 없음"], "correct": 0}, {"id": "q-4-09", "ch": "4", "card": "기관 구성 요건(자산 Rp250bn 초과)", "imp": 3, "sem": true, "type": "short", "q": "KBBF 이사회(BOD, Directors) 구성 현황과 승인 후 체계를 말해 보세요.", "a": "현재 이사 1명이고 신규 3명이 주총 선임 후 F&P 진행 중이며, 승인 후 CEO·CBO·COO·CFO 4명 체계가 됩니다.", "key": ["1명", "3명", "4명", "CEO·CBO·COO·CFO"]}, {"id": "q-4-10", "ch": "4", "card": "이사회·감사회·주총 회의 요건", "imp": 2, "sem": true, "type": "cloze", "q": "이사회(BOD, Directors) 회의 「___」 이상(출석 50%), 감사회(BOC, Board of Commissioners) 회의 「___」 이상(출석 「___」%), 주주총회(GMS) 연 1회 이상", "a": "이사회(BOD) 월 1회·50%, 감사회(BOC) 연 4회·75%, 주총 연 1회입니다.", "blanks": ["월 1회", "연 4회", "75"], "alt": [["매월 1회", "월1회"], ["연4회", "1년 4회"], []], "memo": "이사회 1·50, 감사회 4·75."}, {"id": "q-4-11", "ch": "4", "card": "이사회·감사회·주총 회의 요건", "imp": 2, "sem": true, "type": "short", "q": "의사록(MoM)에 대한 요건을 말해 보세요.", "a": "의사록은 관련 당사자 전원에게 배포하고 반대 의견(dissenting opinion)을 포함하며, 발언·논의 과정이 드러나게 작성합니다.", "key": ["전원 배포", "반대 의견"]}, {"id": "q-4-12", "ch": "4", "card": "겸직 제한(이사·감사·DPS)", "imp": 3, "sem": true, "type": "mc", "q": "겸직(Double Positions) 제한으로 맞는 것은?", "a": "이사(Director)는 다른 기관 이사·집행임원(executive officer) 겸직 금지, 감사(BOC 위원)는 다른 기관 감사 2곳까지(2개 초과 금지)입니다. 이사도 다른 기관 감사는 2곳까지 겸할 수 있습니다.", "choices": ["이사는 다른 기관 이사 겸직 금지, 감사(BOC 위원)는 다른 기관 감사 2곳까지", "이사는 다른 기관 이사 1곳까지, 감사(BOC 위원)는 3곳까지", "이사·감사(BOC 위원) 모두 다른 기관 겸직 전면 금지", "이사는 다른 기관 감사(BOC 위원) 겸직 전면 금지"], "correct": 0}, {"id": "q-4-13", "ch": "4", "card": "겸직 제한(이사·감사·DPS)", "imp": 3, "sem": true, "type": "list", "q": "이사(Director) 겸직(Double Positions)으로 보지 않는 예외 4가지를 말해 보세요.", "a": "지배 자회사 감사(BOC 위원), 협회 지명, OJK 지정, 비영리단체입니다.", "parts": ["금융회사가 지배하는 자회사의 감사(BOC 위원)", "협회 지명 자회사 감사(BOC 위원)", "OJK 지정 감사(BOC 위원)", "비영리단체 직위"]}, {"id": "q-4-14", "ch": "4", "card": "겸직 제한(이사·감사·DPS)", "imp": 3, "sem": true, "type": "short", "q": "선임 후 모회사 직위 겸직(Double Positions) 여부를 말해 보세요.", "a": "선임 후 JB우리캐피탈 겸직 직위는 없고 인사상 해외 파견 형식이며, KBBF 대표이사(President Director) 업무에 전념합니다.", "key": ["겸직 없음", "해외 파견", "전념"]}, {"id": "q-4-15", "ch": "4", "card": "이사·감사·DPS 국적·거주 요건", "imp": 3, "sem": true, "type": "cloze", "q": "외국인 지분 「___」% 이상이면 외국인 이사(Director) 가능, 이사 최소 「___」%는 인도네시아 국민", "a": "외국인 지분 25% 이상이면 외국인 이사 가능, 이사 50% 이상은 인니 국민입니다.", "blanks": ["25", "50"]}, {"id": "q-4-16", "ch": "4", "card": "이사·감사·DPS 국적·거주 요건", "imp": 3, "sem": true, "type": "short", "q": "외국인 지분이 25% 미만이면 이사(Director) 국적 요건은 어떻습니까?", "a": "이사 전원이 인도네시아 국민이어야 합니다.", "key": ["전원", "인도네시아 국민"]}, {"id": "q-4-17", "ch": "4", "card": "이사·감사·DPS 국적·거주 요건", "imp": 3, "sem": true, "type": "short", "q": "독립감사(독립커미셔너)의 국적·거주 요건을 말해 보세요.", "a": "독립감사(독립커미셔너)는 외국인 지분과 관계없이 인도네시아 국민이며 인도네시아에 거주해야 합니다.", "key": ["인도네시아 국민", "거주"]}, {"id": "q-4-18", "ch": "4", "card": "준법 담당 이사와 이사·감사 공시", "imp": 3, "sem": true, "type": "list", "q": "준법 담당 이사가 맡을 수 없는 기능 3가지를 말해 보세요.", "a": "여신, 마케팅, 재무이며 대표이사(President Director)만 예외입니다.", "parts": ["금융(여신)", "마케팅", "재무"]}, {"id": "q-4-19", "ch": "4", "card": "준법 담당 이사와 이사·감사 공시", "imp": 3, "sem": true, "type": "short", "q": "준법 담당 이사 겸직 제한의 예외는 누구입니까?", "a": "대표이사(President Director)입니다.", "key": ["대표이사"]}, {"id": "q-4-20", "ch": "4", "card": "준법 담당 이사와 이사·감사 공시", "imp": 3, "sem": true, "type": "list", "q": "이사·감사(BOC 위원) 공시 의무 2가지를 말해 보세요.", "a": "5% 이상 지분 보유와 재무·가족 관계입니다.", "parts": ["5% 이상 지분 보유", "다른 이사·DPS·주주·사업그룹과의 재무·가족 관계"]}, {"id": "q-4-21", "ch": "4", "card": "이사회의 역할·의무·금지", "imp": 3, "sem": true, "type": "list", "q": "이사회(BOD, Directors) 의무 6가지를 말해 보세요.", "a": "법령 준수, 권한에 따른 경영, 주총 책임, 이해관계자 고려, 감사회(BOC, Board of Commissioners)·DPS 정보 제공, 기관 직무 지원입니다.", "parts": ["법령·정관·내규 준수", "권한과 책임에 따른 경영", "주주총회(GMS)에 직무 책임", "모든 이해관계자, 특히 차주·채권자 이익 고려", "감사회(BOC, Board of Commissioners)·DPS에 회사 정보 적시·완전 제공", "회사 기관·DPS 직무 수행 지원"]}, {"id": "q-4-22", "ch": "4", "card": "이사회의 역할·의무·금지", "imp": 3, "sem": true, "type": "short", "q": "이사회(BOD, Directors) 금지사항 중 확정된 3가지를 말해 보세요.", "a": "회사와 이해상충 거래, 지위를 이용해 회사에 손해를 끼치는 행위, 주총 결의로 정한 보수·편의 외 개인 이익 취득입니다.", "key": ["이해상충 거래", "지위 이용", "개인 이익"]}, {"id": "q-4-23", "ch": "4", "card": "이사회의 역할·의무·금지", "imp": 3, "sem": true, "type": "short", "q": "지배주주가 운영에 직접 지시하면 어떻게 답합니까?", "a": "주주의 경영 간섭은 금지되므로 대주주 의견은 주주총회(GMS)와 이사회(BOD, Directors) 공식 절차로만 반영하고, 회사·고객 이익 기준으로 결정하며 이견은 회의록에 남깁니다.", "key": ["간섭 금지", "공식 절차", "회의록"]}, {"id": "q-4-24", "ch": "4", "card": "감사회의 역할·의무·금지", "imp": 2, "sem": true, "type": "short", "q": "감사 지적사항 후속조치의 이행과 확인 주체는 각각 누구입니까?", "a": "후속조치 이행은 이사회(BOD, Directors), 확인은 감사회(BOC, Board of Commissioners)입니다.", "key": ["이사회(BOD) 이행", "감사회(BOC) 확인"]}, {"id": "q-4-25", "ch": "4", "card": "감사회의 역할·의무·금지", "imp": 2, "sem": true, "type": "list", "q": "강사가 제시한 감사(BOC 위원) 신규 체계 질문 5개 주제를 말해 보세요.", "a": "사업계획, 지배구조·리스크관리 이행, 준법문화, 반부패 전략, 내부감사(Internal Audit) 후속조치입니다.", "parts": ["사업계획 평가", "지배구조·리스크관리 이행 평가", "준법문화 평가", "반부패 전략 감독", "내부감사(Internal Audit) 후속조치 모니터링"]}, {"id": "q-4-26", "ch": "4", "card": "독립감사 요건 6가지", "imp": 2, "sem": true, "type": "list", "q": "독립감사(독립커미셔너) 요건 6가지를 말해 보세요.", "a": "관계 없음, 6개월 경력 제한, 법령 이해, 재무 지식, 인니 국민, 인니 거주입니다.", "parts": ["같은 회사 이사·감사(BOC 위원)·DPS·주주와 관계 없음", "최근 6개월간 같은 회사·관계회사 이사·감사(BOC 위원)·DPS·이사 직하 직위 경력 없음", "멀티파이낸스 관련 법령 이해", "회사 재무상태 지식", "인도네시아 국민", "인도네시아 거주"]}, {"id": "q-4-27", "ch": "4", "card": "감사회 산하 3개 위원회", "imp": 3, "sem": true, "type": "list", "q": "감사회(BOC, Board of Commissioners) 산하 3개 위원회를 말해 보세요.", "a": "감사위원회(Audit Committee), 리스크감시위원회(Risk Monitoring Committee), 보수·추천위원회(Remuneration & Nomination Committee)이며 위원장은 모두 독립감사(독립커미셔너)입니다.", "parts": ["감사위원회(Audit Committee)", "리스크감시위원회(Risk Monitoring Committee)", "보수·추천위원회(Remuneration & Nomination Committee)"]}, {"id": "q-4-28", "ch": "4", "card": "감사회 산하 3개 위원회", "imp": 3, "sem": true, "type": "short", "q": "3개 위원회의 위원장은 누구입니까?", "a": "3개 위원회 모두 독립감사(독립커미셔너)가 위원장입니다.", "key": ["독립감사(독립커미셔너)"]}, {"id": "q-4-29", "ch": "4", "card": "감사회 산하 3개 위원회", "imp": 3, "sem": true, "type": "mc", "q": "이사회(BOD, Directors) 산하 비상설(non-structural) 위원회로 리스크 정책과 한도를 정하고 실행하는 위원회는?", "a": "리스크관리위원회(Risk Management Committee)는 이사회(BOD) 산하이고, 리스크감시위원회(Risk Monitoring Committee)는 감사회(BOC, Board of Commissioners) 산하 감독 위원회입니다.", "choices": ["리스크관리위원회", "리스크감시위원회", "감사위원회", "보수·추천위원회"], "correct": 0, "memo": "감시 = 감사회(BOC, 감독), 관리 = 이사회(BOD, 실행)."}, {"id": "q-4-30", "ch": "4", "card": "감사회 산하 3개 위원회", "imp": 3, "sem": true, "type": "short", "q": "외부감사인 선임 절차를 말해 보세요.", "a": "감사위원회(Audit Committee)가 외부감사인 후보를 감사회(BOC, Board of Commissioners)에 제안하고, 감사회가 주주총회(GMS)에 승인을 요청합니다.", "key": ["감사위원회 제안", "감사회(BOC)", "주주총회 승인"]}, {"id": "q-4-31", "ch": "4", "card": "감사회 산하 3개 위원회", "imp": 3, "sem": true, "type": "short", "q": "보수·추천위원회(Remuneration & Nomination Committee)의 구성을 말해 보세요.", "a": "감사(BOC 위원) 1명과 인사 담당 이사 바로 아래 직급 임원 1명으로 구성하고, 위원장은 독립감사(독립커미셔너)입니다.", "key": ["감사(BOC 위원) 1명", "인사 담당 이사 직하 임원"]}, {"id": "q-4-32", "ch": "4", "card": "이해상충 관리 5가지 전략", "imp": 2, "sem": false, "type": "list", "q": "이해상충 관리 5가지 전략을 말해 보세요.", "a": "공시(Disclosure and Transparency), 회피(Recusal), 직무 분리(Separation of Duties), 외부 독립 자문(Independent Advice), 행동강령(Code of Conduct)입니다.", "parts": ["공시·투명성(Disclosure and Transparency)", "회피(Recusal)", "직무 분리(Separation of Duties)", "외부 독립 자문(Independent Advice)", "행동강령(Code of Conduct)"]}, {"id": "q-4-33", "ch": "4", "card": "GCG 이행보고서·자체평가(2/15)", "imp": 2, "sem": false, "type": "mc", "q": "GCG 자체평가(self-assessment) 보고 기한은?", "a": "다음 연도 2월 15일입니다. 1/31은 반부패 이행보고, 4/30은 지속가능보고서입니다.", "choices": ["다음 연도 2월 15일", "다음 연도 1월 31일", "다음 연도 4월 30일", "회계연도 말"], "correct": 0}, {"id": "q-4-34", "ch": "4", "card": "재무보고 무결성(POJK 42/2025)", "imp": 2, "sem": false, "type": "list", "q": "POJK 42/2025상 이사회(BOD, Directors) 재무보고 책임 4가지를 말해 보세요.", "a": "작성·표시, 적합성, 완전성·진실성, 내부통제(Internal Control) 이행이며 인지세(stamp duty)를 붙인 이사회(BOD) 서명 확인서로 명시합니다.", "parts": ["재무정보·재무보고 작성·표시", "작성·표시의 적합성", "내용의 완전성·진실성", "재무보고 내부통제(Internal Control) 이행"]}, {"id": "q-4-35", "ch": "4", "card": "주요 당사자 적격성 재평가", "imp": 2, "sem": false, "type": "list", "q": "POJK 34/2018 재평가(Reassessment) 사유 4가지를 말해 보세요.", "a": "진실성, 재무적 적격성, 재무평판, 역량 문제 징후입니다.", "parts": ["진실성(integrity)", "재무적 적격성(financial feasibility)", "재무평판(financial reputation)", "역량(competence)"]}, {"id": "q-4-36", "ch": "4", "card": "리스크 지배구조 정책 7가지", "imp": 2, "sem": false, "type": "short", "q": "회사에 두어야 하는 위원회를 이사회(BOD, Directors) 소속과 감사회(BOC, Board of Commissioners) 소속으로 나눠 말해 보세요.", "a": "이사회(BOD) 소속은 리스크관리위원회(Risk Management Committee), 감사회(BOC) 소속은 감사위원회 onal)", "유동성(Liquidity)", "준법(Compliance)", "법률(Legal)", "평판(Reputation)"], "hint": "S-C-M-O-L-C-L-R", "memo": "영문 앞글자 S-C-M-O-L-C-L-R 순서로 외움(강사 자료 순서)"}, {"id": "q-5-06", "ch": "5", "card": "8대 위험과 고유위험 평가지표", "imp": 3, "sem": true, "type": "list", "q": "건강도 평가(Health Level)에서 8대 위험을 묶는 3개 그룹과 각 그룹에 속한 위험을 말해 보세요.", "a": "A. 사업위험군: 전략(Strategic), B. 재무위험군: 신용(Credit)·시장(Market)·운영(Operational)·유동성(Liquidity), C. 지배구조위험군: 준법(Compliance)·법률(Legal)·평판(Reputation).", "parts": ["A. 사업위험군: 전략(Strategic)", "B. 재무위험군: 신용(Credit)·시장(Market)·운영(Operational)·유동성(Liquidity)", "C. 지배구조위험군: 준법(Compliance)·법률(Legal)·평판(Reputation)"], "memo": "개수로 1-4-3: 사업 1개, 재무 4개, 지배구조 3개"}, {"id": "q-5-07", "ch": "5", "card": "8대 위험과 고유위험 평가지표", "imp": 3, "sem": true, "type": "mc", "q": "운영위험(Operational)은 건강도 평가(Health Level)의 어느 위험군에 속합니까?", "a": "운영위험은 신용·시장·유동성과 함께 재무위험군(B)에 속함.", "choices": ["사업위험군", "재무위험군", "지배구조위험군", "어느 군에도 속하지 않음"], "correct": 1, "memo": "재무위험군 4개 = 신용·시장·운영·유동성(8대 위험 순서의 2~5번)"}, {"id": "q-5-08", "ch": "5", "card": "8대 위험과 고유위험 평가지표", "imp": 3, "sem": true, "type": "cloze", "q": "KBBF 2분기 리스크 프로필(Risk Profile)에서 유동성위험(Liquidity)은 ___, 법률위험(Legal)은 ___ 입니다.", "a": "2분기 리스크 프로필 종합 P2, 유동성 P1, 법률 P3.", "blanks": ["P1", "P3"], "alt": [["1"], ["3"]]}, {"id": "q-5-09", "ch": "5", "card": "리스크관리 수립 순서(CE 3·PC 9)", "imp": 2, "sem": false, "type": "list", "q": "리스크관리 수립 3단계를 순서대로 말해 보세요.", "a": "리스크관리 전략 수립, 리스크관리 정책 수립(선호·한도), 지배구조·인프라 개발(구조·문화·인프라).", "parts": ["리스크관리 전략 수립", "리스크관리 정책 수립(선호·한도)", "지배구조·인프라 개발(구조·문화·인프라)"], "memo": "출발점은 회사 전략. 전략 → 정책 → 지배구조·인프라, 각 단계 3개씩 수행기준 9개"}, {"id": "q-5-10", "ch": "5", "card": "리스크 범위 4단계와 측정 기준", "imp": 2, "sem": false, "type": "num", "q": "리스크 매트릭스에서 영향도(Impact) 5단계와 발생가능성(Likelihood) 5단계를 곱한 점수의 최댓값은 몇 점입니까?", "a": "영향도(1~5) × 발생가능성(1~5)로 1~25점을 매김.", "accept": ["25", "25점"], "unit": "점"}, {"id": "q-5-11", "ch": "5", "card": "리스크관리 전략·대응 4유형", "imp": 2, "sem": true, "type": "list", "q": "리스크 대응(Risk Treatment) 4유형을 말해 보세요.", "a": "회피(Avoid), 감소(Reduce), 이전(Transfer), 수용(Accept).", "parts": ["회피(Avoid)", "감소(Reduce)", "이전(Transfer)", "수용(Accept)"], "hint": "TRACK", "memo": "강사 정리 TRACK = Transfer·Reduce·Avoid·Accept"}, {"id": "q-5-12", "ch": "5", "card": "리스크관리 전략·대응 4유형", "imp": 2, "sem": true, "type": "cloze", "q": "사이버보험 가입이나 아웃소싱은 리스크 대응(Risk Treatment) 4유형 중 ___ 에 해당하고, 고위험 국가 진출 취소는 ___ 에 해당합니다.", "a": "보험·아웃소싱은 이전(Transfer), 진출 취소는 회피(Avoid)임.", "blanks": ["이전", "회피"], "alt": [["Transfer", "이전(Transfer)"], ["Avoid", "회피(Avoid)", "Terminate"]]}, {"id": "q-5-13", "ch": "5", "card": "수용능력·선호·허용·한도", "imp": 3, "sem": false, "type": "list", "q": "리스크 관리 기준 4단계 계층을 위에서부터 순서대로 말해 보세요.", "a": "수용능력(Risk Bearing Capacity), 선호(Risk Appetite), 허용(Risk Tolerance), 한도(Risk Limit).", "parts": ["수용능력(Risk Bearing Capacity)", "선호(Risk Appetite)", "허용(Risk Tolerance)", "한도(Risk Limit)"], "memo": "큰 범위에서 작은 운영 단위로: 수용능력 ⊃ 선호 → 허용 → 한도"}, {"id": "q-5-14", "ch": "5", "card": "수용능력·선호·허용·한도", "imp": 3, "sem": false, "type": "cloze", "q": "리스크 선호(Risk Appetite)는 ___ 가 설정하고, 리스크 한도(Risk Limit)는 ___ 위험 유형별로 설정하며, 절차·한도는 최소 연 ___회 검토합니다.", "a": "선호는 이사회(BOD, Directors)가 설정하고, 한도는 8대 위험 유형별로 두며, 최소 연 1회 정기 검토함.", "blanks": ["이사회(BOD)", "8대", "1"], "alt": [["이사회(Directors)", "Directors", "BOD", "Direksi"], ["8"], ["1회", "한"]]}, {"id": "q-5-15", "ch": "5", "card": "수용능력·선호·허용·한도", "imp": 3, "sem": false, "type": "mc", "q": "「넘으면 조치가 필요한 상한」에 해당하는 개념은 무엇입니까?", "a": "허용(Risk Tolerance)은 운영상 수용 가능한 최대 위험으로, 넘으면 조치가 필요함. 선호는 목표 운영 범위임.", "choices": ["수용능력(Risk Bearing Capacity)", "선호(Risk Appetite)", "허용(Risk Tolerance)", "한도(Risk Limit)"], "correct": 2}, {"id": "q-5-16", "ch": "5", "card": "수용능력·선호·허용·한도", "imp": 3, "sem": false, "type": "cloze", "q": "KBBF가 대주주와 정한 조기경보선은 자본비율(Capital Ratio) ___%, Gearing ___배, NPF ___% 입니다.", "a": "자본비율 12%, Gearing 8배, NPF 4% 도달 시 대주주 추가 지원. 규정 한도(자본비율 10%, Gearing 10배)보다 앞선 경보선임.", "blanks": ["12", "8", "4"], "memo": "12-8-4: 규정 한도 10%·10배보다 먼저 울리는 선"}, {"id": "q-5-17", "ch": "5", "card": "리스크관리 정책 구성", "imp": 2, "sem": false, "type": "list", "q": "PADK 48/2025상 리스크관리 정책에 들어가야 할 최소 6가지를 말해 보세요.", "a": "업무 관련 위험 결정, 측정방법·리스크관리정보시스템, 선호(Risk Appetite)·허용(Risk Tolerance)·한도(Risk Limit), 위험등급 평가, 최악 상황(worst case scenario) 비상계획(contingency plan), 내부통제시스템.", "parts": ["업무 관련 위험 결정", "측정방법·리스크관리정보시스템", "선호(Risk Appetite)·허용(Risk Tolerance)·한도(Risk Limit)", "위험등급 평가", "최악 상황(worst case scenario) 비상계획(contingency plan)", "내부통제시스템"]}, {"id": "q-5-18", "ch": "5", "card": "리스크관리위원회·부서·기능", "imp": 2, "sem": true, "type": "cloze", "q": "리스크관리위원회(Risk Management Committee)는 이사의 ___ 이상으로 구성하고, 리스크관리 기능(Risk Management Function)은 대표이사(President Director) 또는 ___ 에게 직접 보고합니다.", "a": "위원회는 이사의 절반 이상(그중 1명은 컴플라이언스·리스크관리 담당 이사)으로 구성하며, 리스크관리 기능은 대표이사 또는 리스크관리 담당 이사에게 직접 책임짐.", "blanks": ["절반", "리스크관리 담당 이사"], "alt": [["과반", "1/2", "50%"], ["리스크 담당 이사", "리스크관리 이사"]]}, {"id": "q-5-19", "ch": "5", "card": "리스크관리위원회·부서·기능", "imp": 2, "sem": true, "type": "mc", "q": "리스크감시위원회(Risk Monitoring Committee)는 어느 기관 소속입니까?", "a": "리스크감시위원회는 감사회(BOC, Board of Commissioners) 소속으로 정책과 이행의 정합성을 감독함. 리스크관리위원회(Risk Management Committee)는 이사회(BOD, Directors) 소속(비상설)임.", "choices": ["이사회(BOD)", "감사회(BOC)", "주주총회", "리스크관리부서"], "correct": 1, "memo": "관리위원회 = 이사회(BOD, 실행), 감시위원회 = 감사회(BOC, 감독)"}, {"id": "q-5-20", "ch": "5", "card": "3선 모델(Three Lines Model)", "imp": 2, "sem": true, "type": "cloze", "q": "3선 모델(Three Lines Model)에서 1선은 ___, 2선은 ___, 3선은 ___ 입니다.", "a": "1선은 상품·서비스를 제공하는 사업부, 2선은 리스크관리·컴플라이언스 등 지원·견제(challenge) 기능, 3선은 독립적 보증을 하는 내부감사(Internal Audit)임.", "blanks": ["사업부", "리스크관리·컴플라이언스", "내부감사"], "alt": [["영업", "영업·심사", "현업"], ["리스크관리", "컴플라이언스", "리스크·컴플라이언스"], ["Internal Audit"]]}, {"id": "q-5-21", "ch": "5", "card": "3선 모델(Three Lines Model)", "imp": 2, "sem": true, "type": "list", "q": "3선(내부감사)의 독립성 요건 3가지를 말해 보세요.", "a": "지배기구(Governing Body)에 대한 책임, 사람·자원·데이터 접근, 감사 계획·수행에서 편향·간섭 배제.", "parts": ["지배기구(Governing Body)에 대한 책임", "사람·자원·데이터 접근", "감사 계획·수행에서 편향·간섭 배제"], "memo": "1선과 2선은 결합할 수 있고, 3선은 독립 요건 3가지를 갖춰야 함"}, {"id": "q-5-22", "ch": "5", "card": "리스크 문화 6단계·5특징", "imp": 2, "sem": false, "type": "list", "q": "리스크 문화 이행 6단계를 순서대로 말해 보세요.", "a": "리더십 헌신(Tone at the Top), 리스크 교육, 정책·절차, 인식 캠페인, 보상과 제재, 모니터링·평가.", "parts": ["리더십 헌신(Tone at the Top)", "리스크 교육", "정책·절차", "인식 캠페인", "보상과 제재", "모니터링·평가"]}, {"id": "q-5-23", "ch": "5", "card": "IT 리스크관리(자산 구간별 의무)", "imp": 2, "sem": false, "type": "cloze", "q": "총자산 Rp___ 초과~Rp1조는 데이터센터와 정기 백업, 총자산 Rp___ 초과는 데이터센터·재해복구센터(DRC)와 IT 운영위원회(IT steering committee)를 갖춰야 합니다.", "a": "Rp500bn 이하는 정기 백업, Rp500bn 초과~Rp1조는 데이터센터+백업, Rp1조 초과는 데이터센터+DRC+IT 운영위원회. KBBF는 총자산 1,473.4bn(8월말)으로 Rp1조 초과 구간임.", "blanks": ["500bn", "1조"], "alt": [["500", "5,000억"], ["1,000bn", "1000bn", "1조 루피아"]]}, {"id": "q-5-24", "ch": "5", "card": "건강도 평가 4요소·5등급", "imp": 3, "sem": true, "type": "list", "q": "건강도 평가(Health Level) 4요소를 말해 보세요.", "a": "GCG, 리스크 프로필(Risk Profile), 수익성(Profitability), 자본(Capital).", "parts": ["GCG", "리스크 프로필(Risk Profile)", "수익성(Profitability)", "자본(Capital)"], "hint": "G-R-P-C", "memo": "NPF는 리스크 프로필(신용위험)의 한 지표로, 4요소에 따로 넣지 않음"}, {"id": "q-5-25", "ch": "5", "card": "건강도 평가 4요소·5등급", "imp": 3, "sem": true, "type": "list", "q": "건강도(Health Level) 종합등급(Composite Rating) 5단계의 명칭을 1등급부터 말해 보세요.", "a": "1 매우 건전(Very Healthy), 2 건전(Healthy), 3 상당히 건전(Fairly Healthy), 4 다소 미흡(Less Healthy), 5 불건전(Unhealthy).", "parts": ["1 매우 건전(Very Healthy)", "2 건전(Healthy)", "3 상당히 건전(Fairly Healthy)", "4 다소 미흡(Less Healthy)", "5 불건전(Unhealthy)"], "memo": "숫자가 클수록 나쁨"}, {"id": "q-5-26", "ch": "5", "card": "건강도 평가 4요소·5등급", "imp": 3, "sem": true, "type": "cloze", "q": "건강도(Health Level) 종합 4등급은 ___ 대상, 5등급은 ___ 대상입니다.", "a": "종합 4등급은 집중감독(Intensive), 5등급은 특별감독(Special, POJK 49/2024).", "blanks": ["집중감독", "특별감독"], "alt": [["intensive", "집중"], ["special", "특별"]]}, {"id": "q-5-27", "ch": "5", "card": "건강도 평가 4요소·5등급", "imp": 3, "sem": true, "type": "list", "q": "건강도(Health Level) 종합 2등급 이상이 요건인 업무 4가지를 말해 보세요.", "a": "운전자금·자금대출(FMU·FD), 기타 금융사업, 인프라금융, 외화차입.", "parts": ["운전자금·자금대출(FMU·FD)", "기타 금융사업", "인프라금융", "외화차입"]}, {"id": "q-5-28", "ch": "5", "card": "감독 방식과 감독 상태 3단계", "imp": 3, "sem": true, "type": "list", "q": "집중감독(Intensive) 지정 기준 3가지를 말해 보세요.", "a": "건강도(Health Level) 종합 4등급, 자기자본/납입자본 0% 이상 50% 미만, Net NPF 5% 초과 25% 이하.", "parts": ["건강도 종합 4등급", "자기자본/납입자본 0% 이상 50% 미만", "Net NPF 5% 초과 25% 이하"], "memo": "숫자 짝: 집중 50%·5%, 특별 0%·25%"}, {"id": "q-5-29", "ch": "5", "card": "감독 방식과 감독 상태 3단계", "imp": 3, "sem": true, "type": "cloze", "q": "특별감독(Special) 기준은 건강도(Health Level) 종합 ___등급, 자기자본/납입자본 ___% 미만, Net NPF ___% 초과, 또는 집중감독(Intensive) 기간 종료입니다.", "a": "종합 5등급, 자기자본/납입자본 0% 미만, Net NPF 25% 초과, 또는 집중감독 기간 종료 시 특별감독.", "blanks": ["5", "0", "25"]}, {"id": "q-5-30", "ch": "5", "card": "감독 방식과 감독 상태 3단계", "imp": 3, "sem": true, "type": "cloze", "q": "OJK 감독 방식 2가지는 보고서·데이터를 분석하는 ___ 감독과 회의·검사를 하는 ___ 감독입니다.", "a": "간접감독(보고서·감독데이터 모니터링·분석)과 직접감독(대면 회의, 검사).", "blanks": ["간접", "직접"], "alt": [["off-site", "간접감독"], ["on-site", "직접감독"]]}, {"id": "q-5-31", "ch": "5", "card": "감독 방식과 감독 상태 3단계", "imp": 3, "sem": true, "type": "cloze", "q": "KBBF 8월말 자기자본/납입자본은 ___%, Net NPF는 ___% 입니다.", "a": "자기자본/납입자본 58.96%, Net NPF 0.94%(8월말). 집중감독(Intensive) 기준 50%까지 여유는 약 9%p임.", "blanks": ["58.96", "0.94"]}, {"id": "q-6-01", "ch": "6", "card": "사업계획 근거 규정과 철학", "imp": 2, "sem": true, "type": "cloze", "q": "사업계획(Business Plan)의 근거 규정은 POJK ___ 이고, 금융회사 서식은 SEOJK ___ 를 따릅니다.", "a": "POJK 24/POJK.05/2019(비은행금융기관 사업계획), SEOJK 23/SEOJK.05/2019(금융회사 사업계획).", "blanks": ["24/2019", "23/2019"], "alt": [["24", "24/POJK.05/2019"], ["23", "23/SEOJK.05/2019"]], "memo": "POJK 24, SEOJK 23: 숫자가 하나 차이. 교재 일부의 「POJK 23/2019」는 오기"}, {"id": "q-6-02", "ch": "6", "card": "사업계획 근거 규정과 철학", "imp": 2, "sem": true, "type": "list", "q": "교재가 제시하는 사업계획(Business Plan) 철학 4가치를 말해 보세요.", "a": "균형(Balance), 책임성(Accountability), 지속가능성(Sustainability), 협업(Collaboration).", "parts": ["균형(Balance)", "책임성(Accountability)", "지속가능성(Sustainability)", "협업(Collaboration)"], "hint": "B-A-S-C"}, {"id": "q-6-03", "ch": "6", "card": "비전·미션·가치 수립", "imp": 3, "sem": true, "type": "cloze", "q": "비전(Vision)은 회사가 달성하려는 ___ 목표이고, 미션(Mission)은 이를 달성하기 위한 ___ 접근 방식입니다.", "a": "SEOJK 23/2019 정의: 비전은 장기 목표, 미션은 단기·중기 접근 방식.", "blanks": ["장기", "단기·중기"], "alt": [["long-term"], ["단중기", "단기 및 중기", "중단기"]]}, {"id": "q-6-04", "ch": "6", "card": "비전·미션·가치 수립", "imp": 3, "sem": true, "type": "cloze", "q": "A to Z는 비전을 「To ___」, 미션을 「To ___」, 가치를 「how to ___」로 표현합니다.", "a": "비전 To Be, 미션 To Do, 가치 how to do.", "blanks": ["Be", "Do", "do"]}, {"id": "q-6-05", "ch": "6", "card": "비전·미션·가치 수립", "imp": 3, "sem": true, "type": "list", "q": "비전(Vision) 수립 고려사항 4가지를 말해 보세요.", "a": "회사 가치와 정렬(차별점), 미래 지향, 명확하고 고무적, 간결.", "parts": ["회사 가치와 정렬(차별점)", "미래 지향", "명확하고 고무적", "간결"]}, {"id": "q-6-06", "ch": "6", "card": "시장·경쟁 분석 방법", "imp": 2, "sem": true, "type": "list", "q": "교재가 제시하는 시장·경쟁 분석 방법 4가지를 말해 보세요.", "a": "PESTEL, SWOT, 산업구조 분석(Porter 5 Forces), 통계 방법.", "parts": ["PESTEL", "SWOT", "산업구조 분석(Porter 5 Forces)", "통계 방법"]}, {"id": "q-6-07", "ch": "6", "card": "시장·경쟁 분석 방법", "imp": 2, "sem": true, "type": "cloze", "q": "KBBF는 8월 기준 Fleet 비중이 약 ___%, FAR이 ___% 입니다.", "a": "Fleet 비중 약 88%, FAR 95.63%(업계 86.01%).", "blanks": ["88", "95.63"]}, {"id": "q-6-08", "ch": "6", "card": "사업계획 정의와 작성 6단계", "imp": 3, "sem": true, "type": "list", "q": "사업계획(Business Plan) 작성 6단계를 순서대로 말해 보세요.", "a": "사업 전략·목표 정의, 전략 목표 설정, KPI 결정, KPI 목표치 설정, 이니셔티브·업무계획, 예산 편성.", "parts": ["사업 전략·목표 정의", "전략 목표 설정", "KPI 결정", "KPI 목표치 설정", "이니셔티브·업무계획", "예산 편성"], "memo": "KPI 결정(③)과 KPI 목표치 설정(④)이 별도 단계"}, {"id": "q-6-09", "ch": "6", "card": "사업계획 정의와 작성 6단계", "imp": 3, "sem": true, "type": "cloze", "q": "KBBF 9월 내부 실적 기준 1~9월 신규취급은 계획 대비 ___%, 9월말 잔액은 계획 대비 ___% 입니다.", "a": "신규취급 계획 대비 108.1%, 9월말 잔액 85.9%(9월 내부 실적, OJK 미확인).", "blanks": ["108.1", "85.9"]}, {"id": "q-6-10", "ch": "6", "card": "사업계획 정의와 작성 6단계", "imp": 3, "sem": true, "type" 년 ___월 말입니다.", "a": "PADK 48/2025 시행 6개월 내, 2026년 6월 말까지 정책 정비 필요. KBBF는 완료 여부 확인 필요.", "blanks": ["6"], "alt": [["6월"]]}, {"id": "q-6-37", "ch": "6", "card": "준수 수준 분석", "imp": 2, "sem": false, "type": "list", "q": "준수 수준 분석 방법 4가지를 말해 보세요.", "a": "정성 서술, 정량 통계, 리스크 기반 분석, 벤치마킹.", "parts": ["정성 서술", "정량 통계", "리스크 기반 분석", "벤치마킹"]}, {"id": "q-6-38", "ch": "6", "card": "컴플라이언스 문화 3계층·파라미터 10", "imp": 2, "sem": true, "type": "list", "q": "컴플라이언스 문화 3계층을 말해 보세요.", "a": "전략 수준, 운영 수준, 개인 수준.", "parts": ["전략 수준", "운영 수준", "개인 수준"], "memo": "4-Eyes Principle과 이중통제(Dual Control)는 운영 수준"}, {"id": "q-6-39", "ch": "6", "card": "컴플라이언스 문화 3계층·파라미터 10", "imp": 2, "sem": true, "type": "list", "q": "컴플라이언스 문화 평가 파라미터 10가지를 말해 보세요.", "a": "경영진 헌신(Commitment from Company Leadership), 내부통제체계, 규정 준수(업무 반영·전파), 교육과 필수 인증, 위반·잠재 위반 건수, 직원 규율 수준, 내부고발제도(WBS), 내·외부 감사 결과, 컴플라이언스 리스크 평가, 보상과 제재 체계.", "parts": ["경영진 헌신(Commitment from Company Leadership)", "내부통제체계", "규정 준수(업무 반영·전파)", "교육과 필수 인증", "위반·잠재 위반 건수", "직원 규율 수준", "내부고발제도(WBS)", "내·외부 감사 결과", "컴플라이언스 리스크 평가", "보상과 제재 체계"]}, {"id": "q-6-40", "ch": "6", "card": "컴플라이언스 문화 이행 9단계", "imp": 3, "sem": true, "type": "list", "q": "컴플라이언스 문화 이행 9단계를 순서대로 말해 보세요.", "a": "경영진 헌신(Commitment from Company Leadership), 정책 개발, 강한 컴플라이언스 기능, 교육과 전파(Training and Outreach), 교육과 사회화(Training and Socialization), 정기 평가·감독, 조직문화 강화, 제재와 보상, 지속 개선.", "parts": ["경영진 헌신(Commitment from Company Leadership)", "정책 개발", "강한 컴플라이언스 기능", "교육과 전파(Training and Outreach)", "교육과 사회화(Training and Socialization)", "정기 평가·감독", "조직문화 강화", "제재와 보상", "지속 개선"], "memo": "교재상 4·5단계 내용이 중복 기재됨"}, {"id": "q-6-41", "ch": "6", "card": "컴플라이언스 문화 이행 9단계", "imp": 3, "sem": true, "type": "short", "q": "컴플라이언스 기능의 보고선과 독립성은 어떻게 갖춥니까?", "a": "독립 부서로 두고 최고경영진 또는 감사회(BOC, Board of Commissioners)에 직접 보고하게 하며, 컴플라이언스 이사나 리스크관리 이사 산하에 두는 것이 적절함.", "key": ["독립", "감사회(BOC)", "직접 보고"]}, {"id": "q-7-01", "ch": "7", "card": "부정방지 전략 정의와 적용", "imp": 3, "sem": true, "type": "cloze", "q": "부정방지 전략(Anti-Fraud Strategy)의 근거는 POJK ___ 이고, 금융회사는 ___ 부터 적용합니다.", "a": "POJK 12/2024(금융서비스기관 부정방지 전략 이행), 금융회사는 2024년 10월 23일부터 적용.", "blanks": ["12/2024", "2024년 10월 23일"], "alt": [["12"], ["2024-10-23", "2024.10.23"]], "memo": "SIPELAKU는 POJK 28/2024로 번호가 다름"}, {"id": "q-7-02", "ch": "7", "card": "부정방지 전략 정의와 적용", "imp": 3, "sem": true, "type": "list", "q": "부정 삼각형(Fraud Triangle) 3요소를 말해 보세요.", "a": "압박(Pressure), 합리화(Rationalization), 기회(Opportunity).", "parts": ["압박(Pressure)", "합리화(Rationalization)", "기회(Opportunity)"], "memo": "기회는 주로 약한 내부통제에서 생김"}, {"id": "q-7-03", "ch": "7", "card": "부정방지 전략 정의와 적용", "imp": 3, "sem": true, "type": "mc", "q": "다음 중 부정 발생 원인 3요소(Fraud Triangle)에 해당하는 목록은 무엇입니까?", "a": "Fraud Triangle은 압박·합리화·기회. 예방~모니터링은 4대 축(Four Pillars), 감독~통제모니터링은 부정통제(Fraud Control) 4요소, 부패~재무보고 부정은 부정 행위 분류임.", "choices": ["예방·탐지·조사·모니터링", "압박·합리화·기회", "적극적 감독·정책절차·조직구조·통제모니터링", "부패·자산 유용·재무보고 부정"], "correct": 1}, {"id": "q-7-04", "ch": "7", "card": "부정 행위 5대 분류", "imp": 2, "sem": false, "type": "list", "q": "부정 행위 5대 분류를 말해 보세요.", "a": "부패(Corruption), 자산 유용(Asset Misappropriation), 재무보고 부정(Financial Reporting Fraud), 기밀정보 유출(Leakage of Confidential Information), 기타 부정에 준하는 행위(Other Acts Equated with Fraud).", "parts": ["부패(Corruption)", "자산 유용(Asset Misappropriation)", "재무보고 부정(Financial Reporting Fraud)", "기밀정보 유출(Leakage of Confidential Information)", "기타 부정에 준하는 행위(Other Acts Equated with Fraud)"]}, {"id": "q-7-05", "ch": "7", "card": "부정방지 전략 4대 축과 세부 수단", "imp": 3, "sem": true, "type": "list", "q": "부정방지 전략(Anti-Fraud Strategy) 4대 축(Four Pillars)을 순서대로 말해 보세요.", "a": "예방(Prevention), 탐지(Detection), 조사·보고·제재(Investigation, Reporting and Sanctions), 모니터링·평가·후속조치(Monitoring, Evaluation and Follow-up).", "parts": ["예방(Prevention)", "탐지(Detection)", "조사·보고·제재(Investigation, Reporting and Sanctions)", "모니터링·평가·후속조치(Monitoring, Evaluation and Follow-up)"], "hint": "P-D-I-M", "memo": "P-D-I-M. 세 번째 축은 조사·보고·제재가 하나의 축"}, {"id": "q-7-06", "ch": "7", "card": "부정방지 전략 4대 축과 세부 수단", "imp": 3, "sem": true, "type": "list", "q": "탐지(Detection) 축의 세부 수단 3가지를 말해 보세요.", "a": "내부고발 정책·체계(Whistleblowing), 불시 점검(surprise audit), 감시 체계(비공개 시험·검사).", "parts": ["내부고발 정책·체계(Whistleblowing)", "불시 점검(surprise audit)", "감시 체계(비공개 시험·검사)"]}, {"id": "q-7-07", "ch": "7", "card": "부정방지 전략 4대 축과 세부 수단", "imp": 3, "sem": true, "type": "list", "q": "내부고발제도(Whistleblowing)의 핵심 요소 3가지를 말해 보세요.", "a": "제보자 보호, 보고 규정, 보고 이후 처리 체계.", "parts": ["제보자 보호", "보고 규정", "보고 이후 처리 체계"]}, {"id": "q-7-08", "ch": "7", "card": "부정방지 전략 4대 축과 세부 수단", "imp": 3, "sem": true, "type": "cloze", "q": "KBBF 내부고발은 ___영업일 내 분류, ___일 내 종결을 기준으로 하고, 반부패 교육은 ___개월마다 전 직원에게 실시합니다.", "a": "익명 내부고발 5영업일 내 분류·60일 내 종결, 반부패 교육 2개월마다 전 직원 대상.", "blanks": ["5", "60", "2"]}, {"id": "q-7-09", "ch": "7", "card": "부정통제 4요소", "imp": 2, "sem": false, "type": "list", "q": "부정통제(Fraud Control)체계 4요소를 말해 보세요.", "a": "이사회(BOD, Directors)·감사회(BOC, Board of Commissioners)의 적극적 감독, 정책·절차, 조직구조·책임성, 통제·모니터링.", "parts": ["이사회(BOD, Directors)·감사회(BOC, Board of Commissioners)의 적극적 감독", "정책·절차", "조직구조·책임성", "통제·모니터링"], "memo": "리스크관리 4대 요소와 앞 두 개가 같고, 뒤 두 개가 조직구조·책임성, 통제·모니터링으로 다름"}, {"id": "q-7-10", "ch": "7", "card": "부정방지 전담 조직과 핵심 의무 7", "imp": 3, "sem": true, "type": "cloze", "q": "부정방지 전담 부서는 ___ 에 책임지고, ___ 와 직접 소통·보고합니다.", "a": "전담 부서는 이사회(BOD, Directors)에 책임지고 감사회(BOC, Board of Commissioners)와 직접 소통·보고함.", "blanks": ["이사회(BOD)", "감사회(BOC)"], "alt": [["이사회(Directors)", "이사", "Directors", "BOD", "Direksi"], ["BOC", "커미셔너회", "Board of Commissioners"]]}, {"id": "q-7-11", "ch": "7", "card": "부정방지 전담 조직과 핵심 의무 7", "imp": 3, "sem": true, "type": "num", "q": "부정방지 교육·인식 활동은 최소 연 몇 회 해야 합니까?", "a": "최소 연 1회. KBBF는 2개월마다 전 직원 대상으로 실시함.", "accept": ["1", "1회"], "unit": "회"}, {"id": "q-7-12", "ch": "7", "card": "부정방지 전담 조직과 핵심 의무 7", "imp": 3, "sem": true, "type": "short", "q": "외주업체 직원의 과실로 소비자가 부정 손실을 입으면 누가 책임집니까?", "a": "회사(LJK)가 법에 따라 책임짐. 이사·감사(BOC 위원)·직원·외주업체 과실 모두 해당함.", "key": ["회사", "책임"]}, {"id": "q-7-13", "ch": "7", "card": "부정방지 전담 조직과 핵심 의무 7", "imp": 3, "sem": true, "type": "list", "q": "조직 구조 답변에서 반드시 언급해야 할 기능 3가지를 말해 보세요.", "a": "AML·CFT 기능, 부정방지(AFU) 기능, 소비자보호 기능.", "parts": ["AML·CFT 기능", "부정방지(AFU) 기능", "소비자보호 기능"]}, {"id": "q-7-14", "ch": "7", "card": "부정방지 전략 모니터링·평가", "imp": 2, "sem": true, "type": "list", "q": "부정방지 실행계획의 6요소를 말해 보세요.", "a": "발견사항(Findings), 리스크, 실행계획(Action Plan), 담당(PIC), 기한(Deadline), 성공 지표(Indicator).", "parts": ["발견사항(Findings)", "리스크", "실행계획(Action Plan)", "담당(PIC)", "기한(Deadline)", "성공 지표(Indicator)"]}, {"id": "q-7-15", "ch": "7", "card": "부정방지 OJK 보고 의무와 기한", "imp": 3, "sem": true, "type": "num", "q": "부정방지 전략을 변경하면 변경 후 몇 영업일 이내에 OJK에 보고합니까?", "a": "전략 변경 후 7영업일 이내(부속서 I).", "accept": ["7", "7영업일"], "unit": "영업일", "memo": "변경 7, 중대 사건 6: 사건이 하루 더 빠름"}, {"id": "q-7-16", "ch": "7", "card": "부정방지 OJK 보고 의무와 기한", "imp": 3, "sem": true, "type": "num", "q": "중대 영향 부정 사건은 식별 후 몇 영업일 이내에 OJK에 보고합니까?", "a": "식별 후 6영업일 이내(부속서 III).", "accept": ["6", "6영업일"], "unit": "영업일"}, {"id": "q-7-17", "ch": "7", "card": "부정방지 OJK 보고 의무와 기한", "imp": 3, "sem": true, "type": "cloze", "q": "부정방지 이행 보고서는 매년 12월 말 기준으로 다음 해 ___ 까지 제출하고, 최초 전략은 POJK 12/2024 시행 후 ___개월 이내에 제출합니다.", "a": "이행 보고서는 다음 해 1월 31일까지(최초 2025년 1월 31일), 최초 전략은 시행 후 6개월 이내.", "blanks": ["1월 31일", "6"], "alt": [["1/31", "1월31일"], ["6개월"]]}, {"id": "q-7-18", "ch": "7", "card": "부정방지 OJK 보고 의무와 기한", "imp": 3, "sem": true, "type": "list", "q": "중대 영향 부정으로 판단하는 기준 3가지를 말해 보세요.", "a": "행위자의 법령 중대 위반, 회사 사업 연속성 위협, 공중의 관심을 끌거나 평판을 해칠 가능성.", "parts": ["행위자의 법령 중대 위반", "회사 사업 연속성 위협", "공중의 관심을 끌거나 평판을 해칠 가능성"]}, {"id": "q-7-19", "ch": "7", "card": "부정방지 의무 위반 제재", "imp": 2, "sem": false, "type": "short", "q": "이사회(BOD, Directors)·감사회(BOC, Board of Commissioners)가 부정방지 전략(Anti-Fraud Strategy)의 효과적 이행을 보장한 증빙이 없으면 어떤 제재가 가능합니까?", "a": "서면경고와 주요 당사자(Primary Party) 지정 금지가 가능함.", "key": ["서면경고", "주요 당사자", "지정 금지"]}, {"id": "q-7-20", "ch": "7", "card": "SIPELAKU 부정행위자 이력정보", "imp": 2 function score(q){ const b=box[q.id]; if(!b) return 1; return b.g===1?0:b.g===2?2:3; }
function build(){
  let list=Q.filter(inScope);

function stats(){

  const el=$('card');
  if(!queue.length){ el.innerHTML=`<div class="done"><b>${mode==='weak'?'모름·애매로 표시한 문항이 없습니다.':'이 범위에 문항이 없습니다.'}</b><button class="primary" type="button" id="toDue">오늘의 학습으로</button></div>`; $('toDue').onclick=()=>{mode='due';build();}; return; }
  if(pos>=queue.length){ el.innerHTML=`<div class="done"><b>${sessionDone}문항을 마쳤습니다.</b><span class="hint">모름·애매로 표시한 문항은 다음 「오늘의 학습」에 먼저 나옵니다.</span><div class="actions"><button class="primary" type="button" id="again">다음 20문항</button><button class="btn" type="button" id="weak">모름·애매만 다시</button></div></div>`; $('again').onclick=()=>{mode='due';build();}; $('weak').onclick=()=>{mode='weak';build();}; return; }
  const q=queue[pos]; revealed=false;
  let h=`<div class="meta"><span class="chip t">${TY[q.type]}</span><span class="chip st">${'★'.repeat(q.imp)}</span>${q.sem?'<span class="chip s">강사 강조</span>':''}<span>${CH[q.ch]} · ${q.card}</span><span style="margin-left:auto;font-family:var(--mono)">${pos+1} / ${queue.length}</span></div>
    <div class="q">${qText(q)}</div>`;
  if(q.type==='cloze') h+=`<div class="blanks">${q.blanks.map((_,i)=>`<label>빈칸 ${i+1}<input type="text" id="b${i}" autocomplete="off"></label>`).join('')}</div>`;
  else if(q.type==='num') h+=`<label class="hint" for="num">답 (${q.unit||'숫자'})</label><input type="text" id="num" autocomplete="off" inputmode="decimal">`;
  else if(q.type==='mc') h+=`<div class="choices">${q.choices.map((c,i)=>`<button type="button" data-i="${i}"><span class="n">${i+1}</span><span>${c}</span></button>`).join('')}</div>`;
  else h+=`<textarea id="txt" placeholder="${q.type==='bundle'?'면접에서 답하듯 떠오르는 요소를 적어 보세요. 머릿속으로 말해 보고 바로 정답을 확인해도 됩니다.':q.type==='list'?'떠오르는 대로 적어 보세요. 적지 않고 머릿속으로 떠올려도 됩니다.':'핵심 단어 위주로 짧게 적어 보세요. 생략해도 됩니다.'}"></textarea>`;
  if(q.hint) h+=`<details class="hint"><summary>힌트</summary>${q.hint}</details>`;
  if(q.type!=='mc') h+=`<div class="actions"><button class="primary" type="button" id="show">정답 확인 (Enter)</button></div>`;
  h+=`<div id="ans"></div>`;
  el.innerHTML=h;
  if(q.type==='mc') el.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>reveal(+b.dataset.i));
  else { $('show').onclick=()=>reveal(); const f=el.querySelector('input,textarea'); if(f) f.focus(); }
}
function reveal(pick){
  if(revealed) return; revealed=true; if(document.activeElement&&document.activeElement.blur) document.activeElement.blur();
  const q=queue[pos]; let h='<div class="ans">'; suggested=0;
  if(q.type==='list'||q.type==='bundle'){
    const t=norm(($('txt')||{}).value); let hits=0;
    const ps=q.parts.map(p=>{ const seg=q.type==='bundle'&&p.includes(':')?p.split(':').slice(1).join(':'):p.split(/[–\-—:(]/)[0]; const core=norm(seg); const hit=t&&core.length>=2&&t.includes(core.slice(0,Math.min(core.length,6))); if(hit)hits++; return {p,hit}; });
    h+=`<h3>${q.type==='bundle'?'핵심 요소':'정답'} ${q.parts.length}개 · 기억한 항목에 체크하세요</h3><ul class="parts">${ps.map((x,i)=>`<li><label class="${x.hit?'hit':''}"><input type="checkbox" ${x.hit?'checked':''} data-i="${i}"><span>${x.p}</span></label></li>`).join('')}</ul>`;
    suggested=hits===q.parts.length?3:hits>0?2:0;
  } else if(q.type==='cloze'){
    let ok=0; const rows=q.blanks.map((b,i)=>{ const v=$('b'+i).value; const alts=[b,...((q.alt&&q.alt[i])||[])].map(norm); const nv=norm(v); const good=nv&&alts.some(a=>a&&(nv===a||nv.includes(a)||(a.includes(nv)&&nv.length>=Math.max(2,a.length*0.6)))); if(good)ok++; return `<div>빈칸 ${i+1}: <span class="${good?'o':'x'}">${good?'맞음':'확인'}</span> 정답 <b>${b}</b>${v?` · 내 답 ${v.replace(/</g,'&lt;')}`:''}</div>`; });
    h+=`<div class="res">${rows.join('')}</div>`; suggested=ok===q.blanks.length?3:ok>0?2:1;
  } else if(q.type==='num'){
    const v=$('num').value; const nv=normKeep(v); const good=!!nv&&q.accept.some(a=>{const na=normKeep(a); return nv===na||(nv.replace(/[^\d.]/g,'')!==''&&nv.replace(/[^\d.]/g,'')===na.replace(/[^\d.]/g,''));});
    h+=`<div class="res"><div><span class="${good?'o':'x'}">${good?'맞음':'확인'}</span> 정답 <b>${q.accept[0]}${q.unit&&!/[^\d.]/.test(q.accept[0])?' '+q.unit:''}</b>${v?` · 내 답 ${v.replace(/</g,'&lt;')}`:''}</div></div>`; suggested=good?3:1;
  } else if(q.type==='mc'){
    const bs=$('card').querySelectorAll('.choices button'); bs.forEach((b,i)=>{ b.disabled=true; if(i===q.correct)b.classList.add('right'); else if(i===pick)b.classList.add('wrong'); });
    suggested=pick===q.correct?3:1;
  } else {
    const t=norm(($('txt')||{}).value); const ks=(q.key||[]).map(k=>({k,got:t&&t.includes(norm(k).slice(0,6))}));
    if(ks.length) h+=`<h3>들어가야 할 핵심어</h3><div class="keys">${ks.map(x=>`<span class="${x.got?'got':''}">${x.k}</span>`).join('')}</div>`;
    const g=ks.filter(x=>x.got).length; suggested=!t?0:g===ks.length?3:g>0?2:1;
  }
  h+=`<h3>모범 답</h3><div class="model">${q.a}</div>`;
  if(q.memo) h+=`<div class="memo">외우는 법 · ${q.memo}</div>`;
  h+=`<h3>스스로 채점 (키보드 1·2·3)</h3><div class="grade"><button type="button" class="g1" data-g="1">모름<small>곧 다시 나옴</small></button><button type="button" class="g2" data-g="2">애매<small>한 번 더</small></button><button type="button" class="g3" data-g="3">앎<small>뒤로 미룸</small></button></div></div>`;
  $('ans').innerHTML=h;
  const sh=$('show'); if(sh) sh.parentElement.remove();
  $('ans').querySelectorAll('.parts input').forEach(c=>c.onchange=()=>{ c.closest('label').classList.toggle('hit',c.checked); const all=[...$('ans').querySelectorAll('.parts input')]; const n=all.filter(x=>x.checked).length; mark(n===all.length?3:n>0?2:1); });
  $('ans').querySelectorAll('.grade button').forEach(b=>b.onclick=()=>grade(+b.dataset.g));
  if(suggested) mark(suggested);
  $('ans').querySelector('.grade').scrollIntoView({block:'nearest'});
}
function mark(g){ $('ans').querySelectorAll('.grade button').forEach(b=>b.classList.toggle('sug',+b.dataset.g===g)); }
function grade(g){ const q=queue[pos]; const b=box[q.id]||{n:0}; box[q.id]={g,n:(b.n||0)+1,t:Date.now()}; save(); sessionDone++; pos++; draw(); }
function chips(){ $('chs').innerHTML=Object.keys(CH).map(k=>`<button type="button" data-c="${k}" aria-pressed="false">${CH[k]}</button>`).join(''); }
chips();
document.addEventListener('click',e=>{
  const st=e.target.closest('[data-set]'); if(st){ SET=st.dataset.set; Q=SET==='d'?QD:QB; try{localStorage.setItem('ojkQuizSet',SET)}catch(x){} build(); return; }
  const m=e.target.closest('[data-m]'), s=e.target.closest('[data-s]'), c=e.target.closest('[data-c]');
  if(m){ mode=m.dataset.m; build(); }
  else if(s){ scope=s.dataset.s; build(); }
  else if(c){ chSel=chSel===c.dataset.c?null:c.dataset.c; build(); }
});
$('reset').onclick=()=>{ const b=$('reset'); if(b.dataset.arm){ box={}; save(); delete b.dataset.arm; b.textContent='기록 초기화'; build(); } else { b.dataset.arm='1'; b.textContent='한 번 더 누르면 초기화'; setTimeout(()=>{delete b.dataset.arm; b.textContent='기록 초기화';},3000); } };
document.addEventListener('keydown',e=>{
  const q=queue[pos]; if(!q) { if(e.key==='Enter'){ const a=$('again'); if(a) a.click(); } return; }
  const typing=/INPUT|TEXTAREA/.test(e.target.tagName);
  if(!revealed){
    if(e.key==='Enter'&&!(e.target.tagName==='TEXTAREA'&&e.shiftKey)){ if(q.type!=='mc'){ e.preventDefault(); reveal(); } }
    else if(q.type==='mc'&&!typing&&/^[1-4]$/.test(e.key)&&+e.key<=q.choices.length){ reveal(+e.key-1); }
    return;
  }
  if(typing) return;
  if(/^[123]$/.test(e.key)) grade(+e.key);
  else if(e.key==='Enter'){ const s=$('ans').querySelector('.grade .sug'); if(s) s.click(); }
});
build();
</script>
