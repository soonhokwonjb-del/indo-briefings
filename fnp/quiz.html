<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OJK 규정 암기 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 위쪽 범위·모드 선택과 진도 막대 / 가운데 문제 카드 한 장(풀기 → 정답 확인 → 스스로 채점) / 아래 단축키 */
:root{
  --bg:#f1f3f6; --panel:#ffffff; --ink:#18212e; --muted:#5a6575; --line:#d8dde5;
  --accent:#24477f; --accent-soft:#e2e9f5;
  --ok:#2f6b47; --ok-soft:#e3f0e8; --mid:#93570a; --mid-soft:#fbefd9; --no:#a8321f; --no-soft:#fae4df; --sem:#7a3e8f; --sem-soft:#f3e8f6;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --panel:#1a2029; --ink:#e3e8ef; --muted:#9aa5b4; --line:#2e3644; --accent:#8fb0ff; --accent-soft:#223152;
  --ok:#7fc59a; --ok-soft:#1d3327; --mid:#e6b25e; --mid-soft:#3a2d17; --no:#f08f7d; --no-soft:#3b211c; --sem:#d7a6e8; --sem-soft:#33233a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --panel:#1a2029; --ink:#e3e8ef; --muted:#9aa5b4; --line:#2e3644; --accent:#8fb0ff; --accent-soft:#223152;
  --ok:#7fc59a; --ok-soft:#1d3327; --mid:#e6b25e; --mid-soft:#3a2d17; --no:#f08f7d; --no-soft:#3b211c; --sem:#d7a6e8; --sem-soft:#33233a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;margin:0;padding-inline:16px;padding-block:14px}
.wrap{max-width:900px;margin:0 auto;display:grid;gap:12px}
header{display:grid;gap:10px}
h1{font-size:20px;margin:0}
h1 small{font-size:12.5px;font-weight:400;color:var(--muted);margin-left:8px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bar .lab{font-size:12px;color:var(--muted);margin-right:2px}
.bar button,.btn{font:inherit;font-size:13px;padding:4px 10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.stats b{font-family:var(--mono);color:var(--ink)}
.meter{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);flex:1;min-width:160px}
.meter i{display:block;height:100%}
.meter .k{background:var(--ok)} .meter .m{background:var(--mid)} .meter .n{background:var(--no)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 22px;display:grid;gap:14px;min-width:0}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.chip{border-radius:4px;padding:1px 7px;font-weight:600;font-size:12px}
.chip.t{background:var(--accent-soft);color:var(--accent)}
.chip.s{background:var(--sem-soft);color:var(--sem)}
.chip.st{color:var(--mid);letter-spacing:-1px}
.q{font-size:20px;font-weight:600;line-height:1.5;text-wrap:balance}
.q .blank{display:inline-block;min-width:3.5em;border-bottom:2px solid var(--accent);margin:0 3px}
textarea,input[type=text]{font:inherit;font-size:16px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
textarea{min-height:84px;resize:vertical}
.blanks{display:grid;gap:8px}
.blanks label{display:grid;grid-template-columns:4.5em 1fr;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.choices{display:grid;gap:8px}
.choices button{font:inherit;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;display:grid;grid-template-columns:1.6em 1fr;gap:6px}
.choices button .n{font-family:var(--mono);color:var(--muted)}
.choices button.right{border-color:var(--ok);background:var(--ok-soft)}
.choices button.wrong{border-color:var(--no);background:var(--no-soft)}
.hint{font-size:14px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.primary{font:inherit;font-weight:600;padding:8px 18px;border:0;border-radius:7px;background:var(--accent);color:var(--panel);cursor:pointer}
.ans{display:grid;gap:10px;border-top:1px dashed var(--line);padding-top:14px}
.ans h3{font-size:12.5px;letter-spacing:.05em;color:var(--accent);margin:0}
.model{background:var(--ok-soft);border-left:3px solid var(--ok);border-radius:0 6px 6px 0;padding:8px 12px}
.parts{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.parts label{display:grid;grid-template-columns:1.4em 1fr;gap:8px;align-items:start;cursor:pointer;padding:6px 10px;border:1px solid var(--line);border-radius:6px}
.parts input{margin-top:5px}
.parts label.hit{background:var(--ok-soft);border-color:var(--ok)}
.res{font-size:14px;display:grid;gap:4px}
.res .o{color:var(--ok);font-weight:600} .res .x{color:var(--no);font-weight:600}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.keys span{font-size:13px;border-radius:4px;padding:1px 8px;border:1px solid var(--line)}
.keys span.got{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.memo{font-size:14.5px;background:var(--mid-soft);border-left:3px solid var(--mid);border-radius:0 6px 6px 0;padding:6px 12px}
.grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grade button{font:inherit;font-weight:600;padding:10px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.grade .g1{border-color:var(--no);color:var(--no)} .grade .g2{border-color:var(--mid);color:var(--mid)} .grade .g3{border-color:var(--ok);color:var(--ok)}
.grade button.sug{box-shadow:0 0 0 3px var(--accent-soft)}
.grade small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.done{text-align:center;padding:30px 10px;display:grid;gap:10px;justify-items:center}
footer{font-size:12px;color:var(--muted);text-align:center}
.reset{font-size:12px;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer;font:inherit}
@media (max-width:600px){.q{font-size:18px}.card{padding:16px}.grade{grid-template-columns:1fr}}
</style>

</head><body>
<div class="wrap">
  <header>
    <h1>OJK 규정 암기 퀴즈<small>규정 핵심 노트 ★★★·강사 강조 중심 · 주관식 위주</small></h1>
    <div class="bar" role="group" aria-label="모드">
      <span class="lab">모드</span>
      <button type="button" data-m="due" aria-pressed="true" title="모르는 것·애매한 것·안 푼 것 먼저, 20문항씩">오늘의 학습</button>
      <button type="button" data-m="weak" aria-pressed="false">모름·애매만</button>
      <button type="button" data-m="seq" aria-pressed="false">처음부터 순서대로</button>
    </div>
    <div class="bar" role="group" aria-label="범위">
      <span class="lab">범위</span>
      <button type="button" data-s="all" aria-pressed="true">전체</button>
      <button type="button" data-s="3" aria-pressed="false">★★★만</button>
      <button type="button" data-s="sem" aria-pressed="false">강사 강조만</button>
      <span class="lab" style="margin-left:6px">장</span>
      <span id="chs" style="display:contents"></span>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <main class="card" id="card" aria-live="polite"></main>
  <footer>Enter 정답 확인 · 1 모름 · 2 애매 · 3 앎 · 객관식은 1~4 · 기록은 이 브라우저에만 저장됩니다 · <button type="button" class="reset" id="reset">기록 초기화</button></footer>
</div>

 "수용능력·선호·허용·한도", "imp": 3, "sem": false, "type": "cloze", "q": "KBBF가 대주주와 정한 조기경보선은 자본비율 ___%, Gearing ___배, NPF ___% 입니다.", "a": "자본비율 12%, Gearing 8배, NPF 4% 도달 시 대주주 추가 지원. 규정 한도(자본비율 10%, Gearing 10배)보다 앞선 경보선임.", "blanks": ["12", "8", "4"], "memo": "12-8-4: 규정 한도 10%·10배보다 먼저 울리는 선"}, {"id": "q-5-17", "ch": "5", "card": "리스크관리 정책 구성", "imp": 2, "sem": false, "type": "list", "q": "PADK 48/2025상 리스크관리 정책에 들어가야 할 최소 6가지를 말해 보세요.", "a": "업무 관련 위험 결정, 측정방법·리스크관리정보시스템, 선호·허용·한도, 위험등급 평가, 최악 상황(worst case) 비상계획, 내부통제시스템.", "parts": ["업무 관련 위험 결정", "측정방법·리스크관리정보시스템", "선호·허용·한도", "위험등급 평가", "최악 상황(worst case) 비상계획", "내부통제시스템"]}, {"id": "q-5-18", "ch": "5", "card": "리스크관리위원회·부서·기능", "imp": 2, "sem": true, "type": "cloze", "q": "리스크관리위원회는 이사의 ___ 이상으로 구성하고, 리스크관리 기능은 대표이사 또는 ___ 에게 직접 보고합니다.", "a": "위원회는 이사의 절반 이상(그중 1명은 컴플라이언스·리스크관리 담당 이사)으로 구성하며, 리스크관리 기능은 대표이사 또는 리스크관리 담당 이사에게 직접 책임짐.", "blanks": ["절반", "리스크관리 담당 이사"], "alt": [["과반", "1/2", "50%"], ["리스크 담당 이사", "리스크관리 이사"]]}, {"id": "q-5-19", "ch": "5", "card": "리스크관리위원회·부서·기능", "imp": 2, "sem": true, "type": "mc", "q": "리스크감시위원회는 어느 기관 소속입니까?", "a": "리스크감시위원회는 감사회 소속으로 정책과 이행의 정합성을 감독함. 리스크관리위원회는 이사회 소속(비상설)임.", "choices": ["이사회", "감사회", "주주총회", "리스크관리부서"], "correct": 1, "memo": "관리위원회 = 이사회(실행), 감시위원회 = 감사회(감독)"}, {"id": "q-5-20", "ch": "5", "card": "3선 모델(Three Lines Model)", "imp": 2, "sem": true, "type": "cloze", "q": "3선 모델에서 1선은 ___, 2선은 ___, 3선은 ___ 입니다.", "a": "1선은 상품·서비스를 제공하는 사업부, 2선은 리스크관리·컴플라이언스 등 지원·견제 기능, 3선은 독립적 보증을 하는 내부감사임.", "blanks": ["사업부", "리스크관리·컴플라이언스", "내부감사"], "alt": [["영업", "영업·심사", "현업"], ["리스크관리", "컴플라이언스", "리스크·컴플라이언스"], ["감사", "Internal Audit"]]}, {"id": "q-5-21", "ch": "5", "card": "3선 모델(Three Lines Model)", "imp": 2, "sem": true, "type": "list", "q": "3선(내부감사)의 독립성 요건 3가지를 말해 보세요.", "a": "지배기구에 대한 책임, 사람·자원·데이터 접근, 감사 계획·수행에서 편향·간섭 배제.", "parts": ["지배기구에 대한 책임", "사람·자원·데이터 접근", "감사 계획·수행에서 편향·간섭 배제"], "memo": "1선과 2선은 결합할 수 있고, 3선은 독립 요건 3가지를 갖춰야 함"}, {"id": "q-5-22", "ch": "5", "ca ruption)", "자산 유용(Asset Misappropriation)", "재무보고 부정(Financial Reporting Fraud)", "기밀정보 유출", "기타 부정에 준하는 행위"]}, {"id": "q-7-05", "ch": "7", "card": "부정방지 전략 4대 축과 세부 수단", "imp": 3, "sem": true, "type": "list", "q": "부정방지 전략 4대 축을 순서대로 말해 보세요.", "a": "예방(Prevention), 탐지(Detection), 조사·보고·제재, 모니터링·평가·후속조치.", "parts": ["예방(Prevention)", "탐지(Detection)", "조사·보고·제재", "모니터링·평가·후속조치"], "hint": "P-D-I-M", "memo": "P-D-I-M. 세 번째 축은 조사·보고·제재가 하나의 축"}, {"id": "q-7-06", "ch": "7", "card": "부정방지 전략 4대 축과 세부 수단", "imp": 3, "sem": true, "type": "list", "q": "탐지(Detection) 축의 세부 수단 3가지를 말해 보세요.", "a": "내부고발 정책·체계(Whistleblowing), 불시 점검(Surprise Audit), 감시 체계(비공개 시험·검사).", "parts": ["내부고발 정책·체계(Whistleblowing)", "불시 점검(Surprise Audit)", "감시 체계(비공개 시험·검사)"]}, {"id": "q-7-07", "ch": "7", "card": "부정방지 전략 4대 축과 세부 수단", "imp": 3, "sem": true, "type": "list", "q": "내부고발제도의 핵심 요소 3가지를 말해 보세요.", "a": "제보자 보호, 보고 규정, 보고 이후 처리 체계.", "parts": ["제보자 보호", "보고 규정", "보고 이후 처리 체계"]}, {"id": "q-7-08", "ch": "7", "card": "부정방지 전략 4대 축과 세부 수단", "imp": 3, "sem": true, "type": "cloze", "q": "KBBF 내부고발은 ___영업일 내 분류, ___일 내 종결을 기준으로 하고, 반부패 교육은 ___개월마다 전 직원에게 실시합니다.", "a": "익명 내부고발 5영업일 내 분류·60일 내 종결, 반부패 교육 2개월마다 전 직원 대상.", "blanks": ["5", "60", "2"]}, {"id": "q-7-09", "ch": "7", "card": "부정통제 4요소", "imp": 2, "sem": false, "type": "list", "q": "부정통제체계 4요소를 말해 보세요.", "a": "이사회·감사회의 적극적 감독, 정책·절차, 조직구조·책임성, 통제·모니터링.", "parts": ["이사회·감사회의 적극적 감독", "정책·절차", "조직구조·책임성", "통제·모니터링"], "memo": "리스크관리 4대 요소와 앞 두 개가 같고, 뒤 두 개가 조직구조·책임성, 통제·모니터링으로 다름"}, {"id": "q-7-10", "ch": "7", "card": "부정방지 전담 조직과 핵심 의무 7", "imp": 3, "sem": true, "type": "cloze", "q": "부정방지 전담 부서는 ___ 에 책임지고, ___ 와 직접 소통·보고합니다.", "a": "전담 부서는 이사회(Directors)에 책임지고 감사회와 직접 소통·보고함.", "blanks": ["이사회", "감사회"], "alt": [["이사회(Directors)", "이사", "Directors"], ["감사회(BOC)", "커미셔너회"]]}, {"id": "q-7-11", "ch": "7", "card": "부정방지 전담 조직과 핵심 의무 7", "imp": 3, "sem": true, "type": "num", "q": "부정방지 교육·인식 활동은 최소 연 몇 회 해야 합니까?", "a": "최소 연 1회. KBBF는 2개월마다 전 직원 대   }
  h+=`<h3>모범 답</h3><div class="model">${q.a}</div>`;
  if(q.memo) h+=`<div class="memo">외우는 법 · ${q.memo}</div>`;
  h+=`<h3>스스로 채점 (키보드 1·2·3)</h3><div class="grade"><button type="button" class="g1" data-g="1">모름<small>곧 다시 나옴</small></button><button type="button" class="g2" data-g="2">애매<small>한 번 더</small></button><button type="button" class="g3" data-g="3">앎<small>뒤로 미룸</small></button></div></div>`;
  $('ans').innerHTML=h;
  const sh=$('show'); if(sh) sh.parentElement.remove();
  $('ans').querySelectorAll('.parts input').forEach(c=>c.onchange=()=>{ c.closest('label').classList.toggle('hit',c.checked); const all=[...$('ans').querySelectorAll('.parts input')]; const n=all.filter(x=>x.checked).length; mark(n===all.length?3:n>0?2:1); });
  $('ans').querySelectorAll('.grade button').forEach(b=>b.onclick=()=>grade(+b.dataset.g));
  if(suggested) mark(suggested);
  $('ans').querySelector('.grade').scrollIntoView({block:'nearest'});
}
function mark(g){ $('ans').querySelectorAll('.grade button').forEach(b=>b.classList.toggle('sug',+b.dataset.g===g)); }
function grade(g){ const q=queue[pos]; const b=box[q.id]||{n:0}; box[q.id]={g,n:(b.n||0)+1,t:Date.now()}; save(); sessionDone++; pos++; draw(); }
function chips(){ $('chs').innerHTML=Object.keys(CH).map(k=>`<button type="button" data-c="${k}" aria-pressed="false">${CH[k]}</button>`).join(''); }
chips();
document.addEventListener('click',e=>{
  const m=e.target.closest('[data-m]'), s=e.target.closest('[data-s]'), c=e.target.closest('[data-c]');
  if(m){ mode=m.dataset.m; build(); }
  else if(s){ scope=s.dataset.s; build(); }
  else if(c){ chSel=chSel===c.dataset.c?null:c.dataset.c; build(); }
});
$('reset').onclick=()=>{ const b=$('reset'); if(b.dataset.arm){ box={}; save(); delete b.dataset.arm; b.textContent='기록 초기화'; build(); } else { b.dataset.arm='1'; b.textContent='한 번 더 누르면 초기화'; setTimeout(()=>{delete b.dataset.arm; b.textContent='기록 초기화';},3000); } };
document.addEventListener('keydown',e=>{
  const q=queue[pos]; if(!q) { if(e.key==='Enter'){ const a=$('again'); if(a) a.click(); } return; }
  const typing=/INPUT|TEXTAREA/.test(e.target.tagName);
  if(!revealed){
    if(e.key==='Enter'&&!(e.target.tagName==='TEXTAREA'&&e.shiftKey)){ if(q.type!=='mc'){ e.preventDefault(); reveal(); } }
    else if(q.type==='mc'&&!typing&&/^[1-4]$/.test(e.key)&&+e.key<=q.choices.length){ reveal(+e.key-1); }
    return;
  }
  if(typing) return;
  if(/^[123]$/.test(e.key)) grade(+e.key);
  else if(e.key==='Enter'){ const s=$('ans').querySelector('.grade .sug'); if(s) s.click(); }
});
build();
</script>
