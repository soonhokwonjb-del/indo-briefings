<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OJK 규정 암기 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 위쪽 범위·모드 선택과 진도 막대 / 가운데 문제 카드 한 장(풀기 → 정답 확인 → 스스로 채점) / 아래 단축키 */
:root{
  --bg:#f1f3f6; --panel:#ffffff; --ink:#18212e; --muted:#5a6575; --line:#d8dde5;
  --accent:#24477f; --accent-soft:#e2e9f5;
  --ok:#2f6b47; --ok-soft:#e3f0e8; --mid:#93570a; --mid-soft:#fbefd9; --no:#a8321f; --no-soft:#fae4df; --sem:#7a3e8f; --sem-soft:#f3e8f6;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --panel:#1a2029; --ink:#e3e8ef; --muted:#9aa5b4; --line:#2e3644; --accent:#8fb0ff; --accent-soft:#223152;
  --ok:#7fc59a; --ok-soft:#1d3327; --mid:#e6b25e; --mid-soft:#3a2d17; --no:#f08f7d; --no-soft:#3b211c; --sem:#d7a6e8; --sem-soft:#33233a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --panel:#1a2029; --ink:#e3e8ef; --muted:#9aa5b4; --line:#2e3644; --accent:#8fb0ff; --accent-soft:#223152;
  --ok:#7fc59a; --ok-soft:#1d3327; --mid:#e6b25e; --mid-soft:#3a2d17; --no:#f08f7d; --no-soft:#3b211c; --sem:#d7a6e8; --sem-soft:#33233a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;margin:0;padding-inline:16px;padding-block:14px}
.wrap{max-width:900px;margin:0 auto;display:grid;gap:12px}
header{display:grid;gap:10px}
h1{font-size:20px;margin:0}
h1 small{font-size:12.5px;font-weight:400;color:var(--muted);margin-left:8px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bar .lab{font-size:12px;color:var(--muted);margin-right:2px}
.bar button,.btn{font:inherit;font-size:13px;padding:4px 10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.stats b{font-family:var(--mono);color:var(--ink)}
.meter{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);flex:1;min-width:160px}
.meter i{display:block;height:100%}
.meter .k{background:var(--ok)} .meter .m{background:var(--mid)} .meter .n{background:var(--no)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 22px;display:grid;gap:14px;min-width:0}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.chip{border-radius:4px;padding:1px 7px;font-weight:600;font-size:12px}
.chip.t{background:var(--accent-soft);color:var(--accent)}
.chip.s{background:var(--sem-soft);color:var(--sem)}
.chip.st{color:var(--mid);letter-spacing:-1px}
.q{font-size:20px;font-weight:600;line-height:1.5;text-wrap:balance}
.q .blank{display:inline-block;min-width:3.5em;border-bottom:2px solid var(--accent);margin:0 3px}
textarea,input[type=text]{font:inherit;font-size:16px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
textarea{min-height:84px;resize:vertical}
.blanks{display:grid;gap:8px}
.blanks label{display:grid;grid-template-columns:4.5em 1fr;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.choices{display:grid;gap:8px}
.choices button{font:inherit;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;display:grid;grid-template-columns:1.6em 1fr;gap:6px}
.choices button .n{font-family:var(--mono);color:var(--muted)}
.choices button.right{border-color:var(--ok);background:var(--ok-soft)}
.choices button.wrong{border-color:var(--no);background:var(--no-soft)}
.hint{font-size:14px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.primary{font:inherit;font-weight:600;padding:8px 18px;border:0;border-radius:7px;background:var(--accent);color:var(--panel);cursor:pointer}
.ans{display:grid;gap:10px;border-top:1px dashed var(--line);padding-top:14px}
.ans h3{font-size:12.5px;letter-spacing:.05em;color:var(--accent);margin:0}
.model{background:var(--ok-soft);border-left:3px solid var(--ok);border-radius:0 6px 6px 0;padding:8px 12px}
.parts{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.parts label{display:grid;grid-template-columns:1.4em 1fr;gap:8px;align-items:start;cursor:pointer;padding:6px 10px;border:1px solid var(--line);border-radius:6px}
.parts input{margin-top:5px}
.parts label.hit{background:var(--ok-soft);border-color:var(--ok)}
.res{font-size:14px;display:grid;gap:4px}
.res .o{color:var(--ok);font-weight:600} .res .x{color:var(--no);font-weight:600}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.keys span{font-size:13px;border-radius:4px;padding:1px 8px;border:1px solid var(--line)}
.keys span.got{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.memo{font-size:14.5px;background:var(--mid-soft);border-left:3px solid var(--mid);border-radius:0 6px 6px 0;padding:6px 12px}
.grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grade button{font:inherit;font-weight:600;padding:10px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.grade .g1{border-color:var(--no);color:var(--no)} .grade .g2{border-color:var(--mid);color:var(--mid)} .grade .g3{border-color:var(--ok);color:var(--ok)}
.grade button.sug{box-shadow:0 0 0 3px var(--accent-soft)}
.grade small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.done{text-align:center;padding:30px 10px;display:grid;gap:10px;justify-items:center}
footer{font-size:12px;color:var(--muted);text-align:center}
.reset{font-size:12px;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer;font:inherit}
@media (max-width:600px){.q{font-size:18px}.card{padding:16px}.grade{grid-template-columns:1fr}}
</style>

</head><body>
<div class="wrap">
  <header>
    <h1>OJK 규정 암기 퀴즈<small>규정 핵심 노트 ★★★·강사 강조 중심 · 개념 단위로 묶어 떠올리기</small></h1>
    <div class="bar" role="group" aria-label="문항 세트">
      <span class="lab">문항</span>
      <button type="button" data-set="b" aria-pressed="true">개념 묶음 (72)</button>
      <button type="button" data-set="d" aria-pressed="false">세부 확인 (253)</button>
    </div>
    <div class="bar" role="group" aria-label="모드">
      <span class="lab">모드</span>
      <button type="button" data-m="due" aria-pressed="true" title="모르는 것·애매한 것·안 푼 것 먼저, 20문항씩">오늘의 학습</button>
      <button type="button" data-m="weak" aria-pressed="false">모름·애매만</button>
      <button type="button" data-m="seq" aria-pressed="false">처음부터 순서대로</button>
    </div>
    <div class="bar" role="group" aria-label="범위">
      <span class="lab">범위</span>
      <button type="button" data-s="all" aria-pressed="true">전체</button>
      <button type="button" data-s="3" aria-pressed="false">★★★만</button>
      <button type="button" data-s="sem" aria-pressed="false">강사 강조만</button>
      <span class="lab" style="margin-left:6px">장</span>
      <span id="chs" style="display:contents"></span>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <main class="card" id="card" aria-live="polite"></main>
  <footer>Enter 정답 확인 · 1 모름 · 2 애매 · 3 앎 · 객관식은 1~4 · 기록은 이 브라우저에만 저장됩니다 · <button type="button" class="reset" id="reset">기록 초기화</button></footer>
</div>

<script>
const CH={"0":"한눈에","1":"업권·규제","2":"사업 범위","3":"건전성·자본","4":"지배구조","5":"리스크·건강도","6":"사업계획·준법","7":"반부패·감사","8":"소비자·AML·인력"};
const TY={bundle:"개념 설명",list:"목록 회상",cloze:"빈칸 채우기",num:"숫자·기한",short:"설명하기",mc:"객관식"};
const QB=[{"id": "b-0-01", "ch": "0", "cards": ["숫자로 헷갈리는 것 모음"], "imp": 3, "sem": false, "q": "4대 요소, 5원칙처럼 숫자로 묶인 주요 제도 목록을 구분해서 말씀해 주십시오.", "a": "4로 묶인 목록은 세 가지입니다. 건강도 평가는 지배구조, 리스크 프로필, 수익성, 자본이고, 리스크관리는 이사회(BOD)·감사회(BOC) 감독, 정책·절차·한도, 관리 과정과 정보시스템, 내부통제이며, 부정방지 전략은 예방, 적발, 조사·제재, 후속조치입니다. 5로 묶인 것은 자산 분류 5단계와 GCG 5원칙이고, 소비자보호 원칙은 7개, 리스크 종류는 8개입니다. 질문에 나온 주제를 먼저 확인하고 해당 목록으로 답하겠습니다.", "memo": "질문에 「건강도」가 있으면 지배구조·리스크·수익성·자본, 「리스크관리」가 있으면 감독·정책·과정·내부통제로 답함", "type": "bundle", "parts": ["4 건강도(Health Level) 평가: 지배구조(GCG)·리스크 프로필(Risk Profile)·수익성(Profitability)·자본(Capital)", "4 리스크관리: 이사회(BOD, Directors)·감사회(BOC, Board of Commissioners) 감독·정책·절차·한도·관리 과정과 정보시스템·내부통제(Internal Control)", "4 부정방지 전략(Anti-Fraud Strategy): 예방(Prevention)·적발(Detection)·조사·보고·제재(Investigation, Reporting and Sanctions)·모니터링·평가·후속조치(Monitoring, Evaluation and Follow-up)", "5 자산 분류(A/R Collectability): 정상(Current)·요주의(Special Mention)·고정(Non-Current)·회수의문(Doubtful)·손실(Bad Debt), 충당금(allowance for impairment losses) 1·5·15·50·100%", "5 GCG 원칙(TARIF): 투명성(Transparency)·책임성(Accountability)·책임(Responsibility)·독립성(Independency)·공정성(Fairness)", "7 소비자보호 원칙: 교육·투명성·공정한 대우·보호·민원·법규 집행·경쟁", "8 리스크 종류: 전략(Strategic)·신용(Credit)·시장(Market)·운영(Operational)·유동성(Liquidity)·컴플라이언스(Compliance)·법률(Legal)·평판(Reputation)", "9 필수 기능: 회계·영업·심사·채권관리·리스크·내부통제·컴플라이언스·인사·AML·IT·소비자보호·부정 통제(Fraud Control)·금융 이해력"], "card": "숫자로 헷갈리는 것 모음"}, {"id": "b-0-02", "ch": "0", "cards": ["OJK 평가 체계 비교(3가지)"], "imp": 3, "sem": false, "q": "OJK가 회사를 평가하는 체계를 설명하고, KBBF의 현재 위치를 말씀해 주십시오.", "a": "OJK는 건강도 평가, 리스크 프로필, 감독 상태의 세 체계로 회사를 봅니다. 건강도 평가는 GCG, 리스크 프로필, 수익성, 자본 네 요소로 1~5등급을 매기고, 리스크 프로필은 8대 위험을 반기마다 평가하며, 건강도 등급과 자본·NPF Net 기준에 따라 감독 상태가 정해집니다. KBBF는 GCG 2등급, 리스크 프로필 P2이고 자기자본/납입자본 58.96%, NPF Net 0.94%로 감독 상태 기준과는 거리가 있습니다. 가장 약한 요소인 수익성을 우선 개선하겠습니다.", "memo": "근거 규정 짝: 건강도 28/2020, 리스크 프로필 PADK 48/2025, 감독 상태 49/2024", "type": "bundle", "parts": ["건강도(Health Level) 평가(POJK 28/2020): GCG·리스크 프로필(Risk Profile)·수익성(Profitability)·자본(Capital) 4요소, 종합 1~5등급", "리스크 프로필(PADK 48/2025): 8대 위험의 고유위험(Inherent Risk) × 리스크관리 품질, 반기 제출", "감독 상태(Supervisory Status, POJK 49/2024): 정상(Normal)·집중(Intensive)·특별감독(Special), 건강도 등급·자기자본/납입자본·NPF Net으로 지정", "연결: 리스크 프로필은 건강도 4요소 중 하나, 건강도 4등급 → 집중감독, 5등급 → 특별감독", "등급 방향: 건강도·리스크 프로필 모두 숫자가 클수록 나쁨", "KBBF: GCG 자체평가 2등급, 2분기 리스크 프로필 종합 P2(유동성 P1, 법률 P3)", "KBBF: 자기자본/납입자본 58.96%, NPF Net 0.94%(8월)로 감독 상태 기준과 거리 있음", "대표이사 할 일: 가장 약한 요소인 수익성을 우선 개선"], "card": "OJK 평가 체계 비교(3가지)"}, {"id": "b-0-03", "ch": "0", "cards": ["숫자로 헷갈리는 것 모음"], "imp": 3, "sem": false, "q": "MFC가 지켜야 할 주요 기준 수치와 보고 기한을 한 번에 말씀해 주십시오.", "a": "기준 수치는 자본비율 10% 이상, Gearing Ratio 10배 이하, 자기자본/납입자본 50% 이상, FAR 50% 이상, NPF Net 5%, 최소 자기자본 1,000억 루피아입니다. 기한은 의심거래 보고 3영업일, 민원 처리 10영업일에 10영업일 연장, 개인정보 유출 72시간, 피두시아 등록 1개월입니다. 연간 보고는 반부패 이행 보고가 1월 31일, GCG 자체평가가 2월 15일입니다.", "memo": "10·10·50·50·5: 자본비율 10%, Gearing Ratio 10배, 자기/납입 50%, FAR 50%, NPF Net 5%", "type": "bundle", "parts": ["자본 기준: 자본비율(Capital Ratio) 10% 이상, 최소 자기자본 Rp100bn 이상", "부채·자산 기준: Gearing Ratio 10배 이하, FAR 50% 이상(경과 40%)", "자기자본/납입자본 50% 이상, NPF Net 5%", "의심거래 보고(STR) 3영업일, 개인정보 유출 통지 72시간", "민원 처리 10영업일(연장 10영업일), 피두시아(Fiducia) 등록 1개월", "연간 기한: 반부패 이행 보고 1월 31일, GCG 자체평가 2월 15일"], "card": "숫자로 헷갈리는 것 모음"}, {"id": "b-1-01", "ch": "1", "cards": ["MFC 규제 체계 지도"], "imp": 2, "sem": true, "q": "멀티파이낸스 회사가 지켜야 할 핵심 규정 체계를 말씀해 주십시오.", "a": "교재는 MFC 규정을 금융사업 운영, 지배구조·리스크관리·준법, 소비자보호, 기타 관련 규정, 금융업 규정 전반의 다섯 축으로 정리합니다. 사업 운영은 POJK 46/2024와 개정 규정 35/2025, 지배구조는 48/2024, 리스크관리는 42/2024와 시행세칙 PADK 48/2025가 기본입니다. 소비자보호는 POJK 22/2023, AML은 POJK 8/2023이 기준입니다. 대표이사(President Director)로 선임되면 규정별로 담당 부서와 점검 주기를 정해 준수 현황을 이사회(BOD)에서 정기적으로 확인하겠습니다.", "memo": "2024년 번호 짝: 42 리스크관리, 43 인력, 46 사업 운영, 48 지배구조, 49 감독상태", "type": "bundle", "parts": ["5대 축: 금융사업 운영(Financing Business Operations) · 지배구조·리스크관리·준법(GRC, Governance, Risk, Compliance) · 소비자보호 · 기타 관련 규정 · 금융업 규정 전반", "사업 운영: POJK 46/2024, 개정 규정 POJK 35/2025", "지배구조·리스크: POJK 48/2024(지배구조), 42/2024(리스크관리)·PADK 48/2025(시행세칙), 28/2020(건강도 평가)", "AML·CFT: POJK 8/2023 / 소비자보호: POJK 22/2023", "기타: POJK 43/2024(인력), 49/2024(감독상태), 19/2025(중소기업 금융)", "대표이사 할 일: 규정별 담당 부서와 점검 주기를 정하고 이사회(BOD, Directors)에서 준수 현황을 정기 확인"], "card": "MFC 규제 체계 지도"}, {"id": "b-1-02", "ch": "1", "cards": ["POJK 46/2024 기본 규정 구조"], "imp": 3, "sem": true, "q": "POJK 46/2024의 주요 내용과 KBBF의 준수 상태를 설명해 주십시오.", "a": "POJK 46/2024는 MFC의 사업 범위, 자본과 재무 비율, 여신한도, 채권 재조정과 분류 기준, 영업 규칙을 정한 기본 규정이고 POJK 35/2025로 일부 개정되었습니다. KBBF는 8월말 기준 자본비율 63.88%, Gearing Ratio 2.06배, FAR 95.63%, 자기자본/납입자본 58.96%로 비율 기준을 모두 충족하고 있습니다. 개선이 필요한 부분은 수익성입니다. 선임 후 최대 차주의 한도 비중을 바로 확인하고, 재조정은 규정 요건 안에서만 운영하겠습니다.", "memo": "46(사업 운영)과 48(지배구조)을 혼동하지 않음", "type": "bundle", "parts": ["성격: MFC 사업 운영 기본 규정(35/2018 대체, 35/2025로 일부 개정)", "사업 범위: 투자금융(Investment Financing)·운전자금금융(Working Capital Financing)·다목적금융(Multipurpose Financing)·OJK 승인 기타 금융", "자본·재무 비율: 기본자본 IDR 100bn, 기본자본/납입자본(Core Capital/Paid-Up Capital) 50%, Gearing Ratio 10배, FAR 50%, 자본비율(Capital Ratio) 10%", "여신한도: 단일 차주 자본의 20%, 단일 그룹 50%", "채권 관리: 재조정(Restructuring) 요건, 자산 건전성 5단계 분류와 충당금(allowance for impairment losses)", "영업·조직: 피두시아(Fiducia) 1개월 내 등록, 제3자 인센티브 17.5% 이하, 필수 기능 9개, 교육훈련비 인건비(Personnel Expenses) 2.5% 이상, 외국인 지분 85% 이하", "KBBF: 자본비율 63.88%, Gearing Ratio 2.06배, FAR 95.63%, 자기자본/납입자본 58.96%(8월)로 비율 기준 충족", "대표이사 할 일: 최대 차주 여신한도 비중 점검, 재조정은 규정 요건 안에서만 운영"], "card": "POJK 46/2024 기본 규정 구조"}, {"id": "b-1-03", "ch": "1", "cards": ["금융회사 발전·강화 로드맵"], "imp": 3, "sem": false, "q": "OJK 금융회사 로드맵 2024~2028의 내용과 KBBF 사업계획(Business Plan)의 연계를 말씀해 주십시오.", "a": "로드맵은 회복력·경쟁력 강화, 생태계 개발, 디지털 전환, 규제·감독 강화의 4대 축과 6대 전략으로 구성됩니다. 3단계에 걸쳐 2028년까지 생산부문 금융 비중을 49~51%, 업계 FAR을 89~90%로 높이는 것이 목표입니다. KBBF는 운송사업자 대상 Fleet 투자금융 비중이 약 88%로 생산부문 금융 중심이고 FAR은 95.63%입니다. 올해 IT 운영위원회를 설치했고 코어시스템 교체를 계획하고 있으며, 조달원 확대와 소비자보호 강화도 사업계획에 반영하겠습니다.", "memo": "로드맵 FAR 85~90%는 업계 합산 목표, 개별 회사 규제 최소 FAR은 50%", "type": "bundle", "parts": ["4대 축: 회복력·경쟁력 강화 · 생태계 요소 개발 · 디지털 전환 가속 · 규제·감독·인허가 강화", "6대 전략: 자본·지배구조·리스크·인력 강화 · 사업 개발 · 규제·감독 강화 · 소비자보호 · 생태계 개발 · 디지털 전환", "3단계 목표(생산부문 금융 비중): 2024~2025 44~45% → 2026~2027 46~48% → 2028 49~51%", "3단계 목표(업계 FAR): 85~86% → 87~88% → 89~90%", "성격: 업계 상황에 따라 조정하는 living document", "KBBF: 운송사업자 대상 Fleet 투자금융(Investment Financing) 비중 약 88%, FAR 95.63%(8월)", "KBBF: 2026년 IT 운영위원회(IT steering committee) 설치, 코어시스템 교체 계획", "대표이사 할 일: 조달원 확대, 소비자보호 강화, 디지털 전환을 사업계획에 반영"], "card": "금융회사 발전·강화 로드맵"}, {"id": "b-1-04", "ch": "1", "cards": ["업계 재무현황과 주요 비율"], "imp": 3, "sem": true, "q": "업계 평균과 비교해 KBBF의 재무 지표는 어떤 수준입니까?", "a": "OJK 통계로 2026년 4월 업계는 FAR 86.70%, Gearing Ratio 2.14배, NPF 총 2.89%·순 0.78%, ROA 5.33%, BOPO 79.21%입니다. KBBF는 8월말 FAR 95.63%, Gearing Ratio 2.06배로 업계와 같거나 나은 수준입니다. 다만 NPF 총 3.25%, 순 0.94%, BOPO 90.58%, 연환산 ROA 1.20%로 자산 건전성과 수익성은 업계보다 약합니다. 대손비용 관리와 비용 효율화로 NPF와 BOPO를 낮추는 것을 우선 과제로 두겠습니다.", "memo": "KBBF는 FAR·Gearing Ratio는 업계 수준, NPF·BOPO·ROA는 업계보다 약함", "type": "bundle", "parts": ["업계 2026년 4월: FAR 86.70%, Gearing Ratio 2.14배, NPF 총 2.89%·순 0.78%", "업계 2026년 4월: ROA 5.33%, ROE 14.18%, BOPO 79.21%", "업계 채권 구성: 다목적금융(Multipurpose Financing) 비중이 가장 크고, 운전자금금융(Working Capital Financing)이 가장 빠르게 증가(YoY 10.64%)", "KBBF 8월: FAR 95.63%, Gearing Ratio 2.06배로 업계 이상 또는 비슷한 수준", "KBBF 8월: NPF 총 3.25%·순 0.94%로 업계보다 높음", "KBBF 8월: BOPO 90.58%, ROA 연 1.20%, ROE 연 3.41%로 수익성이 업계보다 약함", "대표이사 할 일: 대손비용 관리와 비용 효율화로 NPF와 BOPO를 낮추는 것을 우선 과제로 둠"], "card": "업계 재무현황과 주요 비율"}, {"id": "b-1-05", "ch": "1", "cards": ["업계 재무현황과 주요 비율", "금융회사 발전·강화 로드맵"], "imp": 3, "sem": true, "q": "업계 주요 비율과 로드맵 목표 수치를 한 번에 말씀해 주십시오.", "a": "업계는 2026년 4월 FAR 86.70%, BOPO 79.21%, Gearing Ratio 2.14배, NPF 총 2.89%·순 0.78%, ROA 5.33%, ROE 14.18%입니다. 2025년 말에는 FAR 86.01%, BOPO 82.86%, NPF 총 2.51%였습니다. 로드맵은 2028년까지 생산부문 금융 비중 49~51%, 업계 FAR 89~90%를 목표로 하고, 개별 회사의 규제 최소 FAR은 50%입니다.", "memo": "FAR 세 수치 구분: 규제 50%, 업계 86.70%, 로드맵 89~90%", "type": "bundle", "parts": ["업계 2026년 4월: FAR 86.70%, BOPO 79.21%, Gearing Ratio 2.14배", "업계 2026년 4월: NPF 총 2.89%·순 0.78%, ROA 5.33%, ROE 14.18%", "업계 2025년 말: FAR 86.01%, BOPO 82.86%, NPF 총 2.51%·순 0.77%", "로드맵 2028 목표: 생산부문 금융 비중 49~51%, 업계 FAR 89~90%", "규제 최소 FAR 50%(개별 회사 기준)"], "card": "업계 재무현황과 주요 비율 · 금융회사 발전·강화 로드맵"}, {"id": "b-2-01", "ch": "2", "cards": ["사업활동 3대 유형과 대면 요건"], "imp": 3, "sem": true, "q": "OJK 규정상 MFC가 운영할 수 있는 사업활동(Business Activities) 유형을 설명해 주십시오.", "a": "MFC 사업은 투자금융, 운전자금금융, 다목적금융의 3대 유형과 운용리스·수수료 업무 같은 기타 활동, 그리고 OJK 승인을 받은 기타 금융으로 구성됩니다. 투자금융은 사업용 자본재, 운전자금금융은 1개 영업주기 내 단기 지출, 다목적금융은 소비 목적에 대한 금융입니다. 투자금융은 원칙적으로 대면이 필수이고, 운전자금과 다목적금융은 비대면으로도 할 수 있습니다. KBBF는 운송사업자 대상 Fleet 투자금융이 중심이고, 리테일 다목적금융, 딜러 운전자금, 일부 팩토링을 운영하고 있습니다.", "memo": "방식 수 8·6·4: 투자 8, 운전자금 6, 다목적 4", "type": "bundle", "parts": ["3대 유형: 투자금융(Investment Financing)·운전자금금융(Working Capital Financing)·다목적금융(Multipurpose Financing)", "투자금융: 사업·투자활동에 필요한 자본재 금융(방식 8가지, 프로젝트·인프라금융 포함)", "운전자금금융: 1개 영업주기 내 단기 지출 금융(방식 6가지, 금융리스 없음)", "다목적금융: 사업 목적 외 사용·소비 목적 금융(방식 4가지)", "기타 활동(Other Activities): 운용리스(Operating Lease)·수수료 기반 업무(Fee-based)·OJK 승인 기타", "대면: 투자금융만 원칙적으로 물리적 대면 필수(Mandatory Face-to-Face Physically), 운전자금·다목적은 대면·비대면(without face-to-face) 모두 가능", "KBBF: Fleet=투자금융, 리테일=다목적금융, 딜러 재고=운전자금, 일부 팩토링(Factoring)"], "card": "사업활동 3대 유형과 대면 요건"}, {"id": "b-2-02", "ch": "2", "cards": ["할부구매와 금융계약 명칭"], "imp": 3, "sem": true, "q": "KBBF가 사용하는 할부구매 계약의 구조와 정확한 명칭을 말씀해 주십시오.", "a": "할부구매는 MFC가 공급자에게 대금을 직접 지급하고 차주가 MFC에 할부로 상환하는 금융이며, 소유권은 약정에 따라 차주에게 이전됩니다. 투자금융(Investment Financing), 운전자금금융(Working Capital Financing), 다목적금융(Multipurpose Financing) 세 유형 모두에 쓰이는 자동차금융의 기본 계약입니다. 영문 명칭은 Purchase with Installment Payments로 말씀드립니다. KBBF 계약 명칭은 계약서에 쓰인 명칭 그대로 사용하겠습니다.", "memo": "할부구매는 소유권 이전, 금융리스는 MFC 소유 유지", "type": "bundle", "parts": ["구조: MFC가 공급자에게 대금을 직접 지급하고 차주는 MFC에 할부 상환", "소유권: 약정에 따라 공급자에서 차주에게 이전", "적용: 투자·운전자금·다목적 3개 유형 모두에 사용", "흐름: 재화 선택·선수금(Down Payment) → 신청 → 승인 → 공급자 대금 지급 → 인도 → 인수증 제출 → 할부 납부", "명칭: Purchase with Installment Payments('hire purchase', 'buy on installment'는 쓰지 않음)", "금융리스(Finance Lease)와 구분: 금융리스는 약정 기간 동안 MFC가 소유권 보유", "대표이사 할 일: 계약서에 쓰인 명칭 그대로 사용"], "card": "할부구매와 금융계약 명칭"}, {"id": "b-2-03", "ch": "2", "cards": ["금융리스·세일앤리스백", "팩토링(상환청구권 유무)"], "imp": 2, "sem": true, "q": "금융리스(Finance Lease), 세일앤리스백(Sale and Lease Back), 팩토링의 구조와 위험 부담을 설명해 주십시오.", "a": "금융리스는 약정 기간 동안 소유권을 금융회사가 갖고 사용 효익과 위험은 차주에게 넘어가며, 만기에 매수선택권이 주어집니다. 세일앤리스백은 차주가 금융회사에 판 재화를 다시 리스받는 방식입니다. 팩토링은 영업채권을 매입하는 금융으로, 상환청구권부는 채권을 판 고객이, 상환청구권 없는 팩토링은 금융회사가 미회수 위험을 집니다. KBBF는 팩토링을 일부 운영하고 있으므로 매입 채권의 구매자 신용과 만기 요건을 심사 단계에서 확인하겠습니다.", "memo": "운전자금금융에는 금융리스가 없음. 세일앤리스백은 투자·운전자금, 금융리스는 투자·다목적", "type": "bundle", "parts": ["금융리스: 약정 기간 중 소유권은 MFC, 효익과 위험은 차주에게 이전, 만기 매수선택권(purchase option)", "금융리스 의무: 차주의 제3자 재리스 금지, MFC는 리스물건에 표지판·라벨 부착", "세일앤리스백: 차주가 MFC에 판 재화를 다시 리스받는 금융", "사용 범위: 금융리스는 투자·다목적, 세일앤리스백은 투자·운전자금", "팩토링: 기업 영업채권 매입·관리, 투자·운전자금금융(Working Capital Financing)에 사용", "상환청구권부(Factoring With Recourse): 채권 매도인이 미회수 위험 부담 / 상환청구권 없는(Factoring Without Recourse): MFC가 위험 전부 부담", "운용리스(Operating Lease)는 3대 유형 밖의 기타 활동(Other Activities)", "KBBF: 일부 팩토링 운영, 매입 채권의 구매자 신용과 만기 요건을 심사 단계에서 확인"], "card": "금융리스·세일앤리스백 · 팩토링(상환청구권 유무)"}, {"id": "b-2-04", "ch": "2", "cards": ["운전자금대출·자금대출 요건"], "imp": 3, "sem": true, "q": "운전자금대출(FMU, Working Capital Facility)과 자금대출(FD, Fund Facility)의 회사 요건과 차주 요건을 말씀해 주십시오.", "a": "FMU는 사업 목적, FD는 소비 목적 자금을 차주에게 직접 주는 금융입니다. 회사는 건강도 종합 2등급 이상, NPF Net 5% 이하, 기본자본/납입자본 50% 이상을 갖춰야 하고, FD 채권은 총 금융채권의 25% 이내여야 합니다. 차주 한도는 FMU 100억 루피아, FD 5억 루피아이며 담보와 SLIK 조회, 상환능력 분석이 필요합니다. KBBF는 NPF Net 0.94%, 자기자본/납입자본 58.96%로 요건 안에 있고, 담보 면제는 100% 초과 요건을 충족하지 못해 취급하지 않습니다.", "memo": "기본자본/납입자본 두 기준: 수행 요건 50%, 담보 면제 100% 초과", "type": "bundle", "parts": ["정의: FMU는 사업·생산 목적, FD는 소비 목적 자금을 차주에게 직접 지급", "회사 요건: 건강도(Health Level) 종합 2등급 이상, 자본비율(Capital Ratio)·Gearing Ratio 준수, NPF Net 5% 이하, 기본자본/납입자본(Core Capital/Paid-Up Capital) 50% 이상", "FD 비중: FD 다목적 채권은 총 금융채권의 25% 이내", "차주 한도: FMU 차주당 IDR 10bn 이하, FD 차주당 IDR 500mn 이하", "차주 요건: 담보 보유, SLIK·LPIP 조회, 상환능력 분석", "담보 면제(Collateral Exemption): 기본자본/납입자본 100% 초과 회사, 차주당 IDR 100mn 이하, UMKM·신용보험 이전·채권 10% 이내", "KBBF: NPF Net 0.94%, 자기자본/납입자본 58.96%(8월)로 수행 요건 충족", "KBBF: 담보 면제는 100% 초과 요건 미충족으로 취급하지 않음"], "card": "운전자금대출·자금대출 요건"}, {"id": "b-2-05", "ch": "2", "cards": ["POJK 35/2025 개정 내용"], "imp": 3, "sem": true, "q": "POJK 35/2025의 주요 개정 내용과 KBBF의 대응을 말씀해 주십시오.", "a": "POJK 35/2025는 46/2024의 개정 규정으로 선수금 0% 허용, 무담보 운전자금 요건 신설, 비대면 금융 확대, 연체 이력 차주 금융 허용, 지분 변경 절차 간소화를 담고 있습니다. 선수금 0%는 차량금융 NPF Net 3% 이하인 회사가 잔액의 20% 이내에서 할 수 있습니다. KBBF는 NPF Net이 0.94%이지만, 차량금융 기준 수치와 리테일 취급 시기별 성과를 확인한 뒤 20% 한도 안에서 단계적으로 판단하겠습니다. 무담보 운전자금은 기본자본/납입자본 100% 초과 요건을 충족하지 못해 취급하지 않습니다.", "memo": "선수금 0%의 짝: 차량금융 NPF Net 3%와 잔액 20%", "type": "bundle", "parts": ["성격: POJK 46/2024 개정 규정, 2025년 12월 22일 시행", "선수금(Down Payment) 0%: 차량금융 NPF Net 3% 이하 회사, 0% 취급분은 금융채권 잔액의 20% 이내", "무담보 운전자금: 기본자본/납입자본(Core Capital/Paid-Up Capital) 100% 초과 회사, 중소기업 차주당 IDR 100mn 이하, 신용보험·보증, 잔액 10% 이내", "비대면(without face-to-face) 확대: 투자금융(Investment Financing) 소액 비대면 가능, 운전자금·다목적은 OJK 디지털서비스 승인 후", "연체 이력 차주: 상환능력 입증·리스크 성향 부합 시 금융 가능", "지배주주 변경 없는 지분 변경 절차 간소화", "KBBF: NPF Net 0.94%, 차량금융 기준 NPF Net 확인 후 리테일 성과를 보고 20% 한도 안에서 단계적 판단", "KBBF: 무담보 운전자금은 100% 초과 요건 미충족"], "card": "POJK 35/2025 개정 내용"}, {"id": "b-2-06", "ch": "2", "cards": ["디지털금융서비스 요건"], "imp": 2, "sem": true, "q": "디지털금융서비스(Digital Financing Services) 요건과 KBBF의 향후 3~5년 디지털화 계획을 말씀해 주십시오.", "a": "디지털금융은 OJK 승인을 받아야 하고, IT SOP, 자격증을 가진 정보시스템 담당 이사와 그 아래 임원, 3년 이상 경력의 IT 인력을 갖춰야 합니다. 승인 후 6개월 안에 정보보안 인증을 받아야 하고, 비대면 계약에는 전자인증서로 보호된 전자서명을 씁니다. KBBF는 올해 IT 운영위원회를 설치했고 코어시스템 교체를 계획하고 있습니다. 이 기반을 갖춘 뒤 디지털 채널을 단계적으로 검토하겠습니다.", "memo": "숫자 짝: IT 경력 3년, 정보보안 인증 6개월", "type": "bundle", "parts": ["허가: 투자·운전자금·다목적금융(Multipurpose Financing) 모두 디지털 방식 가능, OJK 승인 필요", "요건 4개: IT 활용 SOP, 정보시스템 담당 이사·직하 임원의 IT 자격증, 시스템 인력, 인력 IT 경력 3년 이상", "회사 의무: 정보 기밀성·무결성·가용성, 내부감사(Internal Audit), 승인 후 6개월 내 정보보안 인증, 정보주체 동의, 신용평가(credit scoring)", "비대면(without face-to-face) 계약: 전자인증서로 보호된 전자서명(Electronic Signature) 사용", "리스크관리 고려: 최소 연령, 최소 소득, 상환능력, 금리·마진 상한", "KBBF: 2026년 IT 운영위원회(IT steering committee) 설치, 코어시스템 교체 계획", "대표이사 할 일: 시스템 기반을 갖춘 뒤 디지털 채널을 단계적으로 검토"], "card": "디지털금융서비스 요건"}, {"id": "b-2-07", "ch": "2", "cards": ["제3자 인센티브 상한 17.5%"], "imp": 3, "sem": false, "q": "딜러 등 제3자 인센티브의 상한과 산정 기준을 말씀해 주십시오.", "a": "딜러 등 제3자에게 주는 취득비용(Financing Acquisition costs)은 각 금융계약 총수입의 17.5% 이하여야 합니다. 총수입은 조달비용을 빼기 전 이자수입, 보험 할인, 관리수수료, 취급수수료를 합한 금액입니다. 인센티브를 선수금 산정에 넣는 것도 금지되어 있습니다. 선임 후 딜러 지급 구조가 이 기준 안에 있는지 계약 단위로 점검하겠습니다.", "memo": "분모는 금융원금이 아닌 계약별 총수입(조달비용 차감 전)", "type": "bundle", "parts": ["상한: 각 금융계약 총수입(Income)의 17.5% 이하", "범위: 공급자 현금 커미션, 목표달성 인센티브, 출장비, 공동 판촉비, 소득세 등 제3자·직원 지급 비용 전부", "총수입 4요소: 조달비용 차감 전 이자수입 + 보험 할인(insurance discount) + 관리수수료 + 취급수수료", "금지: 제3자 인센티브를 선수금(Down Payment) 산정에 포함", "대표이사 할 일: 딜러 지급 구조가 기준 안에 있는지 계약 단위로 점검"], "card": "제3자 인센티브 상한 17.5%"}, {"id": "b-2-08", "ch": "2", "cards": ["규정 위반 처리 절차와 행정제재"], "imp": 2, "sem": true, "q": "규정 위반 시 OJK 처리 절차와 KBBF의 최근 지적사항 조치 현황을 말씀해 주십시오.", "a": "OJK가 위반을 확정하면 통지서를 보내고, 회사는 1개월 안에 요건을 충족해야 하며, 못 하면 이행계획을 내고 그 기간에도 못 하면 행정제재를 받습니다. 제재는 서면경고부터 영업정지, 인가취소, 과징금까지 있고 이사 개인에게 취임 금지가 부과될 수도 있습니다. KBBF는 3월에 사업계획상 교육훈련비가 인건비의 2.3%로 기준 2.5%에 못 미쳐 서면 경고를 받았고, 수정 사업계획을 제출했습니다. 선임 후 2.5% 이상 배정을 유지하고 인사 부서가 분기별 집행률을 보고하도록 해 이사회(BOD)와 감사회(BOC)에서 점검하겠습니다.", "memo": "통지 → 1개월 → 이행계획 → 제재의 4단계", "type": "bundle", "parts": ["절차: 위반 확정 → 통지서(Letter of Notification) → 1개월 내 요건 충족 → 미충족 시 이행계획(Fulfillment Plan) → 기간 내 미충족 시 행정제재", "회사 제재: 서면경고, 영업 일부·전부 동결, 업무 제한, 경고장(warning letter), 영업정지, 인가취소, 과징금(administrative fines) 등", "사람 제재: 지배주주·이사·커미셔너 취임 금지", "KBBF: 2026년 3월 사업계획(Business Plan)상 교육훈련비 인건비(Personnel Expenses)의 2.3%로 기준 2.5% 미달, 서면 경고 → 수정 사업계획 제출", "답변 순서: 지적 내용 → 원인 → 조치계획 → 담당자 → 기한 → 증빙 → 감사회(BOC, Board of Commissioners) 모니터링", "대표이사 할 일: 2.5% 이상 배정 유지, 인사 부서 분기별 집행률 보고, 이사회(BOD, Directors)·감사회 점검"], "card": "규정 위반 처리 절차와 행정제재"}, {"id": "b-2-09", "ch": "2", "cards": ["운전자금대출·자금대출 요건", "POJK 35/2025 개정 내용", "제3자 인센티브 상한 17.5%", "디지털금융서비스 요건"], "imp": 3, "sem": true, "q": "2장 사업활동(Business Activities)에서 꼭 기억해야 할 수치를 한 번에 말씀해 주십시오.", "a": "제3자 인센티브는 계약별 총수입의 17.5% 이하입니다. FMU와 FD는 건강도 2등급, NPF Net 5% 이하, 기본자본/납입자본 50% 이상이 회사 요건이고, FD 비중은 25% 이내, 차주 한도는 FMU 100억, FD 5억 루피아입니다. 담보 면제와 무담보 운전자금은 기본자본/납입자본 100% 초과 회사가 차주당 1억 루피아, 잔액 10% 이내에서 할 수 있습니다. 선수금 0%는 차량금융 NPF Net 3% 이하 회사가 잔액 20% 이내에서 할 수 있습니다.", "memo": "100이 두 번: 기본자본/납입자본 100% 초과, 차주당 IDR 100mn", "type": "bundle", "parts": ["제3자 인센티브: 계약별 총수입(Income)의 17.5% 이하", "FMU·FD 회사 요건: 건강도(Health Level) 2등급 이상, NPF Net 5% 이하, 기본자본/납입자본(Core Capital/Paid-Up Capital) 50% 이상", "FD 비중 25% 이내, 차주 한도 FMU IDR 10bn·FD IDR 500mn", "담보 면제(Collateral Exemption)·무담보 운전자금: 기본자본/납입자본 100% 초과, 차주당 IDR 100mn, 잔액 10% 이내", "선수금(Down Payment) 0%: 차량금융 NPF Net 3% 이하, 잔액 20% 이내", "디지털: IT 경력 3년, 승인 후 6개월 내 정보보안 인증", "위반 처리: 통지 후 1개월 내 충족"], "card": "운전자금대출·자금대출 요건 · POJK 35/2025 개정 내용 · 제3자 인센티브 상한 17.5% · 디지털금융서비스 요건"}, {"id": "b-3-01", "ch": "3", "cards": ["건전성 핵심 비율"], "imp": 3, "sem": true, "q": "MFC가 유지해야 할 재무 비율 기준과 KBBF의 현재 수준을 말씀해 주십시오.", "a": "MFC는 FAR 50% 이상, 기본자본 1,000억 루피아 이상, 기본자본/납입자본 50% 이상, Gearing Ratio 10배 이하, 자본비율 10% 이상을 유지해야 합니다. KBBF는 8월말 FAR 95.63%, 자기자본 약 4,700억 루피아, 자기자본/납입자본 58.96%, Gearing Ratio 2.06배, 자본비율 63.88%로 모두 충족합니다. 자기자본/납입자본은 여유가 약 9%p이므로 수익성을 회복해 손실이 쌓이지 않게 하겠습니다. 대주주와는 자본비율 12%, Gearing Ratio 8배, NPF 4%를 조기경보 기준으로 두고 도달 시 추가 지원을 받습니다.", "memo": "규제 10·10·50 / 조기경보 12·8·4", "type": "bundle", "parts": ["FAR: 순 금융채권잔액/총자산 50% 이상 → KBBF 95.63%", "기본자본: IDR 100bn 이상 → KBBF 자기자본 IDR 470.0bn", "기본자본/납입자본(Core Capital/Paid-Up Capital): 50% 이상 → KBBF 58.96%", "Gearing Ratio: 10배 이하 → KBBF 2.06배", "자본비율(Capital Ratio): 조정자본/조정자산 10% 이상 → KBBF 63.88%", "기타: 외화차입 전액 헤지(full hedge), 피두시아(Fiducia) 계약일부터 1개월 내 등록", "주의: 자기자본/납입자본 여유 약 9%p, 손실 누적 시 50%에 가까워짐", "대주주 지원: 조기경보(자본비율 12%, Gearing Ratio 8배, NPF 4%) 도달 시 추가 지원"], "card": "건전성 핵심 비율"}, {"id": "b-3-02", "ch": "3", "cards": ["자본 구성과 최소 자본 기준"], "imp": 2, "sem": true, "q": "MFC 자본의 구성과 최소 자본 기준, KBBF의 자본 확충 계획을 말씀해 주십시오.", "a": "MFC 자본은 기본자본과 보완자본으로 구성되고 보완자본은 기본자본의 100%까지 인정됩니다. 유지 기준은 기본자본 1,000억 루피아 이상과 기본자본/납입자본 50% 이상이고, 설립 시 납입자본은 2,500억 루피아 이상이어야 합니다. KBBF는 8월말 자기자본 약 4,700억 루피아, 납입자본 약 7,972억 루피아로 비율 58.96%입니다. 대주주는 3년간 5,700억 루피아 증자를 계획하고 있고 첫 집행은 2027년이며, 조기경보 기준에 도달하면 추가 지원을 받습니다.", "memo": "100bn은 유지 기준, 250bn은 설립 기준", "type": "bundle", "parts": ["구성: 기본자본(Tier 1, Core Capital) + 보완자본(Tier 2), 보완자본은 기본자본의 100%까지 산입", "유지 기준: 기본자본 IDR 100bn 이상, 기본자본/납입자본(Core Capital/Paid-Up Capital) 50% 이상", "설립 기준: 납입자본 Rp250bn 이상", "업무별 요건: 기타 금융사업(other financing business activities) 기본자본 Rp200bn, 인프라금융 기본자본 IDR 1조", "KBBF 8월: 자기자본 IDR 470.0bn, 납입자본 797.2bn, 비율 58.96%", "증자 계획: 대주주 3년간 IDR 570bn 계획 증자, 첫 집행 2027년", "추가 지원: 조기경보(자본비율 12%, Gearing Ratio 8배, NPF 4%) 도달 시", "대표이사 할 일: 수익성 회복으로 손실 누적 방지(1~8월 순이익 IDR 10.56bn)"], "card": "자본 구성과 최소 자본 기준"}, {"id": "b-3-03", "ch": "3", "cards": ["자산 건전성 분류와 충당금"], "imp": 3, "sem": true, "q": "금융채권의 자산 건전성 분류(A/R Collectability)와 충당금(allowance for impairment losses) 기준, KBBF의 NPF 관리 계획을 말씀해 주십시오.", "a": "금융채권은 연체일수에 따라 정상, 요주의, 고정, 회수의문, 손실의 5단계로 나누고, 담보를 뺀 잔액에 1%, 5%, 15%, 50%, 100%의 충당금을 쌓습니다. 91일 이상 연체된 고정 이하 채권이 NPF입니다. KBBF는 8월말 NPF 총 3.25%, 순 0.94%이고 충당금 커버리지는 89.6%이며, 순 NPF는 연말 0%를 목표로 하고 있습니다. 승인 전 심사부터 조기경보, 추심, 충당금 커버리지까지 연결해 관리하겠습니다.", "memo": "구간 경계 10·90·120·180일, 충당금 1·5·15·50·100%", "type": "bundle", "parts": ["5단계: 정상(Current) 10일 이하 · 요주의(Special Mention) 11~90일 · 고정(Non-Current) 91~120일 · 회수의문(Doubtful) 121~180일 · 손실(Bad Debt) 180일 초과", "충당금: (잔액 - 담보) × 1%·5%·15%·50%·100%, 담보가치는 채권잔액까지만 인정", "NPF: 고정·회수의문·손실(91일 이상) 채권", "KBBF 8월: NPF 총 3.25%(6월 1.57%, 업계 2.89%), 순 0.94%", "KBBF: 순 NPF(NPF Net) 연말 0% 목표", "KBBF: 충당금 커버리지 89.6%(8월, 6월 164.6%)", "대표이사 할 일: 승인 전 심사 → 조기경보 → 추심 → 충당금 커버리지까지 연결 관리"], "card": "자산 건전성 분류와 충당금"}, {"id": "b-3-04", "ch": "3", "cards": ["채권 재조정 요건과 결정권"], "imp": 3, "sem": true, "q": "채권 재조정(Restructuring)은 어떤 기준과 권한으로 결정합니까?", "a": "재조정은 상환이 어렵지만 사업 전망이 양호하거나 재조정 후 상환능력이 있는 차주에게만 할 수 있습니다. 자산 건전성 등급을 올리거나 충당금을 피하려는 목적은 금지됩니다. 결정은 원래 승인자보다 상위 권한자가 하고, 최고 권한자가 승인한 건은 이사회(BOD) 결의로 합니다. KBBF 재조정 채권은 6월 기준 0.51%이며, 이 기준 안에서만 운영하겠습니다.", "memo": "재조정 결정의 「이사회」는 경영 이사회(BOD)이며 감사회(BOC, Board of Commissioners)와 구분", "type": "bundle", "parts": ["대상: 원금·이자 상환이 어렵지만 사업 전망이 양호하거나 재조정 후 상환능력이 있는 차주", "금지 목적: 자산 건전성 등급 상향, 충당금(allowance for impairment losses) 증가 회피", "결정권: 원 금융 승인자보다 상위 권한자", "최고 권한자가 승인한 건: 이사회(BOD, Directors) 결의", "KBBF: 재조정 채권 0.51%(6월)", "대표이사 할 일: 규정 요건 안에서만 운영"], "card": "채권 재조정 요건과 결정권"}, {"id": "b-3-05", "ch": "3", "cards": ["최대금융한도(BMPP)"], "imp": 3, "sem": true, "q": "단일 차주 금융한도 기준과 KBBF의 대형 차주 관리 방안을 말씀해 주십시오.", "a": "단일 차주는 직전 월간보고 자본의 20%, 단일 그룹은 50%가 한도입니다. 자본 감소나 환율 변동 같은 외부 요인으로 한도를 넘으면 초과분을 조정하고 1개월 안에 실행계획을 내야 합니다. KBBF는 Fleet 중심이라 대형 법인 차주 비중을 한도 대비로 관리해야 합니다. 선임 후 최대 차주의 한도 비중을 바로 확인하겠습니다.", "memo": "20·50과 1개월. 분모가 직전 월 자본이라 자본이 줄면 기존 여신도 초과 가능", "type": "bundle", "parts": ["한도: 지배관계 없는 단일 차주 자본의 20%, 단일 차주그룹 50%", "산정 자본: 금융 실행 전 직전 월간보고서(Monthly Report)상 자본", "적용 제외: 정부 프로그램 지정 금융, 정부 보증부 금융", "초과 사유: 자본 감소, 환율 변동, 공정가치 변동, 합병·경영구조 변경, 법령 변경", "초과 시: 초과분 조정, 1개월 내 실행계획(action plan) 제출", "KBBF: Fleet 중심이라 대형 법인 차주 비중을 한도 대비로 관리", "대표이사 할 일: 선임 후 최대 차주의 한도 비중 바로 확인"], "card": "최대금융한도(BMPP)"}, {"id": "b-3-06", "ch": "3", "cards": ["금융위험 경감 4가지"], "imp": 2, "sem": true, "q": "금융위험 경감(Financing Risk Mitigation) 수단을 말씀해 주십시오.", "a": "규정상 금융위험 경감 수단은 신용보험·보증, 담보물 보험, 피두시아와 저당권 설정, 기타 채무불이행 대응 노력의 네 가지입니다. 이미 부실이 된 채권을 보험이나 보증으로 보장하는 것은 금지됩니다. 차량 금융은 피두시아를 계약 후 1개월 안에 등록하고 담보물 보험으로 위험을 이전하겠습니다.", "memo": "보험 두 가지(신용·담보물) + 담보권 설정 + 기타 노력", "type": "bundle", "parts": ["1. 신용보험·신용보증으로 위험 이전", "2. 담보물 위험을 보험으로 이전", "3. 담보신탁(피두시아, Fiduciary / Fiducia)·저당권 설정", "4. 기타 채무불이행(default) 위험 경감 노력", "금지: 보험금 청구액을 보험료 일정 비율로 제한하는 보험·보증, 부실 채권을 보험·보증으로 보장", "KBBF 적용: 차량 금융은 피두시아를 계약 후 1개월 안에 등록, 담보물 보험으로 위험 이전"], "card": "금융위험 경감 4가지"}, {"id": "b-3-07", "ch": "3", "cards": ["주주 요건과 외국인 지분 85%"], "imp": 3, "sem": true, "q": "MFC 주주 요건과 외국인 지분 한도, 대주주와의 관계를 말씀해 주십시오.", "a": "법인 지배주주는 투자 전 2년 이상 영업한 법인이어야 하고 투자액은 그 주주의 자기자본 한도 안이어야 하며, 외국인 소유는 직·간접으로 납입자본의 85%까지입니다. 주주는 회사 운영에서 이사회(BOD)에 간섭할 수 없습니다. KBBF는 10월 16일 임시주총에서 지분 변경과 사명 변경을 승인할 예정입니다. 저는 선임 후 JB우리캐피탈 직위를 겸하지 않으며, 대주주 의견은 주주총회(GMS)와 이사회의 공식 절차로 반영하고 회사와 고객 이익을 기준으로 판단하겠습니다.", "memo": "외국인 숫자 85·25·50: 지분 상한 85%, 외국인 이사 허용 지분 25%, 이사 인니 국적 50%", "type": "bundle", "parts": ["법인 지배주주: 투자 전 2년 이상 영업, 투자액은 그 주주의 자기자본 한도 내", "지배주주 최소 1명, 실질소유자(beneficial owner) 지정, 설립 납입자본 Rp250bn 이상", "외국인 소유: 직·간접 납입자본의 85% 이하", "외국인 기준 구분: 지분 85%(소유), 지분 25% 이상이면 외국인 이사 가능·이사 50% 이상 인니 국적", "주주는 회사 운영에서 이사회(BOD, Directors)에 간섭 금지(POJK 48/2024)", "KBBF: 10월 16일 임시주총에서 지분 변경·사명 변경 승인 예정", "KBBF: 대주주 3년 IDR 570bn 계획 증자, 첫 집행 2027년", "대표이사 할 일: JB우리캐피탈 겸직(Double Positions) 없음(파견 형식), 대주주 의견은 주총·이사회 공식 절차로만 반영"], "card": "주주 요건과 외국인 지분 85%"}, {"id": "b-3-08", "ch": "3", "cards": ["건전성 핵심 비율", "자본 구성과 최소 자본 기준", "자산 건전성 분류와 충당금", "최대금융한도(BMPP)", "주주 요건과 외국인 지분 85%"], "imp": 3, "sem": true, "q": "3장 재무 기준에서 꼭 기억해야 할 수치를 한 번에 말씀해 주십시오.", "a": "재무 비율은 FAR 50% 이상, Gearing Ratio 10배 이하, 자본비율 10% 이상이고, 기본자본은 1,000억 루피아 이상, 기본자본/납입자본은 50% 이상, 설립 납입자본은 2,500억 루피아입니다. 충당금은 1%, 5%, 15%, 50%, 100%이고 연체 경계는 10일, 90일, 120일, 180일입니다. 여신한도는 단일 차주 20%, 단일 그룹 50%이고, 외국인 지분은 85%까지입니다. KBBF 조기경보 기준은 자본비율 12%, Gearing Ratio 8배, NPF 4%입니다.", "memo": "20·50은 여신한도, 50·50은 FAR과 기본자본/납입자본", "type": "bundle", "parts": ["재무 비율: FAR 50% 이상, Gearing Ratio 10배 이하, 자본비율(Capital Ratio) 10% 이상", "자본: 기본자본 IDR 100bn 이상, 기본자본/납입자본(Core Capital/Paid-Up Capital) 50% 이상, 설립 납입자본 Rp250bn", "충당금(allowance for impairment losses): 1%·5%·15%·50%·100%, 연체 경계 10·90·120·180일", "여신한도: 단일 차주 20%, 단일 그룹 50%, 초과 시 1개월 내 실행계획(action plan)", "외국인 지분 85% 이하, 피두시아(Fiducia) 1개월 내 등록", "KBBF 조기경보: 자본비율 12%, Gearing Ratio 8배, NPF 4%"], "card": "건전성 핵심 비율 · 자본 구성과 최소 자본 기준 · 자산 건전성 분류와 충당금 · 최대금융한도(BMPP) · 주주 요건과 외국인 지분 85%"}, {"id": "b-4-01", "ch": "4", "cards": ["GCG 정의와 5원칙(TARIF)"], "imp": 3, "sem": true, "q": "GCG의 정의와 5원칙을 설명하고, 회사에 어떻게 적용하겠는지 말씀해 주십시오.", "a": "GCG는 주주총회, 이사회(BOD), 감사회(BOC)가 규정과 윤리에 따라 책임 있게 회사를 운영하는 구조와 과정입니다. 5원칙은 투명성, 책임성, 책임, 독립성, 공정성이고, 책임성은 직무와 KPI·보고체계에 따른 경영 책임, 책임은 법규 준수를 뜻합니다. KBBF는 2025년 GCG 자체평가 2등급입니다. 저는 직무별 KPI와 보고선을 명확히 하고, 대주주 의견도 주주총회와 이사회 공식 절차로만 반영해 독립성을 지키겠습니다.", "memo": "TARIF 순서. Accountability=KPI·보고체계, Responsibility=법규 준수", "type": "bundle", "parts": ["정의: 주주총회(GMS)·이사회(BOD, Directors)·감사회(BOC, Board of Commissioners)가 규정과 윤리에 따라 책임 있게 회사를 운영하는 구조와 과정", "투명성(Transparency): 관련 정보를 명확하고 접근하기 쉽게 공개", "책임성(Accountability): 조직구조·직무·KPI·보고체계에 따른 경영 책임", "책임(Responsibility): 법규·규정·규범 준수", "독립성·공정성: 이해상충과 외부 간섭 회피, 모든 이해관계자 공정 대우", "설명 틀: 구조(기관·위원회·통제 조직) → 과정(TARIF) → 결과(이해관계자 가치)", "KBBF: 2025년 GCG 자체평가 2등급", "대표이사 할 일: 대주주 의견도 주총·이사회 공식 절차로만 반영해 독립성 유지"], "card": "GCG 정의와 5원칙(TARIF)"}, {"id": "b-4-02", "ch": "4", "cards": ["기관 구성 요건(자산 Rp250bn 초과)", "이사·감사·DPS 국적·거주 요건"], "imp": 3, "sem": true, "q": "이사회(BOD, Directors)와 감사회(BOC, Board of Commissioners)의 구성 요건, 국적·거주 요건을 말씀해 주십시오.", "a": "자산 2,500억 루피아를 넘는 회사는 이사 3명 이상, 감사(BOC 위원) 2명 이상이고 감사회(BOC)에는 독립감사(독립커미셔너)가 포함돼야 합니다. 외국인 지분이 25% 이상이면 외국인 이사를 둘 수 있지만 이사의 50% 이상은 인도네시아 국민이어야 하고, 이사는 전원 인도네시아에 거주해야 합니다. KBBF는 기존 이사 3명 중 2명이 사임했고, 신규 이사 3명이 주총에서 선임돼 F&P를 받고 있으며, 승인 후에는 대표, 사업, 운영, 재무 이사 4인 체계가 됩니다. 저는 선임 후 인도네시아에 거주하며 상근으로 근무하겠습니다.", "memo": "250bn 넘으면 이사 3·감사 2. 거주는 이사 전원, 감사 최소 1명", "type": "bundle", "parts": ["적용 대상: 자산 Rp250bn 초과 회사", "이사회(BOD): 최소 3명, 전원 인도네시아 거주", "감사회(BOC): 최소 2명(독립감사 포함), 최소 1명 인도네시아 거주", "국적: 외국인 지분 25% 이상이면 외국인 이사·감사 가능, 각각 최소 50%는 인도네시아 국민(25% 미만이면 전원 국민)", "독립감사: 인도네시아 국민이며 거주, 감사 결격은 최근 6개월 내 같은 회사 이사 경력", "KBBF: 총자산 약 IDR 1,473.4bn(8월말)으로 적용 대상, 감사(BOC 위원) 2명", "KBBF 이사회: 기존 3인 중 2인 사임, 신규 3인 주총 선임 후 F&P 진행 중, 승인 후 4인(CEO·CBO·COO·CFO) 체계", "본인: 선임 후 인도네시아에 거주하며 상근 근무"], "card": "기관 구성 요건(자산 Rp250bn 초과) · 이사·감사·DPS 국적·거주 요건"}, {"id": "b-4-03", "ch": "4", "cards": ["이사회·감사회·주총 회의 요건"], "imp": 2, "sem": true, "q": "이사회(BOD, Directors), 감사회(BOC, Board of Commissioners), 주주총회(GMS)의 회의 요건과 의사록(MoM) 관리 방법을 말씀해 주십시오.", "a": "이사회(BOD)는 매월 1회 이상, 출석 50% 이상이고 감사회(BOC)는 연 4회 이상, 출석 75% 이상이며, 주주총회는 연 1회 이상 엽니다. 의사록은 관련자 전원에게 배포하고 반대 의견을 포함해야 합니다. KBBF는 10월 16일 임시주총에서 지분 변경과 사명 변경을 다룰 예정입니다. 저는 이사회 의사록에 논의 과정과 반대 의견까지 기록하고 관련자 전원에게 배포하겠습니다.", "memo": "이사회 월1·50%, 감사회 연4·75%, 주총 연1", "type": "bundle", "parts": ["이사회(BOD): 월 1회 이상, 출석 요건 50%", "감사회(BOC): 연 4회 이상, 출석 요건 75%", "주주총회: 연 1회 이상", "의사록: 관련 당사자 전원에게 배포, 반대 의견(dissenting opinion) 포함", "작성 방식: 요약만 쓰지 않고 발언·논의 과정·반대 의견이 드러나게", "KBBF: 10월 16일 임시주총 예정(지분 변경 승인·사명 변경)"], "card": "이사회·감사회·주총 회의 요건"}, {"id": "b-4-04", "ch": "4", "cards": ["겸직 제한(이사·감사·DPS)"], "imp": 3, "sem": true, "q": "이사와 감사(BOC 위원)의 겸직(Double Positions) 제한 기준과 선임 후 모회사 직위 겸임 여부를 말씀해 주십시오.", "a": "규정상 이사는 다른 기관의 이사나 집행임원을 겸할 수 없고, 이사와 감사(BOC 위원) 모두 다른 기관 감사는 2곳까지만 겸할 수 있습니다. 선임 후 JB우리캐피탈에서 겸임하는 직위는 없고 인사상 해외 파견 형식이며, KBBF 대표이사 업무에만 전념하겠습니다. 대주주 의견은 주주총회(GMS)와 이사회(BOD) 공식 절차로만 반영하겠습니다.", "memo": "이사는 다른 기관 이사 겸직 0곳, 다른 기관 감사 2곳까지", "type": "bundle", "parts": ["이사 금지: 다른 기관 이사·집행임원(executive officer), 2개 초과 기관 감사(BOC 위원), 같은 회사 DPS, 이해상충 직위", "이사 예외: 지배 자회사 감사, 협회 지명, OJK 지정, 비영리단체 직위", "감사: 다른 기관 감사는 2곳까지 허용, 다른 기관 이사·임원은 조건부 금지", "DPS: 이사·감사·집행임원 겸직 금지, 3개 초과 기관 DPS 금지", "예외 조건: 겸직으로 직무·권한을 소홀히 하지 않는 경우에 한함", "본인: 선임 후 JB우리캐피탈 겸직 없음(해외 파견 형식), KBBF 대표이사(President Director) 업무에 전념", "대표이사 할 일: 대주주 의견은 주총·이사회(BOD, Directors) 공식 절차로만 반영"], "card": "겸직 제한(이사·감사·DPS)"}, {"id": "b-4-05", "ch": "4", "cards": ["준법 담당 이사와 이사·감사 공시"], "imp": 3, "sem": true, "q": "준법 담당 이사의 역할과 겸직(Double Positions) 제한, 이사·감사(BOC 위원)의 공시 의무를 말씀해 주십시오.", "a": "준법 담당 이사는 회사 정책과 업무가 법령에 맞는지, OJK에 한 약속이 이행되는지를 책임지며 반드시 지정해야 합니다. 준법 담당 이사는 여신, 마케팅, 재무 기능을 맡을 수 없고 대표이사만 예외입니다. 이사와 감사(BOC 위원)는 5% 이상 지분 보유와 다른 이사, DPS, 주주, 사업그룹과의 재무·가족 관계를 공시해야 합니다. 선임 후 준법 담당 이사 지정 현황을 바로 점검해 영업·재무 기능과 분리되도록 하고, 컴플라이언스 부서의 독립 보고선도 확인하겠습니다.", "memo": "준법 이사가 못 맡는 세 기능: 여신·마케팅·재무", "type": "bundle", "parts": ["지정 의무: 준법 기능 담당 이사를 반드시 지정", "역할: 정책·규정·절차·업무의 법령 적합성 확보, OJK 등 감독당국에 대한 약속 이행 확보", "겸직 제한: 여신·마케팅·재무 기능 담당 불가, 대표이사(President Director)만 예외", "공시 ①: 5% 이상 지분 보유", "공시 ②: 다른 이사·DPS·주주·사업그룹과의 재무·가족 관계", "대표이사 할 일: 선임 후 준법 담당 이사 지정 현황 점검, 영업·재무와 분리, 컴플라이언스 독립 보고선 확인"], "card": "준법 담당 이사와 이사·감사 공시"}, {"id": "b-4-06", "ch": "4", "cards": ["이사회의 역할·의무·금지"], "imp": 3, "sem": true, "q": "이사회(BOD, Directors)의 역할과 의무, 금지행위를 말씀하고, 지배주주가 운영에 직접 지시하면 어떻게 하겠는지 말씀해 주십시오.", "a": "이사회(BOD)는 회사 경영 전반에 전적으로 책임지고, 법령과 정관을 지키며 차주와 채권자를 포함한 이해관계자 이익을 고려하고 감사회(BOC)에 정보를 적시에 제공할 의무가 있습니다. 이해상충 거래, 지위를 이용한 회사 손해, 주주총회(GMS) 결의 외 개인 이익 취득은 금지되고, 주주의 경영 간섭도 허용되지 않습니다. 대주주 의견은 주주총회와 이사회의 공식 절차로만 반영하고, 결정은 회사와 고객의 이익을 기준으로 이사회에서 하겠습니다. 이견이 있으면 회의록에 남기고, 이해관계가 있는 이사는 의사결정에서 빠지도록 하겠습니다.", "memo": "이사회는 경영·실행 책임, 감사회는 감독·자문", "type": "bundle", "parts": ["역할: 회사 경영 전반에 전적 책임, 전략 방향 결정, 직무 이행을 감사회(BOC, Board of Commissioners)에 보고", "의무: 법령·정관 준수, 권한에 따른 경영, 주총에 책임, 차주·채권자 등 이해관계자 이익 고려", "의무: 감사회·DPS에 정보 적시·완전 제공, 회사 기관 직무 수행 지원", "금지: 이해상충 거래, 지위를 이용한 회사 손해, 주총 결의 외 개인 이익 취득", "주주 간섭: 주주는 회사 운영에서 이사회(BOD)에 간섭할 수 없음", "KBBF: 대표이사(President Director) 겸직(Double Positions) 없음(파견 형식), 대주주 의견은 주총·이사회 공식 절차로만 반영", "대표이사 할 일: 회사·고객 이익 기준으로 이사회에서 결정, 이견은 회의록에 기록", "이해상충 관리: 관계 거래 공시, 이해관계 있는 이사는 의사결정에서 제외"], "card": "이사회의 역할·의무·금지"}, {"id": "b-4-07", "ch": "4", "cards": ["감사회의 역할·의무·금지"], "imp": 2, "sem": true, "q": "감사회(BOC, Board of Commissioners)의 역할과 의무를 말씀하고, 대표이사(President Director)로서 감사회에 어떻게 보고하겠는지 말씀해 주십시오.", "a": "감사회(BOC)는 회사와 주주, 이해관계자를 위해 이사회(BOD)를 감독하고 자문합니다. GCG 이행 효과성을 모니터링하고, 내부감사, 외부감사, OJK 지적사항에 대한 이사회의 후속조치를 확인하며, 운영 책임은 이사회에 있으므로 운영을 방해할 수 없습니다. KBBF 감사회는 2명입니다. 저는 지적사항별 담당자, 기한, 증빙을 정리해 감사회와 감사위원회에 정기적으로 보고하겠습니다.", "memo": "후속조치는 이사회가 이행, 감사회가 확인", "type": "bundle", "parts": ["역할: 회사·주주·이해관계자를 위해 이사회(BOD, Directors)를 감독·자문", "의무: 이해관계자 이익 균형 감독, 감사회(BOC) 활동보고서 작성(GCG 이행보고서 일부), GCG 이행 효과성 모니터링", "의무: 내부감사(Internal Audit)·외부감사·OJK 지적사항에 대한 이사회 후속조치 확인", "금지: 이해상충 거래, 지위 남용, 개인 이익 취득, 이사회 책임인 회사 운영 방해", "기타: 재무보고 내부통제(Internal Control) 감독(POJK 42/2025), AML 정책 승인·이행 감독", "KBBF: 감사(BOC 위원) 2명", "대표이사 할 일: 지적사항별 담당자·기한·증빙을 정리해 감사회·감사위원회(Audit Committee)에 정기 보고"], "card": "감사회의 역할·의무·금지"}, {"id": "b-4-08", "ch": "4", "cards": ["독립감사 요건 6가지"], "imp": 2, "sem": true, "q": "독립감사(독립커미셔너)의 요건과 역할, 대표이사(President Director)와의 협력 방식을 말씀해 주십시오.", "a": "독립감사(독립커미셔너)는 회사의 이사, 감사(BOC 위원), 주주와 관계가 없고, 최근 6개월간 같은 회사나 관계회사에서 이사 등의 경력이 없어야 하며, 멀티파이낸스 법령과 회사 재무상태를 알고 인도네시아에 거주하는 국민이어야 합니다. 독립감사는 차주와 채권자 등 이해관계자 이익을 대변하고 감사회(BOC) 산하 위원회를 이끕니다. 저는 위원회에 필요한 정보를 적시에 완전하게 제공하고, 독립감사의 반대 의견도 회의록에 남기겠습니다.", "memo": "요건 6개: 관계 없음·6개월 경력 제한·법령 이해·재무 지식·국민·거주", "type": "bundle", "parts": ["독립성: 같은 회사 이사·감사(BOC 위원)·DPS·주주와 관계 없음", "경력 제한: 최근 6개월간 같은 회사·관계회사 이사·감사·DPS·이사 직하 직위 경력 없음", "전문성: 멀티파이낸스 법령 이해, 회사 재무상태 지식", "국적·거주: 인도네시아 국민, 인도네시아 거주", "역할: 차주·채권자·이해관계자 이익을 대변하는 감독, 감사회(BOC, Board of Commissioners) 산하 3개 위원회 위원장", "대표이사 할 일: 위원회에 정보 적시·완전 제공, 독립감사 반대 의견(dissenting opinion)도 회의록에 기록"], "card": "독립감사 요건 6가지"}, {"id": "b-4-09", "ch": "4", "cards": ["감사회 산하 3개 위원회"], "imp": 3, "sem": true, "q": "감사회(BOC, Board of Commissioners) 산하에 두어야 하는 위원회와 각 위원회의 역할을 말씀해 주십시오.", "a": "감사회(BOC) 산하에는 감사위원회, 리스크감시위원회, 보수·추천위원회 세 개를 두고 위원장은 모두 독립감사가 맡습니다. 감사위원회는 감사 이행과 재무제표, 지적사항 후속조치, 내부통제를 점검하고 외부감사인 후보를 제안합니다. 리스크감시위원회는 리스크 정책과 실제 이행이 맞는지 평가하고, 보수·추천위원회는 보수와 추천 정책을 평가합니다. 리스크감시위원회는 감사회 산하 감독 기구이고 리스크관리위원회는 이사회(BOD) 산하 실행 기구이며, 저는 각 위원회에 필요한 자료를 적시에 제공하겠습니다.", "memo": "감사·리스크감시·보수추천, 위원장 셋 모두 독립감사", "type": "bundle", "parts": ["설치 대상: 자산 Rp250bn 초과 회사, 3개 위원회 위원장은 모두 독립감사", "감사위원회(Audit Committee): 감사·재무·회계 전문 독립위원 1명 이상, 감사 이행·재무제표 PSAK 적합성·지적사항 후속조치·내부통제(Internal Control) 모니터링", "감사위원회: 외부감사인 후보를 감사회(BOC)에 제안 → 감사회가 주총에 승인 요청", "리스크감시위원회(Risk Monitoring Committee): 재무·리스크 전문 독립위원 1명 이상, 리스크 정책과 이행의 정합성 평가", "보수·추천위원회(Remuneration & Nomination Committee): 감사(BOC 위원) 1명 + 인사 담당 이사 직하 임원 1명, 보수·추천 정책 평가·권고", "구분: 리스크감시위원회는 감사회 산하 감독 기구, 리스크관리위원회(Risk Management Committee)는 이사회(BOD, Directors) 산하 비상설 실행 기구", "대표이사 할 일: 각 위원회에 필요한 자료를 적시에 제공"], "card": "감사회 산하 3개 위원회"}, {"id": "b-4-10", "ch": "4", "cards": ["기관 구성 요건(자산 Rp250bn 초과)", "이사·감사·DPS 국적·거주 요건", "이사회·감사회·주총 회의 요건", "겸직 제한(이사·감사·DPS)", "준법 담당 이사와 이사·감사 공시", "독립감사 요건 6가지"], "imp": 3, "sem": true, "q": "4장 지배구조에서 꼭 기억해야 할 수치를 한 번에 말씀해 주십시오.", "a": "자산 2,500억 루피아를 넘는 회사는 이사 3명 이상, 감사(BOC 위원) 2명 이상, 감사회(BOC) 산하 위원회 3개를 둡니다. 외국인 지분이 25% 이상이면 외국인 이사를 둘 수 있고 인도네시아 국민이 50% 이상이어야 합니다. 이사회(BOD)는 월 1회 출석 50%, 감사회는 연 4회 출석 75%, 주주총회(GMS)는 연 1회입니다. 다른 기관 감사 겸직은 2곳까지, 감사의 이사 경력 제한은 6개월, 지분 공시 기준은 5%입니다.", "memo": "250 → 3·2·3(이사·감사·위원회), 회의 월1/연4/연1, 출석 50/75", "type": "bundle", "parts": ["기관 구성: 자산 Rp250bn 초과 시 이사 3명 이상, 감사(BOC 위원) 2명 이상, 위원회 3개", "국적: 외국인 지분 25% 이상이면 외국인 이사 가능, 인도네시아 국민 최소 50%", "회의: 이사회(BOD, Directors) 월 1회·출석 50%, 감사회(BOC, Board of Commissioners) 연 4회·출석 75%, 주총 연 1회", "겸직(Double Positions): 이사·감사의 다른 기관 감사 겸직 2곳까지, DPS는 3곳까지", "경력 제한: 감사·독립감사는 최근 6개월 이사 등 경력 없음", "공시: 이사·감사 5% 이상 지분 보유", "GCG 자체평가 제출 2월 15일"], "card": "기관 구성 요건(자산 Rp250bn 초과) · 이사·감사·DPS 국적·거주 요건 · 이사회·감사회·주총 회의 요건 · 겸직 제한(이사·감사·DPS) · 준법 담당 이사와 이사·감사 공시 · 독립감사 요건 6가지"}, {"id": "b-5-01", "ch": "5", "cards": ["리스크관리 일반 원칙·4대 요소"], "imp": 3, "sem": true, "q": "리스크관리의 정의와 이행 4대 요소를 설명하고, KBBF 현황을 말씀해 주십시오.", "a": "리스크관리는 회사 업무에서 생기는 위험을 식별·측정·모니터링·통제하는 절차입니다. 이행은 이사회(BOD)와 감사회(BOC)의 적극적 감독, 정책·절차·한도, 위험 식별·측정·모니터링·통제와 정보시스템, 내부통제 네 요소로 하고, 평가는 고유위험과 관리 품질을 함께 봅니다. KBBF는 리스크관리위원회를 분기마다 열고 있고 2분기 리스크 프로필은 종합 P2입니다. 선임 후 PADK 48/2025에 맞춘 정책 정비 결과를 첫 이사회에서 확인하겠습니다.", "memo": "4대 요소 순서: 감독 → 정책·한도 → 측정·시스템 → 내부통제", "type": "bundle", "parts": ["정의: 업무에서 생기는 위험을 식별·측정·모니터링·통제하는 절차와 방법론", "4대 요소: 이사회(BOD, Directors)·감사회(BOC, Board of Commissioners)의 적극적 감독 / 정책·절차·한도 / 식별·측정·모니터링·통제와 정보시스템 / 내부통제(Internal Control)", "적용: 회사 목적·규모·복잡성에 맞게 적용", "평가: 고유위험(Inherent Risk)과 리스크관리 이행 품질(KPMR)을 함께 평가", "조직 기준: 자산 Rp250bn 초과 시 리스크관리위원회(Risk Management Committee)·리스크관리부서(Risk Management Work Unit) 설치", "KBBF: 2분기 리스크 프로필(Risk Profile) 종합 P2, 리스크관리위원회 분기 운영, 업종 한도 체계 구축 중", "대표이사: PADK 48/2025(정책 정비 기한 2026년 6월 말) 반영 결과를 첫 이사회에서 확인"], "card": "리스크관리 일반 원칙·4대 요소"}, {"id": "b-5-02", "ch": "5", "cards": ["8대 위험과 고유위험 평가지표"], "imp": 3, "sem": true, "q": "멀티파이낸스의 8대 위험과 그룹 구분을 설명하고, KBBF의 주요 위험과 대응을 말씀해 주십시오.", "a": "8대 위험은 전략, 신용, 시장, 운영, 유동성, 준법, 법률, 평판 위험입니다. 건강도(Health Level) 평가에서는 전략을 사업위험군, 신용·시장·운영·유동성을 재무위험군, 준법·법률·평판을 지배구조위험군으로 묶습니다. KBBF의 2분기 리스크 프로필(Risk Profile)은 종합 P2이고 유동성은 P1, 법률은 P3입니다. 신용위험에서는 Fleet 비중이 약 88%여서 편중도 관리가 필요하고 8월 NPF Gross는 3.25%입니다. 업종 한도 체계를 완성하고 법률위험은 계약과 소송 관리를 점검하겠습니다.", "memo": "순서 S-C-M-O-L-C-L-R. 운영위험은 재무위험군에 속함", "type": "bundle", "parts": ["8대 위험: 전략(Strategic)·신용(Credit)·시장(Market)·운영(Operational)·유동성(Liquidity)·준법(Compliance)·법률(Legal)·평판(Reputation)", "A 사업위험군: 전략", "B 재무위험군: 신용·시장·운영·유동성", "C 지배구조위험군: 준법·법률·평판", "고유위험(Inherent Risk) 결정 요인 5: 사업전략·사업 특성·업무 복잡성·금융업계 상황·거시경제", "KBBF 등급: 2분기 종합 P2, 유동성 P1, 법률 P3", "KBBF 신용위험: Fleet 비중 약 88%로 편중도 관리 필요, NPF Gross 3.25%(8월)", "대표이사: 업종 한도 체계 완성, 법률위험은 계약·소송 관리 점검"], "card": "8대 위험과 고유위험 평가지표"}, {"id": "b-5-03", "ch": "5", "cards": ["리스크관리 전략·대응 4유형"], "imp": 2, "sem": true, "q": "리스크 대응(Risk Treatment) 방식 4가지와 리스크관리 운영 구성을 사례와 함께 설명해 주십시오.", "a": "리스크 대응은 회피, 감소, 이전, 수용 네 가지입니다. 고위험 사업은 진출하지 않고, 통제로 줄일 수 있는 위험은 통제를 강화하며, 보험이나 위탁으로 넘길 수 있는 위험은 이전하고, 경미한 위험은 수용합니다. 운영은 사람, 정책, 프로세스, 성과 네 구성으로 하고 전략 KPI마다 리스크 KPI를 함께 둡니다. KBBF에서는 피두시아 등록과 담보 보험으로 신용위험을 줄이고, 대주주와 정한 조기경보 기준으로 상향보고 체계를 운영하겠습니다.", "memo": "회피·감소·이전·수용 = 피한다·줄인다·넘긴다·받아들인다", "type": "bundle", "parts": ["대응 4유형: 회피(Avoid / Terminate)·감소(Reduce)·이전(Transfer)·수용(Accept)", "회피: 고위험 사업에 진출하지 않음", "감소: 선제 통제로 위험을 줄임", "이전: 보험 가입·아웃소싱", "수용: 경미한 위험은 조치 없이 수용", "운영 구성: People·Policy·Process·Performance 4구성, 전략 KPI마다 리스크 KPI를 함께 둠(이중 KPI, Dual KPI)", "KBBF: 피두시아(Fiducia) 등록·담보 보험으로 신용위험 감소", "대표이사: 대주주 조기경보 기준(자본비율 12%, Gearing Ratio 8배, NPF 4%)으로 상향보고(Escalation) 체계 운영"], "card": "리스크관리 전략·대응 4유형"}, {"id": "b-5-04", "ch": "5", "cards": ["수용능력·선호·허용·한도"], "imp": 3, "sem": false, "q": "Risk Appetite, Risk Tolerance, Risk Limit의 차이를 설명하고 KBBF에 어떻게 적용하시겠습니까?", "a": "수용능력은 자본과 유동성으로 흡수할 수 있는 손실 범위이고, 그 안에서 이사회(BOD)가 전략목표를 위해 받아들일 위험 수준인 Risk Appetite를 정합니다. Risk Tolerance는 넘으면 조치가 필요한 상한이고, Risk Limit는 8대 위험과 기능·거래별로 정하는 운영 한도이며 최소 연 1회 검토합니다. KBBF는 대주주와 자본비율 12%, Gearing Ratio 8배, NPF 4%를 조기경보선으로 두고 있습니다. 저는 이 기준과 업종 한도를 이사회 승인 한도로 연결해 매년 검토하겠습니다.", "memo": "범위가 넓은 순서: 수용능력 ⊃ 선호 → 허용 → 한도", "type": "bundle", "parts": ["4단계 계층: 수용능력(Risk Bearing Capacity / Risk Capacity) → 선호 → 허용 → 한도", "수용능력: 자본·유동성·운영역량으로 흡수할 수 있는 손실 범위, 1차 제약", "선호(Risk Appetite): 전략목표를 위해 받아들이려는 위험 수준, 이사회(BOD, Directors)가 설정", "허용(Risk Tolerance): 넘으면 조치가 필요한 상한", "한도(Risk Limit): 8대 위험별·기능별·거래별 설정, 최소 연 1회 검토", "KBBF: 이사회가 Risk Appetite와 한도 승인, 업종 한도 체계 구축 중", "KBBF 조기경보: 자본비율(Capital Ratio) 12%, Gearing Ratio 8배, NPF 4%(규정 한도 10%·10배보다 앞선 경보선)", "대표이사: 조기경보 기준과 업종 한도를 이사회 승인 한도로 연결해 매년 검토"], "card": "수용능력·선호·허용·한도"}, {"id": "b-5-05", "ch": "5", "cards": ["리스크관리위원회·부서·기능", "3선 모델(Three Lines Model)"], "imp": 2, "sem": true, "q": "리스크관리 조직 체계와 3선 모델(Three Lines Model)을 설명해 주십시오.", "a": "자산 Rp250bn을 넘는 회사는 이사회(BOD) 산하에 리스크관리위원회와 리스크관리부서를 둡니다. 리스크관리 기능(Risk Management Function)은 영업과 내부통제 기능에서 독립하고 대표이사 또는 리스크관리 담당 이사에게 직접 보고합니다. 3선 모델에서 1선은 영업·심사 같은 사업부, 2선은 리스크관리와 컴플라이언스, 3선은 내부감사이며 내부감사는 독립 요건을 갖춰야 합니다. KBBF는 리스크관리위원회를 분기마다 운영하고 있고, 저는 한도 초과 사항을 이사회에 보고받고 감사 계획과 자료 접근에 간섭하지 않겠습니다.", "memo": "1선 관리, 2선 견제, 3선 독립 보증", "type": "bundle", "parts": ["리스크관리위원회(Risk Management Committee): 자산 Rp250bn 초과 시 설치, 이사회(BOD, Directors) 산하 비상설, 이사의 절반 이상으로 구성", "위원회 역할: 리스크관리 정책·전략(선호·허용 포함)과 비상계획(contingency plan) 수립", "리스크관리부서(Risk Management Work Unit): 전체 위험 포지션 모니터링·시나리오 테스트, 영업·내부통제(Internal Control) 기능에서 독립", "보고선: 대표이사(President Director) 또는 리스크관리 담당 이사에게 직접 보고", "3선 구분: 1선 사업부(영업·심사), 2선 리스크관리·컴플라이언스, 3선 내부감사(Internal Audit)", "3선 독립 3요건: 지배기구(Governing Body)에 대한 책임 / 사람·자원·데이터 접근 / 감사 계획·수행에 간섭 배제", "KBBF: 리스크관리위원회 분기 운영", "대표이사: 위원회 회의를 직접 챙기고 한도 초과 사항은 이사회에 보고, 내부감사 독립성 보장"], "card": "리스크관리위원회·부서·기능 · 3선 모델(Three Lines Model)"}, {"id": "b-5-06", "ch": "5", "cards": ["건강도 평가 4요소·5등급"], "imp": 3, "sem": true, "q": "금융회사 건강도(Health Level) 평가의 4요소와 등급 체계를 설명하고, KBBF 상태를 말씀해 주십시오.", "a": "건강도 평가는 GCG, 리스크 프로필, 수익성, 자본 네 요소로 회사 전반을 평가해 1등급부터 5등급까지 매깁니다. 4등급은 집중감독, 5등급은 특별감독 대상이고, FMU·FD와 외화차입 같은 업무는 종합 2등급 이상이 요건입니다. KBBF는 GCG 자체평가 2등급, 리스크 프로필 P2이고 8월말 자본비율이 63.88%로 자본은 충분합니다. 수익성이 가장 약한 요소여서 BOPO와 ROA 개선부터 하겠습니다.", "memo": "G-R-P-C(GCG·Risk Profile·Profitability·Capital). NPF는 리스크 프로필 안의 지표", "type": "bundle", "parts": ["4요소: GCG·리스크 프로필(Risk Profile)·수익성(Profitability)·자본(Capital)", "종합등급(Composite Rating) 5단계: 1 매우 건전(Very Healthy) · 2 건전(Healthy) · 3 상당히 건전(Fairly Healthy) · 4 다소 미흡(Less Healthy) · 5 불건전(Unhealthy)", "감독 연결: 4등급 집중감독(Intensive), 5등급 특별감독(Special)", "종합 2등급 이상 요건: FMU·FD, 기타 금융사업(other financing business activities), 인프라금융, 외화차입", "절차: 요소별 평가 → 종합등급 → 자체평가 제출 → OJK 확정 → 개선계획", "KBBF: GCG 자체평가 2등급, 리스크 프로필 P2, 자본비율(Capital Ratio) 63.88%(8월말)", "KBBF 약점: 수익성(ROA 누계 0.80%, BOPO 90.58%, 8월말)", "대표이사: 수익성 회복을 우선 과제로 두고 종합 2등급 이상 유지"], "card": "건강도 평가 4요소·5등급"}, {"id": "b-5-07", "ch": "5", "cards": ["감독 방식과 감독 상태 3단계"], "imp": 3, "sem": true, "q": "OJK 감독 방식과 감독 상태(Supervisory Status) 구분 기준을 설명해 주십시오.", "a": "OJK는 보고서와 데이터를 분석하는 간접감독과 회의·검사로 하는 직접감독을 합니다. 감독 상태는 정상, 집중, 특별 세 단계이고, 종합 4등급이나 자기자본/납입자본 50% 미만, NPF Net 5% 초과 중 하나면 집중감독입니다. 종합 5등급, 자기자본/납입자본 0% 미만, NPF Net 25% 초과는 특별감독입니다. KBBF는 8월말 자기자본/납입자본 58.96%, NPF Net 0.94%로 기준과 거리가 있지만 자본 여유가 약 9%p이므로 손실 누적을 막고 조기경보 기준으로 먼저 대응하겠습니다.", "memo": "집중 4·50·5, 특별 5·0·25", "type": "bundle", "parts": ["감독 방식: 간접감독(보고서·감독데이터 분석)과 직접감독(회의·검사)", "검사 유형: 정기검사·수시검사·범죄 혐의 특별검사", "정상감독(Normal): 집중·특별감독(Special) 기준에 해당하지 않음", "집중감독(Intensive): 종합 4등급 / 자기자본/납입자본 50% 미만 / NPF Net 5% 초과", "특별감독: 종합 5등급 / 자기자본/납입자본 0% 미만 / NPF Net 25% 초과 / 집중감독 기간 종료", "KBBF: 자기자본/납입자본 58.96%, NPF Net 0.94%(8월말)", "KBBF 주의: 자기자본/납입자본 여유 약 9%p", "대표이사: 손실 누적 방지, 대주주 조기경보 기준으로 먼저 대응"], "card": "감독 방식과 감독 상태 3단계"}, {"id": "b-5-08", "ch": "5", "cards": ["리스크관리 일반 원칙·4대 요소", "수용능력·선호·허용·한도", "건강도 평가 4요소·5등급", "감독 방식과 감독 상태 3단계"], "imp": 3, "sem": true, "q": "리스크관리와 감독 상태(Supervisory Status)에 관한 주요 기준 수치를 말씀해 주십시오.", "a": "자산 Rp250bn을 넘으면 리스크관리위원회와 리스크관리부서를 두고, 리스크 한도는 최소 연 1회 검토합니다. 집중감독 기준은 종합 4등급, 자기자본/납입자본 50% 미만, NPF Net 5% 초과이고, 특별감독 기준은 종합 5등급, 0% 미만, 25% 초과입니다. KBBF는 대주주와 자본비율 12%, Gearing Ratio 8배, NPF 4%를 조기경보선으로 정했습니다. 8월말 자본비율은 63.88%, 자기자본/납입자본은 58.96%, NPF Net은 0.94%입니다.", "memo": "조기경보 12·8·4는 규정 한도 10%·10배보다 앞선 경보선", "type": "bundle", "parts": ["조직: 자산 Rp250bn 초과 시 리스크관리위원회(Risk Management Committee)·리스크관리부서(Risk Management Work Unit)", "한도 검토: 최소 연 1회", "건강도(Health Level): 종합 2등급 이상이 FMU·FD·외화차입 등 업무 요건", "집중감독(Intensive): 4등급 · 자기자본/납입자본 50% 미만 · NPF Net 5% 초과", "특별감독(Special): 5등급 · 자기자본/납입자본 0% 미만 · NPF Net 25% 초과", "대주주 조기경보: 자본비율(Capital Ratio) 12% · Gearing Ratio 8배 · NPF 4%", "KBBF(8월말): 자본비율 63.88%, 자기자본/납입자본 58.96%, NPF Net 0.94%, 리스크 프로필(Risk Profile) P2"], "card": "리스크관리 일반 원칙·4대 요소 · 수용능력·선호·허용·한도 · 건강도 평가 4요소·5등급 · 감독 방식과 감독 상태 3단계"}, {"id": "b-6-01", "ch": "6", "cards": ["사업계획 근거 규정과 철학", "사업계획 정의와 작성 6단계"], "imp": 3, "sem": true, "q": "사업계획(Business Plan)의 근거 규정과 작성 절차를 설명해 주십시오.", "a": "사업계획은 POJK 24/2019에 근거하고 금융회사 서식은 SEOJK 23/2019를 따릅니다. 거시 가정과 사업 가정을 세운 뒤 전략 목표, KPI, KPI 목표치, 실행계획, 예산 순으로 연결해 작성합니다. 수립과 실행은 이사회(BOD) 책임이고 감사회(BOC)가 이행을 감독합니다. 9월 내부 실적 기준으로 KBBF는 신규취급이 계획의 108.1%였지만 잔액은 85.9%, 순이익은 약 45%에 그쳐, 그 원인을 분석해 내년 계획 가정에 반영하겠습니다.", "memo": "전략 → 목표 → KPI → 목표치 → 실행 → 예산. KPI 결정과 목표치 설정은 별도 단계", "type": "bundle", "parts": ["근거: POJK 24/2019, 금융회사 서식은 SEOJK 23/2019", "정의: 일정 기간의 사업 발전 계획과 목표 기간 내 달성 전략을 기술한 문서", "철학 4가치: 균형(Balance)·책임성(Accountability)·지속가능성(Sustainability)·협업(Collaboration)", "작성 6단계: 전략·목표 정의 → 전략 목표 설정 → KPI 결정 → KPI 목표치 → 이니셔티브·업무계획 → 예산 편성", "가정: 거시(경제성장률·물가·BI 기준금리·환율·유가)와 사업(수요·취급 목표·조달원·인력·IT)", "역할: 이사회(BOD, Directors)가 수립·실행·실현 보고, 감사회(BOC, Board of Commissioners)가 이행 감독", "KBBF(9월 내부 실적 기준): 1~9월 신규취급 계획 대비 108.1%, 9월말 잔액 85.9%, 순이익 약 45%", "대표이사: 잔액·이익 미달 원인을 분석해 내년 계획 가정에 반영"], "card": "사업계획 근거 규정과 철학 · 사업계획 정의와 작성 6단계"}, {"id": "b-6-02", "ch": "6", "cards": ["비전·미션·가치 수립"], "imp": 3, "sem": true, "q": "비전(Vision), 미션(Mission), 가치(Values)를 어떻게 구분해 수립하는지 말씀해 주십시오.", "a": "비전은 회사가 도달하려는 장기 목표이고, 미션은 그것을 이루기 위한 단기·중기 접근 방식이며, 가치는 일하는 방식입니다. 비전은 미래 지향적이고 간결해야 하고, 미션은 구체적이고 고객과 이해관계자 중심이어야 합니다. 비전과 미션을 확인한 뒤 환경 분석, 사업목표, KPI, 실행계획과 예산으로 이어집니다. 제출한 비전·미션 문서를 기준으로 주요 전략과 상품 다각화 계획을 설명드리겠습니다.", "memo": "비전 = To Be(장기), 미션 = To Do(단기·중기), 가치 = How to do", "type": "bundle", "parts": ["비전: 회사가 달성하려는 장기 목표(To Be)", "비전 고려사항: 회사 가치와 정렬, 미래 지향, 명확하고 고무적, 간결", "미션: 비전 달성을 위한 단기·중기 접근 방식(To Do)", "미션 고려사항: 구체적·적합, 고객·이해관계자 중심", "가치: 일하는 방식(how to do), 예: Integrity·Teamwork·Accountability·Customer focus", "수립 흐름: 비전·미션 확인 → 외부·내부환경 분석 → 사업목표 → KPI → 실행계획·예산", "대표이사: 제출한 비전·미션 문서를 기준으로 주요 전략과 상품 다각화 계획 설명"], "card": "비전·미션·가치 수립"}, {"id": "b-6-03", "ch": "6", "cards": ["시장·경쟁 분석 방법"], "imp": 2, "sem": true, "q": "시장과 경쟁 환경을 어떤 방법으로 분석하고, KBBF의 위치를 어떻게 보십니까?", "a": "거시 요인은 PESTEL, SWOT, Porter 5 Forces, 통계 방법 네 가지로 분석합니다. Porter 5 Forces로 보면 조달원 확보와 핀테크·페이레이터 같은 대체재가 주요 변수입니다. KBBF는 Fleet 비중이 약 88%로 법인 차량금융에 집중되어 있고, 8월 ROA 누계 0.80%와 ROE 누계 2.27%로 수익성이 업계보다 낮습니다. 수익성 회복을 우선 과제로 두겠습니다.", "memo": "분석 도구 4: PESTEL·SWOT·5 Forces·통계. 소유구조는 공급자 교섭력 요인", "type": "bundle", "parts": ["거시 요인: 인플레이션·금리·환율·정부정책·경제성장·인구구조·기술 동향", "분석 방법 4: PESTEL · SWOT · Porter 5 Forces · 통계 방법", "신규 진입 위협: 인가·자본·네트워크가 필요해 중~저, 핀테크는 새 도전", "공급자 교섭력: 은행·자본시장 등 조달원, 금리, 소유구조(은행계/딜러계/독립계)", "구매자 교섭력: 회사 간 경쟁 높음, 소비자가 디지털로 금리·수수료 비교", "대체재: 은행 대출·핀테크 대출·페이레이터·신용협동조합", "KBBF(8월): Fleet 비중 약 88%, FAR 95.63%(업계 86.01%), ROA 누계 0.80%·ROE 누계 2.27%(업계 4.17%·10.71%)", "대표이사: 수익성 회복을 우선 과제로 둠"], "card": "시장·경쟁 분석 방법"}, {"id": "b-6-04", "ch": "6", "cards": ["사업계획 최소 구성 7항목"], "imp": 3, "sem": true, "q": "사업계획서(Business Plan)에 반드시 들어가야 하는 항목을 말씀해 주십시오.", "a": "요약, 직전 계획 이행 평가, 비전·미션·전략, 경영정책과 계획, 재무 추정과 가정, 주요 비율 추정, 기타 정보 일곱 항목입니다. 경영계획에는 자본, 조달, 네트워크, 조직·인력·IT, 금융이해력·포용 계획이 들어갑니다. KBBF는 대주주의 3년간 약 5,700억 루피아 증자 계획과 연결해 자본계획을 설명할 수 있고, 첫 집행은 2027년입니다. 2026년 3월에는 교육훈련비 배정이 2.3%여서 서면 경고를 받아 수정 RBB로 조치했으며, 앞으로 RBB 확정 전에 규정 비율을 점검하겠습니다.", "memo": "a~g 7항목, d 안에 다시 7개. 금융이해력은 d, 지속가능금융은 g", "type": "bundle", "parts": ["a~c: 요약(Executive Summary) / 직전 계획 이행 평가 / 비전·미션·사업전략", "d 경영정책·계획 7: 사업활동(Business Activities), 사업 개발·확장, 자본, 조달, 사무소 네트워크·유통채널, 조직·인력·IT, 금융이해력·포용(literacy and inclusion)", "e~f: 재무제표 추정과 가정 / 주요 비율·계정 추정", "g 기타 정보: 직접 지분참여(Equity Participation), 지속가능금융 실행계획(RAKB), 합병·분할, 샤리아(Sharia) 전환 등", "구분: 금융이해력·포용은 d, 지속가능금융 실행계획은 g", "KBBF 자본계획: 대주주 3년간 IDR 570bn 증자 계획, 첫 집행 2027년, 조기경보 도달 시 추가 지원", "KBBF 지적: 2026년 3월 RBB 교육훈련비 2.3%(기준 2.5%)로 서면 경고 → 수정 RBB 제출로 조치 완료", "대표이사: RBB 확정 전 컴플라이언스 부서가 규정 비율 점검, 분기별 집행률을 이사회(BOD, Directors)·감사회(BOC, Board of Commissioners)에 보고"], "card": "사업계획 최소 구성 7항목"}, {"id": "b-6-05", "ch": "6", "cards": ["사업계획 실현 보고서", "사업계획 감독 보고서(감사회)"], "imp": 3, "sem": true, "q": "사업계획 실현 보고서(Business Plan Realization Report)와 감독 보고서(Business Plan Supervision Report)를 설명하고, 올해 실적을 어떻게 보고하시겠습니까?", "a": "실현 보고서는 이사회(BOD)가 계획 대비 실적, 편차 원인, 후속조치를 담아 반기마다 OJK에 제출합니다. 감독 보고서는 감사회(BOC)가 이행 감독 결과를 담아 같은 반기 주기로 제출합니다. 9월 내부 실적 기준 KBBF의 1~9월 순이익은 약 109억 루피아로 계획의 약 45%이고, 대손비용과 90%대 BOPO가 이익을 낮췄습니다. 선임 후 수익, 대손비용, 조달비용, 영업비용별로 차이를 나눠 보고하고, 감사회가 독립적으로 평가할 수 있게 자료를 제때 제공하겠습니다.", "memo": "같은 반기, 작성자는 다름: 실현 = 이사회, 감독 = 감사회", "type": "bundle", "parts": ["실현 보고서: 이사회(BOD, Directors) 작성, 반기(semi-annual)마다 OJK 제출", "실현 보고서 내용 5: 계획 대비 실적, 편차 원인, 후속조치, 재무비율·주요 계정, 기타 정보", "감독 보고서: 감사회(BOC, Board of Commissioners) 작성, 반기마다 OJK 제출(POJK 24/2019)", "감독 보고서 내용: 사업계획 실현 평가(정량·정성), 성과 영향 요인, 성과 개선 노력", "KBBF(9월 내부 실적 기준): 1~9월 순이익 10.93bn으로 계획 대비 약 45%, 신규취급 108.1%, 잔액 85.9%", "KBBF 원인: 대손비용 누계 10.94bn(1~9월), BOPO 90.58%(8월, 업계 82.86%)", "대표이사: 수익·대손비용·조달비용·영업비용별로 차이를 나눠 보고, 감사회에 실적 자료를 제때 제공"], "card": "사업계획 실현 보고서 · 사업계획 감독 보고서(감사회)"}, {"id": "b-6-06", "ch": "6", "cards": ["사업계획 평가 효익·대상 6", "시정·개선조치 결정 5단계"], "imp": 2, "sem": true, "q": "사업계획(Business Plan) 이행을 어떻게 평가하고, 목표 미달이 예상되면 어떻게 시정하시겠습니까?", "a": "사업계획 이행은 규정 적합성, 전략, 리더십, 정합성, 실행, 자원 적정성 여섯 가지로 평가합니다. 목표 미달이 예상되면 근본 원인을 분석하고, 영향·비용·기간·리스크 기준으로 우선순위를 정한 뒤 조정안을 시범 적용하고 단계적으로 확대합니다. 매월 대시보드로 계획 대비 실적을 점검하겠습니다. 조치마다 담당자와 기한을 정해 이사회(BOD)에서 점검하고 감사회(BOC)에 보고하겠습니다.", "memo": "평가 대상 6 앞글자: 적·전·리·정·실·적", "type": "bundle", "parts": ["평가 3단계: 성공도 측정 → 시정조치 결정 → 사업전략 분석", "평가 대상 6: 적합성(Conformance)·전략(Strategy)·리더십(Leadership)·정합성(Coherence)·실행(Execution)·적정성(Adequacy)", "시정 출발점: 근본원인분석(RCA, Root Cause Analysis)", "결정 5단계: 평가 기준 설정 → 분석 도구 → 우선순위화 → 조정안 논의·권고 → 시범 적용·단계적 실행", "평가 기준: 목표 영향·비용·소요기간·성공 가능성·리스크", "KBBF: 2026년 3월 서면 경고(교육훈련비 2.3%)는 수정 RBB 제출로 조치 완료", "대표이사: 매월 대시보드로 계획 대비 실적 점검, 조치별 담당자·기한을 정해 이사회(BOD, Directors) 점검·감사회(BOC, Board of Commissioners) 보고"], "card": "사업계획 평가 효익·대상 6 · 시정·개선조치 결정 5단계"}, {"id": "b-6-07", "ch": "6", "cards": ["회사 사업 프로세스·현황 점검"], "imp": 3, "sem": true, "q": "회사의 주요 재무지표와 규정 준수 상태를 말씀해 주십시오.", "a": "8월말 OJK 보고 기준 ROA 누계는 0.80%, NPF 총비율 3.25%·순비율 0.94%, Gearing Ratio 2.06배, FAR 95.63%, 자본비율 63.88%입니다. 자본과 레버리지는 기준을 크게 웃돌지만 ROA와 BOPO가 업계보다 약합니다. 규정 준수 면에서는 2026년 3월 교육훈련비 배정 미달로 서면 경고 1건을 받았고 수정 RBB로 조치를 마쳤습니다. BOPO와 대손비용 개선을 우선 과제로 두겠습니다.", "memo": "8월 숫자는 OJK 보고 기준, 9월 숫자는 내부 실적으로 구분해 말함", "type": "bundle", "parts": ["점검 범위: 회사 배경·조직, 시장 경쟁(STP·마케팅 계획), 재무보고(조달원·주요 비율), 규정 준수와 제재", "수익성(8월말 OJK 기준): ROA 누계 0.80%(업계 4.17%), BOPO 90.58%(업계 82.86%)", "자산 건전성: NPF 총비율 3.25%·순비율 0.94%(업계 총비율 3.03%)", "자본·레버리지: 자본비율(Capital Ratio) 63.88%(최소 10%), Gearing Ratio 2.06배(한도 10배), FAR 95.63%(최소 50%)", "평가: 리스크 프로필(Risk Profile) P2(법률 P3), GCG 2등급", "제재: 2026년 3월 서면 경고 1건(교육훈련비 2.3%) → 수정 RBB 제출로 조치 완료", "인력(9월): 142명(정규 77·계약 59·경영진·위원 6), 지점 7, 이직률 0.73%", "대표이사: BOPO와 대손비용 개선을 우선 과제로 둠"], "card": "회사 사업 프로세스·현황 점검"}, {"id": "b-6-08", "ch": "6", "cards": ["규정 준수 확보 철학과 역량요소 4"], "imp": 3, "sem": true, "q": "대표이사(President Director)로서 회사의 규정 준수를 어떻게 확보하시겠습니까?", "a": "컴플라이언스는 법규 준수와 함께 회사의 무결성과 지속가능성을 지키는 일이며, 위반하면 제재와 신뢰 하락으로 이어집니다. 규정 준수는 정보 수집, 신규 규정 영향 평가, 준수 수준 분석, 준수 수준 보고 네 단계로 확보합니다. KBBF는 OJK 보고 기한을 전사 Taskboard로 관리해 올해 1~9월 보고 지연과 과태료가 없었습니다. 선임 후 여신·마케팅·재무와 겸하지 않는 컴플라이언스 담당 이사를 명확히 지정하겠습니다.", "memo": "수집 → 영향 평가 → 분석 → 보고", "type": "bundle", "parts": ["철학: 법규 준수이면서 회사 무결성·지속가능성의 문제, 위반 시 제재·신뢰 하락", "역량요소 4: 데이터·정보 수집 → 신규·개정 규정 영향 평가 → 준수 수준 분석 → 준수 수준 보고", "보고 단계: 초안 → 승인 후 제출 → 배포 → 부서 이행 모니터링", "증빙: 법규 목록, 이사회(BOD, Directors)·감사회(BOC, Board of Commissioners) 앞 컴플라이언스 보고서, 이행·후속조치 보고서, 내부감사(Internal Audit)·OJK 감사 결과", "겸직(Double Positions) 제한: 컴플라이언스 담당 이사는 여신·마케팅·재무 담당 겸직 불가(대표이사 제외)", "KBBF: OJK 보고 기한을 전사 Taskboard로 관리, 2026년 1~9월 지연 0건·과태료 0건", "대표이사: 컴플라이언스 담당 이사를 명확히 지정해 보고 체계 정비"], "card": "규정 준수 확보 철학과 역량요소 4"}, {"id": "b-6-09", "ch": "6", "cards": ["신규 규정 영향 분석과 후속조치"], "imp": 3, "sem": true, "q": "새 OJK 규정이 나오면 회사 안에서 어떤 절차로 반영합니까?", "a": "컴플라이언스 부서가 영향받는 업무를 식별하고, 관련 부서와 논의해 정책·SOP와 시스템을 고친 뒤 이행을 모니터링합니다. 권고안에는 리스크 분석, 비용 추정, 이행 일정을 함께 붙여 이사회(BOD)가 결정하도록 하겠습니다. 예를 들어 POJK 35/2025의 선수금 0%는 NPF Net 0.94%로 요건을 충족하지만, 리테일 성과를 확인한 뒤 단계적으로 판단하겠습니다. 리스크관리 시행세칙 PADK 48/2025의 정책 정비 결과도 선임 후 확인하겠습니다.", "memo": "식별 → 논의 → SOP → 시스템 → 모니터링, 권고에는 리스크·비용·일정", "type": "bundle", "parts": ["영향 분석 4영역: 사업모델·시장전략, 조직·인력, 시스템·인프라, 제재·감독", "후속조치 5단계: 영향 식별 → 관련 부서 논의 → 정책·SOP 조정 → 시스템·인프라 구축 → 모니터링·평가", "권고 형태: 정책·SOP 개정, 조직 조정, 교육·인증, IT·보안", "권고 첨부: 리스크 분석·비용 추정·이행 일정", "KBBF 사례 1: PADK 48/2025 리스크관리 정책 정비(기한 2026년 6월 말) 완료 여부 확인", "KBBF 사례 2: POJK 35/2025 선수금(Down Payment) 0% 요건은 NPF Net 0.94%로 충족, 리테일 성과 확인 후 20% 한도 안에서 단계적 판단", "대표이사: 권고안을 이사회(BOD, Directors)가 결정하도록 상정"], "card": "신규 규정 영향 분석과 후속조치"}, {"id": "b-6-10", "ch": "6", "cards": ["컴플라이언스 문화 3계층·파라미터 10"], "imp": 2, "sem": true, "q": "컴플라이언스 문화를 어떤 구조로 보고 어떤 지표로 평가합니까?", "a": "컴플라이언스 문화는 경영진 헌신과 정책의 전략 수준, SOP와 통제의 운영 수준, 개인 윤리 수준 세 계층으로 봅니다. 평가는 경영진 헌신, 내부통제(Internal Control), 교육과 필수 인증, 위반 건수, 내부고발제도, 감사 결과, 보상·제재 체계 등 10개 파라미터로 합니다. 여신 과정에서는 KYC와 이중통제, 4-Eyes 원칙으로 한 사람이 승인을 끝내지 못하게 하겠습니다. KBBF의 직원 자격증 보유율이 6월 기준 59.38%여서 필수 인증 취득도 함께 높이겠습니다.", "memo": "전략·운영·개인 3계층. 4-Eyes와 이중통제는 운영 수준", "type": "bundle", "parts": ["3계층: 전략(경영진 헌신·준수 정책) / 운영(SOP·시스템·여신 과정 통제·교육) / 개인(윤리·규율)", "여신 과정 통제: KYC, 이중통제(Dual Control), 견제와 균형, 4-Eyes Principle", "파라미터 ①~⑤: 경영진 헌신(Commitment from Company Leadership), 내부통제체계, 규정 준수, 교육·필수 인증, 위반 건수", "파라미터 ⑥~⑩: 직원 규율, 내부고발제도(WBS, Whistleblowing), 내·외부 감사 결과, 컴플라이언스 리스크 평가, 보상·제재 체계", "KBBF: 직원 자격증 보유율 59.38%(6월)로 필수 인증 보완 필요", "KBBF: 익명 내부고발 채널(핫라인·이메일·웹) 운영", "대표이사: 한 사람이 승인을 끝내지 못하게 통제, 위반 건수·감사 결과 정기 점검, 자격증 취득 확대"], "card": "컴플라이언스 문화 3계층·파라미터 10"}, {"id": "b-6-11", "ch": "6", "cards": ["컴플라이언스 문화 이행 9단계"], "imp": 3, "sem": true, "q": "신임 대표이사(President Director)로서 컴플라이언스 문화를 어떻게 정착시키겠습니까?", "a": "컴플라이언스 문화는 경영진 헌신, 정책 개발, 독립적인 컴플라이언스 기능, 교육, 정기 평가, 문화 강화, 제재와 보상, 지속 개선 순서로 정착시킵니다. 첫째, 이사회(BOD)가 준수 원칙을 공식 정책으로 확인하고 제가 먼저 지키겠습니다. 둘째, 컴플라이언스 기능이 감사회(BOC)에 직접 보고할 수 있게 독립성을 보장하겠습니다. 셋째, 2026년 3월 교육훈련비 경고 사례를 반영해 인건비의 2.5% 이상을 배정해 정기 교육을 하겠습니다.", "memo": "헌신 → 정책 → 기능 → 교육 → 평가 → 문화 → 제재·보상 → 개선", "type": "bundle", "parts": ["출발점: 경영진 헌신(Commitment from Company Leadership), 이사회(BOD, Directors)·감사회(BOC, Board of Commissioners)가 정책과 행동으로 보임", "정책 개발: 반부패·개인정보보호·AML·KYC, 여신 승인부터 분쟁 해결까지 SOP", "강한 컴플라이언스 기능: 독립 부서가 최고경영진 또는 감사회에 직접 보고", "교육·전파(Training and Outreach): 정기 교육과 윤리강령 전파", "정기 평가·감독: 내·외부 컴플라이언스 감사, 감사 후 신속 시정", "문화·제재·보상: 리더 솔선수범(Leading by Example), 공정·일관·비례 제재, 준수 우수 직원 보상", "지속 개선: 규정·기술·산업 변화에 맞춰 정책 재검토", "대표이사 첫 조치: 준수 원칙을 이사회 정책으로 확인, 컴플라이언스 기능 독립성 보장, 교육훈련비 인건비(Personnel Expenses) 2.5% 이상 배정"], "card": "컴플라이언스 문화 이행 9단계"}, {"id": "b-7-01", "ch": "7", "cards": ["부정방지 전략 정의와 적용"], "imp": 3, "sem": true, "q": "부정방지 전략(Anti-Fraud Strategy)의 근거 규정과 기본 개념을 말씀해 주십시오.", "a": "근거는 POJK 12/2024이고 금융회사는 2024년 10월 23일부터 적용됩니다. 부정은 회사나 소비자, 제3자를 속여 손실을 주거나 이익을 얻는 고의적 행위이며, 압박·합리화·기회라는 원인을 고려해 전략을 설계합니다. KBBF는 신규 고객 전원을 온라인도박을 포함한 명단과 대조하고 있고, 2026년 6~7월 부정 사고와 손실은 없었습니다. 기회 요인은 약한 내부통제에서 생기므로 업무 분리와 불시 점검으로 줄이겠습니다.", "memo": "부정 원인 3요소(압박·합리화·기회)와 전략 4대 축(Four Pillars)은 서로 다른 목록", "type": "bundle", "parts": ["근거: POJK 12/2024, 금융회사는 2024년 10월 23일부터 적용", "부정(Fraud) 정의: 회사·소비자·제3자를 속이거나 조작하는 고의적 행위로 손실을 주거나 이익을 얻는 것", "적용 범위: 고객·내부·기타 당사자, 온라인 도박·온라인 사기 등에 회사 업무가 이용되지 않게 예방", "부정 삼각형(Fraud Triangle): 압박(Pressure)·합리화(Rationalization)·기회(Opportunity). 기회는 주로 약한 내부통제(Internal Control)에서 발생", "철학: 예방이 치료보다 낫다(Prevention is better than cure)", "KBBF: 신규 고객 100% 명단 대조에 온라인도박 포함, 2026년 6~7월 부정 사고·손실 없음", "대표이사: 업무 분리와 불시 점검(Surprise Audits)으로 기회 요인 축소"], "card": "부정방지 전략 정의와 적용"}, {"id": "b-7-02", "ch": "7", "cards": ["부정방지 전략 4대 축과 세부 수단"], "imp": 3, "sem": true, "q": "부정방지 전략(Anti-Fraud Strategy) 4대 축(Four Pillars)을 회사에서 어떻게 운영하시겠습니까?", "a": "예방, 탐지, 조사·보고·제재, 모니터링·평가·후속조치 네 축입니다. 예방은 교육과 직원 확인, 탐지는 내부고발과 불시 점검, 조사는 독립적인 조사와 공정한 제재, 마지막 축은 사건 원인 분석과 통제 강화입니다. KBBF는 2개월마다 전 직원 반부패 교육을 하고, 익명 내부고발을 5영업일 내 분류·60일 내 종결 기준으로 운영합니다. 이사 관련 신고는 감사회(BOC)로 바로 올라가게 하고, 사건마다 담당자·기한·지표를 정해 후속조치를 확인하겠습니다.", "memo": "예방 → 탐지 → 조사·보고·제재 → 모니터링. 세 번째 축은 조사·보고·제재가 하나", "type": "bundle", "parts": ["4대 축: 예방(Prevention) / 탐지(Detection) / 조사·보고·제재(Investigation, Reporting and Sanctions) / 모니터링·평가·후속조치(Monitoring, Evaluation and Follow-up)", "예방: 부정방지 인식(Anti-Fraud Awareness) 프로그램, 취약성 식별(Vulnerability Identification), 직원 확인(KYE, Know Your Employee)", "탐지: 내부고발제도(Whistleblowing), 불시 점검(Surprise Audits), 감시 체계", "조사·보고·제재: 독립적 조사 권한자, 내부·OJK 보고, 공정·일관된 제재 정책", "모니터링·평가·후속조치: 사건 데이터·원인 분석, 내부통제(Internal Control) 강화", "내부고발 3요소: 제보자 보호, 보고 규정, 보고 후 처리 체계", "KBBF: 익명 내부고발 5영업일 내 분류·60일 내 종결, 반부패 교육 2개월마다 전 직원", "대표이사: 이사 관련 신고는 감사회(BOC, Board of Commissioners)로 바로 올리고, 사건별 담당자·기한·지표를 정해 후속조치 확인"], "card": "부정방지 전략 4대 축과 세부 수단"}, {"id": "b-7-03", "ch": "7", "cards": ["부정방지 전담 조직과 핵심 의무 7"], "imp": 3, "sem": true, "q": "부정방지 전담 조직과 회사의 주요 의무를 설명해 주십시오.", "a": "회사는 이사회(BOD)에 책임지면서 감사회(BOC)와 직접 소통하는 부정방지 전담 부서를 두고, 부서장은 반부정 자격증이나 충분한 경력을 갖춰야 합니다. 전략 수립과 4대 축 운영, 리스크관리와의 통합, OJK 보고, 최소 연 1회 교육이 주요 의무입니다. 외주업체 과실로 소비자가 손실을 봐도 회사가 책임집니다. KBBF는 2개월마다 전 직원 교육을 하고 있고, 외주업체 계약에 부정방지 의무를 넣어 정기 점검하겠습니다.", "memo": "교육 기준은 최소 연 1회, KBBF는 2개월 주기", "type": "bundle", "parts": ["전담 부서: 이사회(BOD, Directors)에 책임, 감사회(BOC, Board of Commissioners)와 직접 소통·보고", "부서장 요건: 반부정 전문 자격증 또는 반부정·금융 분야 충분한 경력", "주요 의무: 전략 수립·이행과 이사회·감사회 감독, 4대 축(Four Pillars) 운영, 리스크관리와 통합", "보고 3유형: 전략, 이행 보고서, 중대 부정 사건", "교육: 부정방지 교육·인식 최소 연 1회", "소비자 손실 책임: 이사·직원·외주업체 과실로 생긴 부정 손실도 회사가 책임", "KBBF: 반부패 교육 2개월마다 전 직원, 부정 사건 현황 분기 보고", "대표이사: 외주업체 계약에 부정방지 의무를 넣고 정기 점검"], "card": "부정방지 전담 조직과 핵심 의무 7"}, {"id": "b-7-04", "ch": "7", "cards": ["부정방지 전략 모니터링·평가"], "imp": 2, "sem": true, "q": "부정방지 전략(Anti-Fraud Strategy)이 효과적인지 어떻게 점검하고 평가합니까?", "a": "관찰, 인터뷰, 문서 검토, 시스템 검증 네 가지로 모니터링합니다. 평가는 근본원인분석, 통제 효과성 점검, 직원 설문, GAP 분석으로 하고 축별 평가 보고서와 개정 권고를 냅니다. 발견사항마다 리스크, 실행계획, 담당자, 기한, 성공 지표를 정하겠습니다. 미이행 사항은 리스크감시위원회에 보고하겠습니다.", "memo": "모니터링 4방법(관찰·인터뷰·문서·시스템)과 평가 4방법(RCA·COSO·설문·GAP)을 구분", "type": "bundle", "parts": ["모니터링 4방법: 관찰(Observation)·인터뷰(Interview)·문서 검토(Document Review)·시스템 검증(System Verification)", "지원 도구: 축별 체크리스트, 부정 리스크 지표·탐지 대시보드, 내부고발(Whistleblowing) 기록", "평가 4방법: 근본원인분석(Root Cause Analysis), COSO/ERM 통제 효과성, 직원 설문 문화 평가, SWOT/GAP 분석", "평가 산출물: 축별 평가 보고서, 효과성 점수·성숙도, 강화·개정 권고", "실행계획 6요소: 발견사항(Findings)·리스크·실행계획·담당(PIC)·기한(Deadline)·성공 지표(Indicator)", "이행 감독: 컴플라이언스·감사 부서, 미이행은 리스크감시위원회(Risk Monitoring Committee) 또는 이사회(BOD, Directors) 보고", "대표이사: 발견사항마다 담당자·기한·지표 지정, 미이행 사항 보고 체계 운영"], "card": "부정방지 전략 모니터링·평가"}, {"id": "b-7-05", "ch": "7", "cards": ["부정방지 OJK 보고 의무와 기한"], "imp": 3, "sem": true, "q": "부정방지와 관련해 OJK에 무엇을 언제까지 보고합니까?", "a": "부정방지 전략(Anti-Fraud Strategy)을 바꾸면 7영업일 이내, 중대 부정 사건은 식별 후 6영업일 이내에 보고합니다. 연차 이행 보고서는 12월 말 기준으로 다음 해 1월 31일까지 제출합니다. 중대 사건 여부는 법령 중대 위반, 사업 연속성 위협, 평판 훼손 가능성으로 판단합니다. KBBF는 OJK 보고 기한을 Taskboard로 관리해 올해 1~9월 지연이 없었고, 부정 사건 현황을 분기마다 보고하고 있습니다.", "memo": "변경 7영업일, 사건 6영업일, 연차 1월 31일", "type": "bundle", "parts": ["최초 전략: POJK 12/2024 시행 후 6개월 이내", "전략 변경: 변경 후 7영업일 이내", "중대 부정 사건: 식별 후 6영업일 이내", "연차 이행 보고서: 12월 말 기준, 다음 해 1월 31일까지", "중대 영향 기준 3: 법령 중대 위반, 사업 연속성 위협, 평판 훼손 가능성", "이행 보고서 내용: 전략 이행 진척, 부정 사건 데이터(행위자·손실액·원인·수법·조치 등)", "KBBF: 2026년 1~9월 OJK 보고 지연 0건(Taskboard 관리), 부정 사건 현황 분기 보고"], "card": "부정방지 OJK 보고 의무와 기한"}, {"id": "b-7-06", "ch": "7", "cards": ["SIPELAKU 부정행위자 이력정보"], "imp": 2, "sem": true, "q": "채용이나 파트너 선정 때 부정 이력은 어떻게 확인합니까?", "a": "POJK 28/2024에 따라 OJK의 SIPELAKU 시스템으로 부정행위자 이력을 조회할 수 있습니다. 이를 쓰려면 부정방지 보고 의무를 지키고, 정보는 취득부터 폐기까지 기밀로 관리하며, 이용 내역을 연 1회 이상 내부감사해야 합니다. 목적 외 이용이나 외부 배포는 금지되고 위반하면 접근이 차단됩니다. 채용과 파트너 선정 절차에 조회를 넣고 이용 내역은 매년 내부감사로 점검하겠습니다.", "memo": "SIPELAKU는 POJK 28/2024, 부정방지 전략은 POJK 12/2024. Pelaku = 행위자", "type": "bundle", "parts": ["정의: 부정행위자(Perpetrator) 이력을 기록하는 OJK 정보시스템 SIPELAKU, 근거 POJK 28/2024", "이용 목적: 채용 결정, 잠재 소비자·파트너 프로파일링, 리스크관리", "접근 요건: OJK 전자 등록, 부정방지 전략(Anti-Fraud Strategy) 보고", "이용자(User) 의무: 반부정 보고 이행, 정책·절차 보유, 기밀 보호, 접근권자 변경 보고, 연 1회 이상 내부감사(Internal Audit)", "금지: 목적 외 접근·이용, 정한 자 외 배포", "접근 비활성화: 위반, 데이터 유출, 부정방지 미준수", "대표이사: 채용·파트너 선정 절차에 조회 포함, 이용 내역은 매년 내부감사로 점검"], "card": "SIPELAKU 부정행위자 이력정보"}, {"id": "b-7-07", "ch": "7", "cards": ["내부감사 지적사항 후속조치", "리스크 기반 감사(RBA) 평가"], "imp": 3, "sem": true, "q": "내부감사(Internal Audit) 지적사항의 후속조치와 감사 계획을 대표이사(President Director)로서 어떻게 관리하시겠습니까?", "a": "내부감사 후속조치는 피감사부서가 약속한 조치의 이행 적정성을 분석하고, 결과를 전달·보고·문서화하는 일입니다. 감사 계획은 리스크 기반 감사 원칙에 따라 회사의 Risk Appetite와 리스크 평가 결과를 기준으로 중대 리스크 영역에 집중합니다. 감사위원회는 감사와 OJK 지적사항의 후속조치, 내부통제 효과성을 모니터링합니다. 저는 지적사항마다 담당자, 기한, KPI를 정해 대시보드로 점검하고, 미이행 사항은 감사위원회에 보고하며, 반복 지적은 교육과 재감사, 성과 평가 반영으로 막겠습니다.", "memo": "후속조치 = 분석 → 전달 → 보고 → 문서화. RBA 평가 = 계획·수행·보고", "type": "bundle", "parts": ["후속조치 평가: 피감사부서(auditee) 약속 대비 이행 적정성 분석 → 전달·조정 → 서면 보고 → 문서화", "품질개선 프로그램 평가: 감사 기능 자체의 계획 이행 분석·보고", "기준: IIA 국제내부감사직무수행체계(IPPF)", "감사위원회(Audit Committee): 내·외부감사 이행, 감사·OJK 지적사항 후속조치, 내부통제(Internal Control) 효과성 모니터링", "리스크 기반 감사(Risk-Based Auditing): 중대 리스크에 집중, 감사계획을 Risk Appetite와 정렬 d": "자금세탁·테러자금조달 방지"}, {"id": "b-8-04", "ch": "8", "cards": ["필수 기능 9개와 교육예산 2.5%"], "imp": 3, "sem": true, "q": "금융회사가 반드시 갖춰야 할 기능과 교육훈련 예산 의무를 말씀해 주십시오.", "a": "관리·회계, 영업·심사·추심, 리스크관리·내부통제·준법, 인적자원, AML·CFT, 정보시스템, 소비자보호, 부정 통제, 금융이해력·포용 아홉 가지입니다. 교육훈련 예산은 인건비의 최소 2.5%를 편성하고 집행해야 합니다. KBBF는 2026년 3월 RBB 배정이 2.3%여서 서면 경고를 받았고, 수정 RBB를 제출해 조치를 마쳤습니다. 앞으로 2.5% 이상을 배정하고 분기별 집행률을 감사회(BOC)에 보고하겠습니다.", "memo": "기능 9개, 교육예산 2.5%는 편성과 집행 모두 요건", "type": "bundle", "parts": ["필수 기능 ①~⑤: 관리·회계, 마케팅·심사·추심, 리스크관리·내부통제(Internal Control)·준법, 인적자원, AML·CFT·금융범죄 예방", "필수 기능 ⑥~⑨: 정보시스템, 소비자 교육·보호, 부정 통제(Fraud Control), 금융이해력·포용(literacy and inclusion)", "교육예산: 인건비(Personnel Expenses)의 최소 2.5%를 편성하고 집행", "편성 단계 미달만으로도 경고 대상", "KBBF: 2026년 3월 RBB 교육훈련비 2.3%로 서면 경고 → 수정 RBB 제출로 조치 완료", "대표이사: 2.5% 이상 배정과 분기별 집행률 감사회(BOC, Board of Commissioners) 보고, AML·부정방지·소비자보호 기능은 별도 담당·정기 보고"], "card": "필수 기능 9개와 교육예산 2.5%"}, {"id": "b-8-05", "ch": "8", "cards": ["인적자원 개발·자격증 의무"], "imp": 3, "sem": true, "q": "임직원 자격증 의무와 인적자원 관리 의무를 말씀해 주십시오.", "a": "이사와 커미셔너는 금융업 전문 자격증, 리스크관리 담당 이사와 바로 아래 임원은 리스크관리 자격증, 추심 인력은 외주를 포함해 추심 자격증이 필요합니다. 인적자원 담당 이사는 인도네시아 국민이어야 하고, 교육훈련비는 당해 인건비의 2.5% 이상이어야 합니다. 저는 APPI(SPPI) 시험에 응시했고, 회사 전체 자격증 보유율은 6월 기준 59.38%입니다. 관리직과 추심 인력의 자격증 취득을 우선 지원하겠습니다.", "memo": "이사·커미셔너 = 금융업, 리스크 담당 = 리스크관리, 추심 = 추심 자격증", "type": "bundle", "parts": ["이사·커미셔너: 금융업 전문 자격증(선임 후 기한 내 취득)", "리스크관리 담당 이사와 바로 아래 임원 1명: 리스크관리 자격증", "지점장급 이상 관리직: 금융업 자격증", "추심·담보집행 직원과 외주인력: 추심 자격증", "인사 의무: 인적자원 담당 이사 지정(인도네시아 국민), 당해 인건비(Personnel Expenses) 2.5% 이상 교육훈련비", "KBBF: 직원 자격증 보유율 59.38%(6월), 인력 142명·이직률 0.73%(9월)", "본인: APPI(SPPI) 시험 응시 완료", "대표이사: 관리직·추심 인력 자격증 취득 우선 지원"], "card": "인적자원 개발·자격증 의무"}, {"id": "b-8-06", "ch": "8", "cards": ["외국인 직원 고용 요건"], "imp": 3, "sem": true, "q": "외국인 임직원 고용 요건과 대표이사(President Director)로서의 독립성 확보 방안을 말씀해 주십시오.", "a": "외국인 지분이 25% 이상인 회사는 외국인을 이사, 커미셔너, 전문가, 컨설턴트로만 둘 수 있고, 외국인 이사와 커미셔너는 각각 50% 이내여야 합니다. 전문가와 컨설턴트는 IT, 리스크관리, OJK 승인 기능에 한해 최대 3년, 1회 1년 연장이 가능합니다. 십시오.", "a": "노동 법규는 고용 형태, 해고 절차와 퇴직금, 최저임금, 사회보험 가입을 정하고 있습니다. 계약직(PKWT)과 정규직(PKWTT)을 구분하고, 해고는 협의 절차와 퇴직금 지급을 거쳐야 하며, BPJS 고용·건강 보험 가입이 의무입니다. KBBF는 9월말 기준 정규직 77명과 계약직 59명을 함께 운영하고 있습니다. 세부 사항은 인사부서와 법률 자문을 거쳐 지키겠습니다.", "memo": "고용 형태 · 해고 · 최저임금 · BPJS", "type": "bundle", "parts": ["고용 형태: 기간제 계약직(PKWT)과 정규직(PKWTT)", "해고: 협의 절차, 퇴직금·근속수당 지급", "임금: 지역 최저임금 준수", "사회보험: BPJS(고용·건강) 가입 의무", "근로시간: 주 40시간 기준", "KBBF: 9월말 인력 142명(정규 77·계약 59·경영진·위원 6)", "대표이사: 세부 사항은 인사부서·법률 자문을 거쳐 준수"], "card": "노동 법규 기본"}, {"id": "b-8-10", "ch": "8", "cards": ["소비자보호 7원칙과 숙려기간", "채권추심 행위 기준", "담보 회수·집행 요건 3가지", "자금세탁·테러자금조달 방지", "필수 기능 9개와 교육예산 2.5%", "외국인 직원 고용 요건", "개인정보보호법(PDP)"], "imp": 3, "sem": true, "q": "소비자보호·추심·AML·인력 관련 주요 기준 수치를 말씀해 주십시오.", "a": "장기·복잡 상품의 숙려기간은 최소 2영업일이고, 소비자보호 위반 과태료는 최대 Rp15bn입니다. 추심은 월요일부터 토요일 오전 8시부터 오후 8시까지 하고, 피두시아는 계약일로부터 1개월 안에 등록합니다. 의심거래(STR)는 3영업일 안에, 5억 루피아 이상 현금거래(CTR)는 PPATK에 보고합니다. 교육훈련비는 인건비의 2.5% 이상, 외국인 이사와 커미셔너는 각각 50% 이내이며, 개인정보 유출은 72시간 안에 통지합니다.", "memo": "2영업일 · 8~20시 · 1개월 · 3영업일 · 2.5% · 50% · 72시간", "type": "bundle", "parts": ["숙려기간(pause period): 소비자 동의 후 최소 2영업일", "소비자보호 위반 과태료: 최대 Rp15bn", "추심 시간: 월~토(국경일 제외) 08:00~20:00", "피두시아(Fiducia) 등록: 계약일로부터 1개월 내", "AML 보고: LTKM 인지 후 3영업일 내, LTKT Rp500백만 이상", "교육훈련비: 인건비(Personnel Expenses)의 최소 2.5%(KBBF 2026년 3월 2.3%로 경고, 조치 완료)", "외국인: 고용 기준 지분 25% 이상, 이사·커미셔너 각 최대 50%, 전문가 3년 + 1년", "개인정보 유출 통지: 72시간 내"], "card": "소비자보호 7원칙과 숙려기간 · 채권추심 행위 기준 · 담보 회수·집행 요건 3가지 · 자금세탁·테러자금조달 방지 · 필수 기능 9개와 교육예산 2.5% · 외국인 직원 고용 요건 · 개인정보보호법(PDP)"}];
